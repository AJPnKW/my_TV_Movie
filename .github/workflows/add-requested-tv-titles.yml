name: Add requested TV titles

on:
  push:
    branches: [main]
    paths:
      - data/requested_tv_titles.json
      - scripts/add_requested_tv_titles.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-titles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Resolve and merge requested shows
        id: import
        continue-on-error: true
        env:
          API_TMDB_KEY: ${{ secrets.API_TMDB_KEY }}
        run: python scripts/add_requested_tv_titles.py

      - name: Validate JSON
        run: |
          python -m json.tool data/inputs.json >/dev/null
          python -m json.tool data/requested_tv_lookup_report.json >/dev/null

      - name: Commit resolved titles and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inputs.json data/requested_tv_lookup_report.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add requested TV titles from TMDB"
            git push
          fi

      - name: Fail only after report is committed
        if: steps.import.outcome == 'failure'
        run: |
          echo "Some titles were unresolved. See data/requested_tv_lookup_report.json."
          exit 1
