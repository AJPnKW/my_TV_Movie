# File: .github/workflows/build-data.yml
# Project: my_TV_Movie
# Version: v1.3.2 (2025-11-12 18:20 EST)
#
# Purpose:
#   Build data/data.json, verify it exists & is non-empty, then copy it to web/data/data.json
#   so the SPA can always fetch ./data/data.json on GitHub Pages.
#
# Repo settings:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#   Settings → Actions → General → Workflow permissions: Read and write
#
# Secrets (min):
#   API_TMDB_KEY
# Optional:
#   API_TMDB_TOKEN, API_TVMAZE_KEY, API_OMDB_KEY,
#   API_TRAKT_CLIENT_ID, API_TRAKT_CLIENT_SECRET, TRAKT_PROFILES

name: Build TV Data and Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"  # every 4 hours

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Build data.json
        env:
          API_TMDB_KEY: ${{ secrets.API_TMDB_KEY }}
          API_TMDB_TOKEN: ${{ secrets.API_TMDB_TOKEN }}
          API_TVMAZE_KEY: ${{ secrets.API_TVMAZE_KEY }}
          API_OMDB_KEY: ${{ secrets.API_OMDB_KEY }}
          API_TRAKT_CLIENT_ID: ${{ secrets.API_TRAKT_CLIENT_ID }}
          API_TRAKT_CLIENT_SECRET: ${{ secrets.API_TRAKT_CLIENT_SECRET }}
          TRAKT_PROFILES: ${{ secrets.TRAKT_PROFILES }}
        run: |
          set -e
          mkdir -p data
          echo "[build] fetch_tmdb.py"
          python scripts/fetch_tmdb.py
          echo "[build] fetch_tvmaze.py (soft-fail ok)"
          python scripts/fetch_tvmaze.py || echo "[build] tvmaze skipped"
          echo "[build] fetch_omdb.py (soft-fail ok)"
          python scripts/fetch_omdb.py || echo "[build] omdb skipped"
          echo "[build] sync_trakt.py (soft-fail ok)"
          python scripts/sync_trakt.py || echo "[build] trakt sync skipped"

          # Sanity check + stamp
          python - << 'EOF'
          import json, pathlib, datetime, sys
          p = pathlib.Path("data/data.json")
          if not p.exists():
              sys.exit("FAIL: data/data.json missing after build.")
          txt = p.read_text(encoding="utf-8").strip()
          if not txt:
              sys.exit("FAIL: data/data.json is empty.")
          try:
              data = json.loads(txt)
          except Exception as e:
              sys.exit(f"FAIL: data/data.json is invalid JSON: {e}")
          meta = data.setdefault("meta", {})
          meta.setdefault("shows", len(data.get("shows", [])))
          meta.setdefault("movies", len(data.get("movies", [])))
          meta["built"] = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          print("[build] Shows:", meta["shows"], "Movies:", meta["movies"], "LiveTV:", meta.get("livetv", 0))
          EOF

          # Copy into /web so Pages always serves it next to index.html
          mkdir -p web/data
          cp data/data.json web/data/data.json
          echo "[build] Copied data/data.json -> web/data/data.json"

      - name: List important files (debug)
        run: |
          echo "== TREE (top) =="
          ls -la
          echo "== TREE (web) =="
          ls -la web || true
          echo "== TREE (web/data) =="
          ls -la web/data || true
          echo "== Head of web/data/data.json =="
          head -n 20 web/data/data.json || true

      - name: Commit updated data (optional)
        if: github.ref == 'refs/heads/main'
        run: |
          if git status --porcelain data/ | grep .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Update data.json ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))" || true
            git push || true
          else
            echo "No data changes to commit."
          fi

      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
