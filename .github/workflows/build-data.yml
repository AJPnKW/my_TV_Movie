# ==============================================================================
# [FILE]    .github/workflows/build-data.yml
# [PROJECT] my_TV_Movie
# [ROLE]    Build data.json + assets via scripts, then publish to repo
# [VERSION] v2.4.0
# [UPDATED] 2025-12-19_00-00-00
# [BUILD]   14.01.05
#
# [FIX]
# - Inject API_TMDB_KEY into the runtime env used by scripts/fetch_tmdb.py
# - Install python deps on the runner (requests + optional tqdm/orjson)
# - Add deterministic TMDB preflight (hard-fails with real HTTP status if auth/network breaks)
# ==============================================================================

name: build-data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *" # daily 04:17 UTC

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          python -m pip install tqdm orjson || true

      - name: TMDB preflight (auth + network)
        env:
          API_TMDB_KEY: ${{ secrets.API_TMDB_KEY }}
        run: |
          python - <<'PY'
          import os, sys, requests

          key = (os.getenv("API_TMDB_KEY") or "").strip()
          if not key:
            print("PRECHECK FAIL: API_TMDB_KEY missing from runtime env"); sys.exit(2)

          url = "https://api.themoviedb.org/3/configuration"
          headers = {"User-Agent": "my_TV_Movie tmdb-preflight"}
          timeout = 20

          # Auto-detect bearer vs v3 key (matches script logic)
          if len(key) >= 60 or key.startswith("eyJ"):
            headers["Authorization"] = f"Bearer {key}"
            r = requests.get(url, headers=headers, timeout=timeout)
          else:
            r = requests.get(url, headers=headers, params={"api_key": key}, timeout=timeout)

          print("TMDB preflight status:", r.status_code)
          if r.status_code != 200:
            print(r.text[:500])
            sys.exit(3)

          print("TMDB preflight OK")
          PY

      - name: Fetch TMDB (data.json + assets)
        env:
          API_TMDB_KEY: ${{ secrets.API_TMDB_KEY }}
          API_TMDB_TOKEN: ${{ secrets.API_TMDB_KEY }}
        run: |
          python scripts/fetch_tmdb.py

      - name: Fetch Trakt (watchlist enrichment)
        env:
          TRAKT_CLIENT_ID: ${{ secrets.API_TRAKT_ID }}
          TRAKT_USERNAME: ${{ secrets.API_TRAKT_KEY }}
          TRAKT_ACCESS_TOKEN: ${{ secrets.API_TRAKT_KEY }}
        run: |
          python scripts/fetch_trakt.py

      - name: Commit & push changes (if any)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "build-data: refresh data.json + assets"
          git push
