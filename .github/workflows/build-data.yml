name: Build TV Data and Deploy

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */4 * * *"  # every 4 hours

  push:
    branches: [ main ]
    paths:
      - "tv_list.txt"
      - "movies_list.txt"
      - "live_tv_list.txt"
      - "web/index.html"
      - "web/show.html"
      - "web/config.json"
      - "web/config.html"
      - "web/config.js"
      - "web/css/**"
      - "scripts/fetch_tmdb.py"
      - ".github/workflows/build-data.yml"

permissions:
  contents: write

concurrency:
  group: build-tv-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-data:
    runs-on: ubuntu-latest

    env:
      API_TMDB_KEY: ${{ secrets.API_TMDB_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Build data + cache missing images
        run: |
          python scripts/fetch_tmdb.py

      - name: Commit & push updated data/images (only if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only commit if data/ or image/ changed
          if git diff --quiet -- data/ image/; then
            echo "No changes in data/ or image/ – nothing to commit."
            exit 0
          fi

          git add data/ image/
          git commit -m "chore: refresh data + image cache [skip ci]"
          git push
