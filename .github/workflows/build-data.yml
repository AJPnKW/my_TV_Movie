name: Build TV Data and Deploy

on:
  # Manual run from Actions tab
  workflow_dispatch:

  # Every 4 hours
  schedule:
    - cron: "0 */4 * * *"

  # Run automatically when you change source config for the hub
  push:
    branches: [ main ]
    paths:
      - "tv_list.txt"
      - "movies_list.txt"
      - "live_tv_list.txt"
      - "web/index.html"
      - "scripts/fetch_tmdb.py"
      - ".github/workflows/build-data.yml"

# Prevent overlapping runs on the same branch
concurrency:
  group: build-tv-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-data:
    runs-on: ubuntu-latest

    # 🔑 Make TMDB key available to fetch_tmdb.py
    env:
      API_TMDB_KEY: ${{ secrets.API_TMDB_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            # Fallback if you don't have a requirements file
            pip install requests tmdbsimple
          fi

      - name: Build TV data (data/data.json, etc.)
        run: |
          python scripts/fetch_tmdb.py

      - name: Commit & push updated data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only commit if data actually changed
          if git diff --quiet -- data/; then
            echo "No changes in data/ – nothing to commit."
            exit 0
          fi

          git add data/
          git commit -m "chore: refresh TV/Movie data [skip ci]"
          git push
