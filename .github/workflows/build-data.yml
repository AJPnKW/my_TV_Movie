name: build-data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"
  push:
    branches: ["main"]
    paths:
      - "data/inputs.json"
      - "data/watch_source_availability.json"
      - "data/watch_state_queue.json"
      - "web/config.json"
      - "scripts/**"
      - "docs/00_master_contract.html"
      - ".github/workflows/build-data.yml"

permissions:
  contents: write

concurrency:
  group: build-data-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-data:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full data pipeline
        env:
          API_TMDB_KEY: ${{ secrets.API_TMDB_KEY }}
          API_TMDB_TOKEN: ${{ secrets.API_TMDB_TOKEN }}
          API_OMDB_KEY: ${{ secrets.API_OMDB_KEY }}
          API_TRAKT_ID: ${{ secrets.API_TRAKT_ID }}
          API_TRAKT_KEY: ${{ secrets.API_TRAKT_KEY }}
          API_TRAKT_REDIRECT_URL: ${{ secrets.API_TRAKT_REDIRECT_URL }}
        run: python scripts/run_pipeline_tmdb_trakt.py

      - name: Validate generated runtime JSON
        if: always()
        run: |
          python -m json.tool data/data.json > /dev/null
          python -m json.tool data/catalog_index.json > /dev/null
          python -m json.tool data/calendar.json > /dev/null
          if [ -f data/watch_state_queue.json ]; then python -m json.tool data/watch_state_queue.json > /dev/null; fi

      - name: Run integrity diagnostics
        if: always()
        run: |
          python scripts/qa_pipeline_integrity.py || true
          python scripts/qa_missing_trakt_ids.py || true
          python scripts/trakt_two_way_sync.py --dry-run || true

      - name: Upload pipeline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-data-diagnostics
          if-no-files-found: ignore
          path: |
            logs/*.log.txt
            reports/*.json
            reports/**/*.json
            reports/**/*.md
            data/errors*.json
            data/*queue*.json

      - name: Commit regenerated data artifacts
        if: success()
        run: |
          if git diff --quiet -- data/data.json data/catalog_index.json data/calendar.json data/catalog_detail assets data/watch_state_queue.json; then
            echo "No runtime artifact changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/catalog_index.json data/calendar.json data/catalog_detail assets data/watch_state_queue.json
          git commit -m "build: update data artifacts"
          git push
