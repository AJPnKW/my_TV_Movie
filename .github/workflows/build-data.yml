name: Build TV Data and Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build data.json
        env:
          API_TMDB_KEY: ${{ secrets.API_TMDB_KEY }}
          API_TMDB_TOKEN: ${{ secrets.API_TMDB_TOKEN }}
          API_TVMAZE_KEY: ${{ secrets.API_TVMAZE_KEY }}
          API_OMDB_KEY: ${{ secrets.API_OMDB_KEY }}
          API_TRAKT_CLIENT_ID: ${{ secrets.API_TRAKT_CLIENT_ID }}
          API_TRAKT_CLIENT_SECRET: ${{ secrets.API_TRAKT_CLIENT_SECRET }}
          API_TRAKT_TV_USER: ${{ secrets.API_TRAKT_TV_USER }}
        run: |
          echo "Running fetch_tmdb.py from $(pwd)"
          python scripts/fetch_tmdb.py
          echo "Resulting data.json:"
          python - << 'EOF'
          import json, os
          p = os.path.join("data", "data.json")
          if not os.path.exists(p):
              raise SystemExit("FATAL: data/data.json not created.")
          with open(p, "r", encoding="utf-8") as f:
              j = json.load(f)
          shows = len(j.get("shows", []))
          movies = len(j.get("movies", []))
          print(f"SUMMARY: shows={shows}, movies={movies}")
          if shows == 0 and movies == 0:
              raise SystemExit("FATAL: No shows and no movies in data.json.")
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
