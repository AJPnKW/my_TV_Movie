name: Build TV Data and Deploy

# ==============================================================================
# File:        .github/workflows/build-data.yml
# Project:     my_TV_Movie
# Purpose:     Build static TV/Movie data + cache images for GitHub Pages
# Version:     v3.3.6 (2025-12-16)
#
# Guarantees:
#   - data/data.json is ALWAYS generated
#   - config.json drives URL + image logic
#   - livetv_list.txt is OPTIONAL
#   - No infinite commit loops
# ==============================================================================

on:
  # Manual trigger
  workflow_dispatch:

  # Scheduled refresh
  schedule:
    - cron: "0 */4 * * *"

  # Trigger on config or input changes
  push:
    branches: [ main ]
    paths:
      - "tv_list.txt"
      - "movies_list.txt"
      - "livetv_list.txt"
      - "web/config.json"
      - "scripts/fetch_tmdb.py"
      - "scripts/fetch_trakt.py"
      - ".github/workflows/build-data.yml"

permissions:
  contents: write

concurrency:
  group: build-tv-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-data:
    runs-on: ubuntu-latest

    env:
      API_TMDB_KEY: ${{ secrets.API_TMDB_KEY }}
      API_TRAKT_CLIENT_ID: ${{ secrets.API_TRAKT_CLIENT_ID }}
      API_TRAKT_CLIENT_SECRET: ${{ secrets.API_TRAKT_CLIENT_SECRET }}

    steps:
      # ------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml orjson tqdm rich httpx

      # ------------------------------------------------------------------------
      - name: Validate input files
        run: |
          set -e
          test -f tv_list.txt || (echo "ERROR: tv_list.txt missing" && exit 1)
          test -f movies_list.txt || (echo "ERROR: movies_list.txt missing" && exit 1)
          if [ ! -f livetv_list.txt ]; then
            echo "WARNING: livetv_list.txt missing (optional)"
          fi
          test -f web/config.json || (echo "ERROR: web/config.json missing" && exit 1)

      # ------------------------------------------------------------------------
      - name: Build TMDB data
        run: |
          python scripts/fetch_tmdb.py

      # ------------------------------------------------------------------------
      - name: Build Trakt watch state (optional)
        run: |
          if [ -f scripts/fetch_trakt.py ]; then
            python scripts/fetch_trakt.py || echo "WARNING: Trakt fetch failed"
          fi

      # ------------------------------------------------------------------------
      - name: Commit & push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes detected – skipping commit."
            exit 0
          fi

          git add data/ image/
          git commit -m "chore: refresh TV/Movie data [skip ci]"
          git push
