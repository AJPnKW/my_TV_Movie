name: build-data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"
  push:
    branches: ["main"]
    paths:
      - "data/inputs.json"
      - "data/watch_source_availability.json"
      - "data/watch_state_queue.json"
      - "web/config.json"
      - "scripts/**"
      - "requirements.txt"
      - "docs/00_master_contract.html"
      - ".github/workflows/build-data.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: build-data-main
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-data:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate streaming config
        run: python scripts/validate_streaming_config.py

      - name: Run full data pipeline
        env:
          API_TMDB_KEY: ${{ secrets.API_TMDB_KEY }}
          API_TMDB_TOKEN: ${{ secrets.API_TMDB_TOKEN }}
          API_OMDB_KEY: ${{ secrets.API_OMDB_KEY }}
          API_TRAKT_ID: ${{ secrets.API_TRAKT_ID }}
          API_TRAKT_KEY: ${{ secrets.API_TRAKT_KEY }}
          API_TRAKT_SECRET: ${{ secrets.API_TRAKT_SECRET }}
          API_TRAKT_REDIRECT_URL: ${{ secrets.API_TRAKT_REDIRECT_URL }}
          API_TRAKT_ACCESS_TOKEN: ${{ secrets.API_TRAKT_ACCESS_TOKEN }}
          API_TRAKT_REFRESH_TOKEN: ${{ secrets.API_TRAKT_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/run_pipeline_tmdb_trakt.py
          else
            python scripts/run_pipeline_tmdb_trakt.py --refresh-existing-trakt
          fi

      - name: Validate generated runtime JSON
        if: always()
        run: |
          python -m json.tool data/data.json > /dev/null
          python -m json.tool data/catalog_index.json > /dev/null
          python -m json.tool data/calendar.json > /dev/null
          if [ -f data/watch_state_queue.json ]; then python -m json.tool data/watch_state_queue.json > /dev/null; fi

      - name: Run integrity diagnostics
        if: ${{ always() && github.event_name != 'push' }}
        env:
          API_TMDB_KEY: ${{ secrets.API_TMDB_KEY }}
          API_TMDB_TOKEN: ${{ secrets.API_TMDB_TOKEN }}
          API_OMDB_KEY: ${{ secrets.API_OMDB_KEY }}
          API_TRAKT_ID: ${{ secrets.API_TRAKT_ID }}
          API_TRAKT_KEY: ${{ secrets.API_TRAKT_KEY }}
          API_TRAKT_SECRET: ${{ secrets.API_TRAKT_SECRET }}
          API_TRAKT_REDIRECT_URL: ${{ secrets.API_TRAKT_REDIRECT_URL }}
          API_TRAKT_ACCESS_TOKEN: ${{ secrets.API_TRAKT_ACCESS_TOKEN }}
          API_TRAKT_REFRESH_TOKEN: ${{ secrets.API_TRAKT_REFRESH_TOKEN }}
        run: |
          python scripts/audit_inputs_tmdb_type.py --inputs data/inputs.json --out reports/_audit_inputs_tmdb_type_current.json --sleep-ms 0
          python scripts/qa_pipeline_integrity.py
          python scripts/qa_missing_trakt_ids.py || true
          python scripts/trakt_two_way_sync.py --dry-run || true

      - name: Upload pipeline diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-data-diagnostics
          if-no-files-found: ignore
          path: |
            logs/*.log.txt
            reports/*.json
            reports/**/*.json
            reports/**/*.md
            data/errors*.json
            data/*queue*.json

      - name: Commit regenerated data artifacts
        id: commit-artifacts
        if: success()
        run: |
          git add data/data.json data/catalog_index.json data/calendar.json data/catalog_detail data/watch_state_queue.json
          mapfile -t new_assets < <(git ls-files --others --exclude-standard assets)
          if [ "${#new_assets[@]}" -gt 0 ]; then
            printf '%s\0' "${new_assets[@]}" | xargs -0 git add --
          fi
          if git diff --cached --quiet; then
            echo "No runtime artifact changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: update data artifacts"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger pages deployment for generated artifacts
        if: steps.commit-artifacts.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
