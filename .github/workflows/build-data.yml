#!/usr/bin/env python

name: build-data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (adjust only if your spec requires otherwise)

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Preflight: proves the secret is injected (without printing it)
      - name: TMDB preflight (masked)
        shell: bash
        env:
          API_TMDB_KEY: ${{ secrets.API_TMDB_KEY }}
          API_TMDB_TOKEN: ${{ secrets.API_TMDB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys, requests
          key = (os.getenv("API_TMDB_KEY") or "").strip()
          tok = (os.getenv("API_TMDB_TOKEN") or "").strip()

          # Only report presence/length, never the value
          def kind(v):
            if not v: return ("missing", 0)
            looks_bearer = v.startswith("ey") and "." in v and len(v) > 40
            return ("bearer/jwt" if looks_bearer else "v3_key", len(v))

          print("API_TMDB_KEY:", kind(key))
          print("API_TMDB_TOKEN:", kind(tok))

          # Prefer bearer if present, otherwise v3 key
          headers = {"Accept": "application/json"}
          params = {}
          if tok:
            headers["Authorization"] = f"Bearer {tok}"
          elif key:
            params["api_key"] = key
          else:
            print("FAIL: no TMDB credential in env"); sys.exit(21)

          r = requests.get("https://api.themoviedb.org/3/configuration", headers=headers, params=params, timeout=25)
          print("TMDB /configuration status:", r.status_code)
          if r.status_code != 200:
            print((r.text or "")[:300].replace("\n", " "))
            sys.exit(22)
          PY

      - name: Fetch TMDB
        shell: bash
        env:
          API_TMDB_KEY: ${{ secrets.API_TMDB_KEY }}
          API_TMDB_TOKEN: ${{ secrets.API_TMDB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/fetch_tmdb.py

      - name: Fetch Trakt (optional)
        shell: bash
        env:
          API_TRAKT_ID: ${{ secrets.API_TRAKT_ID }}
          API_TRAKT_KEY: ${{ secrets.API_TRAKT_KEY }}
          API_TRAKT_OAUTH_REDIRECT_URL: ${{ secrets.API_TRAKT_OAUTH_REDIRECT_URL }}
        run: |
          set -euo pipefail
          if [ -f scripts/fetch_trakt.py ]; then
            python scripts/fetch_trakt.py
          else
            echo "scripts/fetch_trakt.py not present; skipping"
          fi

      - name: Commit refreshed data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # only commit if there are changes
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git add -A
          git commit -m "chore: refresh TV/Movie data [skip ci]"
          git push
