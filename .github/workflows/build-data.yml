name: Build TV Data and Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # REQUIRED for actions/deploy-pages@v4
    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi

      - name: Build data.json
        env:
          API_TMDB_KEY: ${{ secrets.API_TMDB_KEY }}
          API_TMDB_TOKEN: ${{ secrets.API_TMDB_TOKEN }}
          API_TVMAZE_KEY: ${{ secrets.API_TVMAZE_KEY }}
          API_OMDB_KEY: ${{ secrets.API_OMDB_KEY }}
          API_TRAKT_CLIENT_ID: ${{ secrets.API_TRAKT_CLIENT_ID }}
          TRAKT_PROFILES: ${{ secrets.TRAKT_PROFILES }}
        run: |
          python scripts/fetch_tmdb.py
          python scripts/fetch_tvmaze.py || echo "tvmaze failed (non-fatal)"
          python scripts/fetch_omdb.py || echo "omdb failed (non-fatal)"
          python scripts/fetch_trakt.py || echo "trakt failed (non-fatal)"
          python scripts/sync_trakt.py
          python scripts/fetch_live_tv.py || echo "live tv failed (non-fatal)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
