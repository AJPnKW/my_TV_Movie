# ======================================================================================
# [FILE]        .github/workflows/build-data.yml
# [PROJECT]     my_TV_Movie (My TV Hub)
# [ROLE]        Build TMDB dataset + (optional) cache missing images + commit results
# [VERSION]     v3.3.5-wf1
# [UPDATED]     2025-12-14
# [OWNER]       Andrew & Brant (internal)
# [DEPENDS ON]  scripts/fetch_tmdb.py
#              web/config.json
#              tv_list.txt, movies_list.txt, live_tv_list.txt
# [OUTPUTS]     data/data.json
#              image/** (download missing only; never overwrites)
# [RULES]
# - Config-driven: workflow reads web/config.json (authoritative bases/sizes) and rebuilds data
# - No loop: workflow commits data/ + image/ but push trigger paths exclude them
# - Requires secrets.API_TMDB_KEY
# ======================================================================================

name: Build TV Data and Deploy

on:
  workflow_dispatch:

  # Scheduled refresh
  schedule:
    - cron: "0 */4 * * *" # every 4 hours

  # Run automatically when hub inputs/config change (NOT on data/ or image/ changes)
  push:
    branches: [ main ]
    paths:
      - "tv_list.txt"
      - "movies_list.txt"
      - "live_tv_list.txt"
      - "web/config.json"
      - "scripts/fetch_tmdb.py"
      - "web/index.html"
      - "web/show.html"
      - "web/config.html"
      - "web/config.js"
      - "web/css/my_tv_hub.css"
      - ".github/workflows/build-data.yml"

permissions:
  contents: write

concurrency:
  group: build-tv-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-data:
    runs-on: ubuntu-latest

    env:
      API_TMDB_KEY: ${{ secrets.API_TMDB_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight - required inputs present
        shell: bash
        run: |
          set -euo pipefail

          # Secret required
          if [ -z "${API_TMDB_KEY:-}" ]; then
            echo "[WF] ERROR: secrets.API_TMDB_KEY is missing/empty."
            exit 1
          fi

          # Config required
          if [ ! -f "web/config.json" ]; then
            echo "[WF] ERROR: web/config.json not found."
            exit 1
          fi

          # Script required
          if [ ! -f "scripts/fetch_tmdb.py" ]; then
            echo "[WF] ERROR: scripts/fetch_tmdb.py not found."
            exit 1
          fi

          # Lists can be empty, but must exist (keeps behavior predictable)
          for f in tv_list.txt movies_list.txt live_tv_list.txt; do
            if [ ! -f "$f" ]; then
              echo "[WF] ERROR: $f not found."
              exit 1
            fi
          done

          echo "[WF] OK: preflight complete."

      - name: Build data + cache missing images
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fetch_tmdb.py

      - name: Commit & push generated artifacts (data/ + image/) only if changed
        shell: bash
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only generated artifacts
          git add data/ image/ || true

          # Exit clean if nothing staged
          if git diff --cached --quiet; then
            echo "[WF] No changes in data/ or image/ – nothing to commit."
            exit 0
          fi

          git commit -m "chore: refresh data + cache images [skip ci]"
          git push
          
