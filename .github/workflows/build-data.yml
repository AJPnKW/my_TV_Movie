# File: .github/workflows/build-data.yml
# Project: my_TV_Movie
# Version: v1.3.0 (2025-11-10 23:40 EST)

name: Build TV Data and Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Build data.json
        env:
          API_TMDB_KEY: ${{ secrets.API_TMDB_KEY }}
          API_TVMAZE_KEY: ${{ secrets.API_TVMAZE_KEY }}
          API_OMDB_KEY: ${{ secrets.API_OMDB_KEY }}
          API_TRAKT_CLIENT_ID: ${{ secrets.API_TRAKT_CLIENT_ID }}
          API_TRAKT_CLIENT_SECRET: ${{ secrets.API_TRAKT_CLIENT_SECRET }}
        run: |
          set -e
          mkdir -p data
          python scripts/fetch_tmdb.py
          python scripts/fetch_tvmaze.py || echo "tvmaze enrichment skipped"
          python scripts/fetch_omdb.py || echo "omdb enrichment skipped"
          python scripts/sync_trakt.py || echo "trakt sync skipped"
          python scripts/fetch_live_tv.py || echo "live tv skipped"
          cat data/data.json

      - name: Upload artifact (web)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
