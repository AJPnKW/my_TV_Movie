name: build-data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"   # daily, deterministic
  push:
    paths:
      - "scripts/**"
      - "web/**"
      - "data/**"
      - "*.txt"
      - "inputs/**"
      - ".github/workflows/build-data.yml"
      - "requirements.txt"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ------------------------------------------------------------
      # TXT → JSON (intermediate)
      # ------------------------------------------------------------
      - name: Parse TXT inputs
        run: python scripts/parse_txt_to_json.py

      # ------------------------------------------------------------
      # TMDB → data/data.json
      # ------------------------------------------------------------
      - name: Fetch TMDB
        run: python scripts/fetch_tmdb.py
        env:
          # Keep BOTH names available for script auto-detection
          API_TMDB_KEY: ${{ secrets.API_TMDB_KEY }}
          API_TMDB_TOKEN: ${{ secrets.API_TMDB_TOKEN }}

      # ------------------------------------------------------------
      # TRAKT → data/trakt_watched.json (and/or other artifacts)
      # ------------------------------------------------------------
      - name: Fetch Trakt
        run: python scripts/fetch_trakt.py
        env:
          # Authoritative mapping (required by fetch_trakt.py)
          TRAKT_CLIENT_ID: ${{ secrets.API_TRAKT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.API_TRAKT_KEY }}
          TRAKT_OAUTH_REDIRECT_URL: ${{ secrets.API_TRAKT_OAUTH_REDIRECT_URL }}
          TRAKT_USERNAME: ${{ secrets.API_TRAKT_USERNAME }}
          # Compatibility aliases (if scripts still look for API_* names)
          API_TRAKT_ID: ${{ secrets.API_TRAKT_ID }}
          API_TRAKT_KEY: ${{ secrets.API_TRAKT_KEY }}
          API_TRAKT_OAUTH_REDIRECT_URL: ${{ secrets.API_TRAKT_OAUTH_REDIRECT_URL }}
          API_TRAKT_USERNAME: ${{ secrets.API_TRAKT_USERNAME }}

      - name: Sync Trakt
        run: python scripts/sync_trakt.py
        env:
          # Authoritative mapping (keep consistent across trakt steps)
          TRAKT_CLIENT_ID: ${{ secrets.API_TRAKT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.API_TRAKT_KEY }}
          TRAKT_OAUTH_REDIRECT_URL: ${{ secrets.API_TRAKT_OAUTH_REDIRECT_URL }}
          TRAKT_USERNAME: ${{ secrets.API_TRAKT_USERNAME }}
          # Compatibility aliases
          API_TRAKT_ID: ${{ secrets.API_TRAKT_ID }}
          API_TRAKT_KEY: ${{ secrets.API_TRAKT_KEY }}
          API_TRAKT_OAUTH_REDIRECT_URL: ${{ secrets.API_TRAKT_OAUTH_REDIRECT_URL }}
          API_TRAKT_USERNAME: ${{ secrets.API_TRAKT_USERNAME }}

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "build: update data artifacts"
          git push
