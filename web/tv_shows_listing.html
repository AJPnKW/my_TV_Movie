<!--
FILE: web/tv_shows_listing.html
PROJECT: my_TV_Movie
VERSION: 0.1.2
DATE: 2026-01-20

PURPOSE
- Single-page listing utility sourced ONLY from data/data.json
- Two views: TV Shows | Movies
- TV Shows view:
    Show (twisty) → Seasons (twisty) → Episodes (rows)
    Episode row format:
      S##E## - Episode Name - Air Date - Runtime   [Vidsrc] [Videasy]
- Movies view:
    Movie rows with similar metadata + [Vidsrc] [Videasy]

HARD RULES (PER YOUR DATA.JSON)
- Use prebuilt URLs stored in data.json:  item.links.vidsrc  and  item.links.videasy
- Do NOT construct or infer streaming URLs.

EVIDENCE (FROM YOUR SCHEMA DUMP)
- TOP_KEYS: errors, meta, metadata, movies, shows
- TV_KEY = shows, MOVIES_KEY = movies
- show.seasons exists as a key, but SHOW.seasons.count = 0 on the sample object
  → Seasons/Episodes are present elsewhere in the JSON graph (not in show.seasons array)

SEASONS/EPISODES EXTRACTION (NO GUESSING, NO NEW SOURCES)
- Primary path (if present): show.seasons[] then season.episodes[]
- Fallback path (schema-agnostic): deep-scan the loaded JSON object for:
    * Season objects: have season_number + (tv_id/show_id/series_id/parent ids) or obvious season fields
    * Episode objects: have episode_number + season_number + (tv_id/show_id/series_id/parent ids)
  Then index them and join back to shows by TMDB show id + season_number.
-->
<html lang="en">

<body>
  <pre id="ajp_page_header" style="display:none">

VERSION: 0.1.2
DATE: 2026-01-20
  </pre>

  <div class="wrap">
    <div class="topbar">
      <div class="title">Listing</div>

      <div class="tabs" role="tablist" aria-label="Listing views">
        <button id="tab-tv" class="tabbtn" role="tab" aria-selected="true" aria-controls="panel-tv" type="button">TV Shows</button>
        <button id="tab-movies" class="tabbtn" role="tab" aria-selected="false" aria-controls="panel-movies" type="button">Movies</button>
      </div>

      <div class="spacer"></div>

      <button id="page-version-btn" class="version-button" type="button" title="Page version"></button>
    </div>

    <div id="status" class="status">Loading data/data.json…</div>
    <div id="error" class="error" style="display:none"></div>

    <div class="panel" id="panel-tv" role="tabpanel" aria-labelledby="tab-tv">
      <div id="tv-list" class="list"></div>
    </div>

    <div class="panel" id="panel-movies" role="tabpanel" aria-labelledby="tab-movies" style="display:none">
      <div id="movies-list" class="list"></div>
    </div>
  </div>

  <script>
  /* ============================================================================
     VERSION BUTTON (parses your FILE/PROJECT/VERSION/DATE header block)
  ============================================================================ */
  function parseHeaderBlock() {
    const el = document.getElementById("ajp_page_header");
    const raw = (el && el.textContent ? el.textContent : "").trim();
    const out = {};
    raw.split(/\r?\n/).forEach(line => {
      const m = line.match(/^\s*([A-Z_]+)\s*:\s*(.+?)\s*$/);
      if (!m) return;
      out[m[1]] = m[2];
    });
    return out;
  }

  function wireVersionButton() {
    const hdr = parseHeaderBlock();
    const btn = document.getElementById("page-version-btn");
    if (!btn) return;

    const version = hdr.VERSION ? hdr.VERSION : "0.0.0";
    btn.textContent = "v" + version;

    btn.addEventListener("click", () => {
      const file = hdr.FILE ? hdr.FILE : "tv_shows_listing.html";
      const proj = hdr.PROJECT ? hdr.PROJECT : "my_TV_Movie";
      const date = hdr.DATE ? hdr.DATE : "";
      alert(
        file + "\n" +
        proj + "\n" +
        "VERSION: " + version + (date ? ("\nDATE: " + date) : "")
      );
    });
  }

  /* ============================================================================
     DATA LOADING (SOLE SOURCE OF TRUTH: data/data.json)
  ============================================================================ */
  async function loadJson(url) {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status + " while fetching " + url);
    return await res.json();
  }

  /* ============================================================================
     BASIC HELPERS (safe + deterministic)
  ============================================================================ */
  function asInt(x) {
    const n = Number(x);
    return Number.isFinite(n) ? n : null;
  }
  function pad2(n) {
    const v = asInt(n);
    if (v === null) return "??";
    return String(v).padStart(2, "0");
  }
  function fmtDate(x) { return x ? String(x).trim() : ""; }
  function fmtRuntime(x) {
    const n = asInt(x);
    return n === null ? "" : (n + "m");
  }
  function ensureArray(x) {
    if (!x) return [];
    if (Array.isArray(x)) return x;
    if (typeof x === "object" && Array.isArray(x.items)) return x.items;
    if (typeof x === "object") return Object.values(x).filter(v => v && typeof v === "object");
    return [];
  }

  function getTitle(obj) {
    if (!obj) return "";
    return (
      obj.name ??
      obj.title ??
      obj.original_name ??
      obj.original_title ??
      ""
    ).toString();
  }
  function getYear(obj) {
    const d = obj.first_air_date ?? obj.release_date ?? obj.air_date ?? obj.date ?? "";
    const m = String(d).match(/^(\d{4})/);
    return m ? m[1] : "";
  }
  function getTmdbId(obj) {
    if (!obj) return null;
    const v = obj.tmdb_id ?? obj.id ?? null;
    const n = asInt(v);
    return n === null ? null : n;
  }
  function getImdbId(obj) { return (obj && (obj.imdb_id ?? "")) ? String(obj.imdb_id) : ""; }

  /* ============================================================================
     LINKS (HARD): use obj.links.vidsrc + obj.links.videasy ONLY
  ============================================================================ */
  function getLinks(obj) {
    if (obj && obj.links && typeof obj.links === "object") {
      return {
        vidsrc: obj.links.vidsrc ? String(obj.links.vidsrc) : "",
        videasy: obj.links.videasy ? String(obj.links.videasy) : ""
      };
    }
    return { vidsrc: "", videasy: "" };
  }

  /* ============================================================================
     ROOT COLLECTIONS (based on your dump: shows + movies)
  ============================================================================ */
  function detectRootCollections(data) {
    const shows = ensureArray(data && data.shows ? data.shows : []);
    const movies = ensureArray(data && data.movies ? data.movies : []);
    return { shows, movies };
  }

  /* ============================================================================
     SEASONS + EPISODES (THIS IS THE BROKEN PART IN YOUR CURRENT RUN)

     Evidence you provided:
       - show has a "seasons" key
       - BUT show.seasons.count = 0 on the sample show object
       - Root does NOT expose tv_seasons / tv_episodes keys
       => Seasons/Episodes exist elsewhere in the JSON object graph.

     Fix approach (two-path, no questions, no other files):
       PATH A (nested):
         show.seasons[]  +  season.episodes[]
       PATH B (deep-scan + join):
         deep-scan entire loaded JSON to find season/episode objects
         build indexes:
           seasonsByShowId[show_tmdb] -> seasons[]
           episodesByShowSeason[show_tmdb::season_number] -> episodes[]
  ============================================================================ */

  function getSeasonNumber(season) {
    return season ? (season.season_number ?? season.seasonNumber ?? season.number ?? season.season ?? null) : null;
  }
  function getEpisodeNumber(ep) {
    return ep ? (ep.episode_number ?? ep.episodeNumber ?? ep.number ?? ep.episode ?? null) : null;
  }
  function getEpisodeAirDate(ep) { return ep ? (ep.air_date ?? ep.airDate ?? ep.date ?? null) : null; }
  function getEpisodeRuntime(ep) { return ep ? (ep.runtime ?? ep.episode_runtime ?? ep.episodeRuntime ?? null) : null; }

  function getShowSeasonsNested(show) {
    // PATH A: nested show.seasons[]
    // Your data shows "seasons" exists as a key on show objects, but may be empty.
    const s = show && show.seasons ? show.seasons : [];
    return ensureArray(s);
  }
  function getSeasonEpisodesNested(season) {
    // PATH A: nested season.episodes[]
    const e = season && season.episodes ? season.episodes : [];
    return ensureArray(e);
  }

  function isPlainObject(x) {
    return x !== null && typeof x === "object" && !Array.isArray(x);
  }

  function getPossibleParentShowId(obj) {
    // join candidates commonly used across pipelines
    const cands = [
      obj.tv_id, obj.show_id, obj.series_id,
      obj.tmdb_show_id, obj.tmdb_tv_id, obj.tmdb_series_id,
      obj.parent_tmdb_id, obj.parent_id,
      obj.show_tmdb_id
    ];
    for (const v of cands) {
      const n = asInt(v);
      if (n !== null) return n;
    }

    // occasionally the object includes a nested "show" or "series" object
    if (obj.show && isPlainObject(obj.show)) {
      const n = asInt(obj.show.tmdb_id ?? obj.show.id ?? null);
      if (n !== null) return n;
    }
    if (obj.series && isPlainObject(obj.series)) {
      const n = asInt(obj.series.tmdb_id ?? obj.series.id ?? null);
      if (n !== null) return n;
    }

    return null;
  }

  function looksLikeSeason(obj) {
    // minimal season signature: season_number exists and it's not an episode (no episode_number)
    return obj && (obj.season_number != null || obj.seasonNumber != null || obj.season != null) &&
           (obj.episode_number == null && obj.episodeNumber == null);
  }

  function looksLikeEpisode(obj) {
    // minimal episode signature: episode_number + season_number
    const hasEp = (obj && (obj.episode_number != null || obj.episodeNumber != null || obj.episode != null));
    const hasS  = (obj && (obj.season_number != null || obj.seasonNumber != null || obj.season != null));
    return !!(hasEp && hasS);
  }

  function deepScanForSeasonsAndEpisodes(root) {
    // PATH B: deep-scan entire JSON graph
    // Output is indexes to join back to shows.
    const seasonsByShowId = new Map();        // show_tmdb -> season[]
    const episodesByShowSeason = new Map();   // "show_tmdb::season_number" -> episode[]

    let seasonCount = 0;
    let episodeCount = 0;

    const seen = new Set();
    const stack = [root];

    while (stack.length) {
      const cur = stack.pop();
      if (!cur || (typeof cur !== "object")) continue;

      // prevent infinite loops if any
      if (seen.has(cur)) continue;
      seen.add(cur);

      if (Array.isArray(cur)) {
        for (let i = cur.length - 1; i >= 0; i--) stack.push(cur[i]);
        continue;
      }

      // cur is object
      if (looksLikeSeason(cur)) {
        const showId = getPossibleParentShowId(cur);
        const sNum = asInt(getSeasonNumber(cur));
        if (showId !== null && sNum !== null) {
          const key = String(showId);
          const arr = seasonsByShowId.get(key) || [];
          arr.push(cur);
          seasonsByShowId.set(key, arr);
          seasonCount++;
        }
      } else if (looksLikeEpisode(cur)) {
        const showId = getPossibleParentShowId(cur);
        const sNum = asInt(cur.season_number ?? cur.seasonNumber ?? cur.season ?? null);
        if (showId !== null && sNum !== null) {
          const key = String(showId) + "::" + String(sNum);
          const arr = episodesByShowSeason.get(key) || [];
          arr.push(cur);
          episodesByShowSeason.set(key, arr);
          episodeCount++;
        }
      }

      for (const v of Object.values(cur)) stack.push(v);
    }

    // deterministic sorting
    for (const [k, arr] of seasonsByShowId.entries()) {
      arr.sort((a,b) => (asInt(getSeasonNumber(a)) ?? 9999) - (asInt(getSeasonNumber(b)) ?? 9999));
      seasonsByShowId.set(k, arr);
    }
    for (const [k, arr] of episodesByShowSeason.entries()) {
      arr.sort((a,b) => (asInt(getEpisodeNumber(a)) ?? 9999) - (asInt(getEpisodeNumber(b)) ?? 9999));
      episodesByShowSeason.set(k, arr);
    }

    return { seasonsByShowId, episodesByShowSeason, seasonCount, episodeCount };
  }

  /* ============================================================================
     DOM HELPERS
  ============================================================================ */
  function el(tag, attrs, ...children) {
    const n = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") n.className = v;
        else if (k === "dataset") { for (const [dk,dv] of Object.entries(v)) n.dataset[dk] = dv; }
        else if (k.startsWith("aria-")) n.setAttribute(k, v);
        else if (k === "text") n.textContent = v;
        else n.setAttribute(k, v);
      }
    }
    for (const c of children) {
      if (c == null) continue;
      if (typeof c === "string") n.appendChild(document.createTextNode(c));
      else n.appendChild(c);
    }
    return n;
  }
  function makeLinkButton(label, url) {
    const a = el("a", { class: "btn", href: url || "#", target: "_blank", rel: "noreferrer noopener" }, label);
    if (!url) a.setAttribute("aria-disabled", "true");
    return a;
  }
  function makeTwistyButton(isOpen) {
    return el("button", { class: "twisty", type: "button", "aria-label": isOpen ? "Collapse" : "Expand", text: isOpen ? "−" : "+" });
  }
  function setOpen(childrenEl, twistyBtn, open) {
    childrenEl.dataset.open = open ? "true" : "false";
    twistyBtn.textContent = open ? "−" : "+";
    twistyBtn.setAttribute("aria-label", open ? "Collapse" : "Expand");
  }

  /* ============================================================================
     RENDER: EPISODE ROW
     - uses ep.links.* (no URL construction)
  ============================================================================ */
  function buildEpisodeRow(show, season, ep) {
    const sNum = asInt(getSeasonNumber(season)) ?? asInt(ep.season_number ?? ep.seasonNumber ?? ep.season ?? null);
    const eNum = asInt(getEpisodeNumber(ep));
    const epTitle = getTitle(ep) || "(untitled)";
    const air = fmtDate(getEpisodeAirDate(ep));
    const rt = fmtRuntime(getEpisodeRuntime(ep));
    const label =
      "S" + pad2(sNum) + "E" + pad2(eNum) +
      " - " + epTitle +
      (air ? (" - " + air) : "") +
      (rt ? (" - " + rt) : "");

    const links = getLinks(ep);

    return el("div", { class: "ep-row" },
      el("div", { class: "ep-meta" }, label),
      el("div", { class: "pillbar" },
        makeLinkButton("Vidsrc", links.vidsrc),
        makeLinkButton("Videasy", links.videasy)
      )
    );
  }

  /* ============================================================================
     RENDER: SEASON CARD
     - episodes come from:
         PATH A: season.episodes[]
         PATH B: deep-scan index by show_tmdb + season_number
  ============================================================================ */
  function buildSeasonCard(show, season, episodes) {
    const sNum = getSeasonNumber(season);
    const title = getTitle(season) || ("Season " + (sNum ?? "?"));
    const eps = ensureArray(episodes);

    const sub = el("div", { class: "subcard" });
    const headerRow = el("div", { class: "subrow" });
    const twisty = makeTwistyButton(false);
    const children = el("div", { class: "children", dataset: { open: "false" } });

    headerRow.appendChild(twisty);
    headerRow.appendChild(
      el("div", { class: "meta" },
        el("div", { class: "primary" }, title),
        el("div", { class: "secondary" }, "S" + pad2(sNum) + " • " + (eps.length ? (eps.length + " eps") : "no episodes"))
      )
    );

    if (!eps.length) {
      children.appendChild(el("div", { class: "ep-row" },
        el("div", { class: "ep-meta muted" }, "No episodes available in this season.")
      ));
    } else {
      eps.forEach(ep => children.appendChild(buildEpisodeRow(show, season, ep)));
    }

    twisty.addEventListener("click", () => {
      const open = children.dataset.open !== "true";
      setOpen(children, twisty, open);
    });

    sub.appendChild(headerRow);
    sub.appendChild(children);
    return sub;
  }

  /* ============================================================================
     RENDER: SHOW CARD  (THIS IS WHERE SEASONS ARE PULLED)
     - seasons come from:
         PATH A: show.seasons[]  (but you observed count=0)
         PATH B: deep-scan index (seasonsByShowId[show.tmdb_id])
  ============================================================================ */
  function buildShowCard(show, scanIndex) {
    const name = getTitle(show) || "(untitled show)";
    const year = getYear(show);
    const tmdbId = getTmdbId(show);
    const imdbId = getImdbId(show);

    // ---- SEASONS PULL (PATH A then PATH B) ----
    const nestedSeasons = getShowSeasonsNested(show); // show.seasons[]
    const indexedSeasons = (tmdbId != null) ? (scanIndex.seasonsByShowId.get(String(tmdbId)) || []) : [];
    const seasons = nestedSeasons.length ? nestedSeasons : indexedSeasons;
    // -------------------------------------------

    const card = el("div", { class: "card" });
    const row = el("div", { class: "row" });

    const twisty = makeTwistyButton(false);
    const children = el("div", { class: "children", dataset: { open: "false" } });

    const secParts = [];
    if (year) secParts.push(year);
    if (tmdbId) secParts.push("tmdb:" + tmdbId);
    if (imdbId) secParts.push("imdb:" + imdbId);
    secParts.push(seasons.length ? (seasons.length + " seasons") : "no seasons");

    row.appendChild(twisty);
    row.appendChild(
      el("div", { class: "meta" },
        el("div", { class: "primary" }, name),
        el("div", { class: "secondary" }, secParts.join(" • "))
      )
    );

    // Always render a Seasons section (your debugging requirement: confirm whether seasons exist)
    if (!seasons.length) {
      children.appendChild(el("div", { class: "subcard" },
        el("div", { class: "subrow" },
          el("div", { class: "meta" },
            el("div", { class: "primary" }, "Seasons"),
            el("div", { class: "secondary" }, "No seasons available.")
          )
        )
      ));
    } else {
      seasons.forEach(season => {
        const sNum = asInt(getSeasonNumber(season));

        // ---- EPISODES PULL (PATH A then PATH B) ----
        const nestedEps = getSeasonEpisodesNested(season); // season.episodes[]
        const indexedEps =
          (tmdbId != null && sNum != null)
            ? (scanIndex.episodesByShowSeason.get(String(tmdbId) + "::" + String(sNum)) || [])
            : [];
        const eps = nestedEps.length ? nestedEps : indexedEps;
        // -------------------------------------------

        children.appendChild(buildSeasonCard(show, season, eps));
      });
    }

    twisty.addEventListener("click", () => {
      const open = children.dataset.open !== "true";
      setOpen(children, twisty, open);
    });

    card.appendChild(row);
    card.appendChild(children);
    return card;
  }

  /* ============================================================================
     RENDER: MOVIE CARD  (links come from movie.links.*)
  ============================================================================ */
  function buildMovieCard(movie) {
    const name = getTitle(movie) || "(untitled movie)";
    const year = getYear(movie);
    const rt = fmtRuntime(movie.runtime ?? null);
    const tmdbId = getTmdbId(movie);
    const imdbId = getImdbId(movie);
    const links = getLinks(movie);

    const secParts = [];
    if (year) secParts.push(year);
    if (rt) secParts.push(rt);
    if (tmdbId) secParts.push("tmdb:" + tmdbId);
    if (imdbId) secParts.push("imdb:" + imdbId);

    return el("div", { class: "card" },
      el("div", { class: "row" },
        el("div", { class: "meta" },
          el("div", { class: "primary" }, name),
          el("div", { class: "secondary" }, secParts.length ? secParts.join(" • ") : "—")
        ),
        el("div", { class: "pillbar" },
          makeLinkButton("Vidsrc", links.vidsrc),
          makeLinkButton("Videasy", links.videasy)
        )
      )
    );
  }

  /* ============================================================================
     TABS
  ============================================================================ */
  function setTab(tab) {
    const tvBtn = document.getElementById("tab-tv");
    const mvBtn = document.getElementById("tab-movies");
    const tvPanel = document.getElementById("panel-tv");
    const mvPanel = document.getElementById("panel-movies");

    const isTv = tab === "tv";
    tvBtn.setAttribute("aria-selected", isTv ? "true" : "false");
    mvBtn.setAttribute("aria-selected", isTv ? "false" : "true");
    tvPanel.style.display = isTv ? "" : "none";
    mvPanel.style.display = isTv ? "none" : "";
  }
  function wireTabs() {
    document.getElementById("tab-tv").addEventListener("click", () => setTab("tv"));
    document.getElementById("tab-movies").addEventListener("click", () => setTab("movies"));
  }

  /* ============================================================================
     BOOT
  ============================================================================ */
  function showError(msg) {
    const err = document.getElementById("error");
    err.style.display = "";
    err.textContent = msg;
  }
  function setStatus(msg) {
    document.getElementById("status").textContent = msg;
  }

  async function main() {
    wireVersionButton();
    wireTabs();

    try {
      const data = await loadJson("../data/data.json");
      const root = detectRootCollections(data);

      // Build deep-scan indexes for seasons/episodes (PATH B)
      const scanIndex = deepScanForSeasonsAndEpisodes(data);

      // Render TV
      const tvList = document.getElementById("tv-list");
      tvList.innerHTML = "";

      const showsSorted = root.shows.slice().sort((a,b) =>
        (getTitle(a) || "").localeCompare(getTitle(b) || "", undefined, { sensitivity: "base" })
      );

      if (!showsSorted.length) {
        tvList.appendChild(el("div", { class: "card" },
          el("div", { class: "row" },
            el("div", { class: "meta" },
              el("div", { class: "primary" }, "TV Shows"),
              el("div", { class: "secondary" }, "No shows detected in data/data.json.")
            )
          )
        ));
      } else {
        showsSorted.forEach(show => tvList.appendChild(buildShowCard(show, scanIndex)));
      }

      // Render Movies
      const mvList = document.getElementById("movies-list");
      mvList.innerHTML = "";

      const moviesSorted = root.movies.slice().sort((a,b) =>
        (getTitle(a) || "").localeCompare(getTitle(b) || "", undefined, { sensitivity: "base" })
      );

      if (!moviesSorted.length) {
        mvList.appendChild(el("div", { class: "card" },
          el("div", { class: "row" },
            el("div", { class: "meta" },
              el("div", { class: "primary" }, "Movies"),
              el("div", { class: "secondary" }, "No movies detected in data/data.json.")
            )
          )
        ));
      } else {
        moviesSorted.forEach(movie => mvList.appendChild(buildMovieCard(movie)));
      }

      // Status includes evidence that the deep-scan found seasons/episodes
      setStatus(
        "Loaded: " + showsSorted.length + " TV shows, " + moviesSorted.length + " movies. " +
        "ScanIndex: " + scanIndex.seasonCount + " seasons, " + scanIndex.episodeCount + " episodes."
      );

    } catch (e) {
      setStatus("Failed.");
      showError(String(e && e.stack ? e.stack : e));
    }
  }

  main();
  </script>
</body>
</html>
