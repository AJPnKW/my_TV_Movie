<!doctype html>
<!--
FILE: web/tv_shows_listing.html
PROJECT: my_TV_Movie
VERSION: 0.1.6
DATE: 2026-01-22

PURPOSE
- Single-page listing utility sourced ONLY from data/data.json
- Two views: TV Shows | Movies
- TV Shows view:
    Show (twisty) → Seasons (twisty) → Episodes (rows)
    Episode row format:
      S##E## - Episode Name - Air Date - Runtime   [Vidsrc] [Videasy]
- Movies view:
    Movie rows with similar metadata + [Vidsrc] [Videasy]

HARD RULES (PER YOUR DATA.JSON)
- Use prebuilt URLs stored in data.json:  item.links.vidsrc  and  item.links.videasy
- Do NOT construct or infer streaming URLs.

EVIDENCE (FROM YOUR SCHEMA DUMP)
- TOP_KEYS: errors, meta, metadata, movies, shows
- TV_KEY = shows, MOVIES_KEY = movies
- show.seasons exists as a key, but SHOW.seasons.count = 0 on the sample object
  → NOTE (validated via screenshots): show.seasons[] and season.episodes[] DO exist in the canonical structure.
    The earlier “count=0” observation was caused by unsafe inspection/selection, not by the schema.

SEASONS/EPISODES EXTRACTION (NO GUESSING, NO NEW SOURCES)
- Primary path (canonical): show.seasons[] then season.episodes[]
- Fallback path: none. If seasons/episodes are absent, the UI reports “No seasons available” / “No episodes”.

CHANGE LOG
- 0.1.6: Visual refresh
         - Modern “twisty” widget (animated chevron pill)
         - Strong focus/keyboard contrast states
         - Poster thumbnails at show/movie + season + episode levels (capped to row height)
         - Show/movie header becomes 2-line “hero row” with genres + rating + seasons + status + dates; removes imdb
         - Season band: no S01 label; adds air date + 2-line overview clamp + keeps “8 eps”
         - Episode rows: thumbnail + badge + nicer layout; buttons still use prebuilt links only (with cascade)
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TV Shows + Movies Listing</title>

  <style>
    :root { color-scheme: dark; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0b0c0f;
    }

    .wrap { max-width: 1200px; margin: 0 auto; padding: 14px 14px 40px; }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .title { font-size: 18px; font-weight: 650; margin-right: 10px; }

    .tabs { display: inline-flex; gap: 6px; }
    .tabbtn {
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: inherit;
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
    }
    .tabbtn:hover { transform: translateY(-1px); }
    .tabbtn[aria-selected="true"] { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.30); }

    .spacer { flex: 1; }

    .version-button {
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.06);
      color: inherit;
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      user-select: none;
      white-space: nowrap;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
    }
    .version-button:hover { transform: translateY(-1px); }

    /* Focus contrast (buttons + links) */
    .tabbtn:focus-visible,
    .version-button:focus-visible,
    .btn:focus-visible,
    .twisty:focus-visible {
      outline: 3px solid rgba(255,255,255,0.85);
      outline-offset: 2px;
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.55);
    }

    .status { margin-top: 12px; font-size: 13px; opacity: 0.85; }
    .error { margin-top: 12px; font-size: 13px; color: #ffb4b4; white-space: pre-wrap; }

    .panel { margin-top: 12px; }
    .list { display: flex; flex-direction: column; gap: 10px; }

    .card {
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.035);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.24);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
    }

    /* Fun modern twisty */
    .twisty {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.16);
      background:
        radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,0.14), rgba(255,255,255,0.04) 55%, rgba(255,255,255,0.02));
      color: inherit;
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
    }
    .twisty:hover { transform: translateY(-1px); border-color: rgba(255,255,255,0.30); }
    .twisty .chev {
      width: 16px; height: 16px;
      transition: transform 160ms ease;
      opacity: 0.95;
    }
    .twisty[data-open="true"] .chev { transform: rotate(90deg); }

    .thumb {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04);
      flex: 0 0 auto;
    }
    .thumb.sm {
      width: 30px;
      height: 30px;
      border-radius: 9px;
    }

    .meta { min-width: 0; flex: 1; }
    .primary { font-size: 14px; font-weight: 650; line-height: 1.2; }
    .secondary { font-size: 12px; opacity: 0.82; margin-top: 3px; line-height: 1.25; }

    /* Show/Movie title row: 2 lines with “single-line alignment” (no wrapping per line) */
    .line1, .line2 {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pillbar { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .btn {
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: inherit;
      padding: 7px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 12px;
      user-select: none;
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
    }
    .btn:hover { transform: translateY(-1px); border-color: rgba(255,255,255,0.30); background: rgba(255,255,255,0.10); }
    .btn[aria-disabled="true"] { opacity: 0.40; cursor: not-allowed; pointer-events: none; }

    .children { padding: 0 12px 12px 56px; display: none; }
    .children[data-open="true"] { display: block; }

    .subcard {
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.14);
      border-radius: 14px;
      margin-top: 10px;
      overflow: hidden;
    }

    .subrow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }

    /* Season text: 2-line (label + overview clamp) */
    .season_title { font-weight: 650; }
    .clamp2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ep-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-top: 1px solid rgba(255,255,255,0.10);
    }

    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      opacity: 0.92;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .muted { opacity: 0.78; }
  </style>
</head>

<body>
  <pre id="ajp_page_header" style="display:none">
FILE: web/tv_shows_listing.html
PROJECT: my_TV_Movie
VERSION: 0.1.6
DATE: 2026-01-22
  </pre>

  <div class="wrap">
    <div class="topbar">
      <div class="title">Listing</div>

      <div class="tabs" role="tablist" aria-label="Listing views">
        <button id="tab-tv" class="tabbtn" role="tab" aria-selected="true" aria-controls="panel-tv" type="button">TV Shows</button>
        <button id="tab-movies" class="tabbtn" role="tab" aria-selected="false" aria-controls="panel-movies" type="button">Movies</button>
      </div>

      <div class="spacer"></div>

      <button id="page-version-btn" class="version-button" type="button" title="Page version"></button>
    </div>

    <div id="status" class="status">Loading data/data.json…</div>
    <div id="error" class="error" style="display:none"></div>

    <div class="panel" id="panel-tv" role="tabpanel" aria-labelledby="tab-tv">
      <div id="tv-list" class="list"></div>
    </div>

    <div class="panel" id="panel-movies" role="tabpanel" aria-labelledby="tab-movies" style="display:none">
      <div id="movies-list" class="list"></div>
    </div>
  </div>

  <script>
  /* ============================================================================
     VERSION BUTTON (parses FILE/PROJECT/VERSION/DATE from header block)
  ============================================================================ */
  function parseHeaderBlock() {
    const el = document.getElementById("ajp_page_header");
    const raw = (el && el.textContent ? el.textContent : "").trim();
    const out = {};
    raw.split(/\r?\n/).forEach(line => {
      const m = line.match(/^\s*([A-Z_]+)\s*:\s*(.+?)\s*$/);
      if (!m) return;
      out[m[1]] = m[2];
    });
    return out;
  }

  function wireVersionButton() {
    const hdr = parseHeaderBlock();
    const btn = document.getElementById("page-version-btn");
    if (!btn) return;

    const version = hdr.VERSION ? hdr.VERSION : "0.0.0";
    btn.textContent = "v" + version;

    btn.addEventListener("click", () => {
      alert(
        (hdr.FILE || "web/tv_shows_listing.html") + "\n" +
        (hdr.PROJECT || "my_TV_Movie") + "\n" +
        "VERSION: " + version + (hdr.DATE ? ("\nDATE: " + hdr.DATE) : "")
      );
    });
  }

  /* ============================================================================
     DATA LOADING (SOLE SOURCE: ../data/data.json)
  ============================================================================ */
  async function loadJson(url) {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status + " while fetching " + url);
    return await res.json();
  }

  /* ============================================================================
     CANONICAL ACCESSORS (NO KEY GUESSING)
  ============================================================================ */
  function ensureArray(x) { return Array.isArray(x) ? x : []; }

  function asInt(x) {
    const n = Number(x);
    return Number.isFinite(n) ? n : null;
  }

  function pad2(n) {
    const v = asInt(n);
    if (v === null) return "??";
    return String(v).padStart(2, "0");
  }

  function fmtDate(x) { return x ? String(x).trim() : ""; }

  function fmtRuntime(x) {
    const n = asInt(x);
    return n === null ? "" : (n + "m");
  }

  function showTitle(show) {
    const v = show && (show.name ?? show.title ?? show.original_name ?? "");
    return v ? String(v) : "";
  }

  function movieTitle(movie) {
    const v = movie && (movie.title ?? movie.name ?? movie.original_title ?? "");
    return v ? String(v) : "";
  }

  function getYearFromObj(obj) {
    const d = obj ? (obj.first_air_date ?? obj.release_date ?? "") : "";
    const m = String(d).match(/^(\d{4})/);
    return m ? m[1] : "";
  }

  function getGenresLine(obj) {
    const gs = obj && Array.isArray(obj.genres) ? obj.genres : [];
    const names = gs.map(g => g && g.name ? String(g.name) : "").filter(Boolean);
    return names.join(" • ");
  }

  function getRating(obj) {
    const v = obj ? obj.vote_average : null;
    const n = Number(v);
    if (!Number.isFinite(n)) return "";
    return n.toFixed(1);
  }

  /* ============================================================================
     Asset URL resolver
     - data.json paths often look like "/assets/..."
     - On GitHub Pages for a repo site, leading "/" would point to the domain root.
     - We prefix with the repo base segment when present (e.g. "/my_TV_Movie").
  ============================================================================ */
  function getRepoBasePath() {
    const p = (window.location && window.location.pathname) ? String(window.location.pathname) : "";
    // GitHub Pages project site: /<repo>/web/...
    const parts = p.split("/").filter(Boolean);
    if (parts.length >= 1 && parts[0] && parts[0] !== "web") return "/" + parts[0];
    return "";
  }

  function assetUrl(path) {
    if (!path) return "";
    const s = String(path);
    if (s.startsWith("http://") || s.startsWith("https://")) return s;
    if (s.startsWith("data:")) return s;
    if (s.startsWith("/")) return getRepoBasePath() + s;
    return s;
  }

  function pickThumb(obj, keys) {
    for (const k of keys) {
      if (obj && obj[k]) return assetUrl(obj[k]);
    }
    return "";
  }

  /* ============================================================================
     LINKS (HARD): prebuilt URLs only (no construction)
     Episode buttons not working because episodes often do NOT carry links.
     Resolution: cascade prebuilt links:
       episode.links -> season.links -> show.links
  ============================================================================ */
  function getLinksDirect(obj) {
    if (obj && obj.links && typeof obj.links === "object") {
      return {
        vidsrc: obj.links.vidsrc ? String(obj.links.vidsrc) : "",
        videasy: obj.links.videasy ? String(obj.links.videasy) : ""
      };
    }
    return { vidsrc: "", videasy: "" };
  }

  function getLinksCascade(show, season, ep) {
    const e = getLinksDirect(ep);
    if (e.vidsrc || e.videasy) return e;

    const s = getLinksDirect(season);
    if (s.vidsrc || s.videasy) return s;

    return getLinksDirect(show);
  }

  /* ============================================================================
     TV FIELDS (canonical names shown in your screenshots)
  ============================================================================ */
  function seasonNumber(season) { return season ? (season.season_number ?? null) : null; }
  function seasonTitle(season)  { return season ? (season.title ?? season.name ?? null) : null; }
  function seasonAirDate(season){ return season ? (season.air_date ?? null) : null; }
  function seasonOverview(season){ return season ? (season.overview ?? "") : ""; }

  function episodeNumber(ep)    { return ep ? (ep.episode_number ?? null) : null; }
  function episodeTitle(ep)     { return ep ? (ep.title ?? ep.name ?? null) : null; }
  function episodeAirDate(ep)   { return ep ? (ep.air_date ?? null) : null; }
  function episodeRuntime(ep)   { return ep ? (ep.runtime ?? null) : null; }

  /* ============================================================================
     DOM HELPERS
  ============================================================================ */
  function el(tag, attrs, ...children) {
    const n = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") n.className = v;
        else if (k === "dataset") { for (const [dk,dv] of Object.entries(v)) n.dataset[dk] = dv; }
        else if (k.startsWith("aria-")) n.setAttribute(k, v);
        else if (k === "text") n.textContent = v;
        else n.setAttribute(k, v);
      }
    }
    for (const c of children) {
      if (c == null) continue;
      if (typeof c === "string") n.appendChild(document.createTextNode(c));
      else n.appendChild(c);
    }
    return n;
  }

  function makeLinkButton(label, url) {
    const a = el("a", { class: "btn", href: url || "#", target: "_blank", rel: "noreferrer noopener" }, label);
    if (!url) a.setAttribute("aria-disabled", "true");
    return a;
  }

  function makeTwistyButton(isOpen) {
    const btn = el("button", { class: "twisty", type: "button", "aria-label": isOpen ? "Collapse" : "Expand" });
    btn.dataset.open = isOpen ? "true" : "false";
    btn.appendChild(el("svg", { class: "chev", viewBox: "0 0 24 24", fill: "none" },
      el("path", { d: "M9 6l6 6-6 6", stroke: "currentColor", "stroke-width": "2.5", "stroke-linecap": "round", "stroke-linejoin": "round" })
    ));
    return btn;
  }

  function setOpen(childrenEl, twistyBtn, open) {
    childrenEl.dataset.open = open ? "true" : "false";
    twistyBtn.dataset.open = open ? "true" : "false";
    twistyBtn.setAttribute("aria-label", open ? "Collapse" : "Expand");
  }

  function makeThumb(src, cls) {
    const img = el("img", { class: cls || "thumb", alt: "" });
    if (!src) {
      img.style.visibility = "hidden";
      img.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
      return img;
    }
    img.src = src;
    img.loading = "lazy";
    img.decoding = "async";
    img.addEventListener("error", () => { img.style.visibility = "hidden"; });
    return img;
  }

  /* ============================================================================
     RENDER: EPISODE ROW
     - Thumbnail: still_local/still_path if available (capped to row height)
     - Badge: S##E##
     - Buttons: prebuilt links via cascade
  ============================================================================ */
  function buildEpisodeRow(show, season, ep, sNum) {
    const eNum = episodeNumber(ep);
    const name = episodeTitle(ep) || "(untitled)";
    const air = fmtDate(episodeAirDate(ep));
    const rt  = fmtRuntime(episodeRuntime(ep));

    const badgeTxt = "S" + pad2(sNum) + "E" + pad2(eNum);

    const line = [
      name,
      air ? ("• " + air) : "",
      rt ? ("• " + rt) : ""
    ].filter(Boolean).join(" ");

    const links = getLinksCascade(show, season, ep);

    const epThumb = pickThumb(ep, ["still_local", "still_path", "backdrop_local", "backdrop_path", "poster_local", "poster_path"]);

    return el("div", { class: "ep-row" },
      makeThumb(epThumb, "thumb sm"),
      el("div", { class: "badge" }, badgeTxt),
      el("div", { class: "meta" },
        el("div", { class: "primary line1" }, line),
        el("div", { class: "secondary line2 muted" }, (ep && ep.overview ? String(ep.overview) : ""))
      ),
      el("div", { class: "pillbar" },
        makeLinkButton("Vidsrc", links.vidsrc),
        makeLinkButton("Videasy", links.videasy)
      )
    );
  }

  /* ============================================================================
     RENDER: SEASON CARD
     - No "S01" label
     - Keeps "8 eps"
     - Adds season air date
     - Adds 2-line description with "Season #:" label
  ============================================================================ */
  function buildSeasonCard(show, season) {
    const sNum  = seasonNumber(season);
    const sName = seasonTitle(season) || ("Season " + (sNum ?? "?"));
    const sDate = fmtDate(seasonAirDate(season));
    const sOv   = seasonOverview(season);

    const eps = ensureArray(season && season.episodes ? season.episodes : []);
    const epCount = eps.length;

    const sub = el("div", { class: "subcard" });
    const headerRow = el("div", { class: "subrow" });

    const twisty = makeTwistyButton(false);
    const children = el("div", { class: "children", dataset: { open: "false" } });

    const seasonThumb = pickThumb(season, ["poster_local", "poster_path", "backdrop_local", "backdrop_path"]);

    headerRow.appendChild(twisty);
    headerRow.appendChild(makeThumb(seasonThumb, "thumb"));
    headerRow.appendChild(
      el("div", { class: "meta" },
        el("div", { class: "primary line1" },
          el("span", { class: "season_title" }, sName),
          el("span", { class: "muted" }, epCount ? ("  •  " + epCount + " eps") : "  •  no episodes"),
          sDate ? el("span", { class: "muted" }, "  •  " + sDate) : null
        ),
        el("div", { class: "secondary clamp2" },
          (sNum != null ? ("Season " + sNum + ": ") : "Season: "),
          (sOv ? sOv : "—")
        )
      )
    );

    if (!eps.length) {
      children.appendChild(el("div", { class: "ep-row" },
        el("div", { class: "meta" },
          el("div", { class: "primary" }, "No episodes available."),
          el("div", { class: "secondary muted" }, "This season has an empty episodes[] array in data.json.")
        )
      ));
    } else {
      eps
        .slice()
        .sort((a,b) => (asInt(episodeNumber(a)) ?? 9999) - (asInt(episodeNumber(b)) ?? 9999))
        .forEach(ep => children.appendChild(buildEpisodeRow(show, season, ep, sNum)));
    }

    twisty.addEventListener("click", () => {
      const open = children.dataset.open !== "true";
      setOpen(children, twisty, open);
    });

    sub.appendChild(headerRow);
    sub.appendChild(children);
    return sub;
  }

  /* ============================================================================
     RENDER: SHOW CARD
     - Poster thumb between twisty and title
     - Two-line “hero row”
       Line1: Title YEAR • tmdb:ID • Genres
       Line2: ★ rating • # seasons • Status • Released/First air date
     - Removes imdb from display
     - Adds button line at show level (Vidsrc/Videasy) using prebuilt show.links
  ============================================================================ */
  function buildShowCard(show) {
    const title = showTitle(show) || "(untitled show)";
    const year  = getYearFromObj(show);
    const tmdb  = show && show.tmdb_id ? String(show.tmdb_id) : "";
    const genres = getGenresLine(show);
    const rating = getRating(show);
    const status = show && show.status ? String(show.status) : "";
    const firstAir = show && show.first_air_date ? fmtDate(show.first_air_date) : "";
    const seasons = ensureArray(show && show.seasons ? show.seasons : []);
    const links = getLinksDirect(show);

    const card = el("div", { class: "card" });
    const row = el("div", { class: "row" });

    const twisty = makeTwistyButton(false);
    const children = el("div", { class: "children", dataset: { open: "false" } });

    const showThumb = pickThumb(show, ["poster_local", "poster_path", "backdrop_local", "backdrop_path"]);

    const line1Parts = [];
    if (year) line1Parts.push(year);
    if (tmdb) line1Parts.push("tmdb:" + tmdb);
    if (genres) line1Parts.push(genres);

    const line2Parts = [];
    if (rating) line2Parts.push("★ " + rating);
    line2Parts.push((seasons.length ? seasons.length : 0) + " seasons");
    if (status) line2Parts.push(status);
    if (firstAir) line2Parts.push("First Air " + firstAir);

    row.appendChild(twisty);
    row.appendChild(makeThumb(showThumb, "thumb"));
    row.appendChild(
      el("div", { class: "meta" },
        el("div", { class: "primary line1" }, title, line1Parts.length ? ("  " + line1Parts.join(" • ")) : ""),
        el("div", { class: "secondary line2" }, line2Parts.join(" • "))
      )
    );

    row.appendChild(
      el("div", { class: "pillbar" },
        makeLinkButton("Vidsrc", links.vidsrc),
        makeLinkButton("Videasy", links.videasy)
      )
    );

    if (!seasons.length) {
      children.appendChild(el("div", { class: "subcard" },
        el("div", { class: "subrow" },
          el("div", { class: "meta" },
            el("div", { class: "primary" }, "Seasons"),
            el("div", { class: "secondary muted" }, "No seasons available.")
          )
        )
      ));
    } else {
      seasons
        .slice()
        .sort((a,b) => (asInt(seasonNumber(a)) ?? 9999) - (asInt(seasonNumber(b)) ?? 9999))
        .forEach(season => children.appendChild(buildSeasonCard(show, season)));
    }

    twisty.addEventListener("click", () => {
      const open = children.dataset.open !== "true";
      setOpen(children, twisty, open);
    });

    card.appendChild(row);
    card.appendChild(children);
    return card;
  }

  /* ============================================================================
     RENDER: MOVIE CARD
     - Poster thumb between (no twisty) and title
     - Two-line hero row (similar to shows)
     - Removes imdb from display
  ============================================================================ */
  function buildMovieCard(movie) {
    const title = movieTitle(movie) || "(untitled movie)";
    const year  = getYearFromObj(movie);
    const tmdb  = movie && movie.tmdb_id ? String(movie.tmdb_id) : "";
    const genres = getGenresLine(movie);
    const rating = getRating(movie);
    const status = movie && movie.status ? String(movie.status) : "";
    const rel = movie && movie.release_date ? fmtDate(movie.release_date) : "";
    const rt = fmtRuntime(movie && movie.runtime != null ? movie.runtime : null);
    const links = getLinksDirect(movie);

    const card = el("div", { class: "card" });
    const row = el("div", { class: "row" });

    const movieThumb = pickThumb(movie, ["poster_local", "poster_path", "backdrop_local", "backdrop_path"]);

    const line1Parts = [];
    if (year) line1Parts.push(year);
    if (tmdb) line1Parts.push("tmdb:" + tmdb);
    if (genres) line1Parts.push(genres);

    const line2Parts = [];
    if (rating) line2Parts.push("★ " + rating);
    if (status) line2Parts.push(status);
    if (rel) line2Parts.push("Released " + rel);
    if (rt) line2Parts.push(rt);

    row.appendChild(makeThumb(movieThumb, "thumb"));
    row.appendChild(
      el("div", { class: "meta" },
        el("div", { class: "primary line1" }, title, line1Parts.length ? ("  " + line1Parts.join(" • ")) : ""),
        el("div", { class: "secondary line2" }, line2Parts.join(" • "))
      )
    );
    row.appendChild(
      el("div", { class: "pillbar" },
        makeLinkButton("Vidsrc", links.vidsrc),
        makeLinkButton("Videasy", links.videasy)
      )
    );

    card.appendChild(row);
    return card;
  }

  /* ============================================================================
     TABS
  ============================================================================ */
  function setTab(tab) {
    const tvBtn = document.getElementById("tab-tv");
    const mvBtn = document.getElementById("tab-movies");
    const tvPanel = document.getElementById("panel-tv");
    const mvPanel = document.getElementById("panel-movies");

    const isTv = tab === "tv";
    tvBtn.setAttribute("aria-selected", isTv ? "true" : "false");
    mvBtn.setAttribute("aria-selected", isTv ? "false" : "true");
    tvPanel.style.display = isTv ? "" : "none";
    mvPanel.style.display = isTv ? "none" : "";
  }

  function wireTabs() {
    document.getElementById("tab-tv").addEventListener("click", () => setTab("tv"));
    document.getElementById("tab-movies").addEventListener("click", () => setTab("movies"));
  }

  /* ============================================================================
     BOOT
  ============================================================================ */
  function showError(msg) {
    const err = document.getElementById("error");
    err.style.display = "";
    err.textContent = msg;
  }

  function setStatus(msg) {
    document.getElementById("status").textContent = msg;
  }

  function getMetaCounts(data) {
    const counts = data && data.meta && data.meta.counts ? data.meta.counts : null;
    if (!counts) return null;
    const movies = (typeof counts.movies === "number") ? counts.movies : null;
    const shows  = (typeof counts.shows === "number") ? counts.shows  : null;
    const errors = (typeof counts.errors === "number") ? counts.errors : null;
    return { movies, shows, errors };
  }

  function getGeneratedUtc(data) {
    const v = data && data.meta ? data.meta.generated_utc : null;
    return v ? String(v) : "";
  }

  async function main() {
    wireVersionButton();
    wireTabs();

    try {
      const data = await loadJson("../data/data.json");

      const shows  = ensureArray(data && data.shows  ? data.shows  : []);
      const movies = ensureArray(data && data.movies ? data.movies : []);

      const tvList = document.getElementById("tv-list");
      tvList.innerHTML = "";

      const showsSorted = shows.slice().sort((a,b) =>
        (showTitle(a) || "").localeCompare(showTitle(b) || "", undefined, { sensitivity: "base" })
      );
      showsSorted.forEach(show => tvList.appendChild(buildShowCard(show)));

      const mvList = document.getElementById("movies-list");
      mvList.innerHTML = "";

      const moviesSorted = movies.slice().sort((a,b) =>
        (movieTitle(a) || "").localeCompare(movieTitle(b) || "", undefined, { sensitivity: "base" })
      );
      moviesSorted.forEach(movie => mvList.appendChild(buildMovieCard(movie)));

      const counts = getMetaCounts(data);
      const genUtc = getGeneratedUtc(data);

      const showCount = (counts && counts.shows != null) ? counts.shows : showsSorted.length;
      const movieCount = (counts && counts.movies != null) ? counts.movies : moviesSorted.length;

      setStatus(
        "Loaded: " + showCount + " TV shows, " + movieCount + " movies." +
        (genUtc ? ("  Generated: " + genUtc) : "")
      );

    } catch (e) {
      setStatus("Failed.");
      showError(String(e && e.stack ? e.stack : e));
    }
  }

  main();
  </script>
</body>
</html>
