<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>My TV Movie Hub (indexV2)</title>

  <!-- Required references -->
  <link rel="stylesheet" href="./css/my_tv_hub.css" />

  <!-- Optional: allow config.js to set globals before app boots -->
  <script defer src="./config.js"></script>

  <style>
    /* Minimal structural CSS; keep the “real styling” in my_tv_hub.css */
    :root { --focus-ring: 2px; --focus-gap: 2px; }

    body { margin: 0; }
    .v2-app { min-height: 100vh; display: flex; flex-direction: column; }
    .v2-header { position: sticky; top: 0; z-index: 50; }
    .v2-main { flex: 1; display: block; }
    .v2-footer { opacity: 0.85; }

    /* DPAD focus visibility (neurodivergent-friendly: always obvious) */
    [data-focusable="1"]:focus {
      outline: var(--focus-ring) solid currentColor;
      outline-offset: var(--focus-gap);
    }

    /* View container */
    .v2-view { display: none; padding: 12px; }
    .v2-view.is-active { display: block; }

    /* Generic grid */
    .v2-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
    .v2-card { border-radius: 12px; overflow: hidden; }
    .v2-card__img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; display: block; }
    .v2-card__body { padding: 10px; }

    /* Calendar base: 7x6 grid, Mon->Sun */
    .v2-cal-header { position: sticky; top: 0; z-index: 40; padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
    .v2-cal-title { font-weight: 700; }
    .v2-cal-nav { display: flex; gap: 8px; align-items: center; }
    .v2-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: minmax(120px, auto); gap: 8px; }
    .v2-cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; padding: 0 0 8px 0; opacity: 0.9; }
    .v2-cal-cell { border-radius: 12px; padding: 8px; overflow: hidden; display: flex; flex-direction: column; gap: 6px; }
    .v2-cal-date { font-weight: 700; opacity: 0.9; }
    .v2-cal-items { display: grid; gap: 6px; }
    .v2-cal-overflow { font-size: 12px; opacity: 0.8; }

    /* TV safe sizing */
    @media (min-width: 900px) {
      .v2-view { padding: 16px 18px; }
      .v2-cal-grid { grid-auto-rows: minmax(140px, auto); }
    }
  </style>
</head>

<body>
  <div class="v2-app" id="app">
    <!-- Global Sticky Header -->
    <header class="v2-header" id="globalHeader">
      <div style="display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;">
        <div style="display:flex;gap:10px;align-items:center;">
          <div style="font-weight:800;">My TV Movie Hub</div>
          <div id="buildTag" style="opacity:.8;font-size:12px;">indexV2</div>
        </div>

        <nav id="topNav" aria-label="Primary">
          <!-- Tab buttons (DPAD friendly) -->
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button data-route="#calendar" data-focusable="1">Calendar</button>
            <button data-route="#shows" data-focusable="1">Shows</button>
            <button data-route="#movies" data-focusable="1">Movies</button>
            <button data-route="#livetv" data-focusable="1">Live TV</button>
            <button data-route="#config" data-focusable="1">Config</button>
            <button data-route="#explore" data-focusable="1">Explore</button>
            <button data-route="#profiles" data-focusable="1">Profiles</button>
          </div>
        </nav>
      </div>
      <div id="statusStrip" style="padding:0 12px 10px 12px;opacity:.9;font-size:12px;">
        Loading…
      </div>
    </header>

    <!-- Main content -->
    <main class="v2-main" id="main">

      <!-- CALENDAR VIEW -->
      <section class="v2-view" id="view-calendar" aria-label="Calendar">
        <div class="v2-cal-header" id="calHeader">
          <div class="v2-cal-nav">
            <button id="calPrev" data-focusable="1" aria-label="Previous month">◀</button>
            <button id="calToday" data-focusable="1" aria-label="Go to today">Today</button>
            <button id="calNext" data-focusable="1" aria-label="Next month">▶</button>
          </div>
          <div class="v2-cal-title" id="calTitle">Month YYYY</div>
          <div style="margin-left:auto;opacity:.85;font-size:12px;" id="calHint">DPAD: move • OK: open</div>
        </div>

        <div class="v2-cal-dow" id="calDow">
          <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
        </div>

        <div class="v2-cal-grid" id="calGrid" role="grid" aria-label="Month grid"></div>
      </section>

      <!-- SHOWS VIEW -->
      <section class="v2-view" id="view-shows" aria-label="Shows">
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;">
          <label>
            Genre
            <select id="showsGenre" data-focusable="1" multiple size="1" aria-label="Genre filter (multi-select)"></select>
          </label>

          <label>
            Status
            <select id="showsStatus" data-focusable="1" aria-label="Status filter">
              <option value="">All</option>
              <option value="Running">Running</option>
              <option value="Ended">Ended</option>
              <option value="Canceled">Canceled</option>
              <option value="Upcoming">Upcoming</option>
            </select>
          </label>

          <label>
            Origin
            <select id="showsCountry" data-focusable="1" aria-label="Origin country filter"></select>
          </label>

          <label>
            Watched
            <select id="showsWatched" data-focusable="1" aria-label="Watched filter">
              <option value="">All</option>
              <option value="watched">Watched</option>
              <option value="unwatched">Unwatched</option>
            </select>
          </label>

          <label>
            Sort
            <select id="showsSort" data-focusable="1" aria-label="Sort shows">
              <option value="az">A→Z</option>
              <option value="za">Z→A</option>
              <option value="popularity">Popularity</option>
              <option value="vote_average">Vote Average</option>
              <option value="first_air_date">First Air Date</option>
              <option value="last_air_date">Last Air Date</option>
            </select>
          </label>
        </div>

        <div class="v2-grid" id="showsGrid" aria-label="Show cards"></div>
      </section>

      <!-- MOVIES VIEW -->
      <section class="v2-view" id="view-movies" aria-label="Movies">
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;">
          <label>
            Genre
            <select id="moviesGenre" data-focusable="1" multiple size="1" aria-label="Genre filter (multi-select)"></select>
          </label>

          <label>
            Watched
            <select id="moviesWatched" data-focusable="1" aria-label="Watched filter">
              <option value="">All</option>
              <option value="watched">Watched</option>
              <option value="unwatched">Unwatched</option>
            </select>
          </label>

          <label>
            Sort
            <select id="moviesSort" data-focusable="1" aria-label="Sort movies">
              <option value="az">A→Z</option>
              <option value="za">Z→A</option>
              <option value="popularity">Popularity</option>
              <option value="vote_average">Vote Average</option>
              <option value="release_date">Release Date</option>
              <option value="runtime">Runtime</option>
            </select>
          </label>
        </div>

        <div class="v2-grid" id="moviesGrid" aria-label="Movie cards"></div>
      </section>

      <!-- LIVE TV VIEW -->
      <section class="v2-view" id="view-livetv" aria-label="Live TV">
        <div id="livetvRoot">Live TV view (placeholder)</div>
      </section>

      <!-- CONFIG VIEW (must be based on config.html; we will import it next step) -->
      <section class="v2-view" id="view-config" aria-label="Config">
        <div id="configRoot">Config view will load config.html content here.</div>
      </section>

      <!-- EXPLORE VIEW -->
      <section class="v2-view" id="view-explore" aria-label="Explore">
        <div id="exploreRoot">Explore view (placeholder)</div>
      </section>

      <!-- PROFILES VIEW -->
      <section class="v2-view" id="view-profiles" aria-label="Profiles">
        <div id="profilesRoot">Profiles view (placeholder)</div>
      </section>
    </main>

    <footer class="v2-footer" id="globalFooter" style="padding:10px 12px;font-size:12px;">
      <div id="footerMeta">Ready.</div>
    </footer>

    <!-- Popup layer (Show / Season / Movie) -->
    <div id="popupLayer" style="position:fixed;inset:0;display:none;z-index:1000;">
      <div id="popupBackdrop" style="position:absolute;inset:0;"></div>
      <div id="popupPanel" role="dialog" aria-modal="true"
           style="position:relative;margin:6vh auto 0 auto;max-width:1100px;width:min(1100px,92vw);border-radius:14px;overflow:hidden;">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;">
          <div id="popupTitle" style="font-weight:800;">Details</div>
          <button id="popupClose" data-focusable="1" aria-label="Close">✕</button>
        </div>
        <div id="popupBody" style="padding:12px;"></div>
      </div>
    </div>
  </div>

  <script>
    /* indexV2.js (inline for now; can be extracted later) */

    // ---------- Hard defaults (can be overridden by config.js / config.json) ----------
    const DEFAULTS = {
      data_url_primary: "./data/data.json",
      data_url_fallback: "https://raw.githubusercontent.com/AJPnKW/my_TV_Movie/refs/heads/main/data/data.json",
      fallback_poster: "./assets/fallback/poster_fallback.png",
      fallback_backdrop: "./assets/fallback/backdrop_fallback.png",
      fallback_logo: "./assets/fallback/logo_fallback.png",
      week_starts_monday: true,
      calendar_max_items_per_day: 4,
    };

    // ---------- State ----------
    const state = {
      cfg: { ...DEFAULTS },
      config_json: null,
      data: null,
      errors: [],
      route: "#calendar",
      calendarCursor: new Date(),
      lastFocusEl: null,
    };

    // ---------- DOM ----------
    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

    const elStatus = $("#statusStrip");
    const elFooter = $("#footerMeta");

    const views = {
      calendar: $("#view-calendar"),
      shows: $("#view-shows"),
      movies: $("#view-movies"),
      livetv: $("#view-livetv"),
      config: $("#view-config"),
      explore: $("#view-explore"),
      profiles: $("#view-profiles"),
    };

    // ---------- Utilities ----------
    function safeText(v, fallback = "—") {
      if (v === null || v === undefined) return fallback;
      const s = String(v).trim();
      return s ? s : fallback;
    }

    function pushError(code, message, ctx = {}) {
      state.errors.push({ code, message, ctx, ts: new Date().toISOString() });
    }

    function setStatus(msg) {
      elStatus.textContent = msg;
    }

    function setFooter(msg) {
      elFooter.textContent = msg;
    }

    function isFocusable(el) {
      return el && el.getAttribute && el.getAttribute("data-focusable") === "1";
    }

    // Basic DPAD / keyboard mapping
    function attachDpadNav() {
      document.addEventListener("keydown", (e) => {
        const k = e.key;
        const active = document.activeElement;
        const isPopupOpen = $("#popupLayer").style.display === "block";

        // Escape closes popup
        if (k === "Escape" && isPopupOpen) {
          e.preventDefault();
          closePopup();
          return;
        }

        // Enter / Space activate buttons/links
        if ((k === "Enter" || k === " ") && active) {
          // allow native behavior
          return;
        }

        // Route shortcuts (optional)
        if (e.altKey) return;

        // Arrow navigation: rely on browser default unless we are inside a roving grid later.
        // (We’ll implement deterministic grid focus in next steps per-view.)
      }, { passive: false });
    }

    // ---------- Routing ----------
    function normalizeRoute(hash) {
      const h = (hash || "#calendar").toLowerCase();
      const allowed = ["#calendar", "#shows", "#movies", "#livetv", "#config", "#explore", "#profiles"];
      return allowed.includes(h) ? h : "#calendar";
    }

    function setRoute(hash) {
      state.route = normalizeRoute(hash);
      window.location.hash = state.route;
      renderRoute();
    }

    function renderRoute() {
      const route = state.route.slice(1);
      Object.entries(views).forEach(([k, el]) => {
        el.classList.toggle("is-active", k === route);
      });

      // focus first control in view (DPAD friendly)
      const activeView = views[route];
      const first = $$("[data-focusable='1']", activeView)[0];
      if (first) first.focus();

      setFooter(`View: ${route} • Errors: ${state.errors.length}`);
    }

    // ---------- Data loading ----------
    async function loadConfigJson() {
      try {
        const res = await fetch("./config.json", { cache: "no-cache" });
        if (!res.ok) throw new Error(`config.json HTTP ${res.status}`);
        const j = await res.json();
        state.config_json = j;

        // Merge known overrides if present (do not assume schema)
        if (j && typeof j === "object") {
          if (j.data_url) state.cfg.data_url_primary = j.data_url;
          if (j.data_url_primary) state.cfg.data_url_primary = j.data_url_primary;
          if (j.data_url_fallback) state.cfg.data_url_fallback = j.data_url_fallback;
          if (j.fallback_poster) state.cfg.fallback_poster = j.fallback_poster;
          if (j.fallback_backdrop) state.cfg.fallback_backdrop = j.fallback_backdrop;
          if (j.calendar_max_items_per_day) state.cfg.calendar_max_items_per_day = Number(j.calendar_max_items_per_day) || DEFAULTS.calendar_max_items_per_day;
        }
      } catch (err) {
        pushError("CONFIG_JSON_LOAD_FAILED", String(err));
      }
    }

    async function fetchJsonWithFallback(primaryUrl, fallbackUrl) {
      try {
        const r1 = await fetch(primaryUrl, { cache: "no-cache" });
        if (!r1.ok) throw new Error(`primary HTTP ${r1.status}`);
        return await r1.json();
      } catch (e1) {
        pushError("DATA_PRIMARY_FAILED", String(e1), { primaryUrl });
        const r2 = await fetch(fallbackUrl, { cache: "no-cache" });
        if (!r2.ok) throw new Error(`fallback HTTP ${r2.status}`);
        return await r2.json();
      }
    }

    async function loadData() {
      const d = await fetchJsonWithFallback(state.cfg.data_url_primary, state.cfg.data_url_fallback);
      state.data = d;

      // Merge upstream errors[] if present
      if (d && Array.isArray(d.errors)) {
        d.errors.forEach(e => state.errors.push(e));
      }

      // Minimal schema validation (no hard fail)
      if (!d || typeof d !== "object") pushError("DATA_SCHEMA_INVALID", "data.json is not an object");
      if (!Array.isArray(d.movies)) pushError("DATA_MOVIES_MISSING", "data.movies[] missing");
      if (!Array.isArray(d.shows)) pushError("DATA_SHOWS_MISSING", "data.shows[] missing");
    }

    // ---------- Assets / fallbacks ----------
    function resolveImg(src, fallback) {
      const s = (src || "").trim();
      return s ? s : fallback;
    }

    // ---------- Cards ----------
    function createShowCard(show) {
      const title = safeText(show?.name || show?.title, "Missing Title");
      const poster = resolveImg(show?.poster_local || show?.poster, state.cfg.fallback_poster);

      if (title === "Missing Title") pushError("SHOW_MISSING_TITLE", "Show missing title", { id: show?.id });
      if (!show?.poster_local && !show?.poster) pushError("SHOW_MISSING_POSTER", "Show missing poster", { id: show?.id });

      const card = document.createElement("div");
      card.className = "v2-card";
      card.tabIndex = 0;
      card.setAttribute("data-focusable", "1");
      card.addEventListener("click", () => openPopup("show", show));

      card.innerHTML = `
        <img class="v2-card__img" src="${poster}" alt="${escapeHtml(title)}" loading="lazy" />
        <div class="v2-card__body">
          <div style="font-weight:800;">${escapeHtml(title)}</div>
          <div style="opacity:.85;font-size:12px;">
            ${escapeHtml(safeText(show?.status, "—"))}
            ${show?.vote_average ? ` • ★ ${escapeHtml(String(show.vote_average))}` : ""}
          </div>
        </div>
      `;
      return card;
    }

    function createMovieCard(movie) {
      const title = safeText(movie?.title || movie?.name, "Missing Title");
      const poster = resolveImg(movie?.poster_local || movie?.poster, state.cfg.fallback_poster);

      if (title === "Missing Title") pushError("MOVIE_MISSING_TITLE", "Movie missing title", { id: movie?.id });
      if (!movie?.poster_local && !movie?.poster) pushError("MOVIE_MISSING_POSTER", "Movie missing poster", { id: movie?.id });

      const card = document.createElement("div");
      card.className = "v2-card";
      card.tabIndex = 0;
      card.setAttribute("data-focusable", "1");
      card.addEventListener("click", () => openPopup("movie", movie));

      card.innerHTML = `
        <img class="v2-card__img" src="${poster}" alt="${escapeHtml(title)}" loading="lazy" />
        <div class="v2-card__body">
          <div style="font-weight:800;">${escapeHtml(title)}</div>
          <div style="opacity:.85;font-size:12px;">
            ${movie?.release_date ? escapeHtml(movie.release_date) : "—"}
            ${movie?.vote_average ? ` • ★ ${escapeHtml(String(movie.vote_average))}` : ""}
            ${movie?.runtime ? ` • ${escapeHtml(String(movie.runtime))}m` : ""}
          </div>
        </div>
      `;
      return card;
    }

    // ---------- Popup (Show / Season / Movie) ----------
    function openPopup(kind, obj) {
      state.lastFocusEl = document.activeElement;

      const layer = $("#popupLayer");
      const title = $("#popupTitle");
      const body = $("#popupBody");

      title.textContent = kind === "show" ? "Show" : (kind === "movie" ? "Movie" : "Details");
      body.innerHTML = renderPopupHtml(kind, obj);

      layer.style.display = "block";
      $("#popupClose").focus();
    }

    function closePopup() {
      $("#popupLayer").style.display = "none";
      $("#popupBody").innerHTML = "";
      if (state.lastFocusEl && state.lastFocusEl.focus) state.lastFocusEl.focus();
    }

    function renderPopupHtml(kind, obj) {
      // Strips:
      // - Info strip: links like TMDB/RT/homepage where available
      // - Reference strip: genres, rating, service/network, premiered
      // - URL strip: vidsrc, videasy, local
      const name = safeText(obj?.name || obj?.title, "Missing Title");
      const overview = safeText(obj?.overview, "—");
      const genres = Array.isArray(obj?.genres) ? obj.genres : [];
      const vote = obj?.vote_average ? `★ ${obj.vote_average}` : "";
      const homepage = obj?.homepage || "";
      const links = obj?.links || obj?.streaming_links || {};

      const infoStrip = [
        homepage ? `<a href="${escapeAttr(homepage)}" target="_blank" rel="noreferrer">Home</a>` : "",
        obj?.tmdb_url ? `<a href="${escapeAttr(obj.tmdb_url)}" target="_blank" rel="noreferrer">TMDB</a>` : "",
        obj?.rottentomatoes_url ? `<a href="${escapeAttr(obj.rottentomatoes_url)}" target="_blank" rel="noreferrer">RT</a>` : "",
      ].filter(Boolean).join(" • ");

      const refStrip = [
        genres.length ? genres.map(g => escapeHtml(g)).join(" • ") : "",
        vote,
        obj?.release_date ? `Released ${escapeHtml(obj.release_date)}` : "",
        obj?.first_air_date ? `Premiered ${escapeHtml(obj.first_air_date)}` : "",
      ].filter(Boolean).join(" • ");

      const urlStrip = [
        links?.vidsrc ? `<a href="${escapeAttr(links.vidsrc)}" target="_blank" rel="noreferrer">VidSRC</a>` : "",
        links?.videasy ? `<a href="${escapeAttr(links.videasy)}" target="_blank" rel="noreferrer">VidEasy</a>` : "",
        links?.local ? `<a href="${escapeAttr(links.local)}" target="_blank" rel="noreferrer">Local</a>` : "",
      ].filter(Boolean).join(" • ");

      return `
        <div style="display:grid;gap:10px;">
          <div style="font-weight:900;font-size:18px;">${escapeHtml(name)}</div>

          <div style="opacity:.9;font-size:12px;">
            <div><strong>Info:</strong> ${infoStrip || "—"}</div>
            <div><strong>Ref:</strong> ${refStrip || "—"}</div>
            <div><strong>URLs:</strong> ${urlStrip || "—"}</div>
          </div>

          <div style="line-height:1.4;">${escapeHtml(overview)}</div>

          <div style="opacity:.85;font-size:12px;">
            <div><strong>ID:</strong> ${escapeHtml(safeText(obj?.id, "—"))}</div>
            <div><strong>Collections:</strong> ${Array.isArray(obj?.collections) ? escapeHtml(obj.collections.join(", ")) : "—"}</div>
          </div>
        </div>
      `;
    }

    // ---------- Calendar (scaffold: grid + header + empty items for now) ----------
    function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
    function endOfMonth(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 0); }

    function mondayIndex(jsDay) {
      // JS: 0=Sun..6=Sat; we need Mon=0..Sun=6
      return (jsDay + 6) % 7;
    }

    function buildCalendarGrid(cursorDate) {
      const grid = $("#calGrid");
      grid.innerHTML = "";

      const m0 = startOfMonth(cursorDate);
      const m1 = endOfMonth(cursorDate);

      const monthName = m0.toLocaleString(undefined, { month: "long" });
      $("#calTitle").textContent = `${monthName} ${m0.getFullYear()}`;

      const lead = mondayIndex(m0.getDay()); // number of cells before day 1
      const daysInMonth = m1.getDate();
      const totalCells = 42; // 7x6

      // Collect items later (episodes/movies) – placeholder now
      const dayItems = new Map(); // key=YYYY-MM-DD -> array

      for (let i = 0; i < totalCells; i++) {
        const cell = document.createElement("div");
        cell.className = "v2-cal-cell";
        cell.setAttribute("role", "gridcell");
        cell.tabIndex = 0;
        cell.setAttribute("data-focusable", "1");

        const dayNum = i - lead + 1;
        const inMonth = dayNum >= 1 && dayNum <= daysInMonth;

        let dateKey = "";
        if (inMonth) {
          const d = new Date(m0.getFullYear(), m0.getMonth(), dayNum);
          dateKey = d.toISOString().slice(0,10);
        }

        cell.innerHTML = `
          <div class="v2-cal-date">${inMonth ? dayNum : ""}</div>
          <div class="v2-cal-items" data-datekey="${escapeAttr(dateKey)}"></div>
        `;

        if (!inMonth) {
          cell.style.opacity = "0.35";
          cell.removeAttribute("data-focusable");
          cell.tabIndex = -1;
        }

        grid.appendChild(cell);
      }

      // Next step: populate items from data.json into correct day cells with sorting + overflow
      // (Episodes sorted by air time; Movies by release time; overflow indicator if >4)
    }

    // ---------- Filters + list rendering ----------
    function uniqueSorted(arr) {
      return Array.from(new Set(arr.filter(Boolean))).sort((a,b)=>String(a).localeCompare(String(b)));
    }

    function populateFilters() {
      const shows = Array.isArray(state.data?.shows) ? state.data.shows : [];
      const movies = Array.isArray(state.data?.movies) ? state.data.movies : [];

      const showGenres = uniqueSorted(shows.flatMap(s => Array.isArray(s.genres) ? s.genres : []));
      const movieGenres = uniqueSorted(movies.flatMap(m => Array.isArray(m.genres) ? m.genres : []));

      const showCountries = uniqueSorted(shows.map(s => s.origin_country || s.origin_country_code || s.country).flat());

      const elShowsGenre = $("#showsGenre");
      elShowsGenre.innerHTML = showGenres.map(g => `<option value="${escapeAttr(g)}">${escapeHtml(g)}</option>`).join("");

      const elMoviesGenre = $("#moviesGenre");
      elMoviesGenre.innerHTML = movieGenres.map(g => `<option value="${escapeAttr(g)}">${escapeHtml(g)}</option>`).join("");

      const elShowsCountry = $("#showsCountry");
      elShowsCountry.innerHTML = `<option value="">All</option>` + showCountries.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join("");
    }

    function getSelectedMulti(selectEl) {
      return Array.from(selectEl.selectedOptions).map(o => o.value).filter(Boolean);
    }

    function applyShowsFiltersSort() {
      const shows = Array.isArray(state.data?.shows) ? state.data.shows.slice() : [];

      const genres = getSelectedMulti($("#showsGenre"));
      const status = $("#showsStatus").value;
      const country = $("#showsCountry").value;
      const watched = $("#showsWatched").value;
      const sort = $("#showsSort").value;

      let out = shows;

      if (genres.length) {
        out = out.filter(s => {
          const gs = Array.isArray(s.genres) ? s.genres : [];
          return genres.every(g => gs.includes(g));
        });
      }

      if (status) out = out.filter(s => String(s.status || "") === status);

      if (country) {
        out = out.filter(s => {
          const c = s.origin_country || s.origin_country_code || s.country;
          if (Array.isArray(c)) return c.includes(country);
          return String(c || "") === country;
        });
      }

      if (watched) {
        out = out.filter(s => {
          const w = s.trakt?.watched ?? s.watched ?? null;
          return watched === "watched" ? !!w : !w;
        });
      }

      const cmpText = (a,b,ka,kb)=> safeText(a?.[ka]||a?.[kb],"").localeCompare(safeText(b?.[ka]||b?.[kb],""));
      const cmpNum = (a,b,k)=> (Number(b?.[k])||0)-(Number(a?.[k])||0);

      if (sort === "az") out.sort((a,b)=>cmpText(a,b,"name","title"));
      if (sort === "za") out.sort((a,b)=>cmpText(b,a,"name","title"));
      if (sort === "popularity") out.sort((a,b)=>cmpNum(a,b,"popularity"));
      if (sort === "vote_average") out.sort((a,b)=>cmpNum(a,b,"vote_average"));
      if (sort === "first_air_date") out.sort((a,b)=> safeText(a?.first_air_date,"").localeCompare(safeText(b?.first_air_date,"")));
      if (sort === "last_air_date") out.sort((a,b)=> safeText(a?.last_air_date,"").localeCompare(safeText(b?.last_air_date,"")));

      return out;
    }

    function applyMoviesFiltersSort() {
      const movies = Array.isArray(state.data?.movies) ? state.data.movies.slice() : [];

      const genres = getSelectedMulti($("#moviesGenre"));
      const watched = $("#moviesWatched").value;
      const sort = $("#moviesSort").value;

      let out = movies;

      if (genres.length) {
        out = out.filter(m => {
          const gs = Array.isArray(m.genres) ? m.genres : [];
          return genres.every(g => gs.includes(g));
        });
      }

      if (watched) {
        out = out.filter(m => {
          const w = m.trakt?.watched ?? m.watched ?? null;
          return watched === "watched" ? !!w : !w;
        });
      }

      const cmpText = (a,b)=> safeText(a?.title||a?.name,"").localeCompare(safeText(b?.title||b?.name,""));
      const cmpNum = (a,b,k)=> (Number(b?.[k])||0)-(Number(a?.[k])||0);

      if (sort === "az") out.sort((a,b)=>cmpText(a,b));
      if (sort === "za") out.sort((a,b)=>cmpText(b,a));
      if (sort === "popularity") out.sort((a,b)=>cmpNum(a,b,"popularity"));
      if (sort === "vote_average") out.sort((a,b)=>cmpNum(a,b,"vote_average"));
      if (sort === "release_date") out.sort((a,b)=> safeText(a?.release_date,"").localeCompare(safeText(b?.release_date,"")));
      if (sort === "runtime") out.sort((a,b)=> (Number(b?.runtime)||0)-(Number(a?.runtime)||0));

      return out;
    }

    function renderShows() {
      const grid = $("#showsGrid");
      grid.innerHTML = "";
      const rows = applyShowsFiltersSort();
      rows.forEach(s => grid.appendChild(createShowCard(s)));
      setStatus(`Shows: ${rows.length} • Errors: ${state.errors.length}`);
    }

    function renderMovies() {
      const grid = $("#moviesGrid");
      grid.innerHTML = "";
      const rows = applyMoviesFiltersSort();
      rows.forEach(m => grid.appendChild(createMovieCard(m)));
      setStatus(`Movies: ${rows.length} • Errors: ${state.errors.length}`);
    }

    // ---------- Config view import (basis = config.html) ----------
    async function loadConfigViewHtml() {
      try {
        const res = await fetch("./config.html", { cache: "no-cache" });
        if (!res.ok) throw new Error(`config.html HTTP ${res.status}`);
        const html = await res.text();

        // Import body-ish content safely (no execution). We keep it simple:
        $("#configRoot").innerHTML = html;
      } catch (err) {
        pushError("CONFIG_HTML_LOAD_FAILED", String(err));
        $("#configRoot").textContent = "Config view failed to load config.html";
      }
    }

    // ---------- Escaping ----------
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s).replace(/"/g, "&quot;"); }

    // ---------- Boot ----------
    async function boot() {
      setStatus("Booting indexV2…");

      // Wire top nav
      $$("[data-route]").forEach(btn => {
        btn.addEventListener("click", () => setRoute(btn.getAttribute("data-route")));
      });

      $("#popupClose").addEventListener("click", closePopup);
      $("#popupBackdrop").addEventListener("click", closePopup);

      // Calendar controls
      $("#calPrev").addEventListener("click", () => {
        const d = state.calendarCursor;
        state.calendarCursor = new Date(d.getFullYear(), d.getMonth() - 1, 1);
        buildCalendarGrid(state.calendarCursor);
      });
      $("#calNext").addEventListener("click", () => {
        const d = state.calendarCursor;
        state.calendarCursor = new Date(d.getFullYear(), d.getMonth() + 1, 1);
        buildCalendarGrid(state.calendarCursor);
      });
      $("#calToday").addEventListener("click", () => {
        state.calendarCursor = new Date();
        buildCalendarGrid(state.calendarCursor);
      });

      attachDpadNav();

      // Load config.json (optional overrides)
      await loadConfigJson();

      // Load data.json
      setStatus("Loading data.json…");
      await loadData();

      // Load config view html
      await loadConfigViewHtml();

      // Populate filters + render lists
      populateFilters();
      renderShows();
      renderMovies();

      // Calendar scaffold
      buildCalendarGrid(state.calendarCursor);

      // Bind filter change events
      ["showsGenre","showsStatus","showsCountry","showsWatched","showsSort"].forEach(id => {
        const el = $("#"+id);
        if (el) el.addEventListener("change", renderShows);
      });
      ["moviesGenre","moviesWatched","moviesSort"].forEach(id => {
        const el = $("#"+id);
        if (el) el.addEventListener("change", renderMovies);
      });

      // Route init
      state.route = normalizeRoute(window.location.hash);
      window.addEventListener("hashchange", () => {
        state.route = normalizeRoute(window.location.hash);
        renderRoute();
      });
      renderRoute();

      setStatus(`Loaded • Shows: ${(state.data?.shows||[]).length} • Movies: ${(state.data?.movies||[]).length} • Errors: ${state.errors.length}`);
    }

    boot().catch(err => {
      pushError("BOOT_FAILED", String(err));
      setStatus("Boot failed (see errors[]).");
      setFooter(`Errors: ${state.errors.length}`);
      console.error(err);
    });
  </script>
</body>
</html>
