<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My TV & Movie Hub — Config</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/my_tv_hub.css" />

  <style>
    :root {
      --bg: #05060b;
      --card: rgba(10, 12, 24, 0.92);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f5f5f7;
      --muted: #a3a6b8;
      --accent: #ff3366;
      --pill: 999px;
      --r: 18px;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.65);
    }

    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #14172a 0%, #05060b 55%, #020308 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px 16px 60px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .title h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    .title .sub {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      padding: 8px 12px;
      border-radius: var(--pill);
      border: 1px solid var(--border);
      background: rgba(11, 13, 24, 0.9);
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn:hover { border-color: rgba(255, 255, 255, 0.22); }

    .card {
      margin-top: 14px;
      padding: 14px;
      border-radius: var(--r);
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .pill {
      padding: 4px 10px;
      border-radius: var(--pill);
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(10, 12, 24, 0.9);
      color: var(--muted);
      font-size: 0.82rem;
    }

    pre {
      margin: 0;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(5, 6, 14, 0.95);
      color: var(--text);
      overflow: auto;
      font-size: 0.82rem;
      line-height: 1.35;
    }

    .err { color: #ffb4b4; }
  </style>
</head>

<body>
  <div class="shell">
    <header>
      <div class="title">
        <h1>My TV & Movie Hub <span class="pill">Config</span></h1>
        <div class="sub">Utility page (no data schema dependencies).</div>
      </div>
      <div class="nav">
        <a class="btn" href="index.html">Home</a>
        <a class="btn" href="watchlist.html">Watchlist</a>
      </div>
    </header>

    <div class="card">
      <div class="row">
        <button class="btn" id="load-config">Load config.json</button>
        <span class="pill" id="status">Idle</span>
      </div>
      <pre id="out">{}</pre>
      <div id="err" class="err" style="display:none;margin-top:10px"></div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const outEl = document.getElementById("out");
    const errEl = document.getElementById("err");

    function setStatus(t) { statusEl.textContent = t; }
    function showErr(t) { errEl.style.display = "block"; errEl.textContent = t; }

    document.getElementById("load-config").addEventListener("click", async () => {
      errEl.style.display = "none";
      setStatus("Loading…");
      try {
        const res = await fetch("config.json", { cache: "no-cache" });
        if (!res.ok) throw new Error(`Failed to load config.json (HTTP ${res.status})`);
        const data = await res.json();
        outEl.textContent = JSON.stringify(data, null, 2);
        setStatus("Loaded");
      } catch (e) {
        console.error(e);
        setStatus("Error");
        showErr(String(e?.message || e));
      }
    });
  </script>
</body>
</html>
