<!--
========================================================================================
[FILE]        web/show.html
[PROJECT]     my_TV_Movie (My TV Hub)
[ROLE]        Dedicated Show Page (Series → Seasons → Episodes)
[VERSION]     v3.3.7
[UPDATED]     2025-12-17_18-05-00
[BUILD]       14.02.02
[DEPENDS ON]  web/css/my_tv_hub.css
              web/config.json (streaming + image sizes + UI tuning)
              data/data.json (TMDB dataset + local_*_path + links)
              data/trakt_state.json (optional; watch-state overlay)
[NOTES]
- NO inline <style>. All styling must live in web/css/my_tv_hub.css.
- Image preference order: local_*_path → TMDB remote paths.
- Streaming links must come from data.json (config-driven).
========================================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Show Details – My TV Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/my_tv_hub.css?v=3.3.7" />
</head>

<body>
  <div class="app-shell">

    <!-- =========================================================
         HEADER
    ========================================================== -->
    <header class="top-header">
      <div class="brand">
        <div class="brand-title">My TV Hub</div>
        <div class="brand-sub muted">Show Details</div>
      </div>

      <nav class="nav-links">
        <a class="nav-link" href="index.html">⬅ Back to Hub</a>
        <a class="nav-link" href="config.html">⚙️ Config</a>
      </nav>
    </header>

    <!-- =========================================================
         SHOW HERO
    ========================================================== -->
    <section id="show-hero" class="show-hero">
      <div id="show-hero-bg" class="show-hero-bg"></div>

      <div class="show-hero-content">
        <div id="show-poster" class="show-hero-poster"></div>

        <div class="show-hero-info">
          <h1 id="show-title">Loading…</h1>
          <div id="show-meta" class="muted"></div>
          <div id="show-overview" class="show-overview"></div>

          <div class="show-hero-actions">
            <a id="show-link-tmdb" class="show-link-btn btn-tmdb" target="_blank" rel="noopener noreferrer">
              <div class="btn-line1">INFO at</div><div class="btn-line2">TMDB</div>
            </a>
            <a id="show-link-vidsrc" class="show-link-btn btn-vidsrc" target="_blank" rel="noopener noreferrer">
              <div class="btn-line1">Watch on</div><div class="btn-line2">VidSrc</div>
            </a>
            <a id="show-link-videasy" class="show-link-btn btn-videasy" target="_blank" rel="noopener noreferrer">
              <div class="btn-line1">Watch on</div><div class="btn-line2">Videasy</div>
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- =========================================================
         SEASONS
    ========================================================== -->
    <main class="show-main">
      <section class="seasons-wrap">
        <h2 class="section-title">Seasons</h2>
        <div id="seasons-list" class="seasons-list"></div>
      </section>
    </main>

    <!-- =========================================================
         FOOTER
    ========================================================== -->
    <footer class="footer">
      <div class="footer-left muted">
        Data source: <code>data/data.json</code>
      </div>
      <div class="footer-right muted" id="footer-refresh">Last refresh: …</div>
    </footer>
  </div>

  <!-- =========================================================
       SCRIPT
  ========================================================== -->
  <script>
    /*****************************************************************
     * Globals
     *****************************************************************/
    const qs = (s, r=document) => r.querySelector(s);
    const qsa = (s, r=document) => Array.from(r.querySelectorAll(s));

    const STATE = {
      config: null,
      data: null,
      trakt: null,
      show: null
    };

    function getParam(name){
      return new URLSearchParams(window.location.search).get(name);
    }

    function tmdbImg(path, w){
      if(!path) return "";
      return `https://image.tmdb.org/t/p/w${w}${path}`;
    }

    function bestImage(obj, pref){
      for(const p of pref){
        if(p.local && obj[p.local]) return ".." + obj[p.local];
        if(p.remote && obj[p.remote]) return tmdbImg(obj[p.remote], p.w);
      }
      return "";
    }

    /*****************************************************************
     * Loaders
     *****************************************************************/
    async function loadConfig(){
      try{
        const r = await fetch("config.json",{cache:"no-store"});
        STATE.config = await r.json();
      }catch{
        STATE.config = {
          image_sizes:{show_width:185,season_width:185,episode_still_w:300,backdrop_w:780}
        };
      }
    }

    async function loadData(){
      const r = await fetch("../data/data.json",{cache:"no-store"});
      STATE.data = await r.json();

      try{
        const t = await fetch("../data/last_refresh.txt",{cache:"no-store"});
        if(t.ok) qs("#footer-refresh").textContent = "Last refresh: " + (await t.text()).trim();
      }catch{}
    }

    async function loadTrakt(){
      try{
        const r = await fetch("../data/trakt_state.json",{cache:"no-store"});
        if(r.ok) STATE.trakt = await r.json();
      }catch{}
    }

    /*****************************************************************
     * Render Show
     *****************************************************************/
    function renderShow(){
      const id = getParam("id");
      if(!id) return;

      const show = (STATE.data.shows||[]).find(s => String(s.tmdb_id||s.id) === String(id));
      if(!show) return;

      STATE.show = show;

      qs("#show-title").textContent = show.name || "Show";
      qs("#show-meta").textContent =
        `${show.first_air_date || "?"} • ${show.status || "?"} • ${show.number_of_seasons||0} seasons`;

      qs("#show-overview").textContent = show.overview || "";

      const poster = bestImage(show,[
        {local:"local_poster_path",remote:"poster_path",w:STATE.config.image_sizes.show_width}
      ]);
      if(poster){
        qs("#show-poster").style.backgroundImage = `url('${poster}')`;
      }

      const bg = bestImage(show,[
        {local:"local_backdrop_path",remote:"backdrop_path",w:STATE.config.image_sizes.backdrop_w}
      ]);
      if(bg){
        qs("#show-hero-bg").style.backgroundImage =
          `linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.9)),url('${bg}')`;
      }

      const links = show.links||{};
      setLink("#show-link-tmdb",links.tmdb);
      setLink("#show-link-vidsrc",links.vidsrc);
      setLink("#show-link-videasy",links.videasy);

      renderSeasons(show);
    }

    function setLink(sel,href){
      const a = qs(sel);
      if(href){
        a.href = href;
      }else{
        a.classList.add("disabled");
        a.removeAttribute("href");
      }
    }

    /*****************************************************************
     * Render Seasons + Episodes
     *****************************************************************/
    function renderSeasons(show){
      const wrap = qs("#seasons-list");
      wrap.innerHTML = "";

      (show.seasons||[]).forEach(season=>{
        const sec = document.createElement("div");
        sec.className = "season-card";

        const poster = bestImage(season,[
          {local:"local_poster_path",remote:"poster_path",w:STATE.config.image_sizes.season_width}
        ]);

        sec.innerHTML = `
          <div class="season-header">
            <div class="season-poster" ${poster?`style="background-image:url('${poster}')"`:""}></div>
            <div class="season-info">
              <div class="season-title">Season ${season.season_number}</div>
              <div class="muted">${season.episode_count||0} episodes</div>
            </div>
          </div>
          <div class="episodes-list"></div>
        `;

        const list = qs(".episodes-list",sec);

        (season.episodes||[]).forEach(ep=>{
          const still = bestImage(ep,[
            {local:"local_still_path",remote:"still_path",w:STATE.config.image_sizes.episode_still_w}
          ]);

          const epRow = document.createElement("div");
          epRow.className = "episode-row";

          epRow.innerHTML = `
            <div class="episode-still" ${still?`style="background-image:url('${still}')"`:""}></div>
            <div class="episode-info">
              <div class="episode-title">
                S${String(season.season_number).padStart(2,"0")}E${String(ep.episode_number).padStart(2,"0")}
                • ${ep.name||"Episode"}
              </div>
              <div class="muted">${ep.air_date||""}</div>
              <div class="episode-actions">
                ${makeEpBtn(ep,"tmdb","INFO","TMDB")}
                ${makeEpBtn(ep,"vidsrc","Watch","VidSrc")}
                ${makeEpBtn(ep,"videasy","Watch","Videasy")}
              </div>
            </div>
          `;
          list.appendChild(epRow);
        });

        wrap.appendChild(sec);
      });
    }

    function makeEpBtn(ep,key,l1,l2){
      const href = ep.links && ep.links[key];
      if(!href) return "";
      return `<a class="episode-link-btn btn-${key}" href="${href}" target="_blank">
                <div class="btn-line1">${l1}</div><div class="btn-line2">${l2}</div>
              </a>`;
    }

    /*****************************************************************
     * Boot
     *****************************************************************/
    async function boot(){
      await loadConfig();
      await loadData();
      await loadTrakt();
      renderShow();
    }

    boot();
  </script>
</body>
</html>
