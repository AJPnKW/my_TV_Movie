<!DOCTYPE html>
<html lang="en">
<head>
  <!-- =====================================================================
       File:        web/show.html
       Project:     my_TV_Movie
       Purpose:     Dedicated Show Page (Series → Seasons → Episodes)
       Version:     v3.3.5 (2025-12-16)
       Dependencies:
         - data/data.json
         - data/trakt_state.json (optional)
         - web/config.json
         - web/css/my_tv_hub.css
       ===================================================================== -->

  <meta charset="UTF-8" />
  <title>Show Details – My TV Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TV series details with seasons, episodes, images, and watch status" />

  <!-- Global CSS -->
  <link rel="stylesheet" href="css/my_tv_hub.css?v=3.3.5" />

</head>

<body class="page-show">

<!-- ======================================================================
     [SH-0] PAGE HEADER
     ====================================================================== -->
<header class="top-bar">
  <button class="btn btn-outline" onclick="window.location.href='index.html'">
    ← Back to Hub
  </button>
  <h1 id="show-title">Loading…</h1>
</header>

<!-- ======================================================================
     [SH-1] SHOW HERO (Backdrop + Poster)
     ====================================================================== -->
<section id="show-hero" class="show-hero">
  <div class="show-hero-backdrop" id="hero-backdrop"></div>

  <div class="show-hero-content">
    <div class="show-poster-wrap">
      <img id="show-poster" class="show-poster" alt="Show Poster" />
    </div>

    <div class="show-meta">
      <div id="show-status" class="badge badge-status"></div>
      <div id="show-genres" class="meta-line"></div>
      <div id="show-overview" class="meta-overview"></div>

      <div class="button-row">
        <a id="btn-tmdb" class="btn btn-tmdb" target="_blank">INFO<br>TMDB</a>
      </div>
    </div>
  </div>
</section>

<!-- ======================================================================
     [SH-2] SEASONS ACCORDION
     ====================================================================== -->
<main id="seasons-container" class="seasons-container">
  <!-- Seasons injected here -->
</main>

<!-- ======================================================================
     [SH-3] FOOTER
     ====================================================================== -->
<footer class="page-footer">
  <span>My TV Hub • Show View</span>
</footer>

<!-- ======================================================================
     [SH-4] SCRIPT
     ====================================================================== -->
<script>
/* =======================================================================
   [SH-JS-1] Utilities
   ======================================================================= */
const qs = new URLSearchParams(window.location.search);
const SHOW_ID = parseInt(qs.get("id"), 10);

const paths = {
  data: "../data/data.json",
  trakt: "../data/trakt_state.json",
  config: "config.json",
  img: "../image"
};

function el(id) { return document.getElementById(id); }
function fetchJSON(p) { return fetch(p).then(r => r.ok ? r.json() : null); }

/* =======================================================================
   [SH-JS-2] Load all sources
   ======================================================================= */
Promise.all([
  fetchJSON(paths.data),
  fetchJSON(paths.trakt),
  fetchJSON(paths.config)
]).then(([data, trakt, config]) => {
  if (!data || !SHOW_ID) return;

  const show = data.shows.find(s => s.id === SHOW_ID);
  if (!show) return;

  const traktShow = trakt?.shows?.[String(SHOW_ID)] || null;

  renderShow(show, traktShow, config);
});

/* =======================================================================
   [SH-JS-3] Render Show Header
   ======================================================================= */
function renderShow(show, traktShow, config) {
  el("show-title").textContent = `${show.name} [${show.id}]`;

  // Status
  el("show-status").textContent = show.status || "";
  el("show-status").classList.add(`status-${(show.status || "").toLowerCase()}`);

  // Genres
  el("show-genres").textContent = (show.genres || []).join(" / ");

  // Overview
  el("show-overview").textContent = show.overview || "";

  // TMDB
  el("btn-tmdb").href = show.links?.tmdb || "#";

  // Poster
  const poster = show.local_poster_path
    ? `${paths.img}${show.local_poster_path}`
    : show.poster_path
      ? `https://image.tmdb.org/t/p/w${config.image_sizes.show_width}${show.poster_path}`
      : "";
  el("show-poster").src = poster;

  // Backdrop
  if (show.local_backdrop_path || show.backdrop_path) {
    const bg = show.local_backdrop_path
      ? `${paths.img}${show.local_backdrop_path}`
      : `https://image.tmdb.org/t/p/w${config.image_sizes.backdrop_w}${show.backdrop_path}`;
    el("hero-backdrop").style.backgroundImage = `url('${bg}')`;
  }

  renderSeasons(show, traktShow, config);
}

/* =======================================================================
   [SH-JS-4] Render Seasons + Episodes
   ======================================================================= */
function renderSeasons(show, traktShow, config) {
  const container = el("seasons-container");
  container.innerHTML = "";

  (show.seasons || []).forEach(season => {
    const sec = document.createElement("section");
    sec.className = "season-card";

    // Season header
    const header = document.createElement("div");
    header.className = "season-header";
    header.innerHTML = `
      <h2>Season ${season.season_number}</h2>
      <span>${season.episode_count || season.episodes?.length || 0} episodes</span>
    `;
    sec.appendChild(header);

    // Episodes
    const epWrap = document.createElement("div");
    epWrap.className = "episode-list";

    (season.episodes || []).forEach(ep => {
      const watched = traktShow && traktShow.watched_episodes >= ep.episode_number;

      const epEl = document.createElement("div");
      epEl.className = "episode-card" + (watched ? " watched" : "");
      epEl.innerHTML = `
        <div class="episode-still">
          ${ep.local_still_path
            ? `<img src="${paths.img}${ep.local_still_path}">`
            : ep.still_path
              ? `<img src="https://image.tmdb.org/t/p/w${config.image_sizes.episode_still_w}${ep.still_path}">`
              : ""
          }
        </div>
        <div class="episode-info">
          <div class="ep-title">S${season.season_number}E${ep.episode_number} · ${ep.name}</div>
          <div class="ep-air">${ep.air_date || ""}</div>
          <div class="ep-buttons">
            <a class="btn btn-tmdb" target="_blank" href="${ep.links?.tmdb || '#'}">INFO<br>TMDB</a>
            <a class="btn btn-watch" target="_blank" href="${ep.links?.videasy || '#'}">Watch<br>Videasy</a>
            <a class="btn btn-watch-alt" target="_blank" href="${ep.links?.vidsrc || '#'}">Watch<br>VidSrc</a>
          </div>
        </div>
      `;
      epWrap.appendChild(epEl);
    });

    sec.appendChild(epWrap);
    container.appendChild(sec);
  });
}
</script>

</body>
</html>
