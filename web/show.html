<!DOCTYPE html>
<html lang="en">
<head>
  <!-- =========================================================================
       File:        web/show.html
       Project:     my_TV_Movie
       Purpose:     Dedicated show page (series → seasons → episodes)
       Data:        ../data/data.json (generated by scripts/fetch_tmdb.py)
       Config:      ./config.json (streaming bases + image sizes)
       Version:     v3.3.6 (2025-12-16)
       ========================================================================= -->

  <meta charset="UTF-8" />
  <title>Show • My TV Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Show details page for My TV Hub" />

  <!-- IMPORTANT: keep filename EXACT -->
  <link rel="stylesheet" href="css/my_tv_hub.css?v=3.3.6" />

  <!-- Minimal page-only CSS (layout glue only; core styling lives in my_tv_hub.css) -->
  <style>
    .show-page-wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .show-hero { position: relative; border-radius: 16px; overflow: hidden; margin-bottom: 14px; }
    .show-hero-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      filter: blur(0px);
      transform: scale(1.02);
      opacity: 0.18;
    }
    .show-hero-fg { position: relative; display: grid; grid-template-columns: 170px 1fr; gap: 14px; padding: 14px; }
    .show-poster-img { width: 170px; border-radius: 14px; display: block; }
    .show-title-line { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
    .show-title-line h1 { margin: 0; font-size: 1.35rem; }
    .show-subline { margin-top: 6px; opacity: 0.9; }
    .show-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }

    .accordion { margin-top: 14px; }
    .acc-item { border-radius: 14px; overflow: hidden; margin-bottom: 10px; }
    .acc-head {
      width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; cursor: pointer;
    }
    .acc-head .left { display: flex; gap: 10px; align-items: center; }
    .acc-head .meta { opacity: 0.85; font-size: 0.95rem; }
    .acc-body { display: none; padding: 12px 14px; }
    .acc-item.open .acc-body { display: block; }

    .season-grid { display: grid; grid-template-columns: 140px 1fr; gap: 12px; }
    .season-poster-img { width: 140px; border-radius: 12px; display: block; }

    .ep-list { display: grid; gap: 10px; }
    .ep-row {
      border-radius: 12px; padding: 10px;
      display: grid; grid-template-columns: 180px 1fr 150px; gap: 10px; align-items: start;
    }
    .ep-still-img { width: 180px; border-radius: 10px; display: block; }
    .ep-title { margin: 0; font-size: 1.02rem; }
    .ep-meta { opacity: 0.85; margin-top: 4px; font-size: 0.92rem; }
    .ep-overview { margin-top: 8px; opacity: 0.95; line-height: 1.25rem; }
    .ep-actions { display: grid; gap: 8px; align-content: start; }
    .ep-actions .btn { width: 100%; }

    .top-mini-nav { display: flex; gap: 10px; align-items: center; padding: 10px 16px; }
    .top-mini-nav a { text-decoration: none; }

    .error-box { padding: 14px; border-radius: 14px; margin: 14px 0; }
  </style>
</head>

<body>

  <div class="top-mini-nav">
    <a class="btn" href="./index.html">← Back to Hub</a>
    <a class="btn" href="./config.html">Config</a>
  </div>

  <div class="show-page-wrap" id="root">
    <!-- rendered by JS -->
  </div>

<script>
/* ============================================================================
   [SHOW-1.0] Constants
============================================================================ */

const DATA_URL   = "../data/data.json";
const CONFIG_URL = "./config.json";

/* ============================================================================
   [SHOW-1.1] Safe helpers
============================================================================ */

function $(sel) { return document.querySelector(sel); }

function esc(s) {
  return String(s ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function norm(s) {
  return String(s ?? "")
    .toLowerCase()
    .trim()
    .replace(/['"]/g, "")
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/^_+|_+$/g, "");
}

function asInt(x, d=0) {
  const n = Number.parseInt(x, 10);
  return Number.isFinite(n) ? n : d;
}

function first(...vals) {
  for (const v of vals) {
    if (v !== undefined && v !== null && String(v).length) return v;
  }
  return "";
}

/* ============================================================================
   [SHOW-2.0] Query params: id / tmdb_id / slug
============================================================================ */

function getQuery() {
  const p = new URLSearchParams(window.location.search);
  return {
    id: p.get("id"),
    tmdb_id: p.get("tmdb_id"),
    slug: p.get("slug"),
    name: p.get("name")
  };
}

/* ============================================================================
   [SHOW-3.0] Load config + data (robust)
============================================================================ */

async function loadJson(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(`HTTP ${r.status} for ${url}`);
  return await r.json();
}

async function boot() {
  const root = $("#root");
  root.innerHTML = `<div class="error-box">Loading…</div>`;

  let cfg = null;
  let data = null;

  try {
    cfg = await loadJson(CONFIG_URL);
  } catch (e) {
    cfg = {
      streaming_services: {
        vidsrc_tv: "https://vidsrc.net/embed/tv/",
        videasy_tv: "https://player.videasy.net/tv/"
      },
      image_sizes: { show_width: 185, season_width: 185, episode_still_w: 300, backdrop_w: 780 }
    };
  }

  try {
    data = await loadJson(DATA_URL);
  } catch (e) {
    root.innerHTML = `<div class="error-box">ERROR: cannot load data.json (${esc(e.message)})</div>`;
    return;
  }

  renderShowPage(cfg, data);
}

/* ============================================================================
   [SHOW-4.0] Image URL resolver (prefers local_* fields)
============================================================================ */

function tmdbImg(path, w) {
  if (!path) return "";
  // TMDB path values already start with "/xxxx.jpg"
  return `https://image.tmdb.org/t/p/w${w}${path}`;
}

function resolveShowPoster(show, cfg) {
  // prefer local fields if fetch script added them
  return first(
    show.local_poster_path,
    show.local_poster,
    show.poster,               // some schemas use full URL
    tmdbImg(show.poster_path, asInt(cfg?.image_sizes?.show_width, 185))
  );
}

function resolveShowBackdrop(show, cfg) {
  return first(
    show.local_backdrop_path,
    show.local_backdrop,
    show.backdrop,             // some schemas use full URL
    tmdbImg(show.backdrop_path, asInt(cfg?.image_sizes?.backdrop_w, 780))
  );
}

function resolveSeasonPoster(season, cfg) {
  return first(
    season.local_poster_path,
    season.local_poster,
    season.poster,             // full URL if present
    tmdbImg(season.poster_path, asInt(cfg?.image_sizes?.season_width, 185))
  );
}

function resolveEpisodeStill(ep, cfg) {
  return first(
    ep.local_still_path,
    ep.local_episode_still,
    ep.episode_still,          // full URL if present
    tmdbImg(ep.still_path, asInt(cfg?.image_sizes?.episode_still_w, 300))
  );
}

/* ============================================================================
   [SHOW-5.0] Streaming URL builder (config-driven; ignores stale hard-coded links)
============================================================================ */

function buildTvEmbedUrl(base, tmdbId, seasonNum, epNum) {
  const b = String(base || "").trim();
  if (!b) return "";
  // expected bases:
  //  - https://vidsrc.net/embed/tv/
  //  - https://player.videasy.net/tv/
  return `${b}${tmdbId}/${seasonNum}/${epNum}`;
}

function tmdbEpisodeInfoUrl(tmdbShowId, seasonNum, epNum) {
  return `https://www.themoviedb.org/tv/${tmdbShowId}/season/${seasonNum}/episode/${epNum}`;
}

function tmdbShowInfoUrl(tmdbShowId) {
  return `https://www.themoviedb.org/tv/${tmdbShowId}`;
}

/* ============================================================================
   [SHOW-6.0] Watch state helpers (Trakt optional)
============================================================================ */

function isWatchedEp(ep) {
  // tolerate multiple schemas
  const t = ep.trakt || ep.watch || ep.watched || null;
  if (!t) return false;
  if (typeof t === "boolean") return t;
  if (typeof t.watched === "boolean") return t.watched;
  if (typeof t.is_watched === "boolean") return t.is_watched;
  return false;
}

function findNextUnwatchedEpisode(season) {
  const eps = season.episodes || [];
  for (const ep of eps) {
    if (!isWatchedEp(ep)) return ep;
  }
  return null;
}

/* ============================================================================
   [SHOW-7.0] Find show in data (robust)
============================================================================ */

function findShow(data, q) {
  const shows = data?.shows || data?.tv_shows || [];
  const wantedId = first(q.id, q.tmdb_id);
  const wantedSlug = first(q.slug, q.name);

  // match by numeric id fields
  if (wantedId) {
    const n = asInt(wantedId, -1);
    if (n > 0) {
      for (const s of shows) {
        const sid = asInt(first(s.tmdb_id, s.show_id, s.id), -2);
        if (sid === n) return s;
      }
    }
  }

  // match by slug/name
  if (wantedSlug) {
    const target = norm(wantedSlug);
    for (const s of shows) {
      const cand = norm(first(s.ref_name, s.name, s.title));
      if (cand === target) return s;
    }
  }

  return null;
}

/* ============================================================================
   [SHOW-8.0] Render
============================================================================ */

function renderShowPage(cfg, data) {
  const root = $("#root");
  const q = getQuery();
  const show = findShow(data, q);

  if (!show) {
    root.innerHTML = `
      <div class="error-box">
        <div><strong>Show not found.</strong></div>
        <div style="margin-top:8px;opacity:.9">Tip: open from the Hub or pass ?id=TMDB_ID</div>
      </div>`;
    return;
  }

  const tmdbId = asInt(first(show.tmdb_id, show.show_id, show.id), 0);
  const imdb = first(show.imdb_id, show.imdb, "");
  const status = first(show.status_display, show.status, "");
  const since = first(show.first_air_date, show.start_date, "");
  const genres = (show.genres || show.genre_names || []).join(" / ");

  const posterUrl = resolveShowPoster(show, cfg);
  const backdropUrl = resolveShowBackdrop(show, cfg);

  const seasons = (show.seasons || []).slice().sort((a,b) => asInt(a.season_number,0)-asInt(b.season_number,0));

  // Determine "current season" = highest season_number with episodes
  let currentSeasonNum = 0;
  for (const s of seasons) {
    const sn = asInt(s.season_number, 0);
    const epCount = (s.episodes || []).length;
    if (sn > currentSeasonNum && epCount > 0) currentSeasonNum = sn;
  }

  root.innerHTML = `
    <div class="show-hero">
      <div class="show-hero-bg" style="background-image:url('${esc(backdropUrl)}')"></div>
      <div class="show-hero-fg">
        <div>
          <img class="show-poster-img" alt="${esc(show.name)} poster" src="${esc(posterUrl)}" />
        </div>
        <div>
          <div class="show-title-line">
            <h1>${esc(show.name || "Untitled")}</h1>
            <span class="meta">[tmdb:${tmdbId}${imdb ? ` · imdb:${esc(imdb)}` : ""}]</span>
          </div>

          <div class="show-subline">
            ${status ? `<span class="badge status">${esc(status)}</span>` : ""}
            ${since ? `<span class="meta" style="margin-left:10px">Since ${esc(since)}</span>` : ""}
          </div>

          <div class="show-subline">
            ${genres ? `<span class="meta">${esc(genres)}</span>` : ""}
          </div>

          <div class="show-actions">
            <a class="btn btn-info" target="_blank" rel="noopener" href="${esc(tmdbShowInfoUrl(tmdbId))}">
              INFO at<br>TMDB
            </a>
            <a class="btn" href="./index.html">Back to Hub</a>
          </div>
        </div>
      </div>
    </div>

    <div class="accordion" id="seasonAccordion"></div>
  `;

  const acc = $("#seasonAccordion");
  acc.innerHTML = seasons.map(season => renderSeasonAccordionItem(cfg, tmdbId, season, currentSeasonNum)).join("");

  // wire accordions
  acc.querySelectorAll(".acc-head").forEach(btn => {
    btn.addEventListener("click", () => {
      const item = btn.closest(".acc-item");
      item.classList.toggle("open");
    });
  });

  // default: current season open; others closed (matches your rule)
  acc.querySelectorAll(".acc-item").forEach(item => {
    const sn = asInt(item.getAttribute("data-season"), 0);
    if (sn === currentSeasonNum) item.classList.add("open");
  });

  // within current season: open next-unwatched episode details if present (twisty behavior)
  const current = acc.querySelector(`.acc-item[data-season="${currentSeasonNum}"]`);
  if (current) {
    const next = current.querySelector(".ep-row[data-next='1']");
    if (next) next.classList.add("open-ep");
  }
}

/* ============================================================================
   [SHOW-9.0] Render season accordion item
============================================================================ */

function renderSeasonAccordionItem(cfg, tmdbId, season, currentSeasonNum) {
  const sn = asInt(season.season_number, 0);
  const name = first(season.name, (sn === 0 ? "Specials" : `Season ${sn}`));
  const poster = resolveSeasonPoster(season, cfg);
  const eps = (season.episodes || []).slice().sort((a,b) => asInt(a.episode_number,0)-asInt(b.episode_number,0));

  const nextUnwatched = findNextUnwatchedEpisode(season);
  const nextKey = nextUnwatched ? `${asInt(nextUnwatched.episode_number,0)}` : "";

  return `
    <div class="acc-item" data-season="${sn}">
      <button class="acc-head" type="button">
        <div class="left">
          <span class="badge">${esc(name)}</span>
          <span class="meta">${eps.length} eps</span>
          ${sn === currentSeasonNum ? `<span class="badge badge-accent">Current</span>` : ``}
        </div>
        <div class="meta">▾</div>
      </button>

      <div class="acc-body">
        <div class="season-grid">
          <div>
            <img class="season-poster-img" alt="${esc(name)} poster" src="${esc(poster)}" />
          </div>
          <div>
            <div class="ep-list">
              ${eps.map(ep => renderEpisodeRow(cfg, tmdbId, sn, ep, nextKey)).join("")}
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

/* ============================================================================
   [SHOW-10.0] Render episode row
============================================================================ */

function renderEpisodeRow(cfg, tmdbId, seasonNum, ep, nextKey) {
  const en = asInt(ep.episode_number, 0);
  const title = first(ep.name, ep.title, `Episode ${en}`);
  const air = first(ep.air_date, "");
  const rt = ep.runtime != null ? `${ep.runtime}m` : "";
  const overview = first(ep.overview, "");
  const still = resolveEpisodeStill(ep, cfg);

  const isNext = (String(en) === String(nextKey));
  const traktWatched = isWatchedEp(ep);

  const vidsrcBase  = first(cfg?.streaming_services?.vidsrc_tv, "https://vidsrc.net/embed/tv/");
  const videasyBase = first(cfg?.streaming_services?.videasy_tv, "https://player.videasy.net/tv/");

  const urlTMDB   = tmdbEpisodeInfoUrl(tmdbId, seasonNum, en);
  const urlEasy   = buildTvEmbedUrl(videasyBase, tmdbId, seasonNum, en);
  const urlVidsrc = buildTvEmbedUrl(vidsrcBase, tmdbId, seasonNum, en);

  return `
    <div class="ep-row" ${isNext ? `data-next="1"` : ``}>
      <div>
        <img class="ep-still-img" alt="Episode still" src="${esc(still)}" />
      </div>

      <div>
        <div class="show-title-line">
          <h3 class="ep-title">S${seasonNum}E${en} · ${esc(title)}</h3>
          ${traktWatched ? `<span class="badge watched">Watched</span>` : ``}
          ${isNext ? `<span class="badge badge-accent">Next</span>` : ``}
        </div>
        <div class="ep-meta">
          ${air ? `Air: ${esc(air)}` : ``}
          ${air && rt ? ` · ` : ``}
          ${rt ? `Runtime: ${esc(rt)}` : ``}
        </div>
        ${overview ? `<div class="ep-overview">${esc(overview)}</div>` : ``}
      </div>

      <div class="ep-actions">
        <a class="btn btn-tmdb" target="_blank" rel="noopener" href="${esc(urlTMDB)}">INFO at<br>TMDB</a>
        <a class="btn btn-videasy" target="_blank" rel="noopener" href="${esc(urlEasy)}">Watch on<br>Videasy</a>
        <a class="btn btn-vidsrc" target="_blank" rel="noopener" href="${esc(urlVidsrc)}">Watch on<br>VidSrc</a>
      </div>
    </div>
  `;
}

/* ============================================================================
   [SHOW-99.0] Start
============================================================================ */

boot();
</script>

</body>
</html>
