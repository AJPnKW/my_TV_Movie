<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <!-- Preserve existing CSS link -->

  <style>
    /* Keep baseline style; minimal changes only */

    .cal-month-header .btn {
      padding: 8px 10px;

      border: 1px solid rgba(255,255,255,0.08);

    .cal-month-header .title {

<body>
  <div id="app-shell">
    <div id="topbar">
      <div id="topbar-inner">
        <div id="brand" role="banner" aria-label="My TV Hub">
          <div class="logo" aria-hidden="true">TV</div>
          <div class="txt">
            <div class="title">My TV Hub</div>
            <div class="sub">Calendar • Shows • Movies</div>
          </div>
        </div>

        <div id="header-right">
          <div id="status-pill" data-ok="false" title="Data/config load status">
            <div class="dot" aria-hidden="true"></div>
            <div id="status-text">LOADING</div>
          </div>
        </div>
      </div>

      <div id="nav" role="tablist" aria-label="Views">
        <div class="tab" role="tab" aria-selected="true"  data-view="calendar">Calendar</div>
        <div class="tab" role="tab" aria-selected="false" data-view="shows">Shows</div>
        <div class="tab" role="tab" aria-selected="false" data-view="movies">Movies</div>
        <div class="tab" role="tab" aria-selected="false" data-view="live_tv">Live TV</div>
        <div class="tab" role="tab" aria-selected="false" data-view="watchlist">Watchlist</div>
        <div class="tab" role="tab" aria-selected="false" data-view="config">Config</div>
      </div>

      <div id="error-surface" role="alert" aria-live="polite">
        <div class="msg" id="error-msg"></div>
        <button class="dismiss" id="error-dismiss" type="button">Dismiss</button>
      </div>
    </div>

    <main id="main" role="main" aria-label="Main content">
      <!-- Views render here -->
    </main>
  </div>

  <script>
  (() => {
    "use strict";

    // ============================================================
    // Baseline App Container
    // ============================================================

    const App = Object.freeze({
      state: {
        view: "calendar",
        data_loaded: false,
        config_loaded: false,
        data: null,
        config: null
      }
    });

    const el = Object.freeze({
      main: document.getElementById("main"),
      tabs: Array.from(document.querySelectorAll("#nav .tab")),
      statusPill: document.getElementById("status-pill"),
      statusText: document.getElementById("status-text"),
      errorSurface: document.getElementById("error-surface"),
      errorMsg: document.getElementById("error-msg"),
      errorDismiss: document.getElementById("error-dismiss"),
    });

    function showError(message) {
      el.errorMsg.textContent = String(message || "Unknown error");
      el.errorSurface.style.display = "inline-flex";
    }

    function clearErrorSurface() {
      el.errorMsg.textContent = "";
      el.errorSurface.style.display = "none";
    }

    function safeJsonParse(text, contextLabel) {
      try { return JSON.parse(text); }
      catch (e) {
        throw new Error(`Invalid JSON in ${contextLabel}: ${e && e.message ? e.message : e}`);
      }
    }

    function setStatus(ok, text) {
      el.statusPill.setAttribute("data-ok", ok ? "true" : "false");
      el.statusText.textContent = String(text || "");
    }

    function normalizeText(s, fallback) {
      const t = (typeof s === "string") ? s.trim() : "";
      return t ? t : (fallback || "");
    }

    function parseISODateOnly(iso) {
      if (typeof iso !== "string") return null;
      const m = iso.trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return null;
      const y = Number(m[1]), mo = Number(m[2]) - 1, d = Number(m[3]);
      const dt = new Date(y, mo, d);
      if (!Number.isFinite(dt.getTime())) return null;
      // Guard against JS rollover (e.g., 2025-02-31)
      if (dt.getFullYear() !== y || dt.getMonth() !== mo || dt.getDate() !== d) return null;
      return dt;
    }

    function isoDayKeyFromDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function monthLabel(year, monthIndex) {
      const dt = new Date(year, monthIndex, 1);
      return dt.toLocaleString(undefined, { month: "long", year: "numeric" });
    }

    function firstDayOffsetMondayFirst(year, monthIndex) {
      const d = new Date(year, monthIndex, 1);
      const jsDow = d.getDay(); // 0=Sun..6=Sat
      // Convert to Monday-first: Mon=0..Sun=6
      return (jsDow + 6) % 7;
    }

    function daysInMonth(year, monthIndex) {
      return new Date(year, monthIndex + 1, 0).getDate();
    }

    // ============================================
    // Calendar Index Builder (SCHEMA-ALIGNED)
    // ============================================
    function buildCalendarItemsIndex(data) {
      // Index shows by first_air_date and movies by release_date.
      // Ignore invalid/missing dates. Degrade gracefully for missing images/links.
      const byDay = new Map();

      function ensureDay(dayKey) {
        if (!byDay.has(dayKey)) {
          byDay.set(dayKey, {
            day_key: dayKey,
            episodes: [], // kept for compatibility; schema does not include episode objects
            shows: [],
            movies: [],
            epg: []
          });
        }
        return byDay.get(dayKey);
      }

      // Movies
      const movies = Array.isArray(data && data.movies) ? data.movies : [];
      for (const movie of movies) {
        const rel = parseISODateOnly(movie && movie.release_date);
        if (!rel) continue;
        const dayKey = isoDayKeyFromDate(rel);
        const bucket = ensureDay(dayKey);

        const title = normalizeText(movie && movie.title, "Untitled Movie");
        const poster_local = (movie && typeof movie.poster_local === "string") ? movie.poster_local : "";
        const backdrop_local = (movie && typeof movie.backdrop_local === "string") ? movie.backdrop_local : "";
        const links = (movie && typeof movie.links === "object" && movie.links) ? movie.links : {};

        bucket.movies.push({
          kind: "movie",
          day_key: dayKey,
          title,
          tmdb_id: (movie && Number.isFinite(movie.tmdb_id)) ? movie.tmdb_id : null,
          trakt_id: (movie && Number.isFinite(movie.trakt_id)) ? movie.trakt_id : null,
          release_date: (movie && typeof movie.release_date === "string") ? movie.release_date : null,
          poster_local: poster_local || "",
          backdrop_local: backdrop_local || "",
          links,
          popup: { type: "movie", tmdb_id: (movie && Number.isFinite(movie.tmdb_id)) ? movie.tmdb_id : null }
        });
      }

      // Shows
      const shows = Array.isArray(data && data.shows) ? data.shows : [];
      for (const show of shows) {
        const fad = parseISODateOnly(show && show.first_air_date);
        if (!fad) continue;
        const dayKey = isoDayKeyFromDate(fad);
        const bucket = ensureDay(dayKey);

        const title = normalizeText(show && show.title, "Untitled Show");
        const poster_local = (show && typeof show.poster_local === "string") ? show.poster_local : "";
        const backdrop_local = (show && typeof show.backdrop_local === "string") ? show.backdrop_local : "";
        const links = (show && typeof show.links === "object" && show.links) ? show.links : {};
        const seasons = Array.isArray(show && show.seasons) ? show.seasons : [];

        bucket.shows.push({
          kind: "show",
          day_key: dayKey,
          title,
          tmdb_id: (show && Number.isFinite(show.tmdb_id)) ? show.tmdb_id : null,
          trakt_id: (show && Number.isFinite(show.trakt_id)) ? show.trakt_id : null,
          first_air_date: (show && typeof show.first_air_date === "string") ? show.first_air_date : null,
          poster_local: poster_local || "",
          backdrop_local: backdrop_local || "",
          links,
          season_mode: (show && typeof show.season_mode === "string") ? show.season_mode : null,
          season_filter: (show && typeof show.season_filter === "string") ? show.season_filter : null,
          seasons,
          popup: { type: "show", tmdb_id: (show && Number.isFinite(show.tmdb_id)) ? show.tmdb_id : null }
        });
      }

      // Live TV EPG (optional; if present, keep existing behavior)
      const live_tv = Array.isArray(data && data.live_tv) ? data.live_tv : [];
      for (const ch of live_tv) {
        const epg = Array.isArray(ch && ch.epg) ? ch.epg : [];
        for (const entry of epg) {
          const startDate = (entry && typeof entry.start === "string") ? entry.start : null;
          const m = startDate ? startDate.match(/^(\d{4}-\d{2}-\d{2})/) : null;
          if (!m) continue;
          const d = parseISODateOnly(m[1]);
          if (!d) continue;
          const dayKey = isoDayKeyFromDate(d);
          const bucket = ensureDay(dayKey);
          bucket.epg.push({
            kind: "epg",
            day_key: dayKey,
            title: normalizeText(entry && entry.title, "Program"),
            start: (entry && typeof entry.start === "string") ? entry.start : null,
            end: (entry && typeof entry.end === "string") ? entry.end : null,
            poster_local: "",
            backdrop_local: "",
            links: {},
            popup: { type: "epg", channel: normalizeText(ch && ch.name, ""), start: (entry && entry.start) ? entry.start : null }
          });
        }
      }

      // Sort per day for stable UI
      for (const bucket of byDay.values()) {
        bucket.shows.sort((a, b) => String(a.title).localeCompare(String(b.title)));
        bucket.movies.sort((a, b) => String(a.title).localeCompare(String(b.title)));
        bucket.epg.sort((a, b) => String(a.start || "").localeCompare(String(b.start || "")));
      }

      return byDay;
    }

    function calendarItemSecondaryText(item) {
      if (!item) return "";
      if (item.kind === "movie") {
        const providers = Object.keys(item.links || {});
        return providers.length ? `MOVIE • ${providers.join(" • ")}` : "MOVIE";
      }
      if (item.kind === "show") {
        const providers = Object.keys(item.links || {});
        return providers.length ? `SHOW • ${providers.join(" • ")}` : "SHOW";
      }
      if (item.kind === "epg") {
        return `LIVE • ${normalizeText(item.start, "—")}`;
      }
      return "";
    }

    function hasStreaming(item) {
      const links = (item && typeof item.links === "object" && item.links) ? item.links : {};
      return Object.keys(links).length > 0;
    }

    function openPopupForItem(item) {
      // Section 4.1.5 popup routing requirements
      // This module only routes; popup renderers are separate modules.
      if (!item || !item.popup) {
        showError("Calendar item has no popup routing payload.");
        return;
      }
      openPopup({
        title: (item.kind === "movie") ? "Movie" :
               (item.kind === "show") ? "Show" :
               (item.kind === "epg") ? "Program" : "Popup",
        body: `ROUTE:${item.popup.type}`,
        route: Object.freeze(item.popup)
      });
    }

    function openMorePopup(dayKey, items) {
      openPopup({
        title: `More items • ${dayKey}`,
        body: `COUNT:${items.length}`,
        route: Object.freeze({ type: "calendar_more", day: dayKey })
      });
    }

    function renderCalendarView(panel, data) {
      // Section 4.1: month-based 7x5/6 grid with sticky month header.
      const wrap = document.createElement("div");
      wrap.className = "cal-wrap";

      const header = document.createElement("div");
      header.className = "cal-month-header";

      const prevBtn = document.createElement("button");
      prevBtn.type = "button";
      prevBtn.className = "btn";
      prevBtn.textContent = "◀";
      prevBtn.setAttribute("aria-label", "Previous month");

      const nextBtn = document.createElement("button");
      nextBtn.type = "button";
      nextBtn.className = "btn";
      nextBtn.textContent = "▶";
      nextBtn.setAttribute("aria-label", "Next month");

      const title = document.createElement("div");
      title.className = "title";

      const todayPill = document.createElement("div");
      todayPill.className = "today-pill";

      const todayKey = isoDayKeyFromDate(new Date());
      todayPill.innerHTML = `<span>Today</span>&nbsp;<strong>${todayKey}</strong>`;

      const todayBtn = document.createElement("button");
      todayBtn.type = "button";
      todayBtn.className = "btn";
      todayBtn.textContent = "Today";
      todayBtn.setAttribute("aria-label", "Go to current month");

      header.appendChild(prevBtn);
      header.appendChild(nextBtn);
      header.appendChild(title);
      header.appendChild(todayBtn);
      header.appendChild(todayPill);

      // DOW row
      const dowRow = document.createElement("div");
      dowRow.className = "cal-dow";
      const dows = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
      for (const d of dows) {
        const n = document.createElement("div");
        n.textContent = d;
        dowRow.appendChild(n);
      }

      const grid = document.createElement("div");
      grid.className = "cal-grid";

      // Build index once per render
      const byDay = buildCalendarItemsIndex(data);

      // Month state
      const now = new Date();
      let year = now.getFullYear();
      let monthIndex = now.getMonth();

      function renderMonth() {
        grid.innerHTML = "";

        title.textContent = monthLabel(year, monthIndex);

        const offset = firstDayOffsetMondayFirst(year, monthIndex);
        const dim = daysInMonth(year, monthIndex);

        // total cells
        const totalCells = offset + dim;
        const weeks = Math.ceil(totalCells / 7); // 5-6 rows depending month (Section 4.1.2.1)

        // Build cells with deterministic positions:
        // cellIndex 0..(weeks*7-1)
        const cellElements = [];
        const firstCellDate = new Date(year, monthIndex, 1 - offset);

        for (let idx = 0; idx < weeks * 7; idx++) {
          const d = new Date(firstCellDate.getFullYear(), firstCellDate.getMonth(), firstCellDate.getDate() + idx);
          const dYear = d.getFullYear();
          const dMonth = d.getMonth();
          const dNum = d.getDate();
          const inMonth = (dYear === year && dMonth === monthIndex);

          const dayKey = isoDayKeyFromDate(d);

          const cell = document.createElement("div");
          cell.className = "cal-cell";
          cell.setAttribute("data-in-month", inMonth ? "true" : "false");
          cell.setAttribute("data-day", dayKey);

          const head = document.createElement("div");
          head.className = "head";

          const dayNum = document.createElement("div");
          dayNum.className = "d";
          dayNum.textContent = String(dNum);

          head.appendChild(dayNum);

          if (dayKey === todayKey) {
            const badge = document.createElement("div");
            badge.className = "today";
            badge.textContent = "Today";
            head.appendChild(badge);
          }

          cell.appendChild(head);

          const itemsWrap = document.createElement("div");
          itemsWrap.className = "cal-items";

          const bucket = byDay.get(dayKey) || { episodes: [], shows: [], movies: [], epg: [] };

          // Day ordering: shows, movies, epg (episode objects not present in schema).
          const dayItems = []
            .concat(bucket.episodes)
            .concat(bucket.shows).concat(bucket.movies)
            .concat(bucket.epg);

          const maxInline = 3;
          const inlineItems = dayItems.slice(0, maxInline);
          const overflowItems = dayItems.slice(maxInline);

          for (const item of inlineItems) {
            const it = document.createElement("div");
            it.className = "cal-item";
            it.setAttribute("tabindex", "0");
            it.setAttribute("role", "button");
            it.setAttribute("aria-label", `${item.title}`);

            const thumb = document.createElement("div");
            thumb.className = "thumb";

            const posterPath = (item && typeof item.poster_local === "string" && item.poster_local) ? item.poster_local : ((item && typeof item.backdrop_local === "string" && item.backdrop_local) ? item.backdrop_local : "");
            if (posterPath && typeof posterPath === "string") {
              const img = document.createElement("img");
              img.alt = "";
              img.loading = "lazy";
              img.decoding = "async";
              img.src = posterPath; // local path from poster_local/backdrop_local
              img.addEventListener("error", () => {
                thumb.innerHTML = `<div class="noimg">NO</div>`;
              }, { once: true });
              thumb.appendChild(img);
            } else {
              thumb.innerHTML = `<div class="noimg">NO</div>`;
              // Missing image: show placeholder (no error surface).
            }

            const main = document.createElement("div");
            main.className = "main";

            const t = document.createElement("div");
            t.className = "t";
            t.textContent = item.title;

            const s = document.createElement("div");
            s.className = "s";
            s.textContent = calendarItemSecondaryText(item);

            main.appendChild(t);
            main.appendChild(s);

            const right = document.createElement("div");
            right.className = "right";

            const avail = document.createElement("div");
            avail.className = "avail";
            avail.setAttribute("data-on", hasStreaming(item) ? "true" : "false");
            avail.setAttribute("aria-label", hasStreaming(item) ? "Streaming available" : "Streaming unknown");

            right.appendChild(avail);

            it.appendChild(thumb);
            it.appendChild(main);
            it.appendChild(right);

            it.addEventListener("click", () => openPopupForItem(item));
            it.addEventListener("keydown", (ev) => {
              // Enter opens popup (Section 4.1.4.3)
              if (ev.key === "Enter") {
                ev.preventDefault();
                openPopupForItem(item);
              }
            });

            itemsWrap.appendChild(it);
          }

          if (overflowItems.length > 0) {
            const more = document.createElement("div");
            more.className = "cal-item";
            more.setAttribute("tabindex", "0");
            more.setAttribute("role", "button");
            more.setAttribute("aria-label", `More items for ${dayKey}`);

            const thumb = document.createElement("div");
            thumb.className = "thumb";
            thumb.innerHTML = `<div class="noimg">+${overflowItems.length}</div>`;

            const main = document.createElement("div");
            main.className = "main";

            const t = document.createElement("div");
            t.className = "t";
            t.textContent = "More";

            const s = document.createElement("div");
            s.className = "s";
            s.textContent = `${overflowItems.length} item(s)`;

            main.appendChild(t);
            main.appendChild(s);

            const right = document.createElement("div");
            right.className = "right";

            more.appendChild(thumb);
            more.appendChild(main);
            more.appendChild(right);

            more.addEventListener("click", () => openMorePopup(dayKey, overflowItems));
            more.addEventListener("keydown", (ev) => {
              if (ev.key === "Enter") {
                ev.preventDefault();
                openMorePopup(dayKey, overflowItems);
              }
            });

            itemsWrap.appendChild(more);
          }

          cell.appendChild(itemsWrap);
          grid.appendChild(cell);
          cellElements.push(cell);
        }
      }

      prevBtn.addEventListener("click", () => {
        monthIndex -= 1;
        if (monthIndex < 0) { monthIndex = 11; year -= 1; }
        renderMonth();
      });

      nextBtn.addEventListener("click", () => {
        monthIndex += 1;
        if (monthIndex > 11) { monthIndex = 0; year += 1; }
        renderMonth();
      });

      todayBtn.addEventListener("click", () => {
        const now = new Date();
        year = now.getFullYear();
        monthIndex = now.getMonth();
        renderMonth();
      });

      renderMonth();

      wrap.appendChild(header);
      wrap.appendChild(dowRow);
      wrap.appendChild(grid);

      panel.appendChild(wrap);
    }

    // ============================================================
    // View Renderers (baseline)
    // ============================================================

    function clearMain() {
      el.main.innerHTML = "";
    }

    function renderPlaceholderView(title) {
      const d = document.createElement("div");
      d.className = "panel";
      d.innerHTML = `<h2>${title}</h2><p style="color:rgba(255,255,255,0.65)">Work in progress.</p>`;
      el.main.appendChild(d);
    }

    function renderView(view) {
      clearMain();

      const panel = document.createElement("div");
      panel.className = "panel";

      if (!App.state.data_loaded || !App.state.data) {
        panel.innerHTML = `<h2>Loading…</h2><p style="color:rgba(255,255,255,0.65)">data.json not loaded yet.</p>`;
        el.main.appendChild(panel);
        return;
      }

      // View switch
      if (view === "calendar") {
        renderCalendarView(panel, App.state.data);
      } else if (view === "shows") {
        renderPlaceholderView("Shows");
        return;
      } else if (view === "movies") {
        renderPlaceholderView("Movies");
        return;
      } else if (view === "live_tv") {
        renderPlaceholderView("Live TV");
        return;
      } else if (view === "watchlist") {
        // Preserve navigation intent; if separate page exists, open it.
        // Fallback: internal placeholder.
        try {
          window.location.href = "./watchlist.html";
          return;
        } catch (e) {
          renderPlaceholderView("Watchlist");
          return;
        }
      } else if (view === "config") {
        try {
          window.location.href = "./config.html";
          return;
        } catch (e) {
          renderPlaceholderView("Config");
          return;
        }
      } else {
        renderPlaceholderView(view);
        return;
      }

      el.main.appendChild(panel);
    }

    // ============================================================
    // Popup Root (baseline stubs)
    // ============================================================

    function openPopup(payload) {
      // Baseline: keep existing popup contract but minimal here.
      // If your baseline includes a real popup system elsewhere, it can hook these.
      console.log("POPUP", payload);
    }

    function closeTopPopup() {
      // Baseline stub
    }

    // ============================================================
    // Boot / Data + Config Load
    // ============================================================

    async function loadConfig() {
      try {
        const resp = await fetch("./config.json", { cache: "no-store" });
        if (!resp.ok) throw new Error(`Failed to load config.json (${resp.status})`);
        const text = await resp.text();
        const cfg = safeJsonParse(text, "web/config.json");
        App.state.config = cfg;
        App.state.config_loaded = true;
      } catch (e) {
        App.state.config_loaded = false;
        showError(String(e && e.message ? e.message : e));
      }
    }

    async function loadData() {
      try {
        // data.json is loaded once and never mutated
        const resp = await fetch("../data/data.json", { cache: "no-store" });
        if (!resp.ok) throw new Error(`Failed to load data.json (${resp.status})`);
        const text = await resp.text();
        const data = safeJsonParse(text, "data/data.json");

        // If data.json contains errors[] per builder, surface summary (read-only)
        if (data && Array.isArray(data.errors) && data.errors.length > 0) {
          showError(`data.json reports ${data.errors.length} error(s).`);
        }

        App.state.data = data;
        App.state.data_loaded = true;
      } catch (e) {
        App.state.data_loaded = false;
        showError(String(e && e.message ? e.message : e));
      }
    }

    function setActiveTab(view) {
      for (const t of el.tabs) {
        const isActive = (t.getAttribute("data-view") === view);
        t.setAttribute("aria-selected", isActive ? "true" : "false");
      }
    }

    function bindNav() {
      for (const t of el.tabs) {
        t.addEventListener("click", () => {
          const view = t.getAttribute("data-view");
          if (!view) return;
          App.state.view = view;
          setActiveTab(view);
          renderView(view);
        });
      }
    }

    function refreshStatusPill() {
      const ok = !!(App.state.data_loaded && App.state.config_loaded);
      el.statusPill.setAttribute("data-ok", ok ? "true" : "false");

      const meta = el.statusText;
      meta.textContent = (App.state.data_loaded && App.state.config_loaded) ? "" : "LOADING";
    }

    async function boot() {
      clearErrorSurface();
      setStatus(false, "LOADING");
      bindNav();

      await Promise.all([loadConfig(), loadData()]);

      refreshStatusPill();
      setActiveTab(App.state.view);
      renderView(App.state.view);

      // Status text is now either LOADING or blank; keep pill dot as indicator.
      setStatus(!!App.state.data_loaded, "");
    }

    // ============================================================
    // Expose minimal debug hooks (baseline)
    // ============================================================

    window.MyTVHub = Object.freeze({
      App,
      renderView,
      openPopup,
      closeTopPopup,
      reload: boot,
      get data() { return App.state.data; },
      get config() { return App.state.config; }
    });

    boot();
  </script>
</body>
</html>
