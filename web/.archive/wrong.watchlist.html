<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Watchlist</title>
<link rel="stylesheet" href="css/my_tv_hub.css">
</head>
<body>

<h1>Watchlist</h1>
<p>Your saved movies and shows.</p>

<select id="sort">
  <option value="az">A → Z</option>
</select>

<select id="status">
  <option value="all">All</option>
  <option value="Active">Active</option>
  <option value="Ended">Ended</option>
</select>

<button onclick="load()">Retry</button>

<div id="cards"></div>

<script>
function load() {
  fetch("../data/data.json")
    .then(r => r.json())
    .then(d => {
      const items = [
        ...d.movies.filter(m => m.in_watchlist).map(m => ({...m, kind:"movie"})),
        ...d.tv.filter(t => t.in_watchlist).map(t => ({...t, kind:"tv"}))
      ];
      render(items);
    })
    .catch(e => {
      console.error(e);
      alert("Failed to load watchlist");
    });
}

function render(items) {
  const c = document.getElementById("cards");
  c.innerHTML = "";
  items.sort((a,b)=> (a.title||a.name).localeCompare(b.title||b.name));
  items.forEach(i => {
    const div = document.createElement("div");
    const img = i.local_poster_path || i.poster_url;
    div.className="card";
    div.innerHTML = `<img src="${img}"><h3>${i.title||i.name}</h3><div>${i.status||""}</div>`;
    c.appendChild(div);
  });
}

load();
</script>
</body>
</html>
