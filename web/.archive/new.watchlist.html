<!-- =========================================================================================
[FILE] web/watchlist.html
[PROJECT] my_TV_Movie (My TV Hub)
[ROLE] Standalone Watchlist Page (schema-aligned; no episode fields)
[UPDATED] 2025-12-22
========================================================================================= -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My TV & Movie Hub — Watchlist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Preserve canonical stylesheet link -->
  <link rel="stylesheet" href="css/my_tv_hub.css" />

  <style>
    :root{
      --bg-main:#05060b; --text:#f5f5f7; --muted:#a3a6b8; --accent:#ff3366;
      --border:rgba(255,255,255,.10); --shadow:0 18px 45px rgba(0,0,0,.65);
      --r-xl:18px; --r-md:10px; --pill:999px;
    }
    html,body{margin:0;padding:0;background:radial-gradient(circle at top,#14172a 0%,#05060b 55%,#020308 100%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .shell{max-width:1200px;margin:0 auto;padding:16px 16px 60px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
    .title{display:flex;flex-direction:column;gap:4px}
    .title .h{font-size:1.5rem;font-weight:650;letter-spacing:.02em}
    .title .sub{font-size:.9rem;color:var(--muted)}
    .badge{font-size:.92rem;padding:2px 8px;border-radius:var(--pill);background:linear-gradient(135deg,rgba(255,51,102,.12),rgba(113,89,193,.14));color:var(--muted);border:1px solid rgba(255,51,102,.45)}
    nav{display:flex;gap:8px;flex-wrap:wrap}
    .navbtn{padding:7px 12px;border-radius:var(--pill);border:1px solid var(--border);background:rgba(11,13,24,.9);color:var(--text);text-decoration:none;font-size:.85rem}
    .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:20;
      padding:10px 12px;border-radius:var(--r-xl);border:1px solid rgba(255,255,255,.12);
      background:radial-gradient(circle at top left,rgba(255,51,102,.16) 0%,transparent 45%),
                 radial-gradient(circle at bottom right,rgba(60,90,255,.18) 0%,transparent 55%),
                 rgba(5,6,11,.94);
      box-shadow:var(--shadow);backdrop-filter:blur(16px)
    }
    .bar label{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .input,.select{
      background:rgba(11,13,24,.9);border-radius:var(--pill);border:1px solid rgba(255,255,255,.12);
      padding:7px 10px;color:var(--text);font-size:.85rem;outline:none
    }
    .input{min-width:220px;flex:1}
    .pill{padding:4px 10px;border-radius:var(--pill);border:1px solid rgba(255,255,255,.10);background:rgba(10,12,24,.9);color:var(--muted);font-size:.82rem}
    .grid{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
    .card{border-radius:var(--r-xl);border:1px solid rgba(255,255,255,.08);overflow:hidden;box-shadow:var(--shadow);background:rgba(7,9,18,.98)}
    .row{display:flex;gap:10px;padding:10px 10px 12px}
    .poster{width:60px;min-width:60px;height:90px;border-radius:var(--r-md);overflow:hidden;background:#151728;box-shadow:0 10px 25px rgba(0,0,0,.85)}
    .poster img{width:100%;height:100%;object-fit:cover;display:block}
    .meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
    .name{font-weight:650;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .submeta{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:.78rem}
    .links{display:flex;gap:6px;flex-wrap:wrap}
    .linkbtn{
      display:inline-flex;gap:8px;align-items:center;text-decoration:none;color:var(--text);
      padding:6px 10px;border-radius:var(--pill);border:1px solid rgba(255,255,255,.18);
      background:rgba(10,12,24,.96);font-size:.82rem;box-shadow:0 8px 20px rgba(0,0,0,.9)
    }
    .linkbtn:hover{background:linear-gradient(135deg,rgba(255,51,102,.20),rgba(60,90,255,.20))}
    .empty{margin-top:14px;padding:18px 14px;border-radius:var(--r-xl);border:1px dashed rgba(255,255,255,.22);background:rgba(5,6,14,.96);color:var(--muted)}
    .err{color:#ffb4b4}
  </style>
</head>

<body>
  <div class="shell">
    <header>
      <div class="title">
        <div class="h">My TV & Movie Hub <span class="badge">Watchlist</span></div>
        <div class="sub">Standalone view filtered by items that have at least one link.</div>
      </div>
      <nav>
        <a class="navbtn" href="index.html">Home</a>
        <a class="navbtn" href="config.html">Config</a>
      </nav>
    </header>

    <section class="bar">
      <label for="q">Search</label>
      <input id="q" class="input" type="search" placeholder="Title contains…" autocomplete="off"/>

      <label for="type">Type</label>
      <select id="type" class="select">
        <option value="all">All</option>
        <option value="movies">Movies</option>
        <option value="shows">Shows</option>
      </select>

      <label for="sort">Sort</label>
      <select id="sort" class="select">
        <option value="title-asc">Title A → Z</option>
        <option value="title-desc">Title Z → A</option>
        <option value="date-desc">Date New → Old</option>
        <option value="date-asc">Date Old → New</option>
      </select>

      <span id="count" class="pill">Loading…</span>
    </section>

    <div id="error" class="empty err" style="display:none"></div>
    <main id="grid" class="grid"></main>
    <div id="empty" class="empty" style="display:none"></div>
  </div>

  <script>
    function safeStr(v, fallback="") {
      return (typeof v === "string" && v.trim() !== "") ? v : fallback;
    }
    function safeNum(v) {
      return (typeof v === "number" && Number.isFinite(v)) ? v : null;
    }
    function parseDate(s) {
      const t = safeStr(s, "");
      if (!t) return null;
      const d = new Date(t);
      return isNaN(d.getTime()) ? null : d;
    }
    function dateLabel(s, fallback="—") {
      const d = parseDate(s);
      if (!d) return fallback;
      return d.toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" });
    }
    function yearLabel(s, fallback="—") {
      const d = parseDate(s);
      if (!d) return fallback;
      return String(d.getFullYear());
    }
    function isNonEmptyObject(o) {
      return !!o && typeof o === "object" && !Array.isArray(o) && Object.keys(o).length > 0;
    }
    function normalizeLinkValue(v) {
      return (typeof v === "string" && v.trim() !== "") ? v.trim() : null;
    }
    function buildLinks(linksObj) {
      if (!isNonEmptyObject(linksObj)) return [];
      const out = [];
      for (const k of Object.keys(linksObj)) {
        const href = normalizeLinkValue(linksObj[k]);
        if (!href) continue;
        out.push({ label: k, href });
      }
      return out;
    }
    function imgOrFallback(path, fallback) {
      const p = safeStr(path, "");
      return p ? p : fallback;
    }

    const FALLBACK_POSTER = "assets/fallback/poster_fallback.jpg";
    const els = {
      q: document.getElementById("q"),
      type: document.getElementById("type"),
      sort: document.getElementById("sort"),
      count: document.getElementById("count"),
      grid: document.getElementById("grid"),
      empty: document.getElementById("empty"),
      error: document.getElementById("error")
    };

    let state = { movies: [], shows: [] };

    function unifyLinkedItems() {
      const items = [];

      const movies = Array.isArray(state.movies) ? state.movies : [];
      const shows  = Array.isArray(state.shows)  ? state.shows  : [];

      for (const m of movies) {
        if (!m) continue;
        const links = isNonEmptyObject(m.links) ? m.links : {};
        if (!isNonEmptyObject(links)) continue; // watchlist filter
        items.push({
          kind: "movie",
          title: safeStr(m.title, "Untitled"),
          tmdb_id: safeNum(m.tmdb_id),
          trakt_id: safeNum(m.trakt_id),
          date: safeStr(m.release_date, ""),
          poster_local: safeStr(m.poster_local, ""),
          links
        });
      }

      for (const s of shows) {
        if (!s) continue;
        const links = isNonEmptyObject(s.links) ? s.links : {};
        if (!isNonEmptyObject(links)) continue; // watchlist filter
        items.push({
          kind: "show",
          title: safeStr(s.title, "Untitled"),
          tmdb_id: safeNum(s.tmdb_id),
          trakt_id: safeNum(s.trakt_id),
          date: safeStr(s.first_air_date, ""),
          poster_local: safeStr(s.poster_local, ""),
          links,
          season_mode: safeStr(s.season_mode, ""),
          season_filter: safeStr(s.season_filter, ""),
          seasons_count: Array.isArray(s.seasons) ? s.seasons.length : 0
        });
      }

      return items;
    }

    function applyFilters(items) {
      const q = safeStr(els.q.value, "").toLowerCase();
      const t = els.type.value;

      let out = items;

      if (t === "movies") out = out.filter(x => x.kind === "movie");
      if (t === "shows") out = out.filter(x => x.kind === "show");

      if (q) out = out.filter(x => x.title.toLowerCase().includes(q));

      const sk = els.sort.value;
      out = out.slice().sort((a,b) => {
        if (sk === "title-asc") return a.title.localeCompare(b.title);
        if (sk === "title-desc") return b.title.localeCompare(a.title);

        const da = parseDate(a.date);
        const db = parseDate(b.date);

        if (!da && !db) return a.title.localeCompare(b.title);
        if (!da) return 1;
        if (!db) return -1;

        return (sk === "date-asc") ? (da - db) : (db - da);
      });

      return out;
    }

    function setCount(n) {
      els.count.textContent = `${n} item${n === 1 ? "" : "s"}`;
    }

    function render(items) {
      els.grid.innerHTML = "";
      els.empty.style.display = "none";

      if (!items.length) {
        els.empty.style.display = "block";
        els.empty.innerHTML = `<div><b>No watchlist items found.</b></div><div>Items appear here when <code>links{}</code> is non-empty.</div>`;
        setCount(0);
        return;
      }

      setCount(items.length);

      for (const it of items) {
        const card = document.createElement("section");
        card.className = "card";

        const row = document.createElement("div");
        row.className = "row";

        const poster = document.createElement("div");
        poster.className = "poster";
        const pimg = document.createElement("img");
        pimg.alt = it.title;
        pimg.src = imgOrFallback(it.poster_local, FALLBACK_POSTER);
        pimg.loading = "lazy";
        poster.appendChild(pimg);

        const meta = document.createElement("div");
        meta.className = "meta";

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = it.title;

        const sub = document.createElement("div");
        sub.className = "submeta";
        sub.innerHTML = `
          <span class="pill">${it.kind.toUpperCase()}</span>
          <span class="pill">${yearLabel(it.date)}</span>
          <span class="pill">${dateLabel(it.date, "No date")}</span>
        `;

        const ids = document.createElement("div");
        ids.className = "submeta";
        const tmdb = (it.tmdb_id !== null) ? it.tmdb_id : "—";
        const trakt = (it.trakt_id !== null) ? it.trakt_id : "—";
        ids.innerHTML = `<span class="pill">TMDB: ${tmdb}</span><span class="pill">Trakt: ${trakt}</span>`;

        if (it.kind === "show") {
          const extra = document.createElement("div");
          extra.className = "submeta";
          const parts = [];
          parts.push(`<span class="pill">Seasons: ${it.seasons_count}</span>`);
          if (it.season_mode) parts.push(`<span class="pill">Mode: ${it.season_mode}</span>`);
          if (it.season_filter) parts.push(`<span class="pill">Filter: ${it.season_filter}</span>`);
          extra.innerHTML = parts.join("");
          meta.appendChild(extra);
        }

        const linksWrap = document.createElement("div");
        linksWrap.className = "links";
        const links = buildLinks(it.links);
        for (const l of links) {
          const a = document.createElement("a");
          a.className = "linkbtn";
          a.href = l.href;
          a.target = "_blank";
          a.rel = "noreferrer";
          a.textContent = l.label;
          linksWrap.appendChild(a);
        }

        meta.appendChild(name);
        meta.appendChild(sub);
        meta.appendChild(ids);
        meta.appendChild(linksWrap);

        row.appendChild(poster);
        row.appendChild(meta);

        card.appendChild(row);
        els.grid.appendChild(card);
      }
    }

    function showError(msg) {
      els.error.style.display = "block";
      els.error.textContent = msg;
    }

    function rerender() {
      render(applyFilters(unifyLinkedItems()));
    }

    async function load() {
      try {
        const res = await fetch("data/data.json", { cache: "no-cache" });
        if (!res.ok) throw new Error(`Failed to load data/data.json (HTTP ${res.status})`);
        const data = await res.json();

        state.movies = Array.isArray(data?.movies) ? data.movies : [];
        state.shows  = Array.isArray(data?.shows)  ? data.shows  : [];

        rerender();
      } catch (e) {
        console.error(e);
        showError(String(e?.message || e));
      }
    }

    els.q.addEventListener("input", rerender);
    els.type.addEventListener("change", rerender);
    els.sort.addEventListener("change", rerender);

    load();
  </script>
</body>
</html>
