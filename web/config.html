<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>My TV Hub - Config</title>
  <link rel="stylesheet" href="./css/main_app.css?v=v1.5.8" />
</head>
<body data-app-family="main" data-page="config" data-focus-global="off">
  <div class="app">
    <div class="top">
      <div class="brand">
        <a class="logo" href="./index.html" aria-label="The Boys Hub"><img src="../assets/custom/the_boys_hub_logo2.png" alt="The Boys Hub" /></a>
      </div>
      <div class="nav" role="tablist" aria-label="Primary">
        <a class="tab" data-tab="dashboard" href="./index.html" role="tab" aria-label="Dashboard" title="Dashboard" data-label="Dashboard">🏠</a>
        <a class="tab" data-tab="shows" href="./shows.html" role="tab" aria-label="Shows" title="Shows" data-label="Shows">📺</a>
        <a class="tab" data-tab="movies" href="./movies.html" role="tab" aria-label="Movies" title="Movies" data-label="Movies">🎞️</a>
        <a class="tab" data-tab="calendar" href="./calendar.html" role="tab" aria-label="Calendar" title="Calendar" data-label="Calendar">📅</a>
        <a class="tab" data-tab="discover" href="./discover.html" role="tab" aria-label="Discover" title="Discover" data-label="Discover">🔎</a>
        <a class="tab" data-tab="manage-watch-state" href="./manage_watch_state.html" role="tab" aria-label="Tracking" title="Tracking" data-label="Tracking">✅</a>
        <a id="mediaLibraryHeaderButton" class="tab media-library-view-icon" data-tab="media-library" href="./Media_Library.html" target="_blank" rel="noopener" role="tab" aria-selected="false" aria-label="Media Library" title="Media Library" data-label="Media Library">📚</a>
        <a class="tab" data-tab="config" href="./config.html" role="tab" aria-label="Config" title="Config" data-label="Config">⚙️</a>
        <a class="tab" data-tab="inputs-editor" href="./inputs_editor.html" role="tab" aria-label="Inputs Editor" title="Inputs Editor" data-label="Inputs Editor">🖥️</a>
      </div>
      <div class="status" aria-live="polite">
        <div id="statusDot" class="dot"></div>
        <span id="statusText">Loading</span>
        <button id="verBadge" class="calbtn" type="button" aria-label="Version">ver</button>
      </div>
    </div>
    <div class="shell shell--app">
      <main class="main" id="appMain"></main>
    </div>
    <div class="footer" id="footer"></div>
  </div>

  <div id="modalBack" class="app-modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true">
    <div id="modalCard" class="app-modal-card" tabindex="0">
      <div class="app-modal-header">
        <div id="modalTitle" class="app-modal-title">Details</div>
        <button id="modalClose" class="calbtn" type="button">Close</button>
      </div>
      <div id="modalBody" class="app-modal-body"></div>
    </div>
  </div>

  <div id="providerBack" class="app-modal-backdrop app-modal-backdrop--provider" aria-hidden="true" role="dialog" aria-modal="true">
    <div id="providerCard" class="app-modal-card app-modal-card--provider" tabindex="0">
      <div class="app-modal-header">
        <div id="providerTitle" class="app-modal-title">Providers</div>
        <button id="providerClose" class="calbtn" type="button">Close</button>
      </div>
      <div id="providerBody" class="app-modal-body"></div>
    </div>
  </div>

  <script src="./js/chrometv_focus.js?v=v1.5.8"></script>
  <script type="module" src="./js/app_runtime.js?v=v1.5.8"></script>
  <script src="./js/provider_popup_guard.js?v=v1.5.8" defer></script>
  <script src="./js/media_library_header_button.js?v=v1.5.8" defer></script>
</body>
</html>
