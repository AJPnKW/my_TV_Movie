<!--
File: /web/config.html
Project: my_TV_Movie
Version: v1.1.0 (2025-11-06)
Purpose: Static config page for GitHub Pages (no Flask). Shows last refresh and provides a link to run the Actions workflow.
ChangeLog:
- v1.1.0: Switch to static; display last_refresh.txt; add workflow link; Home→index.html.
- v1.0.0: Initial (Flask-based).
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Config · My TV Hub</title>
  <style>
    body{background:#0b0b0c;color:#f3f3f3;font:15px/1.45 system-ui,Segoe UI,Roboto,Arial;margin:0}
    .wrap{max-width:800px;margin:0 auto;padding:18px}
    .mut{color:#b9b9c2}
    a{color:#6ad1ff}
    pre{background:#13131a;padding:12px;border-radius:10px;overflow:auto}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Config</h1>
    <p>Last refresh: <span id="last"></span></p>
    <p><a href="https://github.com/AJPnKW/my_TV_Movie/actions/workflows/build-data.yml">Run data refresh</a> (GitHub login required)</p>
    <p class="mut">Return to <a href="index.html">Home</a> after the workflow completes.</p>
  </div>
  <script>
    async function fetchLast(){
      try{
        const r = await fetch('../data/last_refresh.txt', {cache:'no-cache'});
        if(r.ok){ document.getElementById('last').textContent = await r.text(); }
      }catch{}
    }
    fetchLast();
  </script>
</body>
</html>
