<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>My TV Hub - Config</title>
  <link rel="stylesheet" href="./css/my_tv_hub.css" />
  <link rel="stylesheet" href="./css/main_app.css" />
</head>
<body data-app-family="main" data-page="config" data-focus-global="off">
  <div class="app">
    <div class="top">
      <div class="brand">
        <div class="logo" aria-label="MY TV HUB"><div class="logo_txt"><div>MY TV</div><div>HUB</div></div></div>
      </div>
      <div class="nav" role="tablist" aria-label="Primary">
        <a class="tab" data-tab="dashboard" href="./index.html" role="tab" aria-selected="false">Dashboard</a>
        <a class="tab" data-tab="shows" href="./shows.html" role="tab" aria-selected="false">Shows</a>
        <a class="tab" data-tab="movies" href="./movies.html" role="tab" aria-selected="false">Movies</a>
        <a class="tab" data-tab="watch-me" href="./watch_me/watch_me.html" role="tab" aria-selected="false">Watch Me</a>
        <a class="tab" data-tab="calendar" href="./calendar.html" role="tab" aria-selected="false">Calendar</a>
        <a class="tab" data-tab="discover" href="./discover.html" role="tab" aria-selected="false">Discover</a>
        <a class="tab" data-tab="config" href="./config.html" role="tab" aria-selected="false">Config</a>
        <a class="tab" data-tab="inputs-editor" href="#inputs-editor" role="tab" aria-selected="false">Inputs Editor</a>
      </div>
      <div class="status" aria-live="polite">
        <div id="statusDot" class="dot"></div>
        <span id="statusText">Loading</span>
        <button id="verBadge" class="calbtn" type="button" aria-label="Version">ver</button>
      </div>
    </div>
    <div class="shell shell--app">
      <main class="main" id="appMain"></main>
    </div>
    <div class="footer" id="footer"></div>
  </div>

  <div id="modalBack" class="app-modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true">
    <div id="modalCard" class="app-modal-card" tabindex="0">
      <div class="app-modal-header">
        <div id="modalTitle" class="app-modal-title">Details</div>
        <button id="modalClose" class="calbtn" type="button">Close</button>
      </div>
      <div id="modalBody" class="app-modal-body"></div>
    </div>
  </div>

  <div id="providerBack" class="app-modal-backdrop app-modal-backdrop--provider" aria-hidden="true" role="dialog" aria-modal="true">
    <div id="providerCard" class="app-modal-card app-modal-card--provider" tabindex="0">
      <div class="app-modal-header">
        <div id="providerTitle" class="app-modal-title">Where to watch</div>
        <button id="providerClose" class="calbtn" type="button">Close</button>
      </div>
      <div id="providerBody" class="app-modal-body"></div>
    </div>
  </div>

  <script src="./js/chrometv_focus.js"></script>
  <script type="module" src="./js/app_runtime.js"></script>
</body>
</html>
