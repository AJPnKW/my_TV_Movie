<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Config · My TV Hub</title>
  <style>
    body{background:#0b0b0c;color:#f3f3f3;font:15px/1.45 system-ui,Segoe UI,Roboto,Arial;margin:0}
    .wrap{max-width:800px;margin:0 auto;padding:18px}
    button{padding:12px 16px;border-radius:10px;border:1px solid #333;background:#1e1e26;color:#e8f8ff;cursor:pointer}
    pre{background:#13131a;padding:12px;border-radius:10px;overflow:auto}
    a{color:#6ad1ff}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Config</h1>
    <p>Last refresh: <span id="last"></span></p>
    <button id="btn">Refresh Data (TMDB → data.json)</button>
    <p class="mut">After refresh, return to <a href="/">Home</a> and reload.</p>
    <pre id="log"></pre>
  </div>
  <script>
    async function fetchLast(){
      try{ const r = await fetch('/data/last_refresh.txt',{cache:'no-cache'}); if(r.ok){ document.getElementById('last').textContent = await r.text(); } }catch{}
    }
    async function refresh(){
      const log = document.getElementById('log');
      log.textContent = 'Running…';
      const r = await fetch('/api/refresh', {method:'POST'});
      const j = await r.json();
      log.textContent = JSON.stringify(j, null, 2);
      fetchLast();
    }
    document.getElementById('btn').addEventListener('click', refresh);
    fetchLast();
  </script>
</body>
</html>
