<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>My TV Hub — Config</title>
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#111826;
      --panel2:#0f1620;
      --text:#e8eef7;
      --muted:#b7c3d6;
      --line:rgba(255,255,255,0.10);
      --accent:#3b82f6;
      --ok:#22c55e;
      --bad:#ef4444;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:radial-gradient(1000px 700px at 15% -10%, rgba(59,130,246,0.12), transparent 55%),
                 radial-gradient(900px 700px at 105% 10%, rgba(34,197,94,0.10), transparent 60%),
                 var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      min-height:100vh;
      padding:16px;
    }
    .wrap{ max-width:1200px; margin:0 auto; }
    .top{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:10px 12px; border-radius:14px; border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      position:sticky; top:0; z-index:10; backdrop-filter: blur(8px);
    }
    .title{ font-weight:900; font-size:18px; }
    .actions{ display:flex; gap:8px; flex-wrap:wrap; }
    .btn{
      border:1px solid var(--line);
      background:rgba(255,255,255,0.06);
      color:var(--text);
      border-radius:999px;
      padding:8px 12px;
      font-weight:900;
      cursor:pointer;
    }
    .btn:disabled{ opacity:0.5; cursor:not-allowed; }
    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    summary:focus-visible{
      outline:none;
      box-shadow: var(--ring-focus);
    }
    .status{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
    .dot{ width:10px; height:10px; border-radius:50%; background:var(--bad); }
    .dot.ok{ background:var(--ok); }
    .grid{
      margin-top:12px;
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap:10px;
    }
    .card{
      border:1px solid var(--line);
      border-radius:14px;
      background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .path{ font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; color:#cbd5e1; }
    .label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.12em; }
    .input, textarea{
      width:100%;
      border:1px solid var(--line);
      background:rgba(255,255,255,0.04);
      color:var(--text);
      border-radius:10px;
      padding:8px 10px;
      font-family:inherit;
    }
    textarea{ min-height:96px; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; }
    .row{ display:flex; gap:8px; align-items:center; }
    .pill{ padding:2px 8px; border-radius:999px; font-size:10px; font-weight:800; border:1px solid var(--line); color:var(--muted); }
    .chip.sel,
    .chip.selected,
    .item.on,
    .selected{
      border-color: var(--c-border-strong);
      background: color-mix(in srgb, var(--c-accent) 12%, var(--c-surface-1));
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--c-accent) 30%, transparent);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="title">Config</div>
      <div class="actions">
        <button id="btnReload" class="btn" type="button">Reload</button>
        <button id="btnSave" class="btn" type="button">Save</button>
      </div>
      <div class="status"><span id="dot" class="dot"></span><span id="statusText">Idle</span></div>
    </div>
    <div id="cards" class="grid"></div>
  </div>

  <script>
    "use strict";
    const state = { config: {}, defaultConfig: {}, apiOk: false };
    const $ = (id) => document.getElementById(id);
    const safeText = (v) => (v == null ? "" : String(v));

    function setStatus(ok, msg){
      $("dot").className = "dot" + (ok ? " ok" : "");
      $("statusText").textContent = msg || "";
    }

    function applyUiPaletteFromConfig(cfg){
      try{
        const ui = cfg && typeof cfg === "object" ? cfg.ui_palette : null;
        if (!ui || typeof ui !== "object") return;
        const active = safeText(ui.active || "night_tv");
        const palettes = ui.palettes && typeof ui.palettes === "object" ? ui.palettes : null;
        const palette = palettes && palettes[active] ? palettes[active] : null;
        if (!palette || typeof palette !== "object") return;
        const tokens = palette.tokens && typeof palette.tokens === "object" ? palette.tokens : null;
        const derived = palette.derived && typeof palette.derived === "object" ? palette.derived : null;
        const root = document.documentElement;
        if (tokens){
          for (const [k, v] of Object.entries(tokens)){
            if (k && v != null) root.style.setProperty(`--${k}`, String(v));
          }
        }
        if (derived){
          for (const [k, v] of Object.entries(derived)){
            if (k && v != null) root.style.setProperty(`--${k}`, String(v));
          }
        }
        const alias = ui.alias_to_legacy_vars && typeof ui.alias_to_legacy_vars === "object" ? ui.alias_to_legacy_vars : null;
        if (alias){
          for (const [legacyVar, tokenKey] of Object.entries(alias)){
            if (!legacyVar || !tokenKey) continue;
            root.style.setProperty(`--${legacyVar}`, `var(--${tokenKey})`);
          }
        }
        const legacy = ui.legacy_vars && typeof ui.legacy_vars === "object" ? ui.legacy_vars : null;
        if (legacy){
          if (legacy.chip != null) root.style.setProperty("--chip", String(legacy.chip));
          if (legacy.chip2 != null) root.style.setProperty("--chip2", String(legacy.chip2));
        }
      }catch{}
    }

    async function fetchConfig(){
      try{
        const r = await fetch("/api/config", { cache: "no-store" });
        if (r.ok){
          const data = await r.json();
          state.apiOk = true;
          return data.config || {};
        }
      }catch{}
      state.apiOk = false;
      const r2 = await fetch("./config.json", { cache: "no-store" });
      if (!r2.ok) throw new Error("Failed to load config.json");
      return await r2.json();
    }

    function isPrimitive(v){
      return v == null || typeof v === "string" || typeof v === "number" || typeof v === "boolean";
    }

    function flatten(obj, prefix=""){
      const out = [];
      if (isPrimitive(obj)){
        out.push({ path: prefix || "(root)", value: obj, type: typeof obj });
        return out;
      }
      if (Array.isArray(obj)){
        out.push({ path: prefix, value: obj, type: "array" });
        return out;
      }
      for (const k of Object.keys(obj)){
        const v = obj[k];
        const p = prefix ? `${prefix}.${k}` : k;
        if (isPrimitive(v)){
          out.push({ path: p, value: v, type: typeof v });
        } else if (Array.isArray(v)){
          out.push({ path: p, value: v, type: "array" });
        } else {
          out.push({ path: p, value: v, type: "object" });
        }
      }
      return out;
    }

    function render(){
      const cards = $("cards");
      const rows = flatten(state.config);
      cards.innerHTML = rows.map(r => {
        const val = r.type === "object" || r.type === "array" ? JSON.stringify(r.value, null, 2) : String(r.value ?? "");
        const input = (r.type === "object" || r.type === "array")
          ? `<textarea data-path="${r.path}">${val}</textarea>`
          : `<input class="input" data-path="${r.path}" value="${val}" />`;
        return `
          <div class="card">
            <div class="row">
              <div class="path">${r.path}</div>
              <span class="pill">${r.type}</span>
            </div>
            <div class="label">Current / Default</div>
            ${input}
          </div>
        `;
      }).join("");
    }

    function setByPath(obj, path, value){
      if (!path || path === "(root)") return value;
      const parts = path.split(".");
      let cur = obj;
      for (let i=0;i<parts.length-1;i++){
        const k = parts[i];
        if (!cur[k] || typeof cur[k] !== "object") cur[k] = {};
        cur = cur[k];
      }
      cur[parts[parts.length-1]] = value;
      return obj;
    }

    function collectEdits(){
      const next = JSON.parse(JSON.stringify(state.config));
      document.querySelectorAll("[data-path]").forEach(el => {
        const path = el.getAttribute("data-path");
        const raw = el.value;
        let val = raw;
        if (el.tagName === "TEXTAREA"){
          try{ val = JSON.parse(raw); }catch{ val = raw; }
        } else if (raw === "true" || raw === "false"){
          val = raw === "true";
        } else if (!isNaN(Number(raw)) && raw.trim() !== ""){
          val = Number(raw);
        }
        setByPath(next, path, val);
      });
      return next;
    }

    async function load(){
      setStatus(false, "Loading...");
      state.config = await fetchConfig();
      state.defaultConfig = JSON.parse(JSON.stringify(state.config));
      applyUiPaletteFromConfig(state.config);
      render();
      setStatus(true, state.apiOk ? "Loaded (inputs editor API)" : "Loaded (read-only)");
      $("btnSave").disabled = !state.apiOk;
    }

    async function save(){
      if (!state.apiOk){
        setStatus(false, "Cannot save (inputs editor API not running)");
        return;
      }
      const next = collectEdits();
      const r = await fetch("/api/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(next)
      });
      if (!r.ok){
        setStatus(false, "Save failed");
        return;
      }
      setStatus(true, "Saved");
      state.config = next;
      applyUiPaletteFromConfig(state.config);
    }

    $("btnReload").addEventListener("click", load);
    $("btnSave").addEventListener("click", save);
    load().catch(e => setStatus(false, e.message || String(e)));
  </script>
</body>
</html>
