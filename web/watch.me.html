<!doctype html>
<!--
FILE: web/watch.me.html
VERSION: 1.0.0
UPDATED: 2026-04-03T00:00:00Z
CHANGE NOTES:
- Retired the legacy watch.me shell.
- Redirects all legacy watch links to the canonical watch_me.html page.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>My TV Hub - Watch Me Redirect</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./css/my_tv_hub.css" />
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:radial-gradient(1200px 800px at 20% -10%, rgba(59,130,246,0.14), transparent 55%),
                 radial-gradient(900px 700px at 110% 10%, rgba(34,197,94,0.10), transparent 60%),
                 #0b0f14;
      color:#e8eef7;
      font-family:"Space Grotesk","Avenir Next","Trebuchet MS",sans-serif;
    }
    .retired-card{
      width:min(760px, 100%);
      padding:24px;
      border-radius:24px;
      border:1px solid rgba(255,255,255,0.12);
      background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      box-shadow:0 20px 40px rgba(0,0,0,0.28);
    }
    h1{ margin:0 0 12px; font-size:32px; line-height:1.05; }
    p{ margin:0 0 12px; color:#b7c3d6; font-size:15px; line-height:1.5; }
    .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:42px;
      padding:0 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.14);
      background:rgba(255,255,255,0.08);
      color:#e8eef7;
      font-weight:800;
      text-decoration:none;
    }
    .btn.primary{
      background:#3b82f6;
      border-color:rgba(59,130,246,0.85);
      color:#0b0f14;
    }
  </style>
</head>
<body>
  <main class="retired-card">
    <h1>Legacy Watch Page Retired</h1>
    <p>The old <code>watch.me.html</code> path is no longer an active page shell.</p>
    <p>The canonical watch page is <strong><code>web/watch_me.html</code></strong>.</p>
    <p>You are being redirected automatically.</p>
    <div class="actions">
      <a id="watchRedirectLink" class="btn primary" href="./watch_me.html">Open Watch Me</a>
      <a class="btn" href="./index.html">Back To Dashboard</a>
    </div>
  </main>
  <script>
    (function () {
      var target = "./watch_me.html" + (window.location.search || "") + (window.location.hash || "");
      var link = document.getElementById("watchRedirectLink");
      if (link) link.href = target;
      window.location.replace(target);
    })();
  </script>
  <script src="./js/provider_popup_guard.js" defer></script>
  <script src="./js/media_library_header_button.js" defer></script>
</body>
</html>
