<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My TV & Movie Hub — Watchlist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Core stylesheet (matches v3.3.5 visual style as close as possible) -->
  <link rel="stylesheet" href="css/my_tv_hub.css" />

  <style>
    /* ===========================
       Layout & Page Structure
       =========================== */

    :root {
      --bg-main: #05060b;
      --bg-elevated: #0b0d18;
      --bg-elevated-soft: #111425;
      --bg-elevated-softer: #15182a;
      --accent: #ff3366;
      --accent-soft: rgba(255, 51, 102, 0.3);
      --accent-strong: #ff4b7d;
      --text-main: #f5f5f7;
      --text-muted: #a3a6b8;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.65);
      --radius-xl: 18px;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-pill: 999px;
      --transition-fast: 0.18s ease-out;
      --transition-med: 0.24s ease-out;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #14172a 0%, #05060b 55%, #020308 100%);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .page-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 16px 48px;
    }

    @media (min-width: 1024px) {
      .page-shell {
        padding: 24px 24px 60px;
      }
    }

    /* ===========================
       Top Navigation / Header
       =========================== */

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 12px;
    }

    .app-title-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .app-title {
      font-size: 1.5rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-title-accent {
      font-size: 0.92rem;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: linear-gradient(135deg, rgba(255, 51, 102, 0.12), rgba(113, 89, 193, 0.14));
      color: var(--text-muted);
      border: 1px solid rgba(255, 51, 102, 0.45);
    }

    .app-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .app-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill-meta {
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: rgba(5, 6, 11, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent-strong);
      box-shadow: 0 0 6px rgba(255, 51, 102, 0.8);
    }

    /* ===========================
       Controls (Sorting + Filtering)
       =========================== */

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
      background: radial-gradient(circle at top left, rgba(255, 51, 102, 0.16) 0%, transparent 45%),
        radial-gradient(circle at bottom right, rgba(60, 90, 255, 0.18) 0%, transparent 55%),
        rgba(5, 6, 11, 0.94);
      border-radius: var(--radius-xl);
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: var(--shadow-soft);
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(16px);
    }

    @media (min-width: 768px) {
      .controls-bar {
        padding: 12px 16px;
      }
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .controls-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .select-control {
      background: rgba(11, 13, 24, 0.9);
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 10px;
      color: var(--text-main);
      font-size: 0.82rem;
      min-width: 140px;
      outline: none;
      cursor: pointer;
      appearance: none;
      position: relative;
    }

    .select-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .select-wrapper::after {
      content: "▾";
      position: absolute;
      right: 10px;
      font-size: 0.7rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .status-filter-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .status-pill {
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(11, 13, 24, 0.92);
      color: var(--text-muted);
      cursor: pointer;
      transition: background var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast),
        transform var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-pill span.dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--text-muted);
      opacity: 0.7;
    }

    .status-pill.active {
      background: linear-gradient(135deg, rgba(255, 51, 102, 0.2), rgba(60, 90, 255, 0.2));
      border-color: var(--accent-strong);
      color: var(--text-main);
      transform: translateY(-1px);
    }

    .status-pill.active span.dot {
      background: #7ef29d;
      opacity: 1;
      box-shadow: 0 0 6px rgba(126, 242, 157, 0.9);
    }

    /* ===========================
       Watchlist Container
       =========================== */

    .watchlist-container {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ===========================
       Show Card (Collapsed)
       =========================== */

    .show-card {
      border-radius: var(--radius-xl);
      background: radial-gradient(circle at top left, rgba(255, 51, 102, 0.12) 0%, transparent 48%),
        radial-gradient(circle at bottom right, rgba(60, 90, 255, 0.18) 0%, transparent 58%),
        rgba(7, 9, 18, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      transition: transform var(--transition-med), box-shadow var(--transition-med), border-color var(--transition-med);
      position: relative;
    }

    .show-card.collapsed:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.85);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .show-card-header {
      display: flex;
      gap: 12px;
      padding: 10px 10px;
      align-items: center;
    }

    @media (min-width: 768px) {
      .show-card-header {
        padding: 12px 14px;
      }
    }

    .show-poster-thumb {
      width: 60px;
      min-width: 60px;
      height: 90px;
      border-radius: var(--radius-md);
      background: #151728;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.85);
    }

    .show-poster-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .show-card-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .show-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: space-between;
    }

    .show-title {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .network-logo {
      max-height: 20px;
      max-width: 70px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.7));
    }

    .show-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .status-badge {
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(5, 6, 11, 0.95);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
    }

    .status-active .status-dot {
      background: #7ef29d;
      box-shadow: 0 0 6px rgba(126, 242, 157, 0.9);
    }

    .status-ended .status-dot {
      background: #ff6b6b;
      box-shadow: 0 0 6px rgba(255, 107, 107, 0.9);
    }

    .status-upcoming .status-dot {
      background: #ffd166;
      box-shadow: 0 0 6px rgba(255, 209, 102, 0.9);
    }

    .status-hiatus .status-dot {
      background: #60a5fa;
      box-shadow: 0 0 6px rgba(96, 165, 250, 0.9);
    }

    .show-compact-meta-pill {
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: rgba(10, 12, 24, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.72rem;
    }

    .show-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px 10px;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    @media (min-width: 768px) {
      .show-card-footer {
        padding: 0 14px 12px;
      }
    }

    .small-label {
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    .expand-toggle-btn {
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: linear-gradient(135deg, rgba(255, 51, 102, 0.24), rgba(60, 90, 255, 0.24));
      color: var(--text-main);
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: background var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.9);
    }

    .expand-toggle-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.95);
    }

    .expand-toggle-btn span.icon {
      font-size: 0.9rem;
    }

    /* ===========================
       Expanded Show View
       =========================== */

    .show-card.expanded {
      border-radius: 20px;
      overflow: hidden;
    }

    .show-expanded {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      background: radial-gradient(circle at top, rgba(255, 51, 102, 0.18) 0%, rgba(5, 6, 11, 0.98) 52%, #05060b 100%);
      position: relative;
    }

    .show-hero {
      position: sticky;
      top: 52px; /* below controls bar */
      z-index: 10;
      height: 220px;
      max-height: 260px;
      overflow: hidden;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      background: #05060b;
    }

    @media (min-width: 992px) {
      .show-hero {
        height: 260px;
      }
    }

    .show-hero-backdrop-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .show-hero-backdrop {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.06);
      filter: saturate(1.1) contrast(1.05) brightness(0.9);
      opacity: 0.85;
    }

    .show-hero-gradient {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(0, 0, 0, 0.2) 0%, rgba(5, 6, 12, 0.95) 70%, rgba(5, 6, 12, 1) 100%),
        radial-gradient(circle at top left, rgba(255, 51, 102, 0.5) 0%, transparent 55%),
        radial-gradient(circle at top right, rgba(60, 90, 255, 0.4) 0%, transparent 60%);
      mix-blend-mode: normal;
    }

    .show-hero-content {
      position: relative;
      height: 100%;
      display: flex;
      align-items: flex-end;
      padding: 10px 10px 14px;
      gap: 10px;
    }

    @media (min-width: 768px) {
      .show-hero-content {
        padding: 14px 18px 16px;
      }
    }

    .show-hero-poster {
      width: 75px;
      min-width: 75px;
      height: 112px;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.95);
      background: #151728;
    }

    .show-hero-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .show-hero-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .show-hero-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .show-hero-title {
      font-size: 1.25rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.85);
    }

    .show-hero-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status-badge.hero {
      background: rgba(5, 6, 11, 0.9);
      border-color: rgba(255, 255, 255, 0.24);
    }

    .network-logo-hero {
      max-height: 22px;
      max-width: 90px;
      object-fit: contain;
      filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.9));
    }

    .show-hero-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .pill {
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      background: rgba(5, 6, 15, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .pill-label {
      text-transform: uppercase;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    .pill-text {
      font-size: 0.76rem;
    }

    /* ===========================
       Expanded Body (Overview + Details)
       =========================== */

    .show-expanded-body {
      padding: 12px 10px 16px;
    }

    @media (min-width: 768px) {
      .show-expanded-body {
        padding: 16px 18px 20px;
      }
    }

    .show-overview {
      margin-bottom: 10px;
      color: var(--text-main);
      font-size: 0.9rem;
      line-height: 1.4;
      max-width: 80ch;
    }

    .chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .chip {
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      background: rgba(10, 12, 24, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.09);
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .streaming-links-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .streaming-btn {
      padding: 6px 11px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(10, 12, 24, 0.96);
      color: var(--text-main);
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast),
        box-shadow var(--transition-fast);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.9);
    }

    .streaming-btn:hover {
      background: linear-gradient(135deg, rgba(255, 51, 102, 0.22), rgba(60, 90, 255, 0.22));
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.95);
    }

    .streaming-btn img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      border-radius: 4px;
      background: #05060b;
    }

    .streaming-btn-label-main {
      font-weight: 500;
      font-size: 0.82rem;
    }

    .streaming-btn-label-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* ===========================
       Seasons & Episodes
       =========================== */

    .sections-row {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(0, 2.5fr);
      gap: 14px;
      align-items: flex-start;
    }

    @media (max-width: 900px) {
      .sections-row {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .section-panel {
      background: rgba(10, 12, 24, 0.97);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85);
    }

    .section-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
    }

    .section-subtitle {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .accordion-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .season-card,
    .episode-card {
      border-radius: var(--radius-md);
      background: rgba(5, 6, 14, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      transition: background var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
    }

    .season-card-header,
    .episode-card-header {
      padding: 7px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }

    .season-left,
    .episode-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .season-title-row,
    .episode-title-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }

    .season-number,
    .episode-number {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .season-name,
    .episode-name {
      font-size: 0.88rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .season-meta-row,
    .episode-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .accordion-chevron {
      font-size: 0.8rem;
      color: var(--text-muted);
      transition: transform var(--transition-fast), color var(--transition-fast);
    }

    .season-card.expanded .accordion-chevron,
    .episode-card.expanded .accordion-chevron {
      transform: rotate(180deg);
      color: var(--text-main);
    }

    .season-card.expanded,
    .episode-card.expanded {
      border-color: rgba(255, 255, 255, 0.24);
      background: radial-gradient(circle at top left, rgba(255, 51, 102, 0.14) 0%, transparent 55%),
        rgba(5, 6, 14, 0.98);
      transform: translateY(-1px);
    }

    .season-body,
    .episode-body {
      padding: 8px 10px 9px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.8rem;
      color: var(--text-main);
    }

    .season-overview,
    .episode-overview {
      font-size: 0.82rem;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .season-meta-inline,
    .episode-meta-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .inline-label {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .inline-value {
      font-size: 0.8rem;
    }

    .episode-streaming-row {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* ===========================
       Empty / Error States
       =========================== */

    .empty-state {
      padding: 18px 14px;
      border-radius: var(--radius-xl);
      border: 1px dashed rgba(255, 255, 255, 0.22);
      background: rgba(5, 6, 14, 0.96);
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.88rem;
    }

    .empty-title {
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .error-text {
      color: #ffb4b4;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="app-header">
      <div class="app-title-block">
        <div class="app-title">
          My TV & Movie Hub
          <span class="app-title-accent">Watchlist</span>
        </div>
        <div class="app-subtitle">
          Focused view of shows you actually care about — with the full details UI you liked.
        </div>
      </div>
      <div class="app-meta">
        <div class="pill-meta">
          <span class="pill-dot"></span>
          <span>Standalone page · Non‑SPA</span>
        </div>
        <div class="pill-meta" id="watchlist-count-pill">
          <span>Loading watchlist…</span>
        </div>
      </div>
    </header>

    <!-- Controls: Sorting + Filtering -->
    <section class="controls-bar">
      <div class="controls-group">
        <span class="controls-label">Sort</span>
        <div class="select-wrapper">
          <select id="sort-select" class="select-control">
            <option value="title-asc">A → Z (Title)</option>
            <option value="title-desc">Z → A (Title)</option>
            <option value="last-season-desc">Last Season (Newest → Oldest)</option>
            <option value="last-season-asc">Last Season (Oldest → Newest)</option>
            <option value="last-episode-desc">Last Episode (Newest → Oldest)</option>
            <option value="last-episode-asc">Last Episode (Oldest → Newest)</option>
          </select>
        </div>
      </div>

      <div class="controls-group">
        <span class="controls-label">Status</span>
        <div class="status-filter-pills" id="status-filter-pills">
          <button class="status-pill active" data-status="ALL">
            <span class="dot"></span>
            <span>All</span>
          </button>
          <button class="status-pill" data-status="ACTIVE">
            <span class="dot"></span>
            <span>Active</span>
          </button>
          <button class="status-pill" data-status="HIATUS">
            <span class="dot"></span>
            <span>Hiatus</span>
          </button>
          <button class="status-pill" data-status="UPCOMING">
            <span class="dot"></span>
            <span>Upcoming</span>
          </button>
          <button class="status-pill" data-status="ENDED">
            <span class="dot"></span>
            <span>Ended</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Watchlist Container -->
    <main class="watchlist-container" id="watchlist-container">
      <div class="empty-state" id="initial-message">
        <div class="empty-title">Loading your watchlist…</div>
        <div>Fetching shows from <code>data/data.json</code> and filtering to items marked as watchlisted.</div>
      </div>
    </main>
  </div>

  <script>
    // ===========================
    // Utility functions
    // ===========================

    function parseDate(dateStr) {
      if (!dateStr) return null;
      const d = new Date(dateStr);
      return isNaN(d.getTime()) ? null : d;
    }

    function formatDate(dateStr) {
      const d = parseDate(dateStr);
      if (!d) return "Unknown date";
      return d.toLocaleDateString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric"
      });
    }

    function safeText(value, fallback = "Unknown") {
      if (value === null || value === undefined) return fallback;
      if (typeof value === "string" && value.trim() === "") return fallback;
      return value;
    }

    function createEl(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined && text !== null) el.textContent = text;
      return el;
    }

    // ===========================
    // Global State
    // ===========================

    const state = {
      allShows: [],
      filteredShows: [],
      currentStatusFilter: "ALL",
      currentSort: "title-asc"
    };

    const watchlistContainer = document.getElementById("watchlist-container");
    const statusPills = document.getElementById("status-filter-pills");
    const sortSelect = document.getElementById("sort-select");
    const watchlistCountPill = document.getElementById("watchlist-count-pill");
    const initialMessage = document.getElementById("initial-message");

    // ===========================
    // Data Loading
    // ===========================

    async function loadData() {
      try {
        const res = await fetch("data/data.json", { cache: "no-cache" });
        if (!res.ok) throw new Error("Failed to load data.json");
        const data = await res.json();

        // Expecting data.shows[]; adjust if your structure differs
        const shows = Array.isArray(data) ? data : data.shows || [];

        // Filter to watchlisted shows
        state.allShows = shows.filter((show) => show && show.is_watchlisted);
        updateWatchlistCount();
        applyFiltersAndSort();
      } catch (err) {
        console.error("Error loading data.json:", err);
        renderErrorState(err);
      }
    }

    function updateWatchlistCount() {
      if (!watchlistCountPill) return;
      const count = state.allShows.length;
      watchlistCountPill.innerHTML = "";
      const label = document.createElement("span");
      label.textContent =
        count === 0 ? "No watchlisted shows found" : `${count} watchlisted show${count === 1 ? "" : "s"}`;
      watchlistCountPill.appendChild(label);
    }

    // ===========================
    // Filtering & Sorting
    // ===========================

    function applyFiltersAndSort() {
      const { allShows, currentStatusFilter, currentSort } = state;
      let list = [...allShows];

      // Filter by status
      if (currentStatusFilter !== "ALL") {
        list = list.filter((show) => String(show.status || "").toUpperCase() === currentStatusFilter);
      }

      // Sort
      list.sort((a, b) => compareShows(a, b, currentSort));

      state.filteredShows = list;
      renderWatchlist();
    }

    function compareShows(a, b, sortKey) {
      const titleA = (a.title || a.name || "").toLowerCase();
      const titleB = (b.title || b.name || "").toLowerCase();

      const lastSeasonA = parseDate(a.last_season_air_date || a.lastSeasonAirDate);
      const lastSeasonB = parseDate(b.last_season_air_date || b.lastSeasonAirDate);

      const lastEpisodeA = parseDate(a.last_episode_air_date || a.lastEpisodeAirDate);
      const lastEpisodeB = parseDate(b.last_episode_air_date || b.lastEpisodeAirDate);

      switch (sortKey) {
        case "title-desc":
          if (titleA < titleB) return 1;
          if (titleA > titleB) return -1;
          return 0;
        case "last-season-desc":
          if (lastSeasonA && lastSeasonB) return lastSeasonB - lastSeasonA;
          if (lastSeasonA) return -1;
          if (lastSeasonB) return 1;
          return 0;
        case "last-season-asc":
          if (lastSeasonA && lastSeasonB) return lastSeasonA - lastSeasonB;
          if (lastSeasonA) return 1;
          if (lastSeasonB) return -1;
          return 0;
        case "last-episode-desc":
          if (lastEpisodeA && lastEpisodeB) return lastEpisodeB - lastEpisodeA;
          if (lastEpisodeA) return -1;
          if (lastEpisodeB) return 1;
          return 0;
        case "last-episode-asc":
          if (lastEpisodeA && lastEpisodeB) return lastEpisodeA - lastEpisodeB;
          if (lastEpisodeA) return 1;
          if (lastEpisodeB) return -1;
          return 0;
        case "title-asc":
        default:
          if (titleA < titleB) return -1;
          if (titleA > titleB) return 1;
          return 0;
      }
    }

    // ===========================
    // Render: Watchlist
    // ===========================

    function renderWatchlist() {
      if (initialMessage) initialMessage.remove();
      watchlistContainer.innerHTML = "";

      if (state.filteredShows.length === 0) {
        const empty = createEl("div", "empty-state");
        const title = createEl("div", "empty-title", "Nothing matches your filters yet.");
        const text = createEl(
          "div",
          null,
          "Try changing the status filters or confirm that your data.json has is_watchlisted set correctly."
        );
        empty.appendChild(title);
        empty.appendChild(text);
        watchlistContainer.appendChild(empty);
        return;
      }

      state.filteredShows.forEach((show) => {
        const card = renderShowCard(show);
        watchlistContainer.appendChild(card);
      });
    }

    // ===========================
    // Render: Show Card
    // ===========================

    function renderShowCard(show) {
      const card = createEl("article", "show-card collapsed");
      card.dataset.showId = show.id;

      // Collapsed header
      const header = createEl("div", "show-card-header");

      // Poster
      const posterWrap = createEl("div", "show-poster-thumb");
      const posterImg = document.createElement("img");
      posterImg.alt = safeText(show.title || show.name, "Poster");
      posterImg.src = show.poster_path_local || show.posterLocal || "assets/posters/placeholder_poster.jpg";
      posterWrap.appendChild(posterImg);

      // Main text
      const main = createEl("div", "show-card-main");

      const titleRow = createEl("div", "show-title-row");
      const title = createEl("div", "show-title", safeText(show.title || show.name, "Untitled show"));
      titleRow.appendChild(title);

      if (show.network_logo_local || show.networkLogoLocal) {
        const logo = document.createElement("img");
        logo.className = "network-logo";
        logo.alt = "Network logo";
        logo.src = show.network_logo_local || show.networkLogoLocal;
        titleRow.appendChild(logo);
      }

      main.appendChild(titleRow);

      const metaRow = createEl("div", "show-meta-row");

      // Status badge
      const statusText = String(show.status || "UNKNOWN").toUpperCase();
      const statusBadge = createEl("div", "status-badge");
      const statusDot = createEl("span", "status-dot");
      const statusLabel = createEl("span", null, statusText);

      switch (statusText) {
        case "ACTIVE":
          statusBadge.classList.add("status-active");
          break;
        case "ENDED":
          statusBadge.classList.add("status-ended");
          break;
        case "UPCOMING":
          statusBadge.classList.add("status-upcoming");
          break;
        case "HIATUS":
          statusBadge.classList.add("status-hiatus");
          break;
      }

      statusBadge.appendChild(statusDot);
      statusBadge.appendChild(statusLabel);
      metaRow.appendChild(statusBadge);

      // Last Episode / Season
      const lastEpisodeDate = show.last_episode_air_date || show.lastEpisodeAirDate;
      const lastSeasonDate = show.last_season_air_date || show.lastSeasonAirDate;

      if (lastEpisodeDate) {
        const lastEpisodePill = createEl(
          "div",
          "show-compact-meta-pill",
          `Last ep: ${formatDate(lastEpisodeDate)}`
        );
        metaRow.appendChild(lastEpisodePill);
      }

      if (lastSeasonDate) {
        const lastSeasonPill = createEl(
          "div",
          "show-compact-meta-pill",
          `Last season: ${formatDate(lastSeasonDate)}`
        );
        metaRow.appendChild(lastSeasonPill);
      }

      // Year / Seasons count
      if (show.first_air_date || show.firstAirDate) {
        const year = formatDate(show.first_air_date || show.firstAirDate).split(" ").pop();
        const pill = createEl("div", "show-compact-meta-pill", `Started: ${year}`);
        metaRow.appendChild(pill);
      }

      if (Array.isArray(show.seasons)) {
        const seasonCount = show.seasons.filter((s) => s && s.season_number > 0).length;
        if (seasonCount > 0) {
          const pill = createEl("div", "show-compact-meta-pill", `${seasonCount} season${seasonCount === 1 ? "" : "s"}`);
          metaRow.appendChild(pill);
        }
      }

      main.appendChild(metaRow);

      // Footer
      const footer = createEl("div", "show-card-footer");
      const leftFooter = createEl("div", null);
      const label = createEl("div", "small-label", "Details view");
      const hint = createEl("div", null, "Expand for seasons, episodes, and streaming links");
      leftFooter.appendChild(label);
      leftFooter.appendChild(hint);

      const expandBtn = createEl("button", "expand-toggle-btn");
      const expandIcon = createEl("span", "icon", "▾");
      const expandLabel = createEl("span", null, "Expand");
      expandBtn.appendChild(expandIcon);
      expandBtn.appendChild(expandLabel);

      footer.appendChild(leftFooter);
      footer.appendChild(expandBtn);

      header.appendChild(posterWrap);
      header.appendChild(main);

      card.appendChild(header);
      card.appendChild(footer);

      // Expanded container (initially empty)
      const expanded = createEl("div", "show-expanded");
      expanded.style.display = "none";
      card.appendChild(expanded);

      // Toggle handler
      expandBtn.addEventListener("click", () => toggleShowCard(card, show));
      header.addEventListener("click", (e) => {
        if (e.target.closest(".expand-toggle-btn")) return;
        toggleShowCard(card, show);
      });

      return card;
    }

    // ===========================
    // Expand / Collapse
    // ===========================

    function toggleShowCard(card, show) {
      const isExpanded = card.classList.contains("expanded");
      const expandedEl = card.querySelector(".show-expanded");
      const button = card.querySelector(".expand-toggle-btn");
      const icon = button.querySelector(".icon");
      const label = button.querySelector("span:not(.icon)");

      if (isExpanded) {
        card.classList.remove("expanded");
        card.classList.add("collapsed");
        expandedEl.style.display = "none";
        icon.textContent = "▾";
        label.textContent = "Expand";
      } else {
        card.classList.remove("collapsed");
        card.classList.add("expanded");
        expandedEl.style.display = "block";
        icon.textContent = "▴";
        label.textContent = "Collapse";
        if (!expandedEl.dataset.initialized) {
          renderExpandedShow(expandedEl, show);
          expandedEl.dataset.initialized = "true";
        }
      }
    }

    // ===========================
    // Render: Expanded Show
    // ===========================

    function renderExpandedShow(container, show) {
      container.innerHTML = "";

      // HERO
      const hero = createEl("div", "show-hero");
      const backdropWrap = createEl("div", "show-hero-backdrop-wrap");
      const backdropImg = document.createElement("img");
      backdropImg.className = "show-hero-backdrop";
      backdropImg.src =
        show.backdrop_path_local || show.backdropLocal || "assets/backdrops/shows/placeholder_backdrop.jpg";
      backdropImg.alt = safeText(show.title || show.name, "Backdrop");
      backdropWrap.appendChild(backdropImg);

      const gradient = createEl("div", "show-hero-gradient");
      hero.appendChild(backdropWrap);
      hero.appendChild(gradient);

      const heroContent = createEl("div", "show-hero-content");

      const posterWrap = createEl("div", "show-hero-poster");
      const posterImg = document.createElement("img");
      posterImg.src = show.poster_path_local || show.posterLocal || "assets/posters/placeholder_poster.jpg";
      posterImg.alt = safeText(show.title || show.name, "Poster");
      posterWrap.appendChild(posterImg);

      const heroMain = createEl("div", "show-hero-main");

      const titleRow = createEl("div", "show-hero-title-row");
      const title = createEl("div", "show-hero-title", safeText(show.title || show.name, "Untitled show"));
      titleRow.appendChild(title);

      const badgesRow = createEl("div", "show-hero-badges");

      // Status badge
      const status = String(show.status || "UNKNOWN").toUpperCase();
      const statusBadge = createEl("div", "status-badge hero");
      const statusDot = createEl("span", "status-dot");
      const statusLabel = createEl("span", null, status);

      switch (status) {
        case "ACTIVE":
          statusBadge.classList.add("status-active");
          break;
        case "ENDED":
          statusBadge.classList.add("status-ended");
          break;
        case "UPCOMING":
          statusBadge.classList.add("status-upcoming");
          break;
        case "HIATUS":
          statusBadge.classList.add("status-hiatus");
          break;
      }

      statusBadge.appendChild(statusDot);
      statusBadge.appendChild(statusLabel);
      badgesRow.appendChild(statusBadge);

      // Network logo (hero)
      if (show.network_logo_local || show.networkLogoLocal) {
        const logo = document.createElement("img");
        logo.className = "network-logo-hero";
        logo.alt = "Network logo";
        logo.src = show.network_logo_local || show.networkLogoLocal;
        badgesRow.appendChild(logo);
      }

      titleRow.appendChild(badgesRow);
      heroMain.appendChild(titleRow);

      // Hero meta (years, seasons, episodes)
      const metaRow = createEl("div", "show-hero-meta-row");

      // Years
      const firstAir = show.first_air_date || show.firstAirDate;
      const lastAir = show.last_episode_air_date || show.lastEpisodeAirDate;

      if (firstAir || lastAir) {
        const pill = createEl("div", "pill");
        const label = createEl("span", "pill-label", "Run");
        const value = createEl("span", "pill-text");
        const firstYear = firstAir ? formatDate(firstAir).split(" ").pop() : "?";
        const lastYear = lastAir ? formatDate(lastAir).split(" ").pop() : "?";
        value.textContent = firstYear === lastYear ? firstYear : `${firstYear} – ${lastYear}`;
        pill.appendChild(label);
        pill.appendChild(value);
        metaRow.appendChild(pill);
      }

      // Seasons / Episodes count from data, if present
      if (Array.isArray(show.seasons)) {
        const seasonCount = show.seasons.filter((s) => s && s.season_number > 0).length;
        if (seasonCount > 0) {
          const pill = createEl("div", "pill");
          pill.appendChild(createEl("span", "pill-label", "Seasons"));
          pill.appendChild(createEl("span", "pill-text", `${seasonCount}`));
          metaRow.appendChild(pill);
        }
      }

      if (typeof show.episode_count === "number" || typeof show.total_episodes === "number") {
        const episodeCount = show.episode_count ?? show.total_episodes;
        const pill = createEl("div", "pill");
        pill.appendChild(createEl("span", "pill-label", "Episodes"));
        pill.appendChild(createEl("span", "pill-text", `${episodeCount}`));
        metaRow.appendChild(pill);
      }

      heroMain.appendChild(metaRow);

      heroContent.appendChild(posterWrap);
      heroContent.appendChild(heroMain);
      hero.appendChild(heroContent);

      container.appendChild(hero);

      // Expanded body: overview + sections
      const body = createEl("div", "show-expanded-body");

      // Overview
      if (show.overview) {
        const overview = createEl("div", "show-overview", show.overview);
        body.appendChild(overview);
      }

      // Genres + other chips
      const chipsRow = createEl("div", "chips-row");

      if (Array.isArray(show.genres) && show.genres.length > 0) {
        show.genres.forEach((g) => {
          const chip = createEl("div", "chip", g);
          chipsRow.appendChild(chip);
        });
      }

      if (show.origin_country || show.country) {
        const chip = createEl("div", "chip", `Country: ${show.origin_country || show.country}`);
        chipsRow.appendChild(chip);
      }

      if (show.network_name || show.network) {
        const chip = createEl("div", "chip", `Network: ${show.network_name || show.network}`);
        chipsRow.appendChild(chip);
      }

      if (chipsRow.childElementCount > 0) {
        body.appendChild(chipsRow);
      }

      // Streaming links (show-level)
      if (Array.isArray(show.streaming_links) && show.streaming_links.length > 0) {
        const streamingRow = createEl("div", "streaming-links-row");
        show.streaming_links.forEach((link) => {
          const btn = renderStreamingButton(link);
          streamingRow.appendChild(btn);
        });
        body.appendChild(streamingRow);
      }

      // Seasons + Episodes layout
      const sectionsRow = createEl("div", "sections-row");

      // Seasons panel
      const seasonsPanel = createEl("div", "section-panel");
      const seasonTitleRow = createEl("div", "section-title-row");
      const seasonTitle = createEl("div", "section-title", "Seasons");
      const seasonSub = createEl("div", "section-subtitle", "Expand a season to see episodes.");
      seasonTitleRow.appendChild(seasonTitle);
      seasonTitleRow.appendChild(seasonSub);
      seasonsPanel.appendChild(seasonTitleRow);

      const seasonList = createEl("div", "accordion-list");

      const seasons = Array.isArray(show.seasons) ? show.seasons.slice() : [];
      seasons.sort((a, b) => (a.season_number || 0) - (b.season_number || 0));
      const validSeasons = seasons.filter((s) => s && s.season_number > 0);

      if (validSeasons.length === 0) {
        const emptyText = createEl("div", "section-subtitle", "No seasons available for this show.");
        seasonList.appendChild(emptyText);
      } else {
        validSeasons.forEach((season) => {
          const seasonCard = renderSeasonCard(season);
          seasonList.appendChild(seasonCard);
        });
      }

      seasonsPanel.appendChild(seasonList);
      sectionsRow.appendChild(seasonsPanel);

      // Episodes panel
      const episodesPanel = createEl("div", "section-panel");
      const epTitleRow = createEl("div", "section-title-row");
      const epTitle = createEl("div", "section-title", "Episodes");
      const epSub = createEl("div", "section-subtitle", "Expand a season on the left to populate this list.");
      epTitleRow.appendChild(epTitle);
      epTitleRow.appendChild(epSub);
      episodesPanel.appendChild(epTitleRow);

      const episodesList = createEl("div", "accordion-list");
      episodesList.id = `episodes-list-${show.id || Math.random().toString(36).slice(2)}`;
      episodesPanel.appendChild(episodesList);

      sectionsRow.appendChild(episodesPanel);

      body.appendChild(sectionsRow);
      container.appendChild(body);

      // Attach season click to populate episodes panel
      seasonsPanel.querySelectorAll(".season-card-header").forEach((headerEl) => {
        headerEl.addEventListener("click", () => {
          const card = headerEl.parentElement;
          const seasonNumber = card.dataset.seasonNumber ? parseInt(card.dataset.seasonNumber, 10) : null;
          toggleSeasonCard(card);
          populateEpisodesForSeason(show, seasonNumber, episodesList);
        });
      });
    }

    // ===========================
    // Render: Streaming Button
    // ===========================

    function renderStreamingButton(link) {
      const btn = createEl("a", "streaming-btn");
      btn.href = link.url || link.href || "#";
      btn.target = "_blank";
      btn.rel = "noopener noreferrer";

      if (link.icon_local || link.iconLocal) {
        const icon = document.createElement("img");
        icon.src = link.icon_local || link.iconLocal;
        icon.alt = link.service || link.name || "Service";
        btn.appendChild(icon);
      }

      const labelsWrap = createEl("div", null);
      const main = createEl("div", "streaming-btn-label-main", link.service || link.name || "Watch");
      const sub = createEl("div", "streaming-btn-label-sub", link.type || "Streaming");
      labelsWrap.appendChild(main);
      labelsWrap.appendChild(sub);

      btn.appendChild(labelsWrap);
      return btn;
    }

    // ===========================
    // Render: Season Card
    // ===========================

    function renderSeasonCard(season) {
      const card = createEl("div", "season-card");
      card.dataset.seasonNumber = season.season_number;

      const header = createEl("div", "season-card-header");
      const left = createEl("div", "season-left");

      const titleRow = createEl("div", "season-title-row");
      const num = createEl("div", "season-number", `S${season.season_number}`);
      const name = createEl("div", "season-name", season.name || `Season ${season.season_number}`);
      titleRow.appendChild(num);
      titleRow.appendChild(name);

      const metaRow = createEl("div", "season-meta-row");
      if (season.air_date || season.airDate) {
        const span = createEl("span", null, `First aired: ${formatDate(season.air_date || season.airDate)}`);
        metaRow.appendChild(span);
      }
      if (season.episode_count != null) {
        const span = createEl("span", null, `${season.episode_count} episode${season.episode_count === 1 ? "" : "s"}`);
        metaRow.appendChild(span);
      }

      left.appendChild(titleRow);
      left.appendChild(metaRow);

      const chevron = createEl("div", "accordion-chevron", "▾");

      header.appendChild(left);
      header.appendChild(chevron);
      card.appendChild(header);

      const body = createEl("div", "season-body");
      body.style.display = "none";

      if (season.overview) {
        const overview = createEl("div", "season-overview", season.overview);
        body.appendChild(overview);
      }

      const metaInline = createEl("div", "season-meta-inline");

      if (season.air_date || season.airDate) {
        const block = createEl("div", null);
        const label = createEl("span", "inline-label", "First aired");
        const value = createEl("span", "inline-value", formatDate(season.air_date || season.airDate));
        block.appendChild(label);
        block.appendChild(document.createTextNode(" "));
        block.appendChild(value);
        metaInline.appendChild(block);
      }

      if (season.last_air_date || season.lastAirDate) {
        const block = createEl("div", null);
        const label = createEl("span", "inline-label", "Last aired");
        const value = createEl("span", "inline-value", formatDate(season.last_air_date || season.lastAirDate));
        block.appendChild(label);
        block.appendChild(document.createTextNode(" "));
        block.appendChild(value);
        metaInline.appendChild(block);
      }

      if (metaInline.childElementCount > 0) {
        body.appendChild(metaInline);
      }

      card.appendChild(body);
      return card;
    }

    function toggleSeasonCard(card) {
      const isExpanded = card.classList.contains("expanded");
      const body = card.querySelector(".season-body");
      const chevron = card.querySelector(".accordion-chevron");

      if (isExpanded) {
        card.classList.remove("expanded");
        body.style.display = "none";
        chevron.textContent = "▾";
      } else {
        card.classList.add("expanded");
        body.style.display = "block";
        chevron.textContent = "▴";
      }
    }

    // ===========================
    // Populate Episodes for Season
    // ===========================

    function populateEpisodesForSeason(show, seasonNumber, episodesList) {
      if (!episodesList) return;
      episodesList.innerHTML = "";

      if (!Array.isArray(show.episodes)) {
        const empty = createEl("div", "section-subtitle", "No episode data available for this show.");
        episodesList.appendChild(empty);
        return;
      }

      const episodes = show.episodes.filter((ep) => ep && ep.season_number === seasonNumber);
      episodes.sort((a, b) => (a.episode_number || 0) - (b.episode_number || 0));

      if (episodes.length === 0) {
        const empty = createEl(
          "div",
          "section-subtitle",
          `No episodes found for season ${seasonNumber}.`
        );
        episodesList.appendChild(empty);
        return;
      }

      episodes.forEach((ep) => {
        const card = renderEpisodeCard(ep);
        episodesList.appendChild(card);
      });
    }

    // ===========================
    // Render: Episode Card
    // ===========================

    function renderEpisodeCard(ep) {
      const card = createEl("div", "episode-card");

      const header = createEl("div", "episode-card-header");
      const left = createEl("div", "episode-left");

      const titleRow = createEl("div", "episode-title-row");
      const epNum = createEl(
        "div",
        "episode-number",
        `S${ep.season_number}E${ep.episode_number != null ? ep.episode_number : "?"}`
      );
      const epName = createEl("div", "episode-name", ep.name || `Episode ${ep.episode_number || ""}`);
      titleRow.appendChild(epNum);
      titleRow.appendChild(epName);

      const metaRow = createEl("div", "episode-meta-row");
      if (ep.air_date || ep.airDate) {
        const span = createEl("span", null, `Aired: ${formatDate(ep.air_date || ep.airDate)}`);
        metaRow.appendChild(span);
      }
      if (ep.runtime || ep.runtimeMinutes) {
        const span = createEl("span", null, `${ep.runtime || ep.runtimeMinutes} min`);
        metaRow.appendChild(span);
      }

      left.appendChild(titleRow);
      left.appendChild(metaRow);

      const chevron = createEl("div", "accordion-chevron", "▾");

      header.appendChild(left);
      header.appendChild(chevron);
      card.appendChild(header);

      const body = createEl("div", "episode-body");
      body.style.display = "none";

      if (ep.overview) {
        const overview = createEl("div", "episode-overview", ep.overview);
        body.appendChild(overview);
      }

      const metaInline = createEl("div", "episode-meta-inline");

      if (ep.air_date || ep.airDate) {
        const block = createEl("div", null);
        const label = createEl("span", "inline-label", "Air date");
        const value = createEl("span", "inline-value", formatDate(ep.air_date || ep.airDate));
        block.appendChild(label);
        block.appendChild(document.createTextNode(" "));
        block.appendChild(value);
        metaInline.appendChild(block);
      }

      if (ep.vote_average != null || ep.rating != null) {
        const rating = ep.vote_average ?? ep.rating;
        const block = createEl("div", null);
        const label = createEl("span", "inline-label", "Rating");
        const value = createEl("span", "inline-value", `${rating.toFixed ? rating.toFixed(1) : rating}/10`);
        block.appendChild(label);
        block.appendChild(document.createTextNode(" "));
        block.appendChild(value);
        metaInline.appendChild(block);
      }

      if (metaInline.childElementCount > 0) {
        body.appendChild(metaInline);
      }

      // Episode-level streaming links
      if (Array.isArray(ep.streaming_links) && ep.streaming_links.length > 0) {
        const streamingRow = createEl("div", "episode-streaming-row");
        ep.streaming_links.forEach((link) => {
          const btn = renderStreamingButton(link);
          streamingRow.appendChild(btn);
        });
        body.appendChild(streamingRow);
      }

      card.appendChild(body);

      header.addEventListener("click", () => {
        const isExpanded = card.classList.contains("expanded");
        if (isExpanded) {
          card.classList.remove("expanded");
          body.style.display = "none";
          chevron.textContent = "▾";
        } else {
          card.classList.add("expanded");
          body.style.display = "block";
          chevron.textContent = "▴";
        }
      });

      return card;
    }

    // ===========================
    // Error State
    // ===========================

    function renderErrorState(err) {
      watchlistContainer.innerHTML = "";
      const box = createEl("div", "empty-state");
      const title = createEl("div", "empty-title error-text", "Error loading data.json");
      const text = createEl(
        "div",
        null,
        `There was a problem reading data/data.json. Check the file location, JSON validity, and CORS if running from a server.`
      );
      const details = createEl("div", "error-text", String(err && err.message ? err.message : err));
      box.appendChild(title);
      box.appendChild(text);
      box.appendChild(details);
      watchlistContainer.appendChild(box);
    }

    // ===========================
    // Event Wiring: Status Pills
    // ===========================

    if (statusPills) {
      statusPills.addEventListener("click", (e) => {
        const pill = e.target.closest(".status-pill");
        if (!pill) return;
        const status = pill.dataset.status;
        if (!status) return;

        state.currentStatusFilter = status.toUpperCase();

        statusPills.querySelectorAll(".status-pill").forEach((p) => p.classList.remove("active"));
        pill.classList.add("active");

        applyFiltersAndSort();
      });
    }

    // ===========================
    // Event Wiring: Sort Select
    // ===========================

    if (sortSelect) {
      sortSelect.addEventListener("change", () => {
        state.currentSort = sortSelect.value;
        applyFiltersAndSort();
      });
    }

    // ===========================
    // Init
    // ===========================

    document.addEventListener("DOMContentLoaded", () => {
      loadData();
    });
  </script>
</body>
</html>
