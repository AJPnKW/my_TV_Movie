<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>My TV Hub - Watch Me</title>
  <link rel="stylesheet" href="../css/my_tv_hub.css" />
  <link rel="stylesheet" href="../css/main_app.css" />
</head>
<body data-app-family="main" data-page="watch-me">
  <div class="app">
    <div class="top">
      <div class="brand">
        <div class="logo" aria-label="MY TV HUB"><div class="logo_txt"><div>MY TV</div><div>HUB</div></div></div>
      </div>
      <div class="nav" role="tablist" aria-label="Primary">
        <a class="tab" href="../index.html" role="tab" aria-selected="false">Dashboard</a>
        <a class="tab" href="../shows.html" role="tab" aria-selected="false">Shows</a>
        <a class="tab" href="../movies.html" role="tab" aria-selected="false">Movies</a>
        <a class="tab active" href="./watch_me.html" role="tab" aria-selected="true">Watch Me</a>
        <a class="tab" href="../calendar.html" role="tab" aria-selected="false">Calendar</a>
        <a class="tab" href="../discover.html" role="tab" aria-selected="false">Discover</a>
        <a class="tab" href="../config.html" role="tab" aria-selected="false">Config</a>
        <a class="tab" href="http://127.0.0.1:8787/web/inputs_editor.html" role="tab" aria-selected="false">Inputs Editor</a>
      </div>
      <div class="status" aria-live="polite">
        <div id="watchMeStatusDot" class="dot"></div>
        <span id="watchMeStatusText">Loading</span>
      </div>
    </div>
    <div class="watchme-shell">
      <section class="panel">
        <div class="dashhead">
          <h2>Watch Me</h2>
          <span class="muted">Shared shell, shared cards, shared action bar</span>
        </div>
        <div class="watchme-layout">
          <aside class="watchme-sidebar">
            <section class="dashblock">
              <div class="browse-sidebar__eyebrow">Filter</div>
              <div class="watchme-filters">
                <input id="watchMeSearch" class="input control-input" type="search" placeholder="Search titles" />
                <select id="watchMeType" class="input control-select">
                  <option value="all">All media</option>
                  <option value="episodes">Episodes</option>
                  <option value="movies">Movies</option>
                </select>
                <select id="watchMeWindow" class="input control-select">
                  <option value="14">Next 14 days</option>
                  <option value="30">Next 30 days</option>
                  <option value="7">Next 7 days</option>
                </select>
                <button id="watchMeReset" class="calbtn" type="button">Reset</button>
              </div>
            </section>
            <section class="dashblock">
              <div class="browse-sidebar__eyebrow">Ready</div>
              <div id="watchMeSummary" class="browse-sidebar__meta">Waiting for data</div>
            </section>
          </aside>
          <main id="watchMeSections" class="watchme-sections"></main>
        </div>
      </section>
    </div>
    <div class="footer" id="watchMeFooter"></div>
  </div>
  <script type="module" src="../js/watch_me_runtime.js"></script>
</body>
</html>
