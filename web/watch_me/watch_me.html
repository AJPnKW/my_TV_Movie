<!doctype html>
<!--
FILE: web/watch_me/watch_me.html
VERSION: 1.1.3
UPDATED: 2026-02-16T00:00:00Z
CHANGE NOTES:
- Rebuilt page with clean validated markup/script after manual paste corruption
- Data-driven 5-row carousel view from data/data.json with left filter/sort menu
- Provider links rendered for episode and movie cards when present in data
- Added per-client watched toggle state with HP LAN API + GitHub fallback read support
- Added sidebar Client id input with localStorage persistence and reload behavior
- Added config-driven watched toggle size control and reduced default height
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Watch Me</title>
  <link rel="stylesheet" href="../css/my_tv_hub.css?v=1.1.3" />
  <link rel="stylesheet" href="../css/main_app.css" />
  <style>
    :root{
      --bg:#0b0f16; --panel:#121a28; --line:rgba(255,255,255,.14); --txt:#ecf2ff; --mut:#b5c3dd; --w:150px; --side-w:210px;
      --card-w:150px; --card-h:152px; --gap:10px; --section-gap:12px;
      --carousel-btn-size:56px; --carousel-btn-hitbox:64px; --carousel-btn-border:2px;
      --day-pill-h:26px; --day-seg-gap:8px; --carousel-rows:2;
      --wm_ep_still_h_mult:1.5; --wm_ep_still_side_crop_pct:12.5%;
      --wm_watch_toggle_h:10px; --wm_watch_toggle_w:18px; --wm_watch_toggle_thumb:6px;
      --sel-bg:rgba(255,255,255,.06); --sel-fg:#ecf2ff; --sel-opt-bg:#182132; --sel-opt-fg:#f0f5ff; --sel-opt-hover:#263248;
      --day-bg:rgba(255,255,255,.05); --day-fg:#d5e0f3; --day-today-bg:#dbe9ff; --day-today-fg:#0d1b33;
    }
    html,body{ min-height:100%; height:auto; }
    body{ margin:0; background:radial-gradient(1200px 700px at 15% -10%, rgba(34,130,255,.22), transparent 55%),var(--bg); color:var(--txt); font-family:"Space Grotesk","Segoe UI",sans-serif; overflow:auto; }
    .app{ width:min(97vw,1900px); margin:0 auto; padding:14px; }
    .watchme-top{ margin-bottom:14px; }
    .watchme-top .nav{ flex:1 1 auto; }
    .watchme-top .status{ margin-left:auto; }
    .head{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; border:1px solid var(--line); border-radius:16px; background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03)); padding:10px 14px; margin-bottom:14px; }
    .head h1{ margin:0; font-size:24px; font-weight:900; letter-spacing:.03em; }
    .head p{ margin:0; color:var(--mut); font-size:12px; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; }
    .headcopy{ display:flex; align-items:baseline; gap:12px; }
    .legend{ display:flex; align-items:center; gap:12px; font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.08em; }
    .legend-item{ display:inline-flex; align-items:center; gap:0; }
    .legend .glyph{ font-size:21px; line-height:1; }
    .legend-version{ opacity:.95; }
    .today-btn{ width:30px; height:30px; border-radius:999px; border:1px solid rgba(255,255,255,.24); background:rgba(255,255,255,.08); color:#f3f8ff; font-size:16px; line-height:1; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
    .today-btn:focus-visible{ outline:3px solid #ffffff; outline-offset:2px; }
    .layout{ display:grid; grid-template-columns:var(--side-w) minmax(0,1fr); gap:14px; }
    .side{ position:sticky; top:10px; align-self:start; width:var(--side-w); border:1px solid var(--line); border-radius:14px; background:var(--panel); padding:12px; display:flex; flex-direction:column; gap:12px; max-height:calc(100vh - 20px); overflow:auto; }
    .grp{ display:flex; flex-direction:column; gap:7px; }
    .gt{ font-size:11px; color:var(--mut); font-weight:900; letter-spacing:.1em; text-transform:uppercase; }
    .label{ font-size:12px; color:var(--mut); }
    .inp,.sel{ width:100%; border:1px solid var(--line); border-radius:10px; background:var(--sel-bg); color:var(--sel-fg); font:inherit; font-size:13px; padding:8px 9px; }
    .sel{ color-scheme:dark; }
    .sel option{ color:var(--sel-opt-fg); background:var(--sel-opt-bg); }
    .sel option:checked{ color:var(--sel-opt-fg); background:var(--sel-opt-hover); }
    .sel option:hover{ color:var(--sel-opt-fg); background:var(--sel-opt-hover); }
    .chk{ display:flex; align-items:center; gap:8px; font-size:12px; }
    .reset{ border:1px solid rgba(255,255,255,.24); border-radius:10px; background:rgba(255,255,255,.05); color:#f2f7ff; font-weight:700; padding:8px 9px; cursor:pointer; }
    .main{ display:flex; flex-direction:column; gap:var(--section-gap); min-width:0; overflow-x:auto; }
    .row{ border:1px solid var(--line); border-radius:14px; background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.025)); padding:10px; }
    .rh{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:9px; }
    .tv-rh{ min-height:8px; margin-bottom:8px; }
    .rh h2{ margin:0; font-size:16px; font-weight:900; letter-spacing:.02em; }
    .rm{ font-size:12px; color:var(--mut); }
    .track{ display:grid; grid-auto-flow:column; grid-auto-columns:var(--w); gap:var(--gap); overflow-x:auto; padding-bottom:6px; }
    .track.tv-inline{ display:flex; gap:12px; }
    .carousel-wrap{ position:relative; padding:0 calc(var(--carousel-btn-hitbox) / 2); }
    .carousel-btn{
      position:absolute; top:50%; transform:translateY(-50%);
      width:max(var(--carousel-btn-size),56px); height:max(var(--carousel-btn-size),56px); border-radius:999px;
      border:var(--carousel-btn-border) solid rgba(214,230,255,.72); background:rgba(20,34,56,.92); color:#ffffff; box-shadow:var(--carousel-btn-shadow, 0 0 0 2px rgba(160,196,255,.22), 0 6px 18px rgba(0,0,0,.55));
      display:inline-flex; align-items:center; justify-content:center;
      font-size:28px; line-height:1; cursor:pointer; z-index:2;
      transition:background .18s ease, opacity .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .carousel-btn.left{ left:2px; }
    .carousel-btn.right{ right:2px; }
    .carousel-btn.fast.left{ left:calc(2px + var(--carousel-btn-size) + 6px); }
    .carousel-btn.fast.right{ right:calc(2px + var(--carousel-btn-size) + 6px); }
    .carousel-wrap.tv-wrap .carousel-btn{ top:calc(50% + 18px); }
    .carousel-btn:hover{ background:rgba(38,58,90,.98); border-color:rgba(235,244,255,.95); box-shadow:0 0 0 2px rgba(185,214,255,.35), 0 8px 20px rgba(0,0,0,.62); }
    .carousel-btn:focus-visible{ outline:3px solid #ffffff; outline-offset:2px; }
    .carousel-btn:disabled{ opacity:.32; cursor:default; box-shadow:none; border-color:rgba(255,255,255,.28); background:rgba(27,36,52,.78); }
    .day-seg{ display:flex; flex-direction:column; gap:var(--day-seg-gap); padding-right:2px; border-right:1px solid rgba(255,255,255,.15); }
    .day-seg:last-child{ border-right:none; padding-right:0; }
    .day-pill{ align-self:flex-start; border:1px solid rgba(255,255,255,.2); border-radius:7px; background:var(--day-bg); color:var(--day-fg); font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.12em; padding:4px 8px; min-height:var(--day-pill-h); display:inline-flex; align-items:center; white-space:nowrap; }
    .day-pill.today{ border-color:rgba(219,233,255,.8); background:var(--day-today-bg); color:var(--day-today-fg); }
    .day-cards{ display:grid; grid-auto-flow:column; grid-auto-columns:var(--card-w); grid-template-rows:repeat(var(--carousel-rows), minmax(0,1fr)); gap:var(--gap); }
    .day-cards .watchme-episode-card,
    .track.two-row .watchme-movie-card{ width:var(--card-w); min-height:var(--card-h); }
    .track.two-row{ grid-template-rows:repeat(var(--carousel-rows), minmax(0,1fr)); }
    .watchme-episode-card,
    .watchme-movie-card{ border:1px solid rgba(255,255,255,.13); border-radius:12px; overflow:hidden; background:rgba(255,255,255,.06); display:flex; flex-direction:column; }
    .watchme-episode-card{ grid-template-columns:1fr; }
    .watchme-episode-card .media-card__poster,
    .watchme-movie-card .media-card__poster{ min-height:96px; background:rgba(255,255,255,.08); }
    .watchme-episode-card .media-card__poster img,
    .watchme-movie-card .media-card__poster img{ width:100%; height:100%; object-fit:cover; display:block; }
    .watchme-episode-card .media-card__body,
    .watchme-movie-card .media-card__body{ padding:8px; gap:8px; }
    .watchme-episode-card .media-card__eyebrow{ font-size:10px; color:#bfd0ea; }
    .watchme-episode-card .media-card__title,
    .watchme-movie-card .media-card__title{ font-size:12px; line-height:1.2; font-weight:800; }
    .watchme-episode-card .media-card__meta,
    .watchme-movie-card .media-card__meta{ font-size:10px; color:#cfdbf0; }
    .media{ position:relative; background:rgba(255,255,255,.08); }
    .media.ep{ aspect-ratio:calc((16 / 9) / var(--wm_ep_still_h_mult)); overflow:hidden; }
    .media.mv{ aspect-ratio:2/3; }
    .media img{ width:100%; height:100%; object-fit:cover; display:block; }
    .media.ep img{ width:calc(100% + (2 * var(--wm_ep_still_side_crop_pct))); max-width:none; margin-left:calc(-1 * var(--wm_ep_still_side_crop_pct)); }
    .ov{ position:absolute; inset:auto 0 0 0; background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.86)); padding:7px; display:flex; flex-direction:column; gap:2px; min-height:58%; justify-content:flex-end; }
    .k{ font-size:10px; color:#bfd0ea; text-transform:uppercase; letter-spacing:.05em; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .n{ font-size:12px; line-height:1.2; font-weight:800; color:#f2f6ff; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .d{ font-size:10px; color:#cfdbf0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cb{ padding:8px; display:flex; flex-direction:column; gap:8px; }
    .watchme-actionbar{ margin-top:auto; }
    .watchme-actionbar .actionbar-right{ display:none; }
    .sr-only{
      position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
      clip:rect(0,0,0,0); white-space:nowrap; border:0;
    }
    .warn-inline{ margin-bottom:8px; font-size:11px; color:#ffd9a3; letter-spacing:.02em; }
    .watchme-episode-card,
    .watchme-movie-card{ outline-offset:2px; }
    .watchme-episode-card:focus-visible,
    .watchme-movie-card:focus-visible{ outline:3px solid #ffffff; }
    .day-pill{ outline-offset:2px; }
    .day-pill:focus-visible{ outline:3px solid #ffffff; }
    .empty{ border:1px dashed rgba(255,255,255,.22); border-radius:10px; padding:14px; color:var(--mut); font-size:12px; background:rgba(255,255,255,.03); align-self:start; }
    @media (prefers-color-scheme:light){
      :root{
        --sel-bg:#ffffff; --sel-fg:#101a2e; --sel-opt-bg:#ffffff; --sel-opt-fg:#0f1b32; --sel-opt-hover:#dde7ff;
        --day-bg:#edf2fc; --day-fg:#1d3155; --day-today-bg:#203960; --day-today-fg:#f4f8ff;
      }
      .sel{ color-scheme:light; }
    }
    @media (max-width:1120px){ .side{ max-height:none; } }
  </style>
</head>
<body data-watchme-version="1.1.3">
  <div class="app">
    <div class="top watchme-top">
      <div class="brand">
        <div class="logo" aria-label="MY TV HUB"><div class="logo_txt"><div>MY TV</div><div>HUB</div></div></div>
        <div class="titlebox">
          <div class="title" style="display:none"></div>
          <div class="subtitle" style="display:none"></div>
        </div>
      </div>

      <div class="nav" role="tablist" aria-label="Primary">
        <a class="tab" href="../index.html" role="tab" aria-selected="false">Dashboard</a>
        <a class="tab" href="../shows.html" role="tab" aria-selected="false">Shows</a>
        <a class="tab" href="../movies.html" role="tab" aria-selected="false">Movies</a>
        <a class="tab active" href="./watch_me.html" role="tab" aria-selected="true">Watch Me</a>
        <a class="tab" href="../calendar.html" role="tab" aria-selected="false">Calendar</a>
        <a class="tab" href="../discover.html" role="tab" aria-selected="false">Discover</a>
        <a class="tab" href="../config.html" role="tab" aria-selected="false">Config</a>
        <a class="tab" href="../inputs_editor.html" role="tab" aria-selected="false">Inputs Editor</a>
      </div>

      <div class="status" aria-live="polite">
        <div class="dot"></div>
        <span>Watch Me</span>
      </div>
    </div>

    <header class="head">
      <div class="headcopy">
        <h1>Watch Me</h1>
        <p>TV weekly episodes and movie release windows</p>
      </div>
      <div class="legend">
        <button id="todayBtn" class="today-btn" type="button" title="Today" aria-label="Today">📅</button>
        <span id="legendA" class="legend-item"></span>
        <span id="legendB" class="legend-item"></span>
        <span class="legend-version">&bull;</span>
        <span id="legendVersion" class="legend-version"></span>
      </div>
    </header>

    <div class="layout">
      <aside class="side" aria-label="Filters and sorting">
        <div class="grp">
          <div class="gt">Search</div>
          <label class="label" for="searchText">Title contains</label>
          <input id="searchText" class="inp" type="search" placeholder="Show, episode, or movie" autocomplete="off" />
        </div>
        <div class="grp">
          <div class="gt">Sort</div>
          <label class="label" for="sortBy">Order inside each row</label>
          <select id="sortBy" class="sel">
            <option value="play">Play order</option>
            <option value="date_asc">Date oldest to newest</option>
            <option value="date_desc">Date newest to oldest</option>
            <option value="title">Title A to Z</option>
          </select>
        </div>
        <div class="grp">
          <div class="gt">Type</div>
          <label class="chk"><input id="toggleTv" type="checkbox" checked /> Include TV rows</label>
          <label class="chk"><input id="toggleMovie" type="checkbox" checked /> Include movie rows</label>
        </div>
        <div class="grp">
          <div class="gt">Filters</div>
          <label class="label" for="genreFilter">Genre</label>
          <select id="genreFilter" class="sel"></select>
          <label class="label" for="networkFilter">Network</label>
          <select id="networkFilter" class="sel"></select>
        </div>
        <div class="grp">
          <div class="gt">Device</div>
          <label class="label" for="clientIdInput">Client id</label>
          <input id="clientIdInput" class="inp" type="text" autocomplete="off" />
        </div>
        <button id="resetFilters" class="reset" type="button">Reset filters</button>
      </aside>
      <main id="rowsRoot" class="main" aria-live="polite"></main>
    </div>
  </div>

  <script type="module" src="../js/action_bar.js"></script>
  <script type="module" src="../js/card_renderer.js"></script>
  <script>
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const refs = {
        rowsRoot: $("rowsRoot"),
        searchText: $("searchText"),
        sortBy: $("sortBy"),
        toggleTv: $("toggleTv"),
        toggleMovie: $("toggleMovie"),
        genreFilter: $("genreFilter"),
        networkFilter: $("networkFilter"),
        clientIdInput: $("clientIdInput"),
        resetFilters: $("resetFilters"),
        todayBtn: $("todayBtn"),
        legendA: $("legendA"),
        legendB: $("legendB"),
        legendVersion: $("legendVersion")
      };
      const WATCH_ME_VERSION = "1.1.3";
      const WATCHED_CLIENT_KEY = "watchme_client_id";
      const WATCHED_DEFAULT_CLIENT_ID = "tv_livingroom";
      const WATCHED_DEFAULT_API_BASE_URL = "http://192.168.1.64:9192";

      const WATCH_ME_FALLBACK_TUNING = {
        sidebar_width_px: 210,
        card_width_px: 150,
        card_height_px: 152,
        card_gap_px: 10,
        section_gap_px: 12,
        carousel_btn_size_px: 56,
        carousel_btn_hitbox_px: 64,
        carousel_btn_border_px: 2,
        carousel_btn_shadow: true,
        day_pill_height_px: 26,
        day_segment_gap_px: 8,
        carousel_rows: 2
      };
      const state = {
        shows: [], movies: [], episodes: [], normalizedMovies: [],
        filters: { query:"", sortBy:"play", includeTv:true, includeMovie:true, genre:"all", network:"all" },
        ui: { selectedTvWeekKey:"", selectedMovieModeIndex:0, dataLoaded:false },
        watched: new Map(),
        watchedUnsaved: new Set(),
        clientId: WATCHED_DEFAULT_CLIENT_ID,
        watchedApiBaseUrl: WATCHED_DEFAULT_API_BASE_URL,
        mediaUi: {
          a: { icon: "?", name: "Provider A" },
          b: { icon: "?", name: "Provider B" }
        }
      };
      const MEDIA_ICON_A = "media_vidrsc";
      const MEDIA_ICON_B = "media_videasy";
      const MEDIA_LINK_A = ["v","i","d","s","r","c"].join("");
      const MEDIA_LINK_B = ["v","i","d","e","a","s","y"].join("");

      function repoBase(){
        const parts = location.pathname.split("/").filter(Boolean);
        const wi = parts.indexOf("web");
        return wi > 0 ? `/${parts[0]}` : "";
      }
      function withBasePath(path){
        const p = String(path || "").trim();
        if (!p) return "";
        if (/^https?:\/\//i.test(p)) return p;
        return p.startsWith("/") ? `${repoBase()}${p}` : `${repoBase()}/${p}`;
      }
      function applyWatchMeTuningCss(t){
        const r = document.documentElement.style;
        r.setProperty("--side-w", `${t.sidebar_width_px}px`);
        r.setProperty("--w", `${t.card_width_px}px`);
        r.setProperty("--card-w", `${t.card_width_px}px`);
        r.setProperty("--card-h", `${t.card_height_px}px`);
        r.setProperty("--gap", `${t.card_gap_px}px`);
        r.setProperty("--section-gap", `${t.section_gap_px}px`);
        r.setProperty("--carousel-btn-size", `${t.carousel_btn_size_px}px`);
        r.setProperty("--carousel-btn-hitbox", `${t.carousel_btn_hitbox_px}px`);
        r.setProperty("--carousel-btn-border", `${t.carousel_btn_border_px}px`);
        r.setProperty("--day-pill-h", `${t.day_pill_height_px}px`);
        r.setProperty("--day-seg-gap", `${t.day_segment_gap_px}px`);
        r.setProperty("--carousel-rows", String(t.carousel_rows));
        if (t.carousel_btn_shadow){
          r.setProperty("--carousel-btn-shadow", "0 2px 10px rgba(0,0,0,.38)");
        } else {
          r.setProperty("--carousel-btn-shadow", "none");
        }
      }
      function applyEpisodeStillCss(uiTuning){
        const heightMultRaw = Number(uiTuning?.watch_me_episode_still_height_mult);
        const sideCropRaw = Number(uiTuning?.watch_me_episode_still_side_crop_pct);
        const heightMult = Number.isFinite(heightMultRaw) && heightMultRaw > 0 ? heightMultRaw : 1.5;
        const sideCrop = Number.isFinite(sideCropRaw) && sideCropRaw >= 0 ? sideCropRaw : 12.5;
        const r = document.documentElement.style;
        r.setProperty("--wm_ep_still_h_mult", String(heightMult));
        r.setProperty("--wm_ep_still_side_crop_pct", `${sideCrop}%`);
      }
      function applyWatchedToggleCss(uiTuning){
        const raw = Number(uiTuning?.watch_me_watched_toggle_height_px);
        const height = Number.isFinite(raw) && raw >= 8 ? raw : 10;
        const width = Math.max(14, Math.round(height * 1.8));
        const thumb = Math.max(4, height - 4);
        const r = document.documentElement.style;
        r.setProperty("--wm_watch_toggle_h", `${height}px`);
        r.setProperty("--wm_watch_toggle_w", `${width}px`);
        r.setProperty("--wm_watch_toggle_thumb", `${thumb}px`);
      }
      function resolveWatchMeTuning(raw){
        const out = { ...WATCH_ME_FALLBACK_TUNING };
        if (!raw || typeof raw !== "object") return out;
        for (const k of Object.keys(WATCH_ME_FALLBACK_TUNING)){
          if (!(k in raw)) continue;
          const v = raw[k];
          if (typeof WATCH_ME_FALLBACK_TUNING[k] === "boolean"){
            out[k] = !!v;
          } else {
            const n = Number(v);
            if (Number.isFinite(n) && n > 0) out[k] = n;
          }
        }
        return out;
      }
      function resolveMediaUi(cfg){
        const iconCfg = cfg?.icons && typeof cfg.icons === "object" ? cfg.icons : {};
        const aCfg = iconCfg[MEDIA_ICON_A] || {};
        const bCfg = iconCfg[MEDIA_ICON_B] || {};
        return {
          a: {
            icon: String(aCfg?.icon || "?"),
            name: String(aCfg?.name || "Provider A")
          },
          b: {
            icon: String(bCfg?.icon || "?"),
            name: String(bCfg?.name || "Provider B")
          }
        };
      }
      function applyMediaUi(){
        refs.legendA.innerHTML = `<span class="glyph" title="${escHtml(state.mediaUi.a.name)}" aria-label="${escHtml(state.mediaUi.a.name)}">${escHtml(state.mediaUi.a.icon)}</span>`;
        refs.legendB.innerHTML = `<span class="glyph" title="${escHtml(state.mediaUi.b.name)}" aria-label="${escHtml(state.mediaUi.b.name)}">${escHtml(state.mediaUi.b.icon)}</span>`;
        refs.legendVersion.textContent = `v${WATCH_ME_VERSION}`;
      }
      function resolveWatchedApiBaseUrl(cfg){
        const configured = String(cfg?.ui_tuning?.watch_me_watched_api_base_url || "").trim();
        return configured || WATCHED_DEFAULT_API_BASE_URL;
      }
      async function loadWatchMeTuning(){
        const urls = [`${repoBase()}/web/config.json?v=${WATCH_ME_VERSION}`, `${repoBase()}/config.json?v=${WATCH_ME_VERSION}`, `../config.json?v=${WATCH_ME_VERSION}`, `/my_TV_Movie/web/config.json?v=${WATCH_ME_VERSION}`, `/web/config.json?v=${WATCH_ME_VERSION}`, `/config.json?v=${WATCH_ME_VERSION}`];
        try {
          for (const url of urls){
            try {
              const res = await fetch(url, { cache:"no-store" });
              if (!res.ok) continue;
              const cfg = await res.json();
              const tuning = resolveWatchMeTuning(cfg?.ui_tuning?.watch_me);
              state.mediaUi = resolveMediaUi(cfg);

          if (!res.ok) throw new Error(`HTTP ${res.status}`);

      function flattenData(data){

              return;
            }
            if (target.matches(".day-pill")){
              const seg = target.closest(".day-seg");
              const firstCard = seg ? seg.querySelector(".watchme-episode-card, .watchme-movie-card") : null;
              if (firstCard instanceof HTMLElement){
                firstCard.focus();
                ev.preventDefault();
              }
            }
          });
        }
      }
      function shiftTvWeek(tvWeeks, delta){
        if (!tvWeeks.length) return;
        const i = tvWeeks.findIndex(x => x.key === state.ui.selectedTvWeekKey);
        const cur = i >= 0 ? i : 0;
        const nextIdx = Math.max(0, Math.min(tvWeeks.length - 1, cur + delta));
        if (nextIdx !== cur){
          state.ui.selectedTvWeekKey = tvWeeks[nextIdx].key;
          render();
        }
      }
      function shiftMovieMode(movieModes, delta){
        if (!movieModes.length) return;
        const cur = Math.max(0, Math.min(movieModes.length - 1, state.ui.selectedMovieModeIndex || 0));
        const nextIdx = (cur + delta + movieModes.length) % movieModes.length;
        if (nextIdx !== cur){
          state.ui.selectedMovieModeIndex = nextIdx;
          render();
        }
      }
      function wireCarouselButtons(tvWeeks, movieModes){
        const rowsRoot = refs.rowsRoot;
        const tracks = Array.from(rowsRoot.querySelectorAll(".track"));
        for (const track of tracks){
          let wrap = track.parentElement;
          if (!wrap || !wrap.classList.contains("carousel-wrap")){
            wrap = document.createElement("div");
            wrap.className = "carousel-wrap";
            track.parentNode.insertBefore(wrap, track);
            wrap.appendChild(track);
          }
          wrap.classList.toggle("tv-wrap", track.classList.contains("tv-inline"));
          const rowKind = String(track.closest(".row")?.dataset?.rowKind || "");
          const ensureBtn = (sel, cls, label, text) => {
            let btn = wrap.querySelector(sel);
            if (!(btn instanceof HTMLButtonElement)){
              btn = document.createElement("button");
              btn.type = "button";
              btn.className = cls;
              btn.setAttribute("aria-label", label);
              btn.textContent = text;
              wrap.appendChild(btn);
            }
            return btn;
          };
          const leftFast = ensureBtn(".carousel-btn.left.fast", "carousel-btn left fast", rowKind === "tv" ? "Fast back week" : "Fast back period", "«");
          const leftSingle = ensureBtn(".carousel-btn.left.single", "carousel-btn left single", "Scroll left", "‹");
          const rightSingle = ensureBtn(".carousel-btn.right.single", "carousel-btn right single", "Scroll right", "›");
          const rightFast = ensureBtn(".carousel-btn.right.fast", "carousel-btn right fast", rowKind === "tv" ? "Fast forward week" : "Fast forward period", "»");
          const navBtns = [leftFast, leftSingle, rightSingle, rightFast];
          for (const b of navBtns){
            b.onkeydown = (ev) => {
              if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
              const idx = navBtns.indexOf(b);
              const next = ev.key === "ArrowRight" ? navBtns[idx + 1] : navBtns[idx - 1];
              if (next){ next.focus(); ev.preventDefault(); }
            };
          }
          const step = () => Math.max(120, Math.floor(track.clientWidth * 0.8));
          const update = () => {
            const max = Math.max(0, track.scrollWidth - track.clientWidth);
            const atStart = track.scrollLeft <= 1;
            const atEnd = track.scrollLeft >= max - 1;
            leftSingle.disabled = atStart;
            rightSingle.disabled = atEnd;
            if (rowKind === "tv"){
              const i = tvWeeks.findIndex(x => x.key === state.ui.selectedTvWeekKey);
              const cur = i >= 0 ? i : 0;
              leftFast.disabled = cur <= 0;
              rightFast.disabled = cur >= tvWeeks.length - 1;
            } else if (rowKind === "movies"){
              leftFast.disabled = movieModes.length <= 1;
              rightFast.disabled = movieModes.length <= 1;
            } else {
              leftFast.disabled = true;
              rightFast.disabled = true;
            }
          };
          leftSingle.onclick = () => track.scrollBy({ left: -step(), behavior: "smooth" });
          rightSingle.onclick = () => track.scrollBy({ left: step(), behavior: "smooth" });
          leftFast.onclick = () => {
            if (rowKind === "tv") shiftTvWeek(tvWeeks, -1);
            if (rowKind === "movies") shiftMovieMode(movieModes, -1);
          };
          rightFast.onclick = () => {
            if (rowKind === "tv") shiftTvWeek(tvWeeks, 1);
            if (rowKind === "movies") shiftMovieMode(movieModes, 1);
          };
          track.addEventListener("scroll", update);
          update();
        }
      }

      function render(){
        const now = new Date();
        const eps = uniqueTvEpisodesByStableKey(filtEpisodes(state.episodes));
        const mvs = filtMovies(state.normalizedMovies);
        const tvWeeks = buildTvWeeks(eps);
        const moviesModes = buildMovieModes(mvs, now);
        const currentWeekKey = dateKey(mondayOf(now));
        if (!tvWeeks.some(x => x.key === state.ui.selectedTvWeekKey)){
          state.ui.selectedTvWeekKey = tvWeeks.some(x => x.key === currentWeekKey) ? currentWeekKey : (tvWeeks[tvWeeks.length - 1]?.key || "");
        }
        if (state.ui.selectedMovieModeIndex < 0 || state.ui.selectedMovieModeIndex >= moviesModes.length){
          state.ui.selectedMovieModeIndex = 0;
        }
        const selectedWeek = tvWeeks.find(x => x.key === state.ui.selectedTvWeekKey) || tvWeeks[tvWeeks.length - 1];
        const selectedMode = moviesModes[state.ui.selectedMovieModeIndex] || moviesModes[0];
        const out = [];
        if (state.filters.includeTv){
          out.push(tvCarouselHtml(selectedWeek));
        }
        if (state.filters.includeMovie && selectedMode){
          out.push(moviesCarouselHtml(selectedMode));
        }
        refs.rowsRoot.innerHTML = out.length ? out.join("") : `<section class="row"><div class="empty">Enable at least one media type from filters.</div></section>`;
        wireCarouselButtons(tvWeeks, moviesModes);
        wireKeyboardNav();
      }

      async function loadData(){
        const candidates = [`${repoBase()}/data/data.json`, "../../data/data.json", "../data/data.json", "/data/data.json"];
        let payload = null;
        for (const url of candidates){
          try { const res = await fetch(url, { cache:"no-store" }); if (!res.ok) continue; payload = await res.json(); break; } catch (_e) {}
        }
        if (!payload) throw new Error("Unable to load data/data.json");
        const f = flattenData(payload);
        state.shows = f.shows; state.movies = f.movies; state.episodes = f.episodes; state.normalizedMovies = f.normalizedMovies;
        state.ui.dataLoaded = true;
      }

      async function init(){
        applyMediaUi();
        await loadWatchMeTuning();
        bindUi();
        state.clientId = getClientId();
        refs.clientIdInput.value = state.clientId;
        localStorage.setItem(WATCHED_CLIENT_KEY, state.clientId);
        try {
          await loadData();
          state.watched = new Map();
          buildFilterOptions();
          render();
          state.watched = await loadWatchedMap(state.clientId);
          state.watchedUnsaved = new Set();
          render();
        }
        catch (err){ refs.rowsRoot.innerHTML = `<section class="row"><div class="empty">Failed to load media data: ${escHtml(err?.message || String(err))}</div></section>`; }
      }

      init();
    })();
  </script>
</body>
</html>
