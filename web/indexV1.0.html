[FILE] web/index.html
[PROJECT] my_TV_Movie (My TV Hub)
[ROLE] Single-Page Application shell (single entry point; dynamic views + popup root)
[VERSION] v4.1.1

[BUILD] 00.00.00
[OWNER] Andrew & Brant (internal)
[DEPENDS ON] web/css/my_tv_hub.css web/config.json data/data.json
[NOTES]
- True SPA shell: internal state routing only; no URL changes; no hash routing.
- Views (fixed): Calendar, Shows, Movies, Live TV, Watchlist, Explore, Profiles, Config.
- One global popup root; stacked overlays; scroll trapped inside popup; Escape/Back closes top popup.
- data.json is loaded once and never mutated.
- Canonical asset hierarchy ONLY (assets/...); never reference deprecated image/ folder.
- Phase 4.1 scope: Calendar View renderer inside index.html (per Section 4.1).

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>My TV Hub</title>

  <!-- External CSS (module boundary respected) -->
  <link rel="stylesheet" href="./css/my_tv_hub.css" />

  <!-- Minimal SPA-shell CSS (self-contained; does not modify other modules) -->
  <style>
    :root {
      --bg: #0b0d12;
      --fg: #e8ecf3;
      --muted: #a8b0c0;
      --panel: #121725;
      --panel2: #0f1420;
      --border: rgba(255,255,255,0.10);
      --focus: #ffffff;
      --danger: #ff5b5b;
      --ok: #35d07f;

      --header-h: 64px;
      --nav-h: 56px;

      --radius: 14px;
      --pad: 14px;

      --font: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      overflow: hidden; /* SPA: scroll is handled inside view panels */
    }

    /* Global header (sticky; always visible) */
    #global-header {
      position: sticky;
      top: 0;
      z-index: 30;
      height: var(--header-h);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      background: linear-gradient(180deg, rgba(18,23,37,0.96), rgba(18,23,37,0.88));
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    #brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
    }

    #brand .logo-chip {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255,255,255,0.10);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    #brand .title {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    #brand .title .name {
      font-size: 16px;
      font-weight: 650;
      letter-spacing: 0.2px;
    }
    #brand .title .sub {
      font-size: 12px;
      color: var(--muted);
    }

    #header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 260px;
      justify-content: flex-end;
    }

    #status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 10px;
      background: rgba(255,255,255,0.06);
      font-size: 12px;
      color: var(--muted);
      user-select: none;
    }

    #status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.06) inset;
      flex: 0 0 auto;
    }

    #error-surface {
      max-width: 520px;
      display: none;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 91, 91, 0.35);
      background: rgba(255, 91, 91, 0.10);
      color: #ffd7d7;
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 12px;
    }
    #error-surface .label { font-weight: 650; }
    #error-surface .msg {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 380px;
    }
    #error-surface button {
      margin-left: auto;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: var(--fg);
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
    }
    #error-surface button:focus {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    /* Main nav (tabs) */
    #main-nav {
      height: var(--nav-h);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(15,20,32,0.92);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: var(--header-h);
      z-index: 25;
      backdrop-filter: blur(10px);
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 40px;
      min-width: 118px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--fg);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
      cursor: pointer;
      user-select: none;
    }
    .nav-btn[aria-selected="true"] {
      background: rgba(255,255,255,0.14);
      border-color: rgba(255,255,255,0.22);
    }
    .nav-btn:focus {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    /* App body */
    #app-shell {
      height: calc(100% - var(--header-h) - var(--nav-h));
      display: flex;
      flex-direction: column;
    }

    #content-root {
      flex: 1 1 auto;
      overflow: auto;
      padding: 14px;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    .view-panel {
      background: rgba(18,23,37,0.78);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      min-height: calc(100% - 2px);
      box-sizing: border-box;
    }

    .view-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 0 0 10px 0;
    }
    .view-title h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 750;
    }
    .view-title .meta {
      color: var(--muted);
      font-size: 12px;
      font-family: var(--mono);
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    /* ==========================
       Calendar View (Section 4.1)
       ========================== */

    .cal-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      min-height: 0;
    }

    .cal-month-header {
      position: sticky; /* Section 4.1.2.2 sticky month header */
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 10px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(15,20,32,0.96);
      backdrop-filter: blur(10px);
    }

    .cal-month-header .btn {
      border: 1px solid rgba(255,255,255,0.20);
      background: rgba(255,255,255,0.08);
      color: var(--fg);
      border-radius: 12px;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 750;
      font-size: 13px;
      min-width: 44px;
      text-align: center;
    }
    .cal-month-header .btn:focus {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .cal-month-header .title {
      font-size: 16px;
      font-weight: 850;
      letter-spacing: 0.2px;
    }

    .cal-month-header .today-ind {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(255,255,255,0.06);
      user-select: none;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr); /* Section 4.1.2.1 7 columns */
      gap: 10px;
      min-height: 0;
      flex: 1 1 auto;
    }

    .cal-dow {
      font-size: 12px;
      color: var(--muted);
      font-weight: 750;
      letter-spacing: 0.2px;
      padding: 0 8px;
    }

    .cal-cell {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      padding: 10px;
      min-height: 136px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      outline: none;
    }
    .cal-cell:focus {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .cal-cell[aria-disabled="true"] {
      opacity: 0.55;
    }

    .cal-date {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-weight: 850;
      font-size: 13px;
    }
    .cal-date .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.15);
      user-select: none;
    }
    .cal-date .badge-today {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 8px;
      background: rgba(255,255,255,0.06);
      user-select: none;
    }

    .cal-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .cal-item {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.18);
      border-radius: 12px;
      padding: 6px 8px;
      outline: none;
      cursor: pointer;
    }
    .cal-item:focus {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .cal-item .thumb {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      overflow: hidden;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }
    .cal-item .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cal-item .thumb .noimg {
      font-size: 11px;
      font-weight: 850;
      color: rgba(255,255,255,0.65);
      user-select: none;
    }

    .cal-item .main {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .cal-item .main .t {
      font-weight: 800;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cal-item .main .s {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cal-item .right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cal-item .avail {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.06) inset;
      flex: 0 0 auto;
    }
    .cal-item .avail[data-on="true"] { background: var(--ok); }

    .cal-more {
      border: 1px dashed rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      outline: none;
      text-align: left;
    }
    .cal-more:focus {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    /* Popup system */
    #popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none; /* enabled when stack not empty */
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(6px);
    }

    #popup-container {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none; /* enabled when stack not empty */
      pointer-events: none; /* only active popups handle */
    }

    .popup {
      pointer-events: auto;
      position: absolute;
      inset: 6% 6%;
      background: rgba(18,23,37,0.98);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden; /* scroll trapped inside popup body */
    }

    .popup-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(15,20,32,0.96);
    }

    .popup-header .title {
      font-weight: 800;
      font-size: 15px;
    }

    .popup-header .spacer { margin-left: auto; }

    .popup-header .btn {
      border: 1px solid rgba(255,255,255,0.20);
      background: rgba(255,255,255,0.08);
      color: var(--fg);
      border-radius: 12px;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 650;
      font-size: 12px;
    }
    .popup-header .btn:focus {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .popup-body {
      flex: 1 1 auto;
      overflow: auto;
      padding: 14px;
    }

    /* Utility */
    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

</style>
</head>

<body>
  <!-- GLOBAL HEADER (sticky; always visible) -->
  <header id="global-header" role="banner">
    <div id="brand" aria-label="My TV Hub">
      <div class="logo-chip" aria-hidden="true">
        <span style="font-weight:900;">TV</span>
      </div>
      <div class="title">
        <div class="name">My TV Hub</div>
        <div class="sub">Single-page • DPAD-first • Local assets</div>
      </div>
    </div>

    <div id="error-surface" role="status" aria-live="polite">
      <span class="label">Error</span>
      <span class="msg" id="error-msg"></span>
      <button type="button" id="error-dismiss">Dismiss</button>
    </div>

    <div id="header-right">
      <div id="status-pill" aria-label="Load status">
        <span id="status-dot" aria-hidden="true"></span>
        <span id="status-text">Initializing…</span>
      </div>
    </div>
  </header>

  <!-- MAIN NAV (tabs; calls renderView(<view>)) -->
  <nav id="main-nav" role="tablist" aria-label="Main navigation tabs">
    <button class="nav-btn" role="tab" aria-selected="true" data-view="calendar">Calendar</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="shows">Shows</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="movies">Movies</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="live_tv">Live TV</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="watchlist">Watchlist</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="explore">Explore</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="profiles">Profiles</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="config">Config</button>
  </nav>

  <!-- SPA SHELL -->
  <main id="app-shell" role="main">
    <div id="content-root" tabindex="-1" aria-label="Active view content"></div>
  </main>

  <!-- POPUP SYSTEM (global root) -->
  <div id="popup-overlay" aria-hidden="true"></div>
  <div id="popup-container" aria-live="polite" aria-label="Popup overlays"></div>

  
<script>
/* My TV Hub - index.html (production)
   - Loads data from ../data/data.json (when served from /web/)
   - Optional config from ./config.js (if present). If missing, uses defaults.
   - Renders: Calendar (episode air_date), Shows grid, Movies grid
*/

(function () {
  "use strict";

  // ---------- helpers ----------
  const $ = (sel, el=document) => el.querySelector(sel);
  const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));

  function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

  function safeText(v){ return (v === null || v === undefined) ? "" : String(v); }

  function toDateKey(iso){ // "YYYY-MM-DD" => same
    if (!iso) return null;
    const s = String(iso).trim();
    const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? `${m[1]}-${m[2]}-${m[3]}` : null;
  }

  function parseISODate(iso){
    const k = toDateKey(iso);
    if (!k) return null;
    // Treat as local date (no TZ shift)
    const [y,m,d] = k.split("-").map(x=>parseInt(x,10));
    return new Date(y, m-1, d);
  }

  function fmtMonthYear(d){
    return d.toLocaleString(undefined, { month: "long", year: "numeric" });
  }

  function fmtWeekdayShort(d){
    return d.toLocaleString(undefined, { weekday: "short" });
  }

  function pad2(n){ return String(n).padStart(2,"0"); }

  function dateKeyFromDate(d){
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  }

  function uniqBy(arr, keyFn){
    const seen = new Set();
    const out = [];
    for (const x of arr){
      const k = keyFn(x);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push(x);
    }
    return out;
  }

  function resolveDataUrl(){
    // We want /data/data.json regardless of whether index.html is /web/index.html or /index.html
    const p = location.pathname.replace(/\\/g,"/");
    if (p.endsWith("/web/index.html") || p.endsWith("/web/")) return "../data/data.json";
    if (p.endsWith("/index.html") || p.endsWith("/")) return "data/data.json";
    // fallback
    return "../data/data.json";
  }

  function resolveConfigUrl(){
    // config.js lives beside index.html in /web/
    return "./config.js";
  }

  // ---------- config ----------
  const DEFAULT_CFG = {
    tmdb_image_base: "https://image.tmdb.org/t/p/",
    tmdb_poster_size: "w342",
    tmdb_backdrop_size: "w780",
    // streaming link templates (safe defaults; can be overridden in config.js)
    show_link_templates: [],
    movie_link_templates: [],
    // UI
    cards_per_row_min: 4
  };

  async function tryLoadConfig(){
    // If config.js exists, it should set window.MY_TV_CFG = {...} or export via window.CONFIG / window.AppConfig
    try {
      const res = await fetch(resolveConfigUrl(), { cache: "no-store" });
      if (!res.ok) return { cfg: DEFAULT_CFG, ok: false };
      // execute config.js in a safe-ish sandbox: add a script tag
      const js = await res.text();
      const s = document.createElement("script");
      s.type = "text/javascript";
      s.text = js + "\n//# sourceURL=config.js";
      document.head.appendChild(s);
      const merged = Object.assign({}, DEFAULT_CFG, window.MY_TV_CFG || window.CONFIG || window.AppConfig || {});
      return { cfg: merged, ok: true };
    } catch (_e){
      return { cfg: DEFAULT_CFG, ok: false };
    }
  }

  // ---------- data loading ----------
  async function loadData(){
    const url = resolveDataUrl();
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(`data fetch failed (${res.status})`);
    const d = await res.json();
    // normalize keys we depend on
    d.shows = Array.isArray(d.shows) ? d.shows : [];
    d.movies = Array.isArray(d.movies) ? d.movies : [];
    return d;
  }

  // ---------- image urls ----------
  function posterUrl(cfg, item){
    const path = item && (item.poster_path || item.poster || item.posterPath);
    if (!path) return "";
    const base = cfg.tmdb_image_base || DEFAULT_CFG.tmdb_image_base;
    const size = cfg.tmdb_poster_size || DEFAULT_CFG.tmdb_poster_size;
    return `${base}${size}${path}`;
  }
  function backdropUrl(cfg, item){
    const path = item && (item.backdrop_path || item.backdrop || item.backdropPath);
    if (!path) return "";
    const base = cfg.tmdb_image_base || DEFAULT_CFG.tmdb_image_base;
    const size = cfg.tmdb_backdrop_size || DEFAULT_CFG.tmdb_backdrop_size;
    return `${base}${size}${path}`;
  }

  // ---------- modal ----------
  function openModal(html){
    const root = $("#popupRoot");
    if (!root) return;
    root.innerHTML = `
      <div class="popup-overlay" role="dialog" aria-modal="true">
        <div class="popup-card">
          <div class="popup-actions">
            <button class="btn" id="popupCloseBtn" type="button">Close</button>
          </div>
          <div class="popup-body">${html}</div>
        </div>
      </div>
    `;
    $("#popupCloseBtn", root)?.addEventListener("click", closeModal);
    root.addEventListener("click", (e)=>{ if (e.target === $(".popup-overlay", root)) closeModal(); }, { once: true });
    document.addEventListener("keydown", escCloseOnce, { once: true });
  }
  function escCloseOnce(e){ if (e.key === "Escape") closeModal(); }
  function closeModal(){
    const root = $("#popupRoot");
    if (root) root.innerHTML = "";
  }

  // ---------- link building ----------
  function buildLinks(cfg, item, kind){
    // templates: [{label, url}] where url can include {tmdb_id} {tvmaze_id} {trakt_id} {imdb_id} {season} {episode}
    const tpls = (kind === "show") ? (cfg.show_link_templates || []) : (cfg.movie_link_templates || []);
    const vals = {
      tmdb_id: item.tmdb_id || item.tmdb || item.id || "",
      tvmaze_id: item.tvmaze_id || "",
      trakt_id: item.trakt_id || "",
      imdb_id: item.imdb_id || item.imdb || "",
      season: item.season_number || item.season || "",
      episode: item.episode_number || item.episode || ""
    };
    const out = [];
    for (const t of tpls){
      const label = safeText(t.label || t.name || "Link");
      let url = safeText(t.url || "");
      if (!url) continue;
      url = url.replace(/\{(\w+)\}/g, (_m, k)=> safeText(vals[k] ?? ""));
      if (url.includes("{")) continue; // unresolved placeholder, skip
      out.push({ label, url });
    }
    return out;
  }

  // ---------- card rendering ----------
  function cardHTML(cfg, item, kind){
    const title = safeText(item.title || item.name || "");
    const year = safeText((item.release_date || item.first_air_date || "").slice(0,4));
    const p = posterUrl(cfg, item);
    const sub = (kind === "show")
      ? safeText(item.status || "")
      : safeText(item.release_date || "");
    const rating = (item.vote_average !== undefined && item.vote_average !== null) ? Number(item.vote_average).toFixed(1) : "";
    const chips = [];
    if (rating) chips.push(`<span class="chip">★ ${rating}</span>`);
    if (year) chips.push(`<span class="chip">${year}</span>`);
    return `
      <button class="media-card" type="button" data-kind="${kind}" data-key="${safeText(kind)}:${safeText(item.tmdb_id || item.id || "")}">
        <div class="media-poster">
          ${p ? `<img loading="lazy" src="${p}" alt="${title} poster">` : `<div class="poster-ph">No poster</div>`}
        </div>
        <div class="media-meta">
          <div class="media-title" title="${title}">${title || "(untitled)"}</div>
          <div class="media-sub">${sub}</div>
          <div class="media-chips">${chips.join("")}</div>
        </div>
      </button>
    `;
  }

  function detailHTML(cfg, item, kind){
    const title = safeText(item.title || item.name || "");
    const overview = safeText(item.overview || "");
    const p = posterUrl(cfg, item);
    const b = backdropUrl(cfg, item);
    const tmdb = safeText(item.tmdb_id || item.tmdb || item.id || "");
    const trakt = safeText(item.trakt_id || "");
    const imdb = safeText(item.imdb_id || "");
    const tvmaze = safeText(item.tvmaze_id || "");
    const genres = Array.isArray(item.genres) ? item.genres.join(", ") : safeText(item.genres || "");
    const links = buildLinks(cfg, item, kind);

    let extra = "";
    if (kind === "show"){
      const next = item.next_episode_to_air || item.next_episode || null;
      const air = next && (next.air_date || next.first_air_date) ? toDateKey(next.air_date || next.first_air_date) : null;
      const s = next && (next.season_number ?? next.season) ? (next.season_number ?? next.season) : "";
      const e = next && (next.episode_number ?? next.episode) ? (next.episode_number ?? next.episode) : "";
      if (air) extra += `<div class="kv"><span>Next episode</span><span>${air}${(s&&e)?` • S${s}E${e}`:""}</span></div>`;
    } else {
      const rd = toDateKey(item.release_date);
      if (rd) extra += `<div class="kv"><span>Release</span><span>${rd}</span></div>`;
    }

    const linkHtml = links.length
      ? `<div class="links">${links.map(x=>`<a class="linkbtn" href="${x.url}" target="_blank" rel="noopener">${x.label}</a>`).join("")}</div>`
      : `<div class="muted">No links available.</div>`;

    return `
      <div class="detail">
        ${b ? `<div class="detail-backdrop"><img loading="lazy" src="${b}" alt=""></div>` : ``}
        <div class="detail-main">
          <div class="detail-left">
            ${p ? `<img class="detail-poster" loading="lazy" src="${p}" alt="${title} poster">` : `<div class="detail-poster ph">No poster</div>`}
          </div>
          <div class="detail-right">
            <h2 class="detail-title">${title || "(untitled)"}</h2>
            ${genres ? `<div class="muted">${genres}</div>` : ``}
            <div class="kvgrid">
              ${tmdb ? `<div class="kv"><span>TMDB</span><span>${tmdb}</span></div>` : ``}
              ${trakt ? `<div class="kv"><span>Trakt</span><span>${trakt}</span></div>` : ``}
              ${imdb ? `<div class="kv"><span>IMDb</span><span>${imdb}</span></div>` : ``}
              ${tvmaze ? `<div class="kv"><span>TVMaze</span><span>${tvmaze}</span></div>` : ``}
              ${extra}
            </div>
            ${overview ? `<p class="detail-overview">${overview}</p>` : `<p class="muted">No overview.</p>`}
            ${linkHtml}
          </div>
        </div>
      </div>
    `;
  }

  // ---------- calendar indexing (EPISODE air_date) ----------
  function calendarIndex(data){
    const idx = new Map(); // dateKey -> [{kind, item, dateKey, label}]
    const add = (dateKey, entry) => {
      if (!dateKey) return;
      if (!idx.has(dateKey)) idx.set(dateKey, []);
      idx.get(dateKey).push(entry);
    };

    for (const s of data.shows){
      const next = s.next_episode_to_air || s.next_episode || null;
      const dk = toDateKey(next && (next.air_date || next.first_air_date));
      if (!dk) continue;
      const label = safeText(s.name) || safeText(s.title);
      // store episode context for display
      add(dk, {
        kind: "show",
        key: `show:${safeText(s.tmdb_id||s.id||"")}`,
        title: label,
        item: s,
        ep: next
      });
    }

    for (const m of data.movies){
      const dk = toDateKey(m.release_date);
      if (!dk) continue;
      const label = safeText(m.title) || safeText(m.name);
      add(dk, {
        kind: "movie",
        key: `movie:${safeText(m.tmdb_id||m.id||"")}`,
        title: label,
        item: m
      });
    }

    // stable sort within day
    for (const [k, arr] of idx.entries()){
      arr.sort((a,b)=> a.title.localeCompare(b.title));
      idx.set(k, arr);
    }
    return idx;
  }

  function episodeChip(ep){
    if (!ep) return "";
    const s = ep.season_number ?? ep.season;
    const e = ep.episode_number ?? ep.episode;
    const name = safeText(ep.name || ep.title || "");
    const parts = [];
    if (s !== undefined && s !== null && e !== undefined && e !== null) parts.push(`S${s}E${e}`);
    if (name) parts.push(name);
    return parts.length ? `<span class="chip">${parts.join(" • ")}</span>` : "";
  }

  // ---------- views ----------
  function setStatus(dataOk, cfgOk){
    $("#statusData").textContent = dataOk ? "data:ok" : "data:fail";
    $("#statusCfg").textContent = cfgOk ? "cfg:ok" : "cfg:default";
    const badge = $("#statusBadge");
    if (badge){
      badge.classList.toggle("ok", !!dataOk);
      badge.classList.toggle("fail", !dataOk);
      badge.textContent = dataOk ? "Ready" : "Failed";
    }
  }

  function renderGrid(panel, cfg, items, kind){
    const html = `
      <div class="grid">
        ${items.map(it => cardHTML(cfg, it, kind)).join("")}
      </div>
    `;
    panel.innerHTML = html;

    $$(".media-card", panel).forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const k = btn.getAttribute("data-key") || "";
        const id = k.split(":")[1] || "";
        const item = items.find(x => String(x.tmdb_id||x.id||"") === String(id));
        if (!item) return;
        openModal(detailHTML(cfg, item, kind));
      });
    });
  }

  function renderCalendar(panel, cfg, data){
    const idx = calendarIndex(data);
    const today = new Date();
    const nowKey = dateKeyFromDate(today);

    // start month at today month
    let cursor = new Date(today.getFullYear(), today.getMonth(), 1);

    const header = `
      <div class="cal-header">
        <div class="cal-nav">
          <button class="btn" id="calPrev" type="button" aria-label="Previous month">◀</button>
          <button class="btn" id="calNext" type="button" aria-label="Next month">▶</button>
          <div class="cal-title" id="calTitle"></div>
        </div>
        <div class="cal-today">
          <span class="chip">Today ${nowKey}</span>
          <button class="btn" id="calGoToday" type="button">Today</button>
        </div>
      </div>
      <div class="cal-weekdays">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="cal-wd">${d}</div>`).join("")}</div>
      <div class="cal-grid" id="calGrid"></div>
    `;
    panel.innerHTML = header;

    const titleEl = $("#calTitle", panel);
    const gridEl = $("#calGrid", panel);

    function monthFirstWeekdayMon0(d){
      // JS: Sun=0..Sat=6; we want Mon=0..Sun=6
      const w = d.getDay(); // 0..6 (Sun..Sat)
      return (w + 6) % 7;
    }

    function renderMonth(){
      titleEl.textContent = fmtMonthYear(cursor);

      const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
      const startOffset = monthFirstWeekdayMon0(first);
      const daysInMonth = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0).getDate();

      const cells = [];
      // leading blanks
      for (let i=0;i<startOffset;i++){
        cells.push(`<div class="cal-cell cal-empty"></div>`);
      }

      for (let day=1; day<=daysInMonth; day++){
        const d = new Date(cursor.getFullYear(), cursor.getMonth(), day);
        const dk = dateKeyFromDate(d);
        const entries = idx.get(dk) || [];
        const isToday = dk === nowKey;

        const chips = entries.slice(0,3).map(ent=>{
          const p = posterUrl(cfg, ent.item);
          const epChip = ent.kind==="show" ? episodeChip(ent.ep) : "";
          return `
            <button class="cal-item" type="button" data-kind="${ent.kind}" data-id="${safeText(ent.item.tmdb_id||ent.item.id||"")}" title="${safeText(ent.title)}">
              ${p ? `<img loading="lazy" src="${p}" alt="">` : `<span class="cal-dot"></span>`}
              <span class="cal-item-title">${safeText(ent.title)}</span>
              ${epChip}
            </button>
          `;
        }).join("");

        const more = (entries.length>3) ? `<div class="cal-more">+${entries.length-3} more</div>` : "";

        cells.push(`
          <div class="cal-cell ${isToday ? "today" : ""}" data-date="${dk}">
            <div class="cal-day">
              <span class="cal-daynum">${day}</span>
            </div>
            <div class="cal-items">
              ${chips}
              ${more}
            </div>
          </div>
        `);
      }

      // trailing blanks to complete weeks to full rows (optional)
      const total = startOffset + daysInMonth;
      const rem = total % 7;
      if (rem !== 0){
        for (let i=0;i<(7-rem);i++) cells.push(`<div class="cal-cell cal-empty"></div>`);
      }

      gridEl.innerHTML = cells.join("");

      // handlers
      $$(".cal-item", gridEl).forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const kind = btn.getAttribute("data-kind");
          const id = btn.getAttribute("data-id");
          if (kind==="show"){
            const it = data.shows.find(x=> String(x.tmdb_id||x.id||"")===String(id));
            if (!it) return;
            openModal(detailHTML(cfg, it, "show"));
          } else {
            const it = data.movies.find(x=> String(x.tmdb_id||x.id||"")===String(id));
            if (!it) return;
            openModal(detailHTML(cfg, it, "movie"));
          }
        });
      });
    }

    $("#calPrev", panel).addEventListener("click", ()=>{
      cursor = new Date(cursor.getFullYear(), cursor.getMonth()-1, 1);
      renderMonth();
    });
    $("#calNext", panel).addEventListener("click", ()=>{
      cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
      renderMonth();
    });
    $("#calGoToday", panel).addEventListener("click", ()=>{
      cursor = new Date(today.getFullYear(), today.getMonth(), 1);
      renderMonth();
    });

    renderMonth();
  }

  function renderPlaceholder(panel, title){
    panel.innerHTML = `
      <div class="placeholder">
        <h2>${title}</h2>
        <div class="muted">Coming soon.</div>
      </div>
    `;
  }

  // ---------- routing ----------
  function showPanel(id){
    $$(".view").forEach(v=> v.classList.toggle("active", v.id === id));
    $$(".navbtn").forEach(b=> b.classList.toggle("active", b.getAttribute("data-target") === id));
  }

  function initNav(){
    $$(".navbtn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const t = btn.getAttribute("data-target");
        if (!t) return;
        showPanel(t);
      });
    });
  }

  // ---------- bootstrap ----------
  async function main(){
    initNav();
    showPanel("viewCalendar");

    const statusPill = $("#statusPill");
    if (statusPill) statusPill.textContent = "Initializing…";

    const { cfg, ok: cfgOk } = await tryLoadConfig();

    let dataOk = false;
    let data = { shows: [], movies: [] };
    try {
      data = await loadData();
      dataOk = true;
    } catch (e) {
      console.error(e);
      dataOk = false;
      // surface error
      const toast = $("#toast");
      if (toast){
        toast.classList.add("show","error");
        $("#toastText").textContent = "Failed to fetch";
      }
    }
    setStatus(dataOk, cfgOk);

    // render views
    const cal = $("#viewCalendar");
    const sh  = $("#viewShows");
    const mv  = $("#viewMovies");
    const lt  = $("#viewLiveTV");
    const wl  = $("#viewWatchlist");
    const ex  = $("#viewExplore");
    const pr  = $("#viewProfiles");
    const cf  = $("#viewConfig");

    if (dataOk){
      renderCalendar(cal, cfg, data);
      renderGrid(sh, cfg, data.shows, "show");
      renderGrid(mv, cfg, data.movies, "movie");
    } else {
      renderPlaceholder(cal, "Calendar");
      renderPlaceholder(sh, "Shows");
      renderPlaceholder(mv, "Movies");
    }

    renderPlaceholder(lt, "Live TV");
    renderPlaceholder(wl, "Watchlist");
    renderPlaceholder(ex, "Explore");
    renderPlaceholder(pr, "Profiles");
    renderPlaceholder(cf, "Config");

    if (statusPill) statusPill.textContent = dataOk ? "Ready" : "Failed";
  }

  // toast dismiss
  document.addEventListener("click", (e)=>{
    const b = e.target.closest && e.target.closest("#toastDismiss");
    if (!b) return;
    const toast = $("#toast");
    toast?.classList.remove("show");
  });

  main();
})();
</script>

</body>
</html>
