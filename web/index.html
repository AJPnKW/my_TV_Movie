<!--
File: /web/index.html
Project: my_TV_Movie
Version: v1.5.0 (2025-11-06)

Key features:
- Calendar:
  - 6x7 month grid (Sun-Sat), Prev/Next navigation.
  - Shows episodes for all days in visible grid (includes edges of prev/next month).
  - No greying of other-month days; consistent look.
  - Episode links include season+episode for VidSrc/Videasy.
- A–Z:
  - Grid of cards with poster first.
  - Click A–Z tab again to toggle A→Z / Z→A; label updates.
- Genres:
  - Genre chips + poster cards; same style.
- Config:
  - Respects localStorage:
      tvhub_theme: "dark" (default) or "light"
      tvhub_fontscale: e.g. "1.0", "1.2"
- Overlay:
  - Click any show title (Calendar/A–Z/Genres) to open detailed overlay:
      show overview, seasons list, expandable episode list per season.
  - TBA-only episodes hidden in overlay until real data exists.
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>My TV Hub</title>
  <style>
    :root{
      --bg:#0b0b0c;
      --fg:#f3f3f3;
      --mut:#b9b9c2;
      --card:#15151a;
      --chip:#22222a;
      --pri:#6ad1ff;
      --border:#252530;
      --fs-scale:1;
    }
    /* Light theme variant (toggled via data-theme) */
    :root[data-theme="light"]{
      --bg:#f5f5f7;
      --fg:#111827;
      --mut:#6b7280;
      --card:#ffffff;
      --chip:#e5e7eb;
      --pri:#2563eb;
      --border:#d1d5db;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font:calc(15px * var(--fs-scale))/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }

    a{
      color:var(--pri);
      text-decoration:none;
    }
    a:hover{ text-decoration:underline; }

    header{
      position:sticky;
      top:0;
      z-index:5;
      background:rgba(11,11,12,.9);
      backdrop-filter:saturate(1.4) blur(6px);
    }
    :root[data-theme="light"] header{
      background:rgba(245,245,247,.97);
      backdrop-filter:none;
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:14px;
    }

    h1{
      margin:0;
      font-size:22px;
    }

    .row{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }

    nav{
      display:flex;
      gap:8px;
      margin-top:10px;
      flex-wrap:wrap;
    }

    .tab{
      padding:10px 14px;
      border-radius:999px;
      background:var(--chip);
      cursor:pointer;
      font-size:14px;
      user-select:none;
    }
    .tab.active{
      background:var(--pri);
      color:#041f2a;
    }

    main.wrap{
      padding-top:10px;
      padding-bottom:24px;
    }

    .section{
      padding:4px 0 16px;
    }

    .mut{ color:var(--mut); }
    .divider{
      height:1px;
      background:var(--border);
      margin:8px 0;
    }

    .links a{
      margin-right:10px;
      font-size:11px;
    }

    .pill{
      display:inline-block;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid var(--border);
      font-size:11px;
    }

    /* --- Calendar --- */

    .cal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:8px;
      gap:8px;
    }

    .cal-title{
      font-size:18px;
      font-weight:600;
    }

    .cal-btn{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--chip);
      color:var(--fg);
      font-size:12px;
      cursor:pointer;
      user-select:none;
    }

    .cal-grid{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:4px;
      font-size:11px;
    }

    .cal-dow{
      text-align:center;
      padding:4px 0;
      color:var(--mut);
    }

    .cal-day{
      min-height:86px;
      padding:4px;
      border-radius:8px;
      background:#0f0f14;
      border:1px solid transparent;
      display:flex;
      flex-direction:column;
      gap:3px;
    }
    :root[data-theme="light"] .cal-day{
      background:#ffffff;
    }

    /* No grey-out: keep .out visually same as in-month for clarity */
    .cal-day.out{ }

    .cal-day.today{
      border-color:var(--pri);
    }

    .cal-date{
      font-weight:600;
      font-size:11px;
      margin-bottom:2px;
    }

    .cal-ep{
      display:flex;
      gap:4px;
      align-items:flex-start;
    }

    .cal-ep img{
      width:22px;
      height:33px;
      border-radius:4px;
      object-fit:cover;
      flex-shrink:0;
      background:#111;
    }

    .cal-ep span{
      display:block;
      font-size:9px;
      line-height:1.2;
    }

    .cal-ep .show{
      font-weight:600;
      color:var(--fg);
      cursor:pointer;
    }
    .cal-ep .code{
      color:var(--mut);
    }

    /* --- Shared card layout (A–Z, Genres) --- */

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:12px;
    }

    .card{
      background:var(--card);
      border-radius:14px;
      padding:10px;
      display:flex;
      gap:8px;
      align-items:flex-start;
    }

    .poster{
      width:70px;
      height:105px;
      border-radius:10px;
      object-fit:cover;
      flex-shrink:0;
      background:#111;
    }

    .card-body{
      display:flex;
      flex-direction:column;
      gap:4px;
      flex:1;
      min-width:0;
    }

    .title{
      font-size:16px;
      font-weight:700;
      cursor:pointer;
    }

    .small{ font-size:12px; }

    /* --- Genres --- */

    .chip{
      background:var(--chip);
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      cursor:pointer;
      user-select:none;
    }
    .chip.active{
      background:var(--pri);
      color:#041f2a;
    }

    .genre-bar{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-bottom:10px;
    }

    /* --- A–Z header --- */

    .az-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      margin-bottom:6px;
      font-size:12px;
      color:var(--mut);
    }

    .sort-label{
      padding:4px 8px;
      border-radius:999px;
      border:1px solid var(--border);
      font-size:11px;
      user-select:none;
    }

    /* --- Overlay (show details) --- */

    .overlay[hidden]{ display:none; }

    .overlay{
      position:fixed;
      inset:0;
      z-index:40;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .overlay-backdrop{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.7);
    }

    .overlay-panel{
      position:relative;
      max-width:900px;
      max-height:85vh;
      padding:16px;
      background:var(--card);
      border-radius:18px;
      box-shadow:0 18px 45px rgba(0,0,0,.6);
      overflow:auto;
      z-index:41;
    }
    :root[data-theme="light"] .overlay-panel{
      background:#ffffff;
      box-shadow:0 18px 45px rgba(0,0,0,.18);
    }

    .overlay-close{
      position:absolute;
      top:8px;
      right:10px;
      border:none;
      background:transparent;
      color:var(--mut);
      font-size:20px;
      cursor:pointer;
    }

    .ov-header{
      display:flex;
      gap:12px;
      align-items:flex-start;
      margin-bottom:8px;
    }

    .ov-poster{
      width:90px;
      height:135px;
      border-radius:12px;
      object-fit:cover;
      background:#111;
      flex-shrink:0;
    }

    .ov-title{
      font-size:20px;
      font-weight:700;
      margin-bottom:4px;
    }

    .ov-overview{
      font-size:13px;
      color:var(--mut);
    }

    .season-list{
      margin-top:8px;
      font-size:13px;
    }

    .season-row{
      padding:6px 0;
      border-bottom:1px solid var(--border);
      cursor:pointer;
    }

    .season-label{
      font-weight:600;
    }

    .season-meta{
      font-size:11px;
      color:var(--mut);
    }

    .season-overview{
      font-size:11px;
      color:var(--mut);
      margin-top:2px;
    }

    .episodes{
      margin-top:6px;
      padding-left:4px;
      font-size:11px;
    }

    .ep-row{
      margin-bottom:2px;
    }

  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="row" style="justify-content:space-between">
        <h1>My TV Hub</h1>
        <div class="row small">
          <a href="config.html">Config</a>
        </div>
      </div>
      <nav>
        <div class="tab active" data-tab="calendar">Calendar</div>
        <div class="tab" data-tab="az">A–Z</div>
        <div class="tab" data-tab="genres">Genres</div>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="calendar" class="section"></section>
    <section id="az" class="section" hidden></section>
    <section id="genres" class="section" hidden></section>
  </main>

  <!-- Show detail overlay -->
  <div id="overlay" class="overlay" hidden>
    <div class="overlay-backdrop"></div>
    <div class="overlay-panel">
      <button class="overlay-close" aria-label="Close">&times;</button>
      <div id="overlay-content"></div>
    </div>
  </div>

  <script>
    const $  = (s) => document.querySelector(s);
    const $$ = (s) => Array.from(document.querySelectorAll(s));
    const IMG = (p) => p ? `https://image.tmdb.org/t/p/w300${p}` : '';
    const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    const state = {
      data: null,
      today: new Date(),
      currentMonth: null,
      azDir: 'asc',
      activeGenre: 'All',
    };

    // --- Apply config (theme + font size) from localStorage ---
    function applyConfigFromStorage(){
      const theme = localStorage.getItem('tvhub_theme') || 'dark';
      const scale = parseFloat(localStorage.getItem('tvhub_fontscale') || '1') || 1;
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.setProperty('--fs-scale', String(scale));
    }
    applyConfigFromStorage();

    // --- Data helpers ---
    function getAllShows(){
      return (state.data && Array.isArray(state.data.shows))
        ? state.data.shows
        : [];
    }

    function isTBAName(name){
      if(!name) return True;
      const n = name.trim().toUpperCase();
      return n === 'TBA';
    }

    // --- Load data.json ---
    async function load(){
      try{
        const res = await fetch('../data/data.json', { cache:'no-cache' });
        if(!res.ok) throw new Error('Failed to load data.json');
        state.data = await res.json();
        state.currentMonth = new Date(state.today.getFullYear(), state.today.getMonth(), 1);
        renderAll();
        attachTabs();
      }catch(err){
        console.error(err);
        $('#calendar').innerHTML =
          '<div class="mut">Unable to load data. Make sure the GitHub Actions refresh has run.</div>';
      }
    }

    // --- Links ---
    function showLinks(show){
      const sid = show.show_id;
      return `
        <div class="links small">
          <a target="_blank" href="${show.links.tmdb}">TMDB</a>
          <a target="_blank" href="https://vidsrc.net/embed/tv/${sid}">VidSrc</a>
          <a target="_blank" href="https://player.videasy.net/tv/${sid}">Videasy</a>
        </div>
      `;
    }

    function episodeLinks(show, seasonNum, epNum){
      const sid = show.show_id;
      const s = seasonNum;
      const e = epNum || '';
      return `
        <div class="links small">
          <a target="_blank" href="${show.links.tmdb}">TMDB</a>
          <a target="_blank" href="https://vidsrc.net/embed/tv/${sid}/${s}/${e}">VidSrc</a>
          <a target="_blank" href="https://player.videasy.net/tv/${sid}/${s}/${e}">Videasy</a>
        </div>
      `;
    }

    // --- Tabs ---
    function attachTabs(){
      $$('.tab').forEach(tab=>{
        tab.addEventListener('click', ()=>{
          const target = tab.dataset.tab;
          const isActive = tab.classList.contains('active');

          // Special: clicking A–Z while active toggles sort
          if(target === 'az' && isActive){
            state.azDir = state.azDir === 'asc' ? 'desc' : 'asc';
            renderAZ();
            return;
          }

          $$('.tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');

          ['calendar','az','genres'].forEach(id => {
            $('#'+id).hidden = (id !== target);
          });

          if(target === 'calendar') renderCalendar();
          if(target === 'az')       renderAZ();
          if(target === 'genres')   renderGenres();
        });
      });
    }

    // --- Calendar (6x7 grid with prev/next) ---
    function changeMonth(delta){
      const m = state.currentMonth;
      state.currentMonth = new Date(m.getFullYear(), m.getMonth() + delta, 1);
      renderCalendar();
    }

    function renderCalendar(){
      const host = $('#calendar');
      const shows = getAllShows();
      if(!shows.length){
        host.innerHTML = '<div class="mut">No shows loaded.</div>';
        return;
      }
      if(!state.currentMonth){
        state.currentMonth = new Date(state.today.getFullYear(), state.today.getMonth(), 1);
      }

      // Map all episodes by date
      const byDate = {};
      for(const show of shows){
        for(const s of show.seasons || []){
          for(const e of s.episodes || []){
            if(!e.air_date) continue;
            const key = e.air_date;
            (byDate[key] ||= []).push({ show, season:s.season_number, ep:e });
          }
        }
      }
      for(const key in byDate){
        byDate[key].sort((a,b)=>{
          if(a.show.name < b.show.name) return -1;
          if(a.show.name > b.show.name) return 1;
          return (a.ep.episode_number || 0) - (b.ep.episode_number || 0);
        });
      }

      const year  = state.currentMonth.getFullYear();
      const month = state.currentMonth.getMonth();
      const first = new Date(year, month, 1);
      const firstDow = first.getDay(); // 0=Sun

      const startDate = new Date(first);
      startDate.setDate(first.getDate() - firstDow);

      const monthName = first.toLocaleString(undefined, { month:'long', year:'numeric' });

      let html = `
        <div class="cal-header">
          <button class="cal-btn" id="cal-prev">&lt; Prev</button>
          <div class="cal-title">${monthName}</div>
          <button class="cal-btn" id="cal-next">Next &gt;</button>
        </div>
        <div class="cal-grid">
      `;

      // DOW header
      for(const d of DOW){
        html += `<div class="cal-dow">${d}</div>`;
      }

      // 6 weeks
      for(let i=0;i<42;i++){
        const d = new Date(startDate);
        d.setDate(startDate.getDate() + i);

        const inMonth = (d.getMonth() === month);
        const isToday =
          d.getFullYear() === state.today.getFullYear() &&
          d.getMonth() === state.today.getMonth() &&
          d.getDate() === state.today.getDate();

        const ymd = d.toISOString().slice(0,10);
        const episodes = byDate[ymd] || [];

        html += `<div class="cal-day${inMonth?'':' out'}${isToday?' today':''}">`;
        html += `<div class="cal-date">${d.getDate()}</div>`;

        for(const item of episodes){
          const { show, season, ep } = item;
          html += `
            <div class="cal-ep">
              ${show.poster_path ? `<img src="${IMG(show.poster_path)}" alt="">` : ''}
              <div>
                <span class="show link-show" data-show-id="${show.show_id}">${show.name}</span>
                <span class="code">
                  S${String(season).padStart(2,'0')}E${String(ep.episode_number||0).padStart(2,'0')}
                  ${ep.name ? ' · ' + ep.name : ''}
                </span>
                ${episodeLinks(show, season, ep.episode_number)}
              </div>
            </div>
          `;
        }

        html += `</div>`;
      }

      html += `</div>`;
      host.innerHTML = html;

      $('#cal-prev').onclick = () => changeMonth(-1);
      $('#cal-next').onclick = () => changeMonth(1);

      wireShowClicks();
    }

    // --- A–Z ---
    function renderAZ(){
      const host = $('#az');
      const shows = getAllShows().slice();
      if(!shows.length){
        host.innerHTML = '<div class="mut">No shows loaded.</div>';
        return;
      }

      shows.sort((a,b)=>{
        if(a.name < b.name) return state.azDir === 'asc' ? -1 : 1;
        if(a.name > b.name) return state.azDir === 'asc' ? 1 : -1;
        return 0;
      });

      const dirLabel = state.azDir === 'asc' ? 'A \u2192 Z' : 'Z \u2192 A';

      let html = `
        <div class="az-header">
          <div>Sorted: ${dirLabel}</div>
          <div class="sort-label">Click the A–Z tab again to toggle</div>
        </div>
        <div class="grid">
      `;

      for(const sh of shows){
        html += `
          <div class="card">
            ${sh.poster_path
              ? `<img class="poster" src="${IMG(sh.poster_path)}" alt="${sh.name} poster">`
              : `<div class="poster"></div>`}
            <div class="card-body">
              <div class="title link-show" data-show-id="${sh.show_id}">${sh.name}</div>
              <div class="mut small">${(sh.genres || []).join(', ')}</div>
              <div class="divider"></div>
              ${(sh.seasons || []).map(se => `
                <div class="row small">
                  <span class="pill">Season ${se.season_number}</span>
                  <span class="mut">${(se.episodes || []).length} episodes</span>
                </div>
              `).join('')}
              ${showLinks(sh)}
            </div>
          </div>
        `;
      }

      html += `</div>`;
      host.innerHTML = html;

      wireShowClicks();
    }

    // --- Genres ---
    function renderGenres(){
      const host = $('#genres');
      const shows = getAllShows();
      if(!shows.length){
        host.innerHTML = '<div class="mut">No shows loaded.</div>';
        return;
      }

      const allGenres = new Set();
      for(const sh of shows){ (sh.genres || []).forEach(g => allGenres.add(g)); }
      const tags = ['All', ...Array.from(allGenres).sort()];
      if(!tags.includes(state.activeGenre)) state.activeGenre = 'All';

      const bar = document.createElement('div');
      bar.className = 'genre-bar';

      tags.forEach(g=>{
        const chip = document.createElement('div');
        chip.className = 'chip' + (g === state.activeGenre ? ' active' : '');
        chip.textContent = g;
        chip.onclick = () => {
          state.activeGenre = g;
          renderGenres(); // rerender
        };
        bar.appendChild(chip);
      });

      const grid = document.createElement('div');
      grid.className = 'grid';

      for(const sh of shows){
        if(state.activeGenre !== 'All' &&
           !(sh.genres || []).includes(state.activeGenre)){
          continue;
        }
        const card = document.createElement('div');
        card.className = 'card';

        const posterHtml = sh.poster_path
          ? `<img class="poster" src="${IMG(sh.poster_path)}" alt="${sh.name} poster">`
          : `<div class="poster"></div>`;

        card.innerHTML = `
          ${posterHtml}
          <div class="card-body">
            <div class="title link-show" data-show-id="${sh.show_id}">${sh.name}</div>
            <div class="mut small">${(sh.genres || []).join(', ') || '&nbsp;'}</div>
            <div class="divider"></div>
            ${showLinks(sh)}
          </div>
        `;
        grid.appendChild(card);
      }

      host.innerHTML = '';
      host.appendChild(bar);
      host.appendChild(grid);

      if(!grid.children.length){
        grid.innerHTML = '<div class="mut">No shows for this genre.</div>';
      }

      wireShowClicks();
    }

    // --- Overlay: show details + seasons/episodes ---

    function wireShowClicks(){
      $$('.link-show').forEach(el=>{
        el.onclick = (e)=>{
          e.preventDefault();
          const id = parseInt(el.dataset.showId, 10);
          const show = getAllShows().find(s => s.show_id === id);
          if(show) openOverlay(show);
        };
      });
    }

    function openOverlay(show){
      const ov = $('#overlay');
      const content = $('#overlay-content');

      const seasons = show.seasons || [];

      // Build seasons list
      let seasonsHtml = '';
      for(const s of seasons){
        const eps = s.episodes || [];
        const firstEp = eps.find(ep => ep.air_date) || eps[0];
        const year = firstEp && firstEp.air_date ? firstEp.air_date.slice(0,4) : '';
        seasonsHtml += `
          <div class="season-row" data-season="${s.season_number}">
            <div class="season-label">Season ${s.season_number}</div>
            <div class="season-meta">
              ${year ? year + ' \u2022 ' : ''}${eps.length} Episodes
            </div>
            ${s.overview ? `<div class="season-overview">${s.overview}</div>` : ''}
          </div>
        `;
      }

      content.innerHTML = `
        <div class="ov-header">
          ${show.poster_path
            ? `<img class="ov-poster" src="${IMG(show.poster_path)}" alt="${show.name} poster">`
            : `<div class="ov-poster"></div>`}
          <div>
            <div class="ov-title">${show.name}</div>
            ${show.genres && show.genres.length
              ? `<div class="mut small">${show.genres.join(', ')}</div>` : ''}
            ${show.overview
              ? `<div class="ov-overview">${show.overview}</div>` : ''}
          </div>
        </div>
        <div class="season-list">
          ${seasonsHtml || '<div class="mut">No season data.</div>'}
        </div>
      `;

      // Season click → show episodes list inline
      content.querySelectorAll('.season-row').forEach(row=>{
        row.addEventListener('click', ()=>{
          const sn = parseInt(row.dataset.season, 10);
          const targetSeason = seasons.find(s => s.season_number === sn);
          if(!targetSeason) return;

          const wrapId = `eps-${sn}`;
          let wrap = row.nextElementSibling;
          if(wrap && wrap.id === wrapId){
            // toggle off
            wrap.remove();
            return;
          }
          // remove any other episode blocks
          content.querySelectorAll('.episodes').forEach(e => e.remove());

          wrap = document.createElement('div');
          wrap.className = 'episodes';
          wrap.id = wrapId;

          const eps = (targetSeason.episodes || []).filter(ep=>{
            // hide pure TBA slots (name "TBA" and no details)
            if(!ep.name) return false;
            const n = ep.name.trim().toUpperCase();
            if(n === 'TBA' && !ep.overview) return false;
            return True;
          });

          if(!eps.length){
            wrap.innerHTML = '<div class="mut">No detailed episodes yet.</div>';
          }else{
            wrap.innerHTML = eps.map(ep=>{
              const code =
                `S${String(sn).padStart(2,'0')}E${String(ep.episode_number||0).padStart(2,'0')}`;
              const date = ep.air_date || '';
              const overview = ep.overview ? ` - ${ep.overview}` : '';
              return `
                <div class="ep-row">
                  <strong>${code}</strong> ${ep.name || ''}
                  ${date ? ` · ${date}` : ''}
                  ${overview}
                </div>
              `;
            }).join('');
          }

          row.insertAdjacentElement('afterend', wrap);
        });
      });

      ov.hidden = false;

      // Close handlers
      $('.overlay-close').onclick = ()=> closeOverlay();
      $('.overlay-backdrop').onclick = ()=> closeOverlay();
    }

    function closeOverlay(){
      $('#overlay').hidden = true;
      $('#overlay-content').innerHTML = '';
    }

    // --- Orchestrator ---
    function renderAll(){
      renderCalendar();
      renderAZ();
      renderGenres();
    }

    load();
  </script>
</body>
</html>
