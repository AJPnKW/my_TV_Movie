<!-- ========================================================================================
[FILE] web/index.html
[PROJECT] my_TV_Movie (My TV Hub)
[ROLE] Single-Page Application shell (single entry point; dynamic views + popup root)
[VERSION] v4.1.0
[UPDATED] 2025-12-19_00-00-00
[BUILD] 00.00.00
[OWNER] Andrew & Brant (internal)
[DEPENDS ON] web/css/my_tv_hub.css web/config.json data/data.json
[NOTES]
- True SPA shell: internal state routing only; no URL changes; no hash routing.
- Views (fixed): Calendar, Shows, Movies, Live TV, Watchlist, Explore, Profiles, Config.
- One global popup root; stacked overlays; Escape/Back closes top popup; scroll trapped in popup.
- data.json is loaded once and never mutated.
- Canonical asset hierarchy ONLY (assets/...); never reference deprecated image/ folder.
======================================================================================== -->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>My TV Hub</title>

  <!-- External CSS (module boundary respected) -->
  <link rel="stylesheet" href="./css/my_tv_hub.css" />

  <!-- Minimal SPA-shell CSS (self-contained; does not modify other modules) -->
  <style>
    :root {
      --bg: #0b0d12;
      --fg: #e8ecf3;
      --muted: #a8b0c0;
      --panel: #121725;
      --panel2: #0f1420;
      --border: rgba(255,255,255,0.10);
      --focus: #ffffff;
      --danger: #ff5b5b;
      --ok: #35d07f;

      --header-h: 64px;
      --nav-h: 56px;

      --radius: 14px;
      --pad: 14px;

      --font: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      overflow: hidden; /* SPA: scroll is handled inside view panels */
    }

    /* Global header (sticky; always visible) */
    #global-header {
      position: sticky;
      top: 0;
      z-index: 30;
      height: var(--header-h);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      background: linear-gradient(180deg, rgba(18,23,37,0.96), rgba(18,23,37,0.88));
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    #brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
    }

    #brand .logo-chip {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255,255,255,0.10);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    #brand .title {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    #brand .title .name {
      font-size: 16px;
      font-weight: 650;
      letter-spacing: 0.2px;
    }
    #brand .title .sub {
      font-size: 12px;
      color: var(--muted);
    }

    #header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 260px;
      justify-content: flex-end;
    }

    #status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 10px;
      background: rgba(255,255,255,0.06);
      font-size: 12px;
      color: var(--muted);
      user-select: none;
    }

    #status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.06) inset;
      flex: 0 0 auto;
    }

    #error-surface {
      max-width: 520px;
      display: none;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 91, 91, 0.35);
      background: rgba(255, 91, 91, 0.10);
      color: #ffd7d7;
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 12px;
    }
    #error-surface .label { font-weight: 650; }
    #error-surface .msg {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 380px;
    }
    #error-surface button {
      margin-left: auto;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: var(--fg);
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
    }
    #error-surface button:focus {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    /* Main nav (tabs) */
    #main-nav {
      height: var(--nav-h);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(15,20,32,0.92);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: var(--header-h);
      z-index: 25;
      backdrop-filter: blur(10px);
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 40px;
      min-width: 118px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--fg);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
      cursor: pointer;
      user-select: none;
    }
    .nav-btn[aria-selected="true"] {
      background: rgba(255,255,255,0.14);
      border-color: rgba(255,255,255,0.22);
    }
    .nav-btn:focus {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    /* App body */
    #app-shell {
      height: calc(100% - var(--header-h) - var(--nav-h));
      display: flex;
      flex-direction: column;
    }

    #content-root {
      flex: 1 1 auto;
      overflow: auto;
      padding: 14px;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    .view-panel {
      background: rgba(18,23,37,0.78);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      min-height: calc(100% - 2px);
      box-sizing: border-box;
    }

    .view-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 0 0 10px 0;
    }
    .view-title h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 750;
    }
    .view-title .meta {
      color: var(--muted);
      font-size: 12px;
      font-family: var(--mono);
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    /* Popup system */
    #popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none; /* enabled when stack not empty */
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(6px);
    }

    #popup-container {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none; /* enabled when stack not empty */
      pointer-events: none; /* only active popups handle */
    }

    .popup {
      pointer-events: auto;
      position: absolute;
      inset: 6% 6%;
      background: rgba(18,23,37,0.98);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden; /* scroll trapped inside popup body */
    }

    .popup-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(15,20,32,0.96);
    }

    .popup-header .title {
      font-weight: 800;
      font-size: 15px;
    }

    .popup-header .spacer { margin-left: auto; }

    .popup-header .btn {
      border: 1px solid rgba(255,255,255,0.20);
      background: rgba(255,255,255,0.08);
      color: var(--fg);
      border-radius: 12px;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 650;
      font-size: 12px;
    }
    .popup-header .btn:focus {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .popup-body {
      flex: 1 1 auto;
      overflow: auto;
      padding: 14px;
    }

    /* Utility */
    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
  </style>
</head>

<body>
  <!-- GLOBAL HEADER (sticky; always visible) -->
  <header id="global-header" role="banner">
    <div id="brand" aria-label="My TV Hub">
      <div class="logo-chip" aria-hidden="true">
        <!-- UI chrome icon path must be canonical; do not hardcode unknown filenames -->
        <span style="font-weight:900;">TV</span>
      </div>
      <div class="title">
        <div class="name">My TV Hub</div>
        <div class="sub">Single-page • DPAD-first • Local assets</div>
      </div>
    </div>

    <div id="error-surface" role="status" aria-live="polite">
      <span class="label">Error</span>
      <span class="msg" id="error-msg"></span>
      <button type="button" id="error-dismiss">Dismiss</button>
    </div>

    <div id="header-right">
      <div id="status-pill" aria-label="Load status">
        <span id="status-dot" aria-hidden="true"></span>
        <span id="status-text">Initializing…</span>
      </div>
    </div>
  </header>

  <!-- MAIN NAV (tabs; calls renderView(<view>)) -->
  <nav id="main-nav" role="tablist" aria-label="Main navigation tabs">
    <button class="nav-btn" role="tab" aria-selected="true" data-view="calendar">Calendar</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="shows">Shows</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="movies">Movies</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="live_tv">Live TV</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="watchlist">Watchlist</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="explore">Explore</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="profiles">Profiles</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="config">Config</button>
  </nav>

  <!-- SPA SHELL -->
  <main id="app-shell" role="main">
    <div id="content-root" tabindex="-1" aria-label="Active view content"></div>
  </main>

  <!-- POPUP SYSTEM (global root) -->
  <div id="popup-overlay" aria-hidden="true"></div>
  <div id="popup-container" aria-live="polite" aria-label="Popup overlays"></div>

  <script>
    "use strict";

    // =====================================================================================
    // SPA Shell Runtime (index.html module only)
    // - Internal state routing only (no URL changes)
    // - data.json loaded once and never mutated
    // - Global popup root with stacked overlays; Escape/Back closes top popup
    // - Canonical assets hierarchy only (assets/...)
    // =====================================================================================

    const VIEWS = Object.freeze([
      { key: "calendar",  label: "Calendar"  },
      { key: "shows",     label: "Shows"     },
      { key: "movies",    label: "Movies"    },
      { key: "live_tv",   label: "Live TV"   },
      { key: "watchlist", label: "Watchlist" },
      { key: "explore",   label: "Explore"   },
      { key: "profiles",  label: "Profiles"  },
      { key: "config",    label: "Config"    }
    ]);

    const App = {
      state: {
        active_view: "calendar",
        data_loaded: false,
        config_loaded: false,
        fatal_error: null
      },
      // data.json is loaded once and never mutated
      frozen_data: null,
      config: null,
      popup_stack: []
    };

    const el = {
      contentRoot: document.getElementById("content-root"),
      popupOverlay: document.getElementById("popup-overlay"),
      popupContainer: document.getElementById("popup-container"),
      statusDot: document.getElementById("status-dot"),
      statusText: document.getElementById("status-text"),
      errorSurface: document.getElementById("error-surface"),
      errorMsg: document.getElementById("error-msg"),
      errorDismiss: document.getElementById("error-dismiss"),
      nav: document.getElementById("main-nav")
    };

    function setStatus(kind, text) {
      // kind: "idle" | "ok" | "warn" | "error"
      el.statusText.textContent = text;
      if (kind === "ok") el.statusDot.style.background = "var(--ok)";
      else if (kind === "error") el.statusDot.style.background = "var(--danger)";
      else el.statusDot.style.background = "rgba(255,255,255,0.25)";
    }

    function showError(message) {
      el.errorMsg.textContent = String(message || "Unknown error");
      el.errorSurface.style.display = "inline-flex";
    }

    function clearErrorSurface() {
      el.errorMsg.textContent = "";
      el.errorSurface.style.display = "none";
    }

    function safeJsonParse(text, contextLabel) {
      try { return JSON.parse(text); }
      catch (e) {
        throw new Error(`Invalid JSON in ${contextLabel}: ${e && e.message ? e.message : e}`);
      }
    }

    async function loadConfigOnce() {
      // Authoritative config for streaming + image cache + UI tuning
      const resp = await fetch("./config.json", { cache: "no-store" });
      if (!resp.ok) throw new Error(`Failed to load config.json (${resp.status})`);
      const text = await resp.text();
      const cfg = safeJsonParse(text, "web/config.json");
      App.config = cfg;
      App.state.config_loaded = true;
    }

    async function loadDataOnce() {
      // Canonical data model output (not manually edited)
      const resp = await fetch("../data/data.json", { cache: "no-store" });
      if (!resp.ok) throw new Error(`Failed to load data.json (${resp.status})`);
      const text = await resp.text();
      const data = safeJsonParse(text, "data/data.json");
      // Freeze to enforce "never mutated"
      App.frozen_data = Object.freeze(data);
      App.state.data_loaded = true;
    }

    function setActiveNav(viewKey) {
      const btns = Array.from(el.nav.querySelectorAll(".nav-btn"));
      for (const b of btns) {
        const isActive = (b.getAttribute("data-view") === viewKey);
        b.setAttribute("aria-selected", isActive ? "true" : "false");
      }
    }

    function renderView(viewKey) {
      // Internal state routing only; no URL changes
      App.state.active_view = viewKey;
      setActiveNav(viewKey);

      const panel = document.createElement("section");
      panel.className = "view-panel";
      panel.setAttribute("data-view", viewKey);

      const titleRow = document.createElement("div");
      titleRow.className = "view-title";

      const h1 = document.createElement("h1");
      const viewMeta = VIEWS.find(v => v.key === viewKey);
      h1.textContent = viewMeta ? viewMeta.label : viewKey;

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = (App.state.data_loaded && App.state.config_loaded) ? "READY" : "LOADING";

      titleRow.appendChild(h1);
      titleRow.appendChild(meta);
      panel.appendChild(titleRow);

      const hint = document.createElement("div");
      hint.className = "hint";

      // NOTE: View renderers are placeholders here only as structural compliance:
      // - view containers exist
      // - routing calls renderView(view)
      // Detailed view renderers are rebuilt in their own modules later.
      if (!App.state.data_loaded || !App.state.config_loaded) {
        hint.textContent = "Loading required data/config…";
      } else {
        hint.textContent = `View container ready: ${h1.textContent}.`;
      }

      panel.appendChild(hint);

      el.contentRoot.innerHTML = "";
      el.contentRoot.appendChild(panel);
      el.contentRoot.focus({ preventScroll: true });
    }

    // ==========================
    // Popup System (stacked)
    // ==========================

    function syncPopupDom() {
      const hasPopups = App.popup_stack.length > 0;
      el.popupOverlay.style.display = hasPopups ? "block" : "none";
      el.popupContainer.style.display = hasPopups ? "block" : "none";
      el.popupOverlay.setAttribute("aria-hidden", hasPopups ? "false" : "true");

      el.popupContainer.innerHTML = "";
      if (!hasPopups) return;

      // Render all popups in stack order; topmost last
      for (let i = 0; i < App.popup_stack.length; i++) {
        const p = App.popup_stack[i];

        const popup = document.createElement("div");
        popup.className = "popup";
        popup.setAttribute("role", "dialog");
        popup.setAttribute("aria-modal", "true");
        popup.setAttribute("data-popup-index", String(i));
        popup.style.zIndex = String(90 + i);

        const header = document.createElement("div");
        header.className = "popup-header";

        const t = document.createElement("div");
        t.className = "title";
        t.textContent = p && p.title ? String(p.title) : "Popup";

        const spacer = document.createElement("div");
        spacer.className = "spacer";

        const closeBtn = document.createElement("button");
        closeBtn.type = "button";
        closeBtn.className = "btn";
        closeBtn.textContent = "Close";
        closeBtn.addEventListener("click", () => closeTopPopup());

        header.appendChild(t);
        header.appendChild(spacer);
        header.appendChild(closeBtn);

        const body = document.createElement("div");
        body.className = "popup-body";
        body.tabIndex = 0;

        const bodyText = document.createElement("div");
        bodyText.className = "hint";
        bodyText.textContent = p && p.body ? String(p.body) : "Popup body container ready.";
        body.appendChild(bodyText);

        popup.appendChild(header);
        popup.appendChild(body);

        el.popupContainer.appendChild(popup);
      }

      // Focus inside top popup
      const topPopup = el.popupContainer.querySelector(".popup:last-child .popup-body");
      if (topPopup) topPopup.focus({ preventScroll: true });
    }

    function openPopup(payload) {
      App.popup_stack.push(payload || { title: "Popup", body: "" });
      syncPopupDom();
    }

    function closeTopPopup() {
      if (App.popup_stack.length === 0) return;
      App.popup_stack.pop();
      syncPopupDom();
      if (App.popup_stack.length === 0) {
        // Return focus to active view
        el.contentRoot.focus({ preventScroll: true });
      }
    }

    function closeAllPopups() {
      if (App.popup_stack.length === 0) return;
      App.popup_stack = [];
      syncPopupDom();
      el.contentRoot.focus({ preventScroll: true });
    }

    // ==========================
    // Event wiring
    // ==========================

    function onNavClick(e) {
      const btn = e.target && e.target.closest ? e.target.closest(".nav-btn") : null;
      if (!btn) return;
      const viewKey = btn.getAttribute("data-view");
      if (!viewKey) return;
      renderView(viewKey);
    }

    function onGlobalKeyDown(e) {
      // Escape/Back closes the top popup (if any)
      if (e.key === "Escape") {
        if (App.popup_stack.length > 0) {
          e.preventDefault();
          closeTopPopup();
          return;
        }
      }

      // Minimal deterministic shortcuts (internal; no URL changes)
      // (No speculative keymaps beyond popup close.)
    }

    function wireEvents() {
      el.nav.addEventListener("click", onNavClick);
      document.addEventListener("keydown", onGlobalKeyDown);

      el.errorDismiss.addEventListener("click", () => clearErrorSurface());
      el.popupOverlay.addEventListener("click", () => {
        // Clicking overlay closes top popup (consistent with stacked overlay behavior)
        closeTopPopup();
      });
    }

    // ==========================
    // Boot
    // ==========================

    async function boot() {
      clearErrorSurface();
      setStatus("idle", "Loading config…");
      try {
        wireEvents();

        await loadConfigOnce();
        setStatus("idle", "Loading data…");

        await loadDataOnce();
        setStatus("ok", "Loaded");

        // Initial view render (Calendar by default)
        renderView(App.state.active_view);

        // If data.json contains errors array/object per spec, surface summary non-silently
        // (Do not mutate; only read.)
        try {
          const d = App.frozen_data;
          if (d && d.errors && Array.isArray(d.errors) && d.errors.length > 0) {
            showError(`data.json reports ${d.errors.length} error(s).`);
            setStatus("error", "Loaded with errors");
          }
        } catch (_) {
          // Non-fatal; still no silent failures elsewhere.
        }

      } catch (err) {
        App.state.fatal_error = (err && err.message) ? err.message : String(err);
        showError(App.state.fatal_error);
        setStatus("error", "Fatal error");
        // Render a deterministic error view container
        renderView("config");
      }
    }

    // Expose strictly-limited debug hooks (read-only; no mutation)
    window.MyTVHub = Object.freeze({
      renderView,
      openPopup,
      closeTopPopup,
      closeAllPopups,
      getData: () => App.frozen_data,
      getConfig: () => App.config
    });

    boot();
  </script>
</body>
</html>
