<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- [HTML-1.0] Document meta + version -->
    <meta charset="UTF-8" />
    <title>My TV Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Static TV + Movies + Live TV hub for Andrew & Brant" />

    <!-- [HTML-1.1] External CSS (keep filename EXACT) -->
    <link rel="stylesheet" href="css/my_tv_hub.css?v=3.3.5" />
  </head>

  <body>
    <!-- [HTML-2.0] App shell -->
    <div class="app-shell">
      <!-- ===================================================== -->
      <!-- [HTML-2.1] Header + nav -->
      <!-- ===================================================== -->
      <header class="app-header">
        <div class="app-header-inner">
          <div class="app-title">
            <h1>My TV Hub</h1>
            <div class="app-meta" id="meta-line">index.html: v3.3.5 • Loading…</div>
          </div>

          <nav class="nav" aria-label="Views">
            <!-- [HTML-2.1.1] View buttons -->
            <button class="nav-button active" data-view="calendar" id="btn-view-calendar" type="button">
              <span class="nav-icon" aria-hidden="true">📅</span>
              <span class="nav-label">Calendar</span>
            </button>

            <button class="nav-button" data-view="shows" id="btn-view-shows" type="button">
              <span class="nav-icon" aria-hidden="true">🎬</span>
              <span class="nav-label">Shows</span>
            </button>

            <button class="nav-button" data-view="movies" id="btn-view-movies" type="button">
              <span class="nav-icon" aria-hidden="true">🎞️</span>
              <span class="nav-label">Movies</span>
            </button>

            <button class="nav-button" data-view="live" id="btn-view-live" type="button">
              <span class="nav-icon" aria-hidden="true">📺</span>
              <span class="nav-label">Live</span>
            </button>

            <button class="nav-button" data-view="config" id="btn-view-config" type="button">
              <span class="nav-icon" aria-hidden="true">⚙️</span>
              <span class="nav-label">Config</span>
            </button>

            <!-- [HTML-2.1.2] Direct link to show.html -->
            <a class="nav-button nav-link" href="show.html" id="btn-go-showpage" title="Open show.html">
              <span class="nav-icon" aria-hidden="true">🧩</span>
              <span class="nav-label">Show Page</span>
            </a>
          </nav>

          <!-- [HTML-2.2] Global subtitle (context line under view buttons) -->
          <div class="view-subtitle" id="view-subtitle">Episodes &amp; movie releases by air date.</div>
        </div>
      </header>

      <!-- ===================================================== -->
      <!-- [HTML-3.0] Main content area -->
      <!-- ===================================================== -->
      <main class="app-main">
        <!-- ===================================================== -->
        <!-- [HTML-3.1] Calendar Tab -->
        <!-- ===================================================== -->
        <section class="tab active" id="tab-calendar" aria-label="Calendar view">
          <div class="calendar-header card">
            <div class="calendar-header-top">
              <div class="calendar-month" id="cal-month-title">Month</div>
              <div class="calendar-range muted" id="cal-month-range">Range</div>
            </div>

            <div class="calendar-header-actions">
              <button class="btn" id="btn-cal-prev" type="button">« Prev</button>
              <button class="btn" id="btn-cal-today" type="button">Today</button>
              <button class="btn" id="btn-cal-next" type="button">Next »</button>
            </div>
          </div>

          <!-- [HTML-3.1.1] Day-of-week row -->
          <div class="calendar-grid calendar-dow" id="cal-dow-row"></div>

          <!-- [HTML-3.1.2] Calendar grid -->
          <div class="calendar-grid" id="calendar-grid"></div>
        </section>

        <!-- ===================================================== -->
        <!-- [HTML-3.2] Shows Tab -->
        <!-- ===================================================== -->
        <section class="tab" id="tab-shows" aria-label="Shows view">
          <div class="card shows-toolbar" id="shows-toolbar">
            <div class="shows-toolbar-row">
              <div class="shows-toolbar-group">
                <div class="toolbar-label">Genre</div>
                <div class="toolbar-controls" id="genre-controls"></div>
              </div>

              <div class="shows-toolbar-group">
                <div class="toolbar-label">Status</div>
                <div class="toolbar-controls">
                  <select class="select" id="status-select">
                    <option value="all">All</option>
                  </select>
                </div>
              </div>

              <div class="shows-toolbar-group">
                <div class="toolbar-label">Sort</div>
                <div class="toolbar-controls">
                  <select class="select" id="sort-select">
                    <option value="az">A → Z</option>
                    <option value="za">Z → A</option>
                    <option value="next_air">Next Air Date</option>
                    <option value="last_air">Last Air Date</option>
                  </select>
                </div>
              </div>

              <div class="shows-toolbar-group">
                <div class="toolbar-label">Search</div>
                <div class="toolbar-controls">
                  <input class="input" id="shows-search" type="search" placeholder="Search shows…" />
                </div>
              </div>
            </div>
          </div>

          <div class="shows-grid" id="shows-grid"></div>
        </section>

        <!-- ===================================================== -->
        <!-- [HTML-3.3] Movies Tab -->
        <!-- ===================================================== -->
        <section class="tab" id="tab-movies" aria-label="Movies view">
          <div class="movies-grid" id="movies-grid"></div>
        </section>

        <!-- ===================================================== -->
        <!-- [HTML-3.4] Live Tab -->
        <!-- ===================================================== -->
        <section class="tab" id="tab-live" aria-label="Live TV view">
          <div class="card">
            <div class="muted">Live TV list placeholder.</div>
            <div id="live-grid" class="live-grid"></div>
          </div>
        </section>

        <!-- ===================================================== -->
        <!-- [HTML-3.5] Config Tab -->
        <!-- ===================================================== -->
        <section class="tab" id="tab-config" aria-label="Config view">
          <div class="card">
            <div class="row-between">
              <div>
                <div class="section-title">Config snapshot</div>
                <div class="muted">Loaded from <code>web/config.json</code>.</div>
              </div>
              <a class="btn" href="config.html" target="_blank" rel="noopener noreferrer">Open Config Panel</a>
            </div>

            <pre class="codeblock" id="config-dump">{}</pre>
          </div>
        </section>
      </main>

      <!-- ===================================================== -->
      <!-- [HTML-4.0] Modal -->
      <!-- ===================================================== -->
      <div class="modal-backdrop" id="modal-backdrop" aria-hidden="true"></div>

      <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
        <div class="modal-inner">
          <div class="modal-header">
            <div class="modal-title" id="modal-title">Details</div>
            <button class="modal-close" id="modal-close" type="button" aria-label="Close">✕</button>
          </div>
          <div class="modal-body" id="modal-body"></div>
        </div>
      </div>
    </div>

    <!-- ===================================================== -->
    <!-- [JS-0.0] Inline runtime (kept in index.html by design) -->
    <!-- ===================================================== -->
    <script>
      // =====================================================
      // [JS-0.0] Version + core URLs
      // =====================================================
      const VERSION = "v3.3.5";
      const DATA_URL = "../data/data.json";
      const CONFIG_URL = "config.json";

      // [JS-0.1.1] Streaming baselines (defaults; may be overridden by config.json)
      // TV episode:
      //   - VidSrc:  https://vidsrc.net/embed/tv/{id}/{season}/{episode}
      //   - VidEasy: https://player.videasy.net/tv/{id}/{season}/{episode}
      // Movie:
      //   - VidSrc:  https://vidsrc.net/embed/movie/{id}
      //   - VidEasy: https://player.videasy.net/movie/{id}
      const VID_EASY_TV_BASE = "https://player.videasy.net/tv/";
      const VID_EASY_MOVIE_BASE = "https://player.videasy.net/movie/";
      const VIDSRC_TV_BASE = "https://vidsrc.net/embed/tv/";
      const VIDSRC_MOVIE_BASE = "https://vidsrc.net/embed/movie/";

      // =====================================================
      // [JS-0.2] App-config (optional override via web/config.json)
      // =====================================================
      // Supports BOTH shapes:
      // Shape A (new):
      //  {
      //    streaming_services: { vidsrc_tv, vidsrc_movie, videasy_tv, videasy_movie },
      //    image_sizes: { show_width, movie_width, season_width, episode_still_w, backdrop_w },
      //    ui_tuning: { calendar_button_scale, calendar_card_density }
      //  }
      //
      // Shape B (legacy internal):
      //  { streaming: {...}, image_sizes: {...}, ui_tuning: {...} }
      const appConfig = {
        streaming: {
          vidsrc_tv_base: VIDSRC_TV_BASE,
          vidsrc_movie_base: VIDSRC_MOVIE_BASE,
          videasy_tv_base: VID_EASY_TV_BASE,
          videasy_movie_base: VID_EASY_MOVIE_BASE
        },
        image_sizes: {
          show_width: 185,
          movie_width: 185,
          season_width: 185,
          episode_still_w: 300,
          backdrop_w: 780
        },
        ui_tuning: {
          calendar_button_scale: 0.75,
          calendar_card_density: 1.0
        }
      };

      async function loadConfig() {
        try {
          const res = await fetch(CONFIG_URL, { cache: "no-store" });
          if (!res.ok) return;

          const cfg = await res.json();

          // Shape A (preferred)
          if (cfg && cfg.streaming_services) {
            const ss = cfg.streaming_services || {};
            if (ss.vidsrc_tv) appConfig.streaming.vidsrc_tv_base = ss.vidsrc_tv;
            if (ss.vidsrc_movie) appConfig.streaming.vidsrc_movie_base = ss.vidsrc_movie;
            if (ss.videasy_tv) appConfig.streaming.videasy_tv_base = ss.videasy_tv;
            if (ss.videasy_movie) appConfig.streaming.videasy_movie_base = ss.videasy_movie;

            if (cfg.image_sizes) appConfig.image_sizes = { ...appConfig.image_sizes, ...cfg.image_sizes };
            if (cfg.ui_tuning) appConfig.ui_tuning = { ...appConfig.ui_tuning, ...cfg.ui_tuning };
            return;
          }

          // Shape B (legacy)
          if (cfg && cfg.streaming) {
            appConfig.streaming = { ...appConfig.streaming, ...cfg.streaming };
          }
          if (cfg && cfg.image_sizes) {
            appConfig.image_sizes = { ...appConfig.image_sizes, ...cfg.image_sizes };
          }
          if (cfg && cfg.ui_tuning) {
            appConfig.ui_tuning = { ...appConfig.ui_tuning, ...cfg.ui_tuning };
          }
        } catch (err) {
          console.warn("config.json not loaded (continuing with defaults):", err);
        }
      }

      // =====================================================
      // [JS-0.3] Helpers
      // =====================================================
      function qs(sel) {
        return document.querySelector(sel);
      }
      function qsa(sel) {
        return Array.from(document.querySelectorAll(sel));
      }
      function openInNewTab(url) {
        if (!url) return;
        window.open(url, "_blank", "noopener,noreferrer");
      }

      function tmdbImageUrl(path, size) {
        if (!path) return null;
        const clean = path.startsWith("/") ? path : "/" + path;
        return `https://image.tmdb.org/t/p/${size}${clean}`;
      }

      // [JS-0.3.2] Prefer local cached images when available
      function pickImageUrl(localPath, tmdbPath, size) {
        if (localPath) return localPath;
        return tmdbImageUrl(tmdbPath, size);
      }

      function monthName(m) {
        return new Date(2000, m, 1).toLocaleString(undefined, { month: "long" });
      }
      function formatDate(d) {
        return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
      }
      function formatDateRange(a, b) {
        return `${formatDate(a)} – ${formatDate(b)}`;
      }

      // =====================================================
      // [JS-0.9] Apply UI tuning from config.json into CSS variables
      // =====================================================
      function applyUiTuning() {
        try {
          const ui = appConfig && appConfig.ui_tuning ? appConfig.ui_tuning : {};
          const root = document.documentElement;

          if (ui.calendar_button_scale != null) {
            root.style.setProperty("--calendar-button-scale", String(ui.calendar_button_scale));
          }
          if (ui.calendar_card_density != null) {
            root.style.setProperty("--calendar-card-density", String(ui.calendar_card_density));
          }
        } catch (e) {
          console.warn("applyUiTuning() failed:", e);
        }
      }

      // =====================================================
      // [JS-1.0] App state
      // =====================================================
      const appState = {
        data: null,
        currentView: "calendar",
        calYear: null,
        calMonthIndex: null
      };

      // =====================================================
      // [JS-1.1] Init
      // =====================================================
      document.addEventListener("DOMContentLoaded", () => {
        wireViewTabs();
        wireModal();
        loadData();
      });

      // =====================================================
      // [JS-1.2] View tabs
      // =====================================================
      function wireViewTabs() {
        qsa(".nav-button").forEach((btn) => {
          btn.addEventListener("click", () => {
            const view = btn.dataset.view;
            if (view) setActiveView(view);
          });
        });
      }

      function setActiveView(view) {
        if (!view || view === appState.currentView) return;
        appState.currentView = view;

        qsa(".nav-button").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.view === view);
        });
        qsa(".tab").forEach((tab) => {
          tab.classList.toggle("active", tab.id === `tab-${view}`);
        });

        const subtitle = qs("#view-subtitle");
        if (view === "calendar") {
          subtitle.textContent = "Episodes & movie releases by air date.";
        } else if (view === "shows") {
          subtitle.textContent = "Browse series, seasons, and episodes.";
        } else if (view === "movies") {
          subtitle.textContent = "Browse movies with direct playback links.";
        } else if (view === "live") {
          subtitle.textContent = "Live TV channel list (EPG later).";
        } else if (view === "config") {
          subtitle.textContent = "Configuration snapshot.";
          qs("#config-dump").textContent = JSON.stringify(appConfig, null, 2);
        }
      }

      // =====================================================
      // [JS-1.3] Data load (config + data.json)  **FIX: must be async**
      // =====================================================
      async function loadData() {
        try {
          await loadConfig();
          applyUiTuning();

          // config snapshot in config tab
          qs("#config-dump").textContent = JSON.stringify(appConfig, null, 2);

          const res = await fetch(DATA_URL, { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          appState.data = data;

          updateMetaLine();

          initCalendarState();
          buildCalendar();
          buildShows();
          buildMovies();
          buildLive();
        } catch (err) {
          console.error("Failed to load data.json:", err);
          qs("#meta-line").textContent = `index.html: ${VERSION} • ERROR loading data.json`;
        }
      }

      function updateMetaLine() {
        const d = appState.data || {};
        const built = d.built_at || d.builtAt || "unknown";
        const shows = (d.shows && d.shows.length) || d.shows_count || "?";
        const movies = (d.movies && d.movies.length) || d.movies_count || "?";
        const live = (d.live && d.live.length) || d.livetv_count || 0;

        qs("#meta-line").textContent = `index.html: ${VERSION} • Data built: ${built} • Shows: ${shows} • Movies: ${movies} • LiveTV: ${live}`;
      }

      // =====================================================
      // [JS-2.0] Modal logic
      // =====================================================
      function wireModal() {
        const backdrop = qs("#modal-backdrop");
        const modal = qs("#modal");
        const btnClose = qs("#modal-close");

        function close() {
          modal.setAttribute("aria-hidden", "true");
          backdrop.setAttribute("aria-hidden", "true");
        }

        btnClose.addEventListener("click", close);
        backdrop.addEventListener("click", close);
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") close();
        });
      }

      function openModal(title, bodyEl) {
        const backdrop = qs("#modal-backdrop");
        const modal = qs("#modal");
        qs("#modal-title").textContent = title;
        const body = qs("#modal-body");
        body.innerHTML = "";
        body.appendChild(bodyEl);

        backdrop.setAttribute("aria-hidden", "false");
        modal.setAttribute("aria-hidden", "false");
      }

      // =====================================================
      // [JS-3.0] Calendar build
      // =====================================================
      function initCalendarState() {
        const now = new Date();
        appState.calYear = now.getFullYear();
        appState.calMonthIndex = now.getMonth();
      }

      function buildCalendar() {
        const data = appState.data || {};
        const items = (data.calendar_items || data.calendar || []).slice();

        // Build DOW row (Mon-first)
        const dowRow = qs("#cal-dow-row");
        dowRow.innerHTML = "";
        const names = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
        names.forEach((n) => {
          const cell = document.createElement("div");
          cell.className = "calendar-dow-cell";
          cell.textContent = n;
          dowRow.appendChild(cell);
        });

        // Month title/range + nav labels
        const y = appState.calYear;
        const m = appState.calMonthIndex;

        const title = `${monthName(m)} ${y}`;
        qs("#cal-month-title").textContent = title;

        const monthStart = new Date(y, m, 1);
        const monthEnd = new Date(y, m + 1, 0);
        qs("#cal-month-range").textContent = formatDateRange(monthStart, monthEnd);

        const prev = new Date(y, m - 1, 1);
        const next = new Date(y, m + 1, 1);
        qs("#btn-cal-prev").t
