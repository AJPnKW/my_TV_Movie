<!DOCTYPE html>
<!--
========================================================================================
[FILE]        web/index.html
[PROJECT]     my_TV_Movie (My TV Hub)
[ROLE]        Main Hub UI (Calendar / Shows / Movies / Live TV)
[VERSION]     v3.3.7
[UPDATED]     2025-12-17_17-18-00
[BUILD]       14.02.04
[OWNER]       Andrew & Brant (internal)

[DEPENDS ON]
  - data/data.json                  (generated by scripts/fetch_tmdb.py)
  - data/trakt_state.json           (optional; generated by scripts/fetch_trakt.py)
  - web/config.json                 (streaming + UI tuning)
  - web/css/my_tv_hub.css

[DESIGN RULES]
- NO hard-coded streaming domains here (config-driven only).
- Image preference order: local_*_path → remote TMDB URL.
- All view switching is client-side (static GitHub Pages safe).
========================================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My TV Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Static TV + Movies + Live TV hub for Andrew & Brant" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/my_tv_hub.css?v=3.3.7" />
</head>
<body>

  <!-- ========================================================= -->
  <!-- Top Bar -->
  <!-- ========================================================= -->
  <header class="topbar">
    <div class="brand">
      <h1>My TV Hub</h1>
      <div class="meta">Calendar · Shows · Movies · Live</div>
    </div>

    <div class="view-buttons">
      <button class="view-btn active" data-view="calendar">📅 Calendar</button>
      <button class="view-btn" data-view="shows">📺 Shows</button>
      <button class="view-btn" data-view="movies">🎬 Movies</button>
      <button class="view-btn" data-view="live">📡 Live TV</button>
    </div>
  </header>

  <!-- ========================================================= -->
  <!-- Main Container -->
  <!-- ========================================================= -->
  <main class="container">

    <!-- Calendar View -->
    <section id="view-calendar" class="view-panel">
      <div id="calendar-root"></div>
    </section>

    <!-- Shows View -->
    <section id="view-shows" class="view-panel hidden">
      <div class="shows-grid" id="shows-root"></div>
    </section>

    <!-- Movies View -->
    <section id="view-movies" class="view-panel hidden">
      <div class="shows-grid" id="movies-root"></div>
    </section>

    <!-- Live TV View -->
    <section id="view-live" class="view-panel hidden">
      <div class="card soft">
        <h2 class="section-title">Live TV</h2>
        <div id="live-root" class="muted">No Live TV data loaded.</div>
      </div>
    </section>

  </main>

<script>
/* =====================================================================
   index.html client logic
   ===================================================================== */

const DATA_URL   = '../data/data.json';
const TRAKT_URL  = '../data/trakt_state.json';
const CONFIG_URL = './config.json';

let DATA = null;
let TRAKT = {};
let CONFIG = {};

/* --------------------------------------------------
   Utilities
-------------------------------------------------- */
function $(sel) { return document.querySelector(sel); }
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function imgPath(item, type='poster') {
  return item[`local_${type}_path`] || item[`${type}_url`] || '';
}

/* --------------------------------------------------
   Loaders
-------------------------------------------------- */
async function loadJSON(url, fallback = null) {
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(url);
    return await r.json();
  } catch {
    return fallback;
  }
}

async function loadAll() {
  DATA   = await loadJSON(DATA_URL);
  TRAKT  = await loadJSON(TRAKT_URL, {});
  CONFIG = await loadJSON(CONFIG_URL, {});

  if (!DATA) {
    $('#calendar-root').innerHTML = '<p class="muted">data.json missing</p>';
    return;
  }

  renderCalendar();
  renderShows();
  renderMovies();
}

/* --------------------------------------------------
   Calendar
-------------------------------------------------- */
function renderCalendar() {
  const root = $('#calendar-root');
  root.innerHTML = '';

  if (!DATA.calendar || !DATA.calendar.length) {
    root.innerHTML = '<p class="muted">No upcoming episodes.</p>';
    return;
  }

  let currentDay = '';
  DATA.calendar.forEach(item => {
    if (item.air_date !== currentDay) {
      currentDay = item.air_date;
      const sticky = el('div','day-sticky');
      sticky.appendChild(el('h3','day-title',currentDay));
      root.appendChild(sticky);
    }

    const card = el('div','cal-item');
    const img = el('img');
    img.src = imgPath(item,'poster');

    const text = el('div','cal-text');
    text.appendChild(el('div','cal-title', item.title));
    text.appendChild(el('div','cal-sub', item.subtitle || ''));

    const btns = el('div','cal-buttons');
    if (item.show_id) {
      const b = el('a','link-btn btn-tmdb');
      b.href = `show.html?id=${item.show_id}`;
      b.innerHTML = '<span class="stack"><span class="top">VIEW</span><span class="bottom">Show</span></span>';
      btns.appendChild(b);
    }

    card.append(img,text,btns);
    root.appendChild(card);
  });
}

/* --------------------------------------------------
   Shows
-------------------------------------------------- */
function renderShows() {
  const root = $('#shows-root');
  root.innerHTML = '';

  (DATA.shows || []).forEach(show => {
    const card = el('div','card show-card');
    const img = el('img');
    img.src = imgPath(show,'poster');

    const h = el('h3',null,show.title);
    const m = el('div','muted', show.year || '');

    const b = el('a','link-btn btn-tmdb');
    b.href = `show.html?id=${show.id}`;
    b.innerHTML = '<span class="stack"><span class="top">OPEN</span><span class="bottom">Show</span></span>';

    card.append(img,h,m,b);
    root.appendChild(card);
  });
}

/* --------------------------------------------------
   Movies
-------------------------------------------------- */
function renderMovies() {
  const root = $('#movies-root');
  root.innerHTML = '';

  (DATA.movies || []).forEach(movie => {
    const card = el('div','card show-card');
    const img = el('img');
    img.src = imgPath(movie,'poster');

    const h = el('h3',null,movie.title);
    const m = el('div','muted', movie.year || '');

    const b = el('a','link-btn btn-tmdb');
    b.href = movie.stream_url || '#';
    b.target = '_blank';
    b.innerHTML = '<span class="stack"><span class="top">WATCH</span><span class="bottom">Movie</span></span>';

    card.append(img,h,m,b);
    root.appendChild(card);
  });
}

/* --------------------------------------------------
   View switching
-------------------------------------------------- */
document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view-panel').forEach(v => v.classList.add('hidden'));

    btn.classList.add('active');
    $('#view-' + btn.dataset.view).classList.remove('hidden');
  });
});

/* -------------------------------------------------- */
loadAll();
</script>

</body>
</html>
