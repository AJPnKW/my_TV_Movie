<!doctype html>
<html lang="en">
<head>
  <!--
    File: web/index.html
    Project: my_TV_Movie
    Version: v2.3.0 (2025-11-08)
  -->
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>My TV Hub</title>
  <style>
    :root{
      --bg:#050509;
      --fg:#f5f5f7;
      --mut:#9ca3af;
      --card:#14151d;
      --chip:#151823;
      --pri:#3b82f6;
      --border:#f5e6c5;
      --fs-scale:1;
    }
    :root[data-theme="light"]{
      --bg:#f5f5f7;
      --fg:#111827;
      --mut:#6b7280;
      --card:#ffffff;
      --chip:#e5e7eb;
      --pri:#2563eb;
      --border:#d1d5db;
    }

    *{box-sizing:border-box;margin:0;padding:0;}

    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font:calc(15px * var(--fs-scale))/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }

    a{color:var(--pri);text-decoration:none;}
    a:hover{text-decoration:underline;}

    header{
      position:sticky;
      top:0;
      z-index:40;
      background:rgba(5,5,9,.97);
      backdrop-filter:blur(8px);
    }
    :root[data-theme="light"] header{
      background:rgba(245,245,247,.97);
      backdrop-filter:none;
    }

    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:10px 20px 8px;
    }

    h1{
      font-size:22px;
      font-weight:700;
    }

    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:8px;
    }

    nav{
      display:flex;
      gap:8px;
      margin-top:6px;
      flex-wrap:wrap;
    }

    .tab{
      padding:6px 14px;
      border-radius:999px;
      background:var(--chip);
      font-size:11px;
      cursor:pointer;
      user-select:none;
    }
    .tab.active{
      background:var(--pri);
      color:#ffffff;
    }

    main{
      padding:8px 20px 4px;
      max-width:1200px;
      margin:0 auto;
    }

    .section{padding-bottom:16px;}
    .mut{color:var(--mut);}
    .small{font-size:10px;}

    .btn{
      padding:5px 10px;
      border-radius:999px;
      border:1px solid var(--chip);
      background:var(--chip);
      color:var(--fg);
      font-size:10px;
      cursor:pointer;
      min-width:52px;
    }
    .btn.active{
      background:var(--pri);
      color:#ffffff;
      border-color:var(--pri);
    }

    .controls-sticky{
      position:sticky;
      top:64px;
      z-index:30;
      background:var(--bg);
      padding:4px 0 6px;
    }
    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      align-items:center;
      font-size:10px;
    }
    .label{
      font-size:9px;
      color:var(--mut);
      margin-right:2px;
    }

    /* Calendar */

    .cal-head-sticky{
      position:sticky;
      top:64px;
      z-index:25;
      background:var(--bg);
      padding-bottom:4px;
    }

    .cal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:6px;
      margin-bottom:4px;
    }

    .cal-title{
      font-size:17px;
      font-weight:600;
    }

    .cal-nav{
      display:flex;
      gap:4px;
    }

    .cal-btn{
      padding:5px 8px;
      border-radius:999px;
      border:1px solid var(--chip);
      background:var(--chip);
      color:var(--fg);
      font-size:9px;
      cursor:pointer;
      min-width:46px;
      text-align:center;
    }

    .cal-dow-row{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      font-size:8px;
      color:var(--mut);
      gap:4px;
    }

    .cal-dow{
      text-align:center;
      padding-bottom:1px;
    }

    .cal-grid{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:6px;
      margin-top:4px;
    }

    .cal-day{
      min-height:98px;
      padding:4px;
      border-radius:8px;
      border:1px solid var(--border);
      background:#0d0e15;
      display:flex;
      flex-direction:column;
      gap:3px;
    }
    :root[data-theme="light"] .cal-day{
      background:#ffffff;
    }

    .cal-day.today{
      background:#fde68a; /* gold */
      color:#111827;
      box-shadow:0 0 0 1px #fed7aa;
    }
    :root[data-theme="light"] .cal-day.today{
      background:#2563eb;
      color:#ffffff;
      box-shadow:0 0 0 1px #1d4ed8;
    }
    .cal-day.today .cal-show,
    .cal-day.today .cal-ep,
    .cal-day.today .cal-movie-label{
      color:inherit;
    }
    .cal-day.today .icon-link{
      background:rgba(15,23,42,.96);
      color:#ffffff;
    }

    .cal-date{
      font-size:8px;
      font-weight:600;
      margin-bottom:1px;
    }

    .cal-item{
      display:flex;
      gap:4px;
      align-items:flex-start;
      cursor:default;
    }

    .cal-item img{
      width:40px;
      height:60px;
      border-radius:6px;
      object-fit:cover;
      background:#111827;
      flex-shrink:0;
    }

    .cal-lines{
      display:flex;
      flex-direction:column;
      gap:1px;
      font-size:8.5px;
    }

    .cal-show{
      font-weight:700;
      cursor:pointer;
    }

    .cal-ep{
      cursor:pointer;
    }

    .cal-movie-label{
      font-size:7.5px;
      color:var(--mut);
    }

    .net-row{
      display:flex;
      flex-wrap:wrap;
      gap:3px;
      margin-top:1px;
    }
    .net-chip{
      padding:1px 4px;
      border-radius:6px;
      background:rgba(148,163,253,.14);
      font-size:7px;
      color:var(--mut);
    }

    .icon-row{
      display:flex;
      gap:3px;
      flex-wrap:wrap;
      margin-top:1px;
    }
    .icon-link{
      display:inline-flex;
      align-items:center;
      gap:2px;
      padding:2px 5px;
      border-radius:999px;
      background:rgba(15,23,42,.96);
      font-size:7px;
      cursor:pointer;
    }
    .icon-link span{
      font-size:8px;
    }
    :root[data-theme="light"] .icon-link{
      background:rgba(17,24,39,.98);
      color:#ffffff;
    }

    /* Cards */

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:10px;
      margin-top:4px;
    }

    .card{
      background:var(--card);
      border-radius:14px;
      padding:8px;
      display:flex;
      gap:8px;
      border:1px solid var(--chip);
      align-items:flex-start;
    }

    .poster{
      width:70px;
      height:104px;
      border-radius:10px;
      object-fit:cover;
      background:#111827;
      flex-shrink:0;
    }

    .card-body{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
      flex:1;
    }

    .title{
      font-size:14px;
      font-weight:700;
      cursor:pointer;
    }

    .divider{
      height:1px;
      background:rgba(148,163,253,.14);
      margin:3px 0;
    }

    /* Overlay */

    .overlay[hidden]{display:none;}

    .overlay{
      position:fixed;
      inset:0;
      z-index:90;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .overlay-backdrop{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.78);
    }

    .overlay-panel{
      position:relative;
      max-width:980px;
      max-height:86vh;
      padding:18px 14px 10px;
      background:var(--card);
      border-radius:18px;
      box-shadow:0 24px 60px rgba(0,0,0,.75);
      overflow:auto;
      z-index:91;
    }
    :root[data-theme="light"] .overlay-panel{
      background:#ffffff;
      box-shadow:0 24px 60px rgba(0,0,0,.18);
    }

    .overlay-close{
      position:absolute;
      top:6px;
      right:10px;
      border:none;
      background:transparent;
      color:var(--mut);
      font-size:24px;
      cursor:pointer;
    }

    .ov-header{
      display:flex;
      gap:10px;
      align-items:flex-start;
      padding-top:16px;
      margin-bottom:6px;
    }

    .ov-poster{
      width:105px;
      height:158px;
      border-radius:10px;
      object-fit:cover;
      background:#111827;
      flex-shrink:0;
    }

    .ov-title{
      font-size:19px;
      font-weight:700;
      margin-bottom:2px;
    }

    .ov-sub{
      font-size:11px;
      color:var(--mut);
      margin-bottom:3px;
    }

    .ov-overview{
      font-size:12px;
      color:var(--mut);
    }

    .ov-links{
      margin-top:4px;
      display:flex;
      gap:4px;
      flex-wrap:wrap;
    }

    .season-list{
      margin-top:6px;
      font-size:11px;
    }

    .season-row{
      padding:4px 0;
      border-bottom:1px solid rgba(148,163,253,.18);
      cursor:pointer;
    }

    .season-label{
      font-weight:600;
    }

    .season-badge{
      display:inline-block;
      margin-left:6px;
      padding:1px 6px;
      border-radius:999px;
      background:var(--chip);
      color:var(--pri);
      font-size:8px;
    }

    .season-meta{
      font-size:9px;
      color:var(--mut);
    }

    .episodes{
      margin-top:3px;
      padding-left:4px;
      font-size:10px;
    }

    .ep-row{
      padding:2px 0;
      border-bottom:1px dashed rgba(148,163,253,.16);
    }

    #meta{
      font-size:9px;
      color:var(--mut);
      padding:2px 20px 10px;
      max-width:1200px;
      margin:0 auto;
    }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="row">
      <h1>My TV Hub</h1>
      <div class="small">
        <a href="config.html">Config</a>
      </div>
    </div>
    <nav>
      <div class="tab active" data-tab="calendar">Calendar</div>
      <div class="tab" data-tab="shows">Shows</div>
      <div class="tab" data-tab="movies">Movies</div>
    </nav>
  </div>
</header>

<main>
  <section id="calendar" class="section"></section>
  <section id="shows" class="section" hidden></section>
  <section id="movies" class="section" hidden></section>
</main>

<div id="meta"></div>

<div id="overlay" class="overlay" hidden>
  <div class="overlay-backdrop"></div>
  <div class="overlay-panel">
    <button class="overlay-close" aria-label="Close">&times;</button>
    <div id="overlay-content"></div>
  </div>
</div>

<script>
  const $  = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const IMG = p => p ? `https://image.tmdb.org/t/p/w300${p}` : '';

  const state = {
    data:null,
    today:new Date(),
    currentMonth:null,
    showsGenre:'All',
    showsStatus:'All',
    showsSort:'title',
    showsDir:'asc',
    moviesGenre:'All',
    moviesStatus:'All',
    moviesSort:'title',
    moviesDir:'asc'
  };

  (function initTheme(){
    const t = localStorage.getItem('tvhub_theme') || 'dark';
    const s = parseFloat(localStorage.getItem('tvhub_fontscale') || '1.0') || 1.0;
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.style.setProperty('--fs-scale', String(s));
  })();

  function getShows(){ return (state.data && state.data.shows) || []; }
  function getMovies(){ return (state.data && state.data.movies) || []; }

  async function load(){
    try{
      const r = await fetch('../data/data.json', {cache:'no-cache'});
      if(!r.ok) throw new Error('no data.json');
      state.data = await r.json();
      state.currentMonth = new Date(
        state.today.getFullYear(),
        state.today.getMonth(),
        1
      );
      attachTabs();
      renderAll();
    }catch(e){
      console.error(e);
      $('#calendar').innerHTML =
        '<div class="mut">Unable to load data. Run the "Build TV Data" workflow.</div>';
    }
  }

  function attachTabs(){
    $$('.tab').forEach(tab=>{
      tab.onclick = ()=>{
        const t = tab.dataset.tab;
        if(tab.classList.contains('active')) return;
        $$('.tab').forEach(x=>x.classList.remove('active'));
        tab.classList.add('active');
        ['calendar','shows','movies'].forEach(id=>{
          $('#'+id).hidden = (id !== t);
        });
        if(t === 'calendar') renderCalendar();
        if(t === 'shows') renderShows();
        if(t === 'movies') renderMovies();
      };
    });
  }

  // --------- helpers ---------
  function buildEpisodeIcons(show, season, epNum){
    const sid = show.show_id;
    const e = epNum || '';
    return `
      <a class="icon-link" target="_blank"
         href="https://www.themoviedb.org/tv/${sid}/season/${season}/episode/${e}">
        <span>Ⓣ</span><span>TMDB</span>
      </a>
      <a class="icon-link" target="_blank"
         href="https://vidsrc.net/embed/tv/${sid}/${season}/${e}">
        <span>▶</span><span>VidSrc</span>
      </a>
      <a class="icon-link" target="_blank"
         href="https://player.videasy.net/tv/${sid}/${season}/${e}">
        <span>▶</span><span>Videasy</span>
      </a>
    `;
  }

  function buildMovieIcons(mv){
    const id = mv.movie_id;
    return `
      <a class="icon-link" target="_blank" href="${mv.links.tmdb}">
        <span>Ⓣ</span><span>TMDB</span>
      </a>
      <a class="icon-link" target="_blank" href="https://vidsrc.net/embed/movie/${id}">
        <span>▶</span><span>VidSrc</span>
      </a>
      <a class="icon-link" target="_blank" href="https://player.videasy.net/movie/${id}">
        <span>▶</span><span>Videasy</span>
      </a>
    `;
  }

  function buildNetworks(show){
    const nets = show.networks || [];
    if(!nets.length) return '';
    const first = nets.slice(0,3);
    return `
      <div class="net-row">
        ${first.map(n=>`<div class="net-chip">${n}</div>`).join('')}
      </div>
    `;
  }

  function guessCurrentSeason(show){
    let best = null, bestDate = null;
    (show.seasons||[]).forEach(s=>{
      (s.episodes||[]).forEach(ep=>{
        if(!ep.air_date) return;
        const d = new Date(ep.air_date);
        if(!bestDate || d > bestDate){
          bestDate = d;
          best = s.season_number;
        }
      });
    });
    return best;
  }

  // --------- Calendar ---------
  function changeMonth(delta){
    const m = state.currentMonth;
    state.currentMonth = new Date(m.getFullYear(), m.getMonth()+delta, 1);
    renderCalendar();
  }

  function gotoToday(){
    state.currentMonth = new Date(
      state.today.getFullYear(),
      state.today.getMonth(),
      1
    );
    renderCalendar();
  }

  function renderCalendar(){
    const host = $('#calendar');
    const shows = getShows();
    const movies = getMovies();

    if(!shows.length && !movies.length){
      host.innerHTML = '<div class="mut">No shows or movies configured.</div>';
      return;
    }

    const by = {};
    // shows
    for(const sh of shows){
      for(const s of sh.seasons || []){
        for(const ep of s.episodes || []){
          if(!ep.air_date) continue;
          const key = ep.air_date;
          (by[key] ||= []).push({type:'ep', show:sh, s:s.season_number, ep});
        }
      }
    }
    // movies
    for(const mv of movies){
      if(!mv.release_date) continue;
      const key = mv.release_date;
      (by[key] ||= []).push({type:'mv', mv});
    }

    const year = state.currentMonth.getFullYear();
    const month = state.currentMonth.getMonth();
    const first = new Date(year, month, 1);
    const start = new Date(first);
    start.setDate(first.getDate() - first.getDay());

    const monthName = first.toLocaleString(undefined,{month:'long',year:'numeric'});

    let html = `
      <div class="cal-head-sticky">
        <div class="cal-header">
          <div class="cal-title">${monthName}</div>
          <div class="cal-nav">
            <button class="cal-btn" id="cal-prev">&#9664;</button>
            <button class="cal-btn" id="cal-today">Today</button>
            <button class="cal-btn" id="cal-next">&#9654;</button>
          </div>
        </div>
        <div class="cal-dow-row">
          <div class="cal-dow">Sun</div>
          <div class="cal-dow">Mon</div>
          <div class="cal-dow">Tue</div>
          <div class="cal-dow">Wed</div>
          <div class="cal-dow">Thu</div>
          <div class="cal-dow">Fri</div>
          <div class="cal-dow">Sat</div>
        </div>
      </div>
      <div class="cal-grid">
    `;

    for(let i=0;i<42;i++){
      const d = new Date(start);
      d.setDate(start.getDate()+i);
      const isToday =
        d.getFullYear()===state.today.getFullYear() &&
        d.getMonth()===state.today.getMonth() &&
        d.getDate()===state.today.getDate();
      const key = d.toISOString().slice(0,10);
      const items = by[key] || [];

      html += `<div class="cal-day${isToday?' today':''}">`;
      html += `<div class="cal-date">${d.getDate()}</div>`;

      for(const it of items){
        if(it.type === 'ep'){
          const {show,s,ep} = it;
          const epCode = `S${String(s).padStart(2,'0')}E${String(ep.episode_number||0).padStart(2,'0')}`;
          html += `
            <div class="cal-item" data-show-id="${show.show_id}" data-season="${s}">
              ${show.poster_path ? `<img src="${IMG(show.poster_path)}" alt="">` : ''}
              <div class="cal-lines">
                <div class="cal-show">${show.name}</div>
                <div class="cal-ep">${epCode}${ep.name ? ' · ' + ep.name : ''}</div>
                ${buildNetworks(show)}
                <div class="icon-row">
                  ${buildEpisodeIcons(show,s,ep.episode_number||'')}
                </div>
              </div>
            </div>
          `;
        } else {
          const mv = it.mv;
          html += `
            <div class="cal-item">
              ${mv.poster_path ? `<img src="${IMG(mv.poster_path)}" alt="">` : ''}
              <div class="cal-lines">
                <div class="cal-show">${mv.name}</div>
                <div class="cal-movie-label">Movie</div>
                <div class="icon-row">
                  ${buildMovieIcons(mv)}
                </div>
              </div>
            </div>
          `;
        }
      }

      html += `</div>`;
    }

    html += `</div>`;
    host.innerHTML = html;

    $('#cal-prev').onclick = ()=>changeMonth(-1);
    $('#cal-next').onclick = ()=>changeMonth(1);
    $('#cal-today').onclick = ()=>gotoToday();

    // click anywhere on show block (except icon links) => popup with focus season
    $$('#calendar .cal-item[data-show-id]').forEach(el=>{
      el.addEventListener('click', e=>{
        if(e.target.closest('.icon-link')) return;
        const id = parseInt(el.dataset.showId,10);
        const season = parseInt(el.dataset.season||'0',10) || null;
        const show = getShows().find(s=>s.show_id===id);
        if(show) openOverlay(show, season);
      });
    });
  }

  // --------- Shows ---------
  function renderShows(){
    const host = $('#shows');
    const shows = getShows();
    if(!shows.length){
      host.innerHTML = '<div class="mut">No shows loaded.</div>';
      return;
    }

    const genreSet = new Set();
    const statusSet = new Set();
    shows.forEach(sh=>{
      (sh.genres||[]).forEach(g=>genreSet.add(g));
      if(sh.status) statusSet.add(sh.status);
    });

    let html = `
      <div class="controls-sticky">
        <div class="controls">
          <span class="label">Genre</span>
          <button class="btn${state.showsGenre==='All'?' active':''}" data-sh-genre="All">All</button>
    `;
    Array.from(genreSet).sort().forEach(g=>{
      html += `<button class="btn${state.showsGenre===g?' active':''}" data-sh-genre="${g}">${g}</button>`;
    });
    html += `
        </div>
        <div class="controls" style="margin-top:4px;">
          <span class="label">Sort</span>
          <button class="btn" id="sh-sort-title"></button>
          <span class="label">Status</span>
          <button class="btn${state.showsStatus==='All'?' active':''}" data-sh-status="All">All</button>
    `;
    Array.from(statusSet).sort().forEach(s=>{
      html += `<button class="btn${state.showsStatus===s?' active':''}" data-sh-status="${s}">${s}</button>`;
    });
    html += `
        </div>
      </div>
      <div class="grid">
    `;

    let list = shows.slice();
    if(state.showsGenre !== 'All'){
      list = list.filter(sh => (sh.genres||[]).includes(state.showsGenre));
    }
    if(state.showsStatus !== 'All'){
      list = list.filter(sh => sh.status === state.showsStatus);
    }

    list.sort((a,b)=>{
      const an = (a.name||'').toLowerCase();
      const bn = (b.name||'').toLowerCase();
      if(an < bn) return state.showsDir === 'asc' ? -1 : 1;
      if(an > bn) return state.showsDir === 'asc' ? 1 : -1;
      return 0;
    });

    for(const sh of list){
      const cs = guessCurrentSeason(sh);
      html += `
        <div class="card">
          ${sh.poster_path ? `<img class="poster" src="${IMG(sh.poster_path)}" alt="${sh.name}">` : `<div class="poster"></div>`}
          <div class="card-body">
            <div class="title link-show" data-show-id="${sh.show_id}">${sh.name}</div>
            <div class="mut small">
              ${(sh.genres||[]).join(', ')}
              ${sh.status ? ' • ' + sh.status : ''}
            </div>
            ${cs ? `<div class="small" data-show-id="${sh.show_id}" data-season="${cs}">
                      Current season: Season ${cs}
                    </div>` : ''}
            <div class="divider"></div>
            <div class="icon-row">
              <a class="icon-link" target="_blank" href="${sh.links.tmdb}">
                <span>Ⓣ</span><span>TMDB</span>
              </a>
            </div>
          </div>
        </div>
      `;
    }
    html += `</div>`;
    host.innerHTML = html;

    const sortBtn = $('#sh-sort-title');
    sortBtn.textContent = state.showsDir === 'asc' ? 'Title A–Z' : 'Title Z–A';
    sortBtn.classList.add('active');
    sortBtn.onclick = ()=>{
      state.showsDir = state.showsDir === 'asc' ? 'desc' : 'asc';
      renderShows();
    };

    $$('[data-sh-genre]').forEach(btn=>{
      btn.onclick = ()=>{
        state.showsGenre = btn.dataset.shGenre;
        renderShows();
      };
    });
    $$('[data-sh-status]').forEach(btn=>{
      btn.onclick = ()=>{
        state.showsStatus = btn.dataset.shStatus;
        renderShows();
      };
    });

    // show title -> overlay
    $$('.link-show').forEach(el=>{
      el.onclick = e=>{
        e.preventDefault();
        const id = parseInt(el.dataset.showId,10);
        const show = getShows().find(s=>s.show_id===id);
        if(show) openOverlay(show, null);
      };
    });

    // current season line -> overlay with that season expanded
    $$('[data-show-id][data-season]').forEach(el=>{
      el.onclick = ()=>{
        const id = parseInt(el.dataset.showId,10);
        const sn = parseInt(el.dataset.season,10) || null;
        const show = getShows().find(s=>s.show_id===id);
        if(show) openOverlay(show, sn);
      };
    });
  }

  // --------- Movies ---------
  function renderMovies(){
    const host = $('#movies');
    const movies = getMovies();
    if(!movies.length){
      host.innerHTML = '<div class="mut">No movies loaded.</div>';
      return;
    }

    const genreSet = new Set();
    const statusSet = new Set();
    movies.forEach(mv=>{
      (mv.genres||[]).forEach(g=>genreSet.add(g));
      if(mv.status) statusSet.add(mv.status);
    });

    let html = `
      <div class="controls-sticky">
        <div class="controls">
          <span class="label">Genre</span>
          <button class="btn${state.moviesGenre==='All'?' active':''}" data-mv-genre="All">All</button>
    `;
    Array.from(genreSet).sort().forEach(g=>{
      html += `<button class="btn${state.moviesGenre===g?' active':''}" data-mv-genre="${g}">${g}</button>`;
    });
    html += `
        </div>
        <div class="controls" style="margin-top:4px;">
          <span class="label">Sort</span>
          <button class="btn" id="mv-sort-title"></button>
          <button class="btn${state.moviesSort==='date'?' active':''}" id="mv-sort-date">Release date</button>
          <span class="label">Status</span>
          <button class="btn${state.moviesStatus==='All'?' active':''}" data-mv-status="All">All</button>
    `;
    Array.from(statusSet).sort().forEach(s=>{
      html += `<button class="btn${state.moviesStatus===s?' active':''}" data-mv-status="${s}">${s}</button>`;
    });
    html += `
        </div>
      </div>
      <div class="grid">
    `;

    let list = movies.slice();
    if(state.moviesGenre !== 'All'){
      list = list.filter(mv => (mv.genres||[]).includes(state.moviesGenre));
    }
    if(state.moviesStatus !== 'All'){
      list = list.filter(mv => mv.status === state.moviesStatus);
    }

    if(state.moviesSort === 'title'){
      list.sort((a,b)=>{
        const an = (a.name||'').toLowerCase();
        const bn = (b.name||'').toLowerCase();
        if(an < bn) return state.moviesDir === 'asc' ? -1 : 1;
        if(an > bn) return state.moviesDir === 'asc' ? 1 : -1;
        return 0;
      });
    }else{
      list.sort((a,b)=>{
        const da = a.release_date ? new Date(a.release_date) : null;
        const db = b.release_date ? new Date(b.release_date) : null;
        if(!da && !db) return 0;
        if(!da) return 1;
        if(!db) return -1;
        return da - db;
      });
    }

    for(const mv of list){
      html += `
        <div class="card">
          ${mv.poster_path ? `<img class="poster" src="${IMG(mv.poster_path)}" alt="${mv.name}">` : `<div class="poster"></div>`}
          <div class="card-body">
            <div class="title">${mv.name}</div>
            <div class="mut small">
              ${(mv.genres||[]).join(', ')}
              ${mv.status ? ' • ' + mv.status : ''}
              ${mv.release_date ? ' • ' + mv.release_date : ''}
            </div>
            <div class="divider"></div>
            <div class="icon-row">
              ${buildMovieIcons(mv)}
            </div>
          </div>
        </div>
      `;
    }
    html += `</div>`;
    host.innerHTML = html;

    const sortTitleBtn = $('#mv-sort-title');
    sortTitleBtn.textContent = state.moviesDir === 'asc' ? 'Title A–Z' : 'Title Z–A';
    sortTitleBtn.classList.toggle('active', state.moviesSort === 'title');
    sortTitleBtn.onclick = ()=>{
      if(state.moviesSort === 'title'){
        state.moviesDir = state.moviesDir === 'asc' ? 'desc' : 'asc';
      }else{
        state.moviesSort = 'title';
      }
      renderMovies();
    };
    $('#mv-sort-date').onclick = ()=>{
      state.moviesSort = 'date';
      renderMovies();
    };

    $$('[data-mv-genre]').forEach(btn=>{
      btn.onclick = ()=>{
        state.moviesGenre = btn.dataset.mvGenre;
        renderMovies();
      };
    });
    $$('[data-mv-status]').forEach(btn=>{
      btn.onclick = ()=>{
        state.moviesStatus = btn.dataset.mvStatus;
        renderMovies();
      };
    });
  }

  // --------- Overlay ---------
  function openOverlay(show, focusSeason){
    const ov = $('#overlay');
    const box = $('#overlay-content');
    const seasons = show.seasons || [];

    let seasonHtml = '';
    seasons.forEach(s=>{
      const eps = s.episodes || [];
      const first = eps[0];
      const year = first && first.air_date ? first.air_date.slice(0,4) : '';
      seasonHtml += `
        <div class="season-row" data-season="${s.season_number}">
          <div class="season-label">
            Season ${s.season_number}
          </div>
          <div class="season-meta">
            ${year ? year + ' • ' : ''}${eps.length} episodes
          </div>
        </div>
      `;
    });

    box.innerHTML = `
      <div class="ov-header">
        ${show.poster_path ? `<img class="ov-poster" src="${IMG(show.poster_path)}" alt="${show.name}">` : `<div class="ov-poster"></div>`}
        <div>
          <div class="ov-title">
            <a href="${show.links.tmdb}" target="_blank">${show.name}</a>
          </div>
          <div class="ov-sub">
            ${(show.genres||[]).join(', ')}
            ${show.status ? ' • ' + show.status : ''}
          </div>
          ${show.overview ? `<div class="ov-overview">${show.overview}</div>` : ''}
          <div class="ov-links">
            <a class="icon-link" target="_blank" href="${show.links.tmdb}">
              <span>Ⓣ</span><span>TMDB</span>
            </a>
          </div>
        </div>
      </div>
      <div class="season-list">
        ${seasonHtml || '<div class="mut">No seasons found.</div>'}
      </div>
    `;

    function renderEpisodesUnder(row, s){
      box.querySelectorAll('.episodes').forEach(e=>e.remove());
      const wrap = document.createElement('div');
      wrap.className = 'episodes';

      const eps = s.episodes || [];
      if(!eps.length){
        wrap.innerHTML = '<div class="mut">No episodes.</div>';
      }else{
        wrap.innerHTML = eps.map(ep=>{
          const code = `S${String(s.season_number).padStart(2,'0')}E${String(ep.episode_number||0).padStart(2,'0')}`;
          const date = ep.air_date ? ` • ${ep.air_date}` : '';
          const ov = ep.overview ? ` — ${ep.overview}` : '';
          return `
            <div class="ep-row">
              <strong>${code}</strong> ${ep.name || ''}${date}${ov}
              <div class="icon-row">
                ${buildEpisodeIcons(show,s.season_number,ep.episode_number||'')}
              </div>
            </div>
          `;
        }).join('');
      }

      row.insertAdjacentElement('afterend', wrap);
    }

    box.querySelectorAll('.season-row').forEach(row=>{
      row.onclick = ()=>{
        const sn = parseInt(row.dataset.season,10);
        const s = seasons.find(x=>x.season_number===sn);
        if(!s) return;
        const next = row.nextElementSibling;
        if(next && next.classList.contains('episodes')){
          next.remove();
          return;
        }
        renderEpisodesUnder(row, s);
      };
    });

    $('#overlay .overlay-close').onclick = closeOverlay;
    $('#overlay .overlay-backdrop').onclick = closeOverlay;
    ov.hidden = false;

    // auto-expand focus season if provided
    if(focusSeason){
      const target = box.querySelector(`.season-row[data-season="${focusSeason}"]`);
      const s = seasons.find(x=>x.season_number===focusSeason);
      if(target && s){
        renderEpisodesUnder(target, s);
      }
    }
  }

  function closeOverlay(){
    $('#overlay').hidden = true;
    $('#overlay-content').innerHTML = '';
  }

  // --------- Meta + All ---------
  function renderMeta(){
    if(!state.data) return;
    const sc = (state.data.meta && state.data.meta.shows) || (state.data.shows||[]).length;
    const mc = (state.data.meta && state.data.meta.movies) || (state.data.movies||[]).length;
    $('#meta').textContent =
      `Data built: ${state.data.generated_at || 'n/a'} · Shows: ${sc} · Movies: ${mc}`;
  }

  function renderAll(){
    renderCalendar();
    renderShows();
    renderMovies();
    renderMeta();
    $('#shows').hidden = true;
    $('#movies').hidden = true;
  }

  load();
</script>
</body>
</html>
