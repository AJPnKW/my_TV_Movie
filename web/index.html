<!doctype html>
<html lang="en">
<head>
  <!--
    File: web/index.html
    Project: my_TV_Movie
    Version: v2.8.0 (2025-11-09)
  -->
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>My TV Hub</title>
  <style>
    :root{
      --bg:#050509;
      --fg:#f5f5f7;
      --mut:#9ca3af;
      --card:#14151d;
      --chip:#151823;
      --pri:#3b82f6;
      --border:#f5e6c5;
      --fs-scale:1;
    }
    :root[data-theme="light"]{
      --bg:#f5f5f7;
      --fg:#111827;
      --mut:#6b7280;
      --card:#ffffff;
      --chip:#e5e7eb;
      --pri:#2563eb;
      --border:#d1d5db;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font:calc(15px * var(--fs-scale))/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    a{color:var(--pri);text-decoration:none;}
    a:hover{text-decoration:underline;}

    header{
      position:sticky;
      top:0;
      z-index:40;
      background:rgba(5,5,9,.97);
      backdrop-filter:blur(8px);
    }
    :root[data-theme="light"] header{
      background:rgba(245,245,247,.97);
      backdrop-filter:none;
    }
    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:10px 20px 8px;
    }
    h1{font-size:22px;font-weight:700;}
    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:8px;
    }
    nav{
      display:flex;
      gap:8px;
      margin-top:6px;
      flex-wrap:wrap;
    }
    .tab{
      padding:6px 14px;
      border-radius:999px;
      background:var(--chip);
      font-size:11px;
      cursor:pointer;
      user-select:none;
    }
    .tab.active{
      background:var(--pri);
      color:#ffffff;
    }

    main{
      padding:8px 20px 4px;
      max-width:1200px;
      margin:0 auto;
    }
    .section{padding-bottom:16px;}
    .mut{color:var(--mut);}
    .small{font-size:10px;}

    .btn{
      padding:5px 10px;
      border-radius:999px;
      border:1px solid var(--chip);
      background:var(--chip);
      color:var(--fg);
      font-size:10px;
      cursor:pointer;
      min-width:52px;
    }
    .btn.active{
      background:var(--pri);
      color:#ffffff;
      border-color:var(--pri);
    }
    .btn.chip{
      padding:3px 9px;
      font-size:9px;
      min-width:0;
    }

    .controls-sticky{
      position:sticky;
      top:64px;
      z-index:30;
      background:var(--bg);
      padding:4px 0 6px;
    }
    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      align-items:center;
      font-size:10px;
    }
    .label{
      font-size:9px;
      color:var(--mut);
      margin-right:2px;
    }

    /* Calendar */
    .cal-head-sticky{
      position:sticky;
      top:64px;
      z-index:25;
      background:var(--bg);
      padding-bottom:4px;
    }
    .cal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:6px;
      margin-bottom:4px;
    }
    .cal-title{font-size:17px;font-weight:600;}
    .cal-nav{display:flex;gap:4px;}
    .cal-btn{
      padding:5px 8px;
      border-radius:999px;
      border:1px solid var(--chip);
      background:var(--chip);
      color:var(--fg);
      font-size:9px;
      cursor:pointer;
      min-width:46px;
      text-align:center;
    }
    .cal-dow-row{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      font-size:8px;
      color:var(--mut);
      gap:4px;
    }
    .cal-dow{text-align:center;padding-bottom:1px;}
    .cal-grid{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:6px;
      margin-top:4px;
    }
    .cal-day{
      min-height:98px;
      padding:4px;
      border-radius:8px;
      border:1px solid var(--border);
      background:#0d0e15;
      display:flex;
      flex-direction:column;
      gap:3px;
    }
    :root[data-theme="light"] .cal-day{background:#ffffff;}
    .cal-day.today{
      background:#fde68a;
      color:#111827;
      box-shadow:0 0 0 1px #fed7aa;
    }
    :root[data-theme="light"] .cal-day.today{
      background:#2563eb;
      color:#ffffff;
      box-shadow:0 0 0 1px #1d4ed8;
    }
    .cal-date{
      font-size:8px;
      font-weight:600;
      margin-bottom:1px;
    }
    .cal-item{
      display:flex;
      gap:4px;
      align-items:flex-start;
    }
    .cal-item img{
      width:40px;
      height:60px;
      border-radius:6px;
      object-fit:cover;
      background:#111827;
      flex-shrink:0;
    }
    .cal-lines{
      display:flex;
      flex-direction:column;
      gap:1px;
      font-size:8.5px;
    }
    .cal-show{font-weight:700;cursor:pointer;}
    .cal-ep{cursor:pointer;}
    .cal-movie-label{font-size:7.5px;color:var(--mut);}

    .net-row{
      display:flex;
      flex-wrap:wrap;
      gap:3px;
      margin-top:1px;
    }
    .net-chip{
      padding:1px 4px;
      border-radius:6px;
      background:rgba(148,163,253,.14);
      font-size:7px;
      color:var(--mut);
      display:flex;
      align-items:center;
      gap:2px;
    }
    .net-logo{
      height:10px;
      max-width:40px;
      object-fit:contain;
      display:block;
    }

    .icon-row{
      display:flex;
      gap:3px;
      flex-wrap:wrap;
      margin-top:1px;
    }
    .icon-link{
      display:inline-flex;
      align-items:center;
      gap:2px;
      padding:2px 5px;
      border-radius:999px;
      background:rgba(15,23,42,.96);
      font-size:7px;
      cursor:pointer;
    }
    .icon-link span{font-size:8px;}
    :root[data-theme="light"] .icon-link{
      background:rgba(17,24,39,.98);
      color:#ffffff;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:10px;
      margin-top:4px;
    }
    .card{
      background:var(--card);
      border-radius:14px;
      padding:8px;
      display:flex;
      gap:8px;
      border:1px solid var(--chip);
      align-items:flex-start;
    }
    .poster{
      width:70px;
      height:104px;
      border-radius:10px;
      object-fit:cover;
      background:#111827;
      flex-shrink:0;
    }
    .card-body{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
      flex:1;
    }
    .title{
      font-size:14px;
      font-weight:700;
      cursor:pointer;
    }
    .divider{
      height:1px;
      background:rgba(148,163,253,.14);
      margin:3px 0;
    }

    .overlay[hidden]{display:none;}
    .overlay{
      position:fixed;
      inset:0;
      z-index:90;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .overlay-backdrop{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.78);
    }
    .overlay-panel{
      position:relative;
      max-width:980px;
      max-height:86vh;
      padding:22px 16px 10px;
      background:var(--card);
      border-radius:18px;
      box-shadow:0 24px 60px rgba(0,0,0,.75);
      overflow:auto;
      z-index:91;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
      touch-action:auto;
    }
    :root[data-theme="light"] .overlay-panel{
      background:#ffffff;
      box-shadow:0 24px 60px rgba(0,0,0,.18);
    }
    .overlay-close{
      position:absolute;
      top:6px;
      right:10px;
      border:none;
      background:transparent;
      color:var(--mut);
      font-size:24px;
      cursor:pointer;
    }
    .overlay-back{
      position:absolute;
      top:10px;
      left:10px;
      border:none;
      background:transparent;
      color:var(--mut);
      font-size:16px;
      cursor:pointer;
    }

    .ov-header{
      display:flex;
      gap:10px;
      align-items:flex-start;
      padding-top:12px;
      margin-bottom:6px;
    }
    .ov-poster{
      width:105px;
      height:158px;
      border-radius:10px;
      object-fit:cover;
      background:#111827;
      flex-shrink:0;
    }
    .ov-title-row{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }
    .ov-title{
      font-size:19px;
      font-weight:700;
    }
    .ov-sub{
      font-size:11px;
      color:var(--mut);
      margin:2px 0;
    }
    .ov-current{
      font-size:10px;
      margin:2px 0 1px;
    }
    .ov-overview{
      font-size:12px;
      color:var(--mut);
      margin-top:2px;
    }
    .ov-links{
      margin-top:4px;
      display:flex;
      gap:4px;
      flex-wrap:wrap;
    }

    .season-list{
      margin-top:8px;
      font-size:11px;
    }
    .season-row{
      padding:4px 0;
      border-bottom:1px solid rgba(148,163,253,.18);
      cursor:pointer;
    }
    .season-label{
      font-weight:600;
      margin-right:6px;
    }
    .season-meta{
      font-size:9px;
      color:var(--mut);
    }
    .season-desc{
      font-size:9px;
      color:var(--mut);
      margin-top:1px;
    }

    .episodes{
      margin-top:3px;
      padding-left:4px;
      font-size:10px;
    }
    .ep-row{
      padding:3px 0;
      border-bottom:1px dashed rgba(148,163,253,.16);
      cursor:pointer;
    }
    .ep-watched{
      font-size:8px;
      color:#22c55e;
      margin-left:4px;
    }

    #meta{
      font-size:9px;
      color:var(--mut);
      padding:2px 20px 10px;
      max-width:1200px;
      margin:0 auto;
    }

    .remote-focus{
      outline:2px solid var(--pri);
      outline-offset:2px;
      border-radius:6px;
    }

    .profile-bar{
      display:inline-flex;
      gap:4px;
      margin-left:8px;
      flex-wrap:wrap;
      align-items:center;
    }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="row">
      <h1>My TV Hub</h1>
      <div class="small">
        <a href="config.html">Config</a>
      </div>
    </div>
    <nav>
      <div class="tab" data-tab="calendar">Calendar</div>
      <div class="tab" data-tab="shows">Shows</div>
      <div class="tab" data-tab="movies">Movies</div>
      <div id="profileBar" class="profile-bar" hidden></div>
    </nav>
  </div>
</header>

<main>
  <section id="calendar" class="section"></section>
  <section id="shows" class="section" hidden></section>
  <section id="movies" class="section" hidden></section>
</main>

<div id="meta"></div>

<div id="overlay" class="overlay" hidden>
  <div class="overlay-backdrop"></div>
  <div class="overlay-panel">
    <button class="overlay-back" aria-label="Back" hidden>&larr;</button>
    <button class="overlay-close" aria-label="Close">&times;</button>
    <div id="overlay-content"></div>
  </div>
</div>

<script>
  const $=s=>document.querySelector(s);
  const $$=s=>Array.from(document.querySelectorAll(s));
  const IMG=p=>p?`https://image.tmdb.org/t/p/w300${p}`:'';

  const state={
    data:null,
    serviceLogos:{},
    today:new Date(),
    currentMonth:null,
    profile:'All', // All | Andrew | Brant | Both (if present)
    showsGenre:'All',
    showsStatus:'All',
    showsWhen:'All',
    showsSort:'title',
    showsDir:'asc',
    moviesGenre:'All',
    moviesStatus:'All',
    moviesWhen:'All',
    moviesSort:'title',
    moviesDir:'asc'
  };

  let overlayStack=[];
  let remoteIndex=-1;

  (function initTheme(){
    const t=localStorage.getItem('tvhub_theme')||'dark';
    const s=parseFloat(localStorage.getItem('tvhub_fontscale')||'1.0')||1.0;
    document.documentElement.setAttribute('data-theme',t);
    document.documentElement.style.setProperty('--fs-scale',String(s));
  })();

  const getShows=()=> (state.data&&state.data.shows)||[];
  const getMovies=()=> (state.data&&state.data.movies)||[];

  async function load(){
    try{
      const [logos,data]=await Promise.all([
        loadServiceLogos().catch(()=>({})),
        fetch('../data/data.json',{cache:'no-cache'}).then(r=>{
          if(!r.ok) throw new Error('no data.json');
          return r.json();
        })
      ]);
      state.serviceLogos=logos||{};
      state.data=data;
      state.currentMonth=new Date(state.today.getFullYear(),state.today.getMonth(),1);
      initTabs();
      initProfileBar();
      renderAll();
    }catch(e){
      console.error(e);
      $('#calendar').innerHTML='<div class="mut">Unable to load data. Run the "Build TV Data" workflow.</div>';
    }
  }

  async function loadServiceLogos(){
    const url='../reports/service_logo_report_20251108_011548.csv';
    try{
      const r=await fetch(url,{cache:'no-cache'});
      if(!r.ok) return{};
      const text=await r.text();
      if(!text) return{};
      const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
      if(lines.length<2) return{};
      const header=lines[0].split(',').map(s=>s.trim().toLowerCase());
      const nameIdx=header.findIndex(h=>h.includes('name')||h.includes('service'));
      const logoIdx=header.findIndex(h=>h.includes('logo'));
      if(nameIdx===-1||logoIdx===-1) return{};
      const map={};
      for(let i=1;i<lines.length;i++){
        const cols=lines[i].split(',').map(s=>s.trim());
        const name=cols[nameIdx];
        const logo=cols[logoIdx];
        if(!name||!logo) continue;
        map[name.toLowerCase()]=logo;
      }
      return map;
    }catch(e){
      console.warn('Logo CSV load failed',e);
      return{};
    }
  }

  function initTabs(){
    const tabs=$$('.tab');
    tabs.forEach(tab=>{
      tab.onclick=()=>{
        const t=tab.dataset.tab;
        if(tab.classList.contains('active')) return;
        tabs.forEach(x=>x.classList.remove('active'));
        tab.classList.add('active');
        ['calendar','shows','movies'].forEach(id=>{
          $('#'+id).hidden=(id!==t);
        });
        if(t==='calendar') renderCalendar();
        if(t==='shows') renderShows();
        if(t==='movies') renderMovies();
        remoteIndex=-1;
      };
    });
    tabs[0].classList.add('active');
  }

  function initProfileBar(){
    const pb=$('#profileBar');
    const profiles=(state.data && state.data.profiles)||null;
    if(!profiles || !profiles.length){
      pb.hidden=true;
      return;
    }
    pb.hidden=false;
    const buttons=[
      {id:'All',label:'All'},
      {id:'Andrew',label:'Andrew'},
      {id:'Brant',label:'Brant'},
      {id:'Both',label:'Both'}
    ].filter(p=>p.id==='All' || profiles.includes(p.id));
    pb.innerHTML='<span class="label">Profile</span>'+
      buttons.map(p=>`<button class="btn chip${p.id===state.profile?' active':''}" data-prof="${p.id}">${p.label}</button>`).join('')+
      `<button class="btn chip${state.showsWhen==='Next30' && state.moviesWhen==='Next30'?' active':''}" data-quick-upcoming="1">Upcoming 30d</button>`;
    $$('[data-prof]').forEach(b=>{
      b.onclick=()=>{
        state.profile=b.dataset.prof;
        initProfileBar();
        renderAll();
      };
    });
    $$('[data-quick-upcoming]').forEach(b=>{
      b.onclick=()=>{
        const active=state.showsWhen==='Next30' && state.moviesWhen==='Next30';
        state.showsWhen=active?'All':'Next30';
        state.moviesWhen=active?'All':'Next30';
        initProfileBar();
        renderAll();
      };
    });
  }

  // Helpers

  function buildEpisodeIcons(show,season,epNum){
    const sid=show.show_id;
    const e=epNum||'';
    return `
      <a class="icon-link" target="_blank"
         href="https://www.themoviedb.org/tv/${sid}/season/${season}/episode/${e}">
        <span>Ⓣ</span><span>TMDB</span>
      </a>
      <a class="icon-link" target="_blank"
         href="https://vidsrc.net/embed/tv/${sid}/${season}/${e}">
        <span>▶</span><span>VidSrc</span>
      </a>
      <a class="icon-link" target="_blank"
         href="https://player.videasy.net/tv/${sid}/${season}/${e}">
        <span>▶</span><span>Videasy</span>
      </a>
    `;
  }

  function buildMovieIcons(mv){
    const id=mv.movie_id;
    return `
      <a class="icon-link" target="_blank" href="${mv.links.tmdb}">
        <span>Ⓣ</span><span>TMDB</span>
      </a>
      <a class="icon-link" target="_blank" href="https://vidsrc.net/embed/movie/${id}">
        <span>▶</span><span>VidSrc</span>
      </a>
      <a class="icon-link" target="_blank" href="https://player.videasy.net/movie/${id}">
        <span>▶</span><span>Videasy</span>
      </a>
    `;
  }

  function buildNetworks(show){
    const nets=show.networks||[];
    if(!nets.length) return'';
    const first=nets.slice(0,3);
    return `
      <div class="net-row">
        ${first.map(n=>{
          const key=n.toLowerCase();
          const logo=state.serviceLogos[key];
          if(logo){
            const src=logo.startsWith('http')?logo:`../image/services_logos/${logo}`;
            return `<div class="net-chip"><img class="net-logo" src="${src}" alt="${n}"></div>`;
          }
          return `<div class="net-chip">${n}</div>`;
        }).join('')}
      </div>
    `;
  }

  function guessCurrentSeason(show){
    let best=null,bestDate=null;
    (show.seasons||[]).forEach(s=>{
      (s.episodes||[]).forEach(ep=>{
        if(!ep.air_date) return;
        const d=new Date(ep.air_date);
        if(!bestDate || d>bestDate){bestDate=d;best=s.season_number;}
      });
    });
    return best;
  }

  function getShowLastAir(show){
    let last=null;
    (show.seasons||[]).forEach(s=>{
      (s.episodes||[]).forEach(ep=>{
        if(!ep.air_date) return;
        const d=new Date(ep.air_date);
        if(!last || d>last) last=d;
      });
    });
    return last;
  }

  function getShowNextAir(show,today){
    let next=null;
    (show.seasons||[]).forEach(s=>{
      (s.episodes||[]).forEach(ep=>{
        if(!ep.air_date) return;
        const d=new Date(ep.air_date);
        if(d>=today && (!next || d<next)) next=d;
      });
    });
    return next;
  }

  const getMovieDate=mv=> mv.release_date?new Date(mv.release_date):null;

  function inWhenBucket(datePast,dateFuture,when,today){
    if(when==='All') return true;
    if(when==='Past') return !!datePast && (!dateFuture || dateFuture<today);
    if(when==='Future') return !!dateFuture && dateFuture>=today;
    if(when==='Next30'){
      if(!dateFuture) return false;
      const diff=(dateFuture-today)/86400000;
      return diff>=0 && diff<=30;
    }
    if(when==='Next90'){
      if(!dateFuture) return false;
      const diff=(dateFuture-today)/86400000;
      return diff>=0 && diff<=90;
    }
    return true;
  }

  function watchedLabel(ep){
    const wb=ep.watched_by||[];
    if(!wb.length) return'';
    if(wb.includes('Andrew') && wb.includes('Brant')) return'<span class="ep-watched">Watched: Both</span>';
    if(wb.includes('Andrew')) return'<span class="ep-watched">Watched: Andrew</span>';
    if(wb.includes('Brant')) return'<span class="ep-watched">Watched: Brant</span>';
    return'';
  }

  function isVisibleForProfile(ep){
    if(state.profile==='All') return true;
    const wb=ep.watched_by||[];
    if(state.profile==='Andrew') return !wb.includes('Andrew');
    if(state.profile==='Brant') return !wb.includes('Brant');
    if(state.profile==='Both') return !(wb.includes('Andrew') && wb.includes('Brant'));
    return true;
  }

  function buildWhenButtons(type,current){
    const opts=[
      ['All','All'],
      ['Past','Past'],
      ['30d','Next30'],
      ['90d','Next90'],
      ['Future','Future'],
    ];
    return opts.map(([label,val])=>{
      const active=current===val?' active':'';
      return `<button class="btn chip${active}" data-when-type="${type}" data-when="${val}">${label}</button>`;
    }).join('');
  }

  // Calendar

  function changeMonth(d){const m=state.currentMonth;state.currentMonth=new Date(m.getFullYear(),m.getMonth()+d,1);renderCalendar();}
  function gotoToday(){state.currentMonth=new Date(state.today.getFullYear(),state.today.getMonth(),1);renderCalendar();}

  function renderCalendar(){
    const host=$('#calendar');
    const shows=getShows();
    const movies=getMovies();
    if(!shows.length && !movies.length){
      host.innerHTML='<div class="mut">No shows or movies configured.</div>';return;
    }
    const by={};
    for(const sh of shows){
      for(const s of sh.seasons||[]){
        for(const ep of s.episodes||[]){
          if(!ep.air_date) continue;
          if(!isVisibleForProfile(ep)) continue;
          const key=ep.air_date;
          (by[key] ||= []).push({type:'ep',show:sh,s:s.season_number,ep});
        }
      }
    }
    for(const mv of movies){
      if(!mv.release_date) continue;
      const key=mv.release_date;
      (by[key] ||= []).push({type:'mv',mv});
    }
    const y=state.currentMonth.getFullYear();
    const m=state.currentMonth.getMonth();
    const first=new Date(y,m,1);
    const start=new Date(first);
    start.setDate(first.getDate()-first.getDay());
    const monthName=first.toLocaleString(undefined,{month:'long',year:'numeric'});
    let html=`
      <div class="cal-head-sticky">
        <div class="cal-header">
          <div class="cal-title">${monthName}</div>
          <div class="cal-nav">
            <button class="cal-btn" id="cal-prev">&#9664;</button>
            <button class="cal-btn" id="cal-today">Today</button>
            <button class="cal-btn" id="cal-next">&#9654;</button>
          </div>
        </div>
        <div class="cal-dow-row">
          <div class="cal-dow">Sun</div><div class="cal-dow">Mon</div><div class="cal-dow">Tue</div>
          <div class="cal-dow">Wed</div><div class="cal-dow">Thu</div><div class="cal-dow">Fri</div><div class="cal-dow">Sat</div>
        </div>
      </div>
      <div class="cal-grid">
    `;
    for(let i=0;i<42;i++){
      const d=new Date(start);d.setDate(start.getDate()+i);
      const isToday=d.toDateString()===state.today.toDateString();
      const key=d.toISOString().slice(0,10);
      const items=by[key]||[];
      html+=`<div class="cal-day${isToday?' today':''}"><div class="cal-date">${d.getDate()}</div>`;
      for(const it of items){
        if(it.type==='ep'){
          const {show,s,ep}=it;
          const code=`S${String(s).padStart(2,'0')}E${String(ep.episode_number||0).padStart(2,'0')}`;
          html+=`
            <div class="cal-item">
              ${show.poster_path?`<img src="${IMG(show.poster_path)}" alt="">`:''}
              <div class="cal-lines">
                <div class="cal-show remote" data-show-id="${show.show_id}">${show.name}</div>
                <div class="cal-ep remote"
                     data-show-id="${show.show_id}"
                     data-season="${s}"
                     data-ep="${ep.episode_number||''}">
                  ${code}${ep.name?' · '+ep.name:''}
                  ${watchedLabel(ep)}
                </div>
                ${buildNetworks(show)}
                <div class="icon-row">${buildEpisodeIcons(show,s,ep.episode_number||'')}</div>
              </div>
            </div>`;
        }else{
          const mv=it.mv;
          html+=`
            <div class="cal-item">
              ${mv.poster_path?`<img src="${IMG(mv.poster_path)}" alt="">`:''}
              <div class="cal-lines">
                <div class="cal-show cal-movie-title remote"
                     data-movie-id="${mv.movie_id}">
                  ${mv.name}
                </div>
                <div class="cal-movie-label">Movie${mv.release_date?' • '+mv.release_date:''}</div>
                <div class="icon-row">${buildMovieIcons(mv)}</div>
              </div>
            </div>`;
        }
      }
      html+='</div>';
    }
    html+='</div>';
    host.innerHTML=html;

    $('#cal-prev').onclick=()=>changeMonth(-1);
    $('#cal-next').onclick=()=>changeMonth(1);
    $('#cal-today').onclick=()=>gotoToday();

    $$('#calendar .cal-show[data-show-id]').forEach(el=>{
      el.onclick=()=>{
        const id=+el.dataset.showId;
        const sh=getShows().find(s=>s.show_id===id);
        if(sh) openShowOverlay(sh,null);
      };
    });
    $$('#calendar .cal-ep[data-show-id]').forEach(el=>{
      el.onclick=()=>{
        const id=+el.dataset.showId;
        const sn=+el.dataset.season||null;
        const epn=parseInt(el.dataset.ep||'0',10)||null;
        const sh=getShows().find(s=>s.show_id===id);
        if(!sh) return;
        if(epn){
          const season=(sh.seasons||[]).find(x=>x.season_number===sn);
          const ep=season && (season.episodes||[]).find(e=>e.episode_number===epn);
          if(ep) return openEpisodeOverlay(sh,season,ep);
        }
        openShowOverlay(sh,sn);
      };
    });
    $$('#calendar .cal-movie-title').forEach(el=>{
      el.onclick=()=>{
        const id=+el.dataset.movieId;
        const mv=getMovies().find(m=>m.movie_id===id);
        if(mv) openMovieOverlay(mv);
      };
    });

    remoteIndex=-1;
  }

  // Shows, Movies, Overlay, Remote nav
