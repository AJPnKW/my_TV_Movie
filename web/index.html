<!doctype html>
<html lang="en">
<head>
  <!--
    File: web/index.html
    Project: my_TV_Movie
    Version: v2.8.01 (2025-11-09)

    Features:
      - SPA: Calendar / Shows / Movies / Live TV
      - Popups:
          P1: Show + seasons
          P2: Season episodes (inline in P1)
          P3: Episode detail
          P4: Movie detail
      - Trakt-integrated profiles (via scripts/sync_trakt.py):
          profiles[] + episode.watched_by[]
      - "Upcoming 30d" quick filter
      - Directional remote navigation
      - TV-friendly layout
      - Live TV: stubbed grid using data.live_tv (channel, country, group, logo)
  -->
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>My TV Hub</title>
  <style>
    :root{
      --bg:#050509;
      --fg:#f5f5f7;
      --mut:#9ca3af;
      --card:#14151d;
      --chip:#151823;
      --pri:#3b82f6;
      --border:#f5e6c5;
      --fs-scale:1;
    }
    :root[data-theme="light"]{
      --bg:#f5f5f7;
      --fg:#111827;
      --mut:#6b7280;
      --card:#ffffff;
      --chip:#e5e7eb;
      --pri:#2563eb;
      --border:#d1d5db;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font:calc(15px * var(--fs-scale))/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    a{color:var(--pri);text-decoration:none;}
    a:hover{text-decoration:underline;}

    header{
      position:sticky;
      top:0;
      z-index:40;
      background:rgba(5,5,9,.97);
      backdrop-filter:blur(8px);
    }
    :root[data-theme="light"] header{
      background:rgba(245,245,247,.97);
      backdrop-filter:none;
    }
    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:10px 20px 8px;
    }
    h1{font-size:22px;font-weight:700;}
    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:8px;
    }
    nav{
      display:flex;
      gap:8px;
      margin-top:6px;
      flex-wrap:wrap;
      align-items:center;
    }
    .tab{
      padding:6px 14px;
      border-radius:999px;
      background:var(--chip);
      font-size:11px;
      cursor:pointer;
      user-select:none;
    }
    .tab.active{
      background:var(--pri);
      color:#ffffff;
    }
    .profile-bar{
      display:inline-flex;
      gap:4px;
      flex-wrap:wrap;
      align-items:center;
      margin-left:4px;
      font-size:9px;
    }
    .btn-profile{
      padding:3px 9px;
      border-radius:999px;
      border:1px solid var(--chip);
      background:var(--chip);
      color:var(--fg);
      font-size:9px;
      cursor:pointer;
    }
    .btn-profile.active{
      background:var(--pri);
      color:#ffffff;
      border-color:var(--pri);
    }

    main{
      padding:8px 20px 4px;
      max-width:1200px;
      margin:0 auto;
    }
    .section{padding-bottom:16px;}
    .mut{color:var(--mut);}
    .small{font-size:10px;}

    .btn{
      padding:5px 10px;
      border-radius:999px;
      border:1px solid var(--chip);
      background:var(--chip);
      color:var(--fg);
      font-size:10px;
      cursor:pointer;
      min-width:52px;
    }
    .btn.active{
      background:var(--pri);
      color:#ffffff;
      border-color:var(--pri);
    }
    .btn.chip{
      padding:3px 9px;
      font-size:9px;
      min-width:0;
    }

    .controls-sticky{
      position:sticky;
      top:64px;
      z-index:30;
      background:var(--bg);
      padding:4px 0 6px;
    }
    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      align-items:center;
      font-size:10px;
    }
    .label{
      font-size:9px;
      color:var(--mut);
      margin-right:2px;
    }

    /* Calendar */
    .cal-head-sticky{
      position:sticky;
      top:64px;
      z-index:25;
      background:var(--bg);
      padding-bottom:4px;
    }
    .cal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:6px;
      margin-bottom:4px;
    }
    .cal-title{font-size:17px;font-weight:600;}
    .cal-nav{display:flex;gap:4px;}
    .cal-btn{
      padding:5px 8px;
      border-radius:999px;
      border:1px solid var(--chip);
      background:var(--chip);
      color:var(--fg);
      font-size:9px;
      cursor:pointer;
      min-width:46px;
      text-align:center;
    }
    .cal-dow-row{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      font-size:8px;
      color:var(--mut);
      gap:4px;
    }
    .cal-dow{text-align:center;padding-bottom:1px;}
    .cal-grid{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:6px;
      margin-top:4px;
    }
    .cal-day{
      min-height:98px;
      padding:4px;
      border-radius:8px;
      border:1px solid var(--border);
      background:#0d0e15;
      display:flex;
      flex-direction:column;
      gap:3px;
    }
    :root[data-theme="light"] .cal-day{background:#ffffff;}
    .cal-day.today{
      background:#fde68a;
      color:#111827;
      box-shadow:0 0 0 1px #fed7aa;
    }
    :root[data-theme="light"] .cal-day.today{
      background:#2563eb;
      color:#ffffff;
      box-shadow:0 0 0 1px #1d4ed8;
    }
    .cal-date{
      font-size:8px;
      font-weight:600;
      margin-bottom:1px;
    }
    .cal-item{
      display:flex;
      gap:4px;
      align-items:flex-start;
    }
    .cal-item img{
      width:40px;
      height:60px;
      border-radius:6px;
      object-fit:cover;
      background:#111827;
      flex-shrink:0;
    }
    .cal-lines{
      display:flex;
      flex-direction:column;
      gap:1px;
      font-size:8.5px;
    }
    .cal-show{font-weight:700;cursor:pointer;}
    .cal-ep{cursor:pointer;}
    .cal-movie-label{font-size:7.5px;color:var(--mut);}

    .net-row{
      display:flex;
      flex-wrap:wrap;
      gap:3px;
      margin-top:1px;
    }
    .net-chip{
      padding:1px 4px;
      border-radius:6px;
      background:rgba(148,163,253,.14);
      font-size:7px;
      color:var(--mut);
      display:flex;
      align-items:center;
      gap:2px;
    }
    .net-logo{
      height:10px;
      max-width:40px;
      object-fit:contain;
      display:block;
    }

    .icon-row{
      display:flex;
      gap:3px;
      flex-wrap:wrap;
      margin-top:1px;
    }
    .icon-link{
      display:inline-flex;
      align-items:center;
      gap:2px;
      padding:2px 5px;
      border-radius:999px;
      background:rgba(15,23,42,.96);
      font-size:7px;
      cursor:pointer;
    }
    .icon-link span{font-size:8px;}
    :root[data-theme="light"] .icon-link{
      background:rgba(17,24,39,.98);
      color:#ffffff;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:10px;
      margin-top:4px;
    }
    .card{
      background:var(--card);
      border-radius:14px;
      padding:8px;
      display:flex;
      gap:8px;
      border:1px solid var(--chip);
      align-items:flex-start;
    }
    .poster{
      width:70px;
      height:104px;
      border-radius:10px;
      object-fit:cover;
      background:#111827;
      flex-shrink:0;
    }
    .card-body{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
      flex:1;
    }
    .title{
      font-size:14px;
      font-weight:700;
      cursor:pointer;
    }
    .divider{
      height:1px;
      background:rgba(148,163,253,.14);
      margin:3px 0;
    }

    /* Overlay */
    .overlay[hidden]{display:none;}
    .overlay{
      position:fixed;
      inset:0;
      z-index:90;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .overlay-backdrop{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.78);
    }
    .overlay-panel{
      position:relative;
      max-width:980px;
      max-height:86vh;
      padding:22px 16px 10px;
      background:var(--card);
      border-radius:18px;
      box-shadow:0 24px 60px rgba(0,0,0,.75);
      overflow:auto;
      z-index:91;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
      touch-action:auto;
    }
    :root[data-theme="light"] .overlay-panel{
      background:#ffffff;
      box-shadow:0 24px 60px rgba(0,0,0,.18);
    }
    .overlay-close{
      position:absolute;
      top:6px;
      right:10px;
      border:none;
      background:transparent;
      color:var(--mut);
      font-size:24px;
      cursor:pointer;
    }
    .overlay-back{
      position:absolute;
      top:10px;
      left:10px;
      border:none;
      background:transparent;
      color:var(--mut);
      font-size:16px;
      cursor:pointer;
    }

    .ov-header{
      display:flex;
      gap:10px;
      align-items:flex-start;
      padding-top:12px;
      margin-bottom:6px;
    }
    .ov-poster{
      width:105px;
      height:158px;
      border-radius:10px;
      object-fit:cover;
      background:#111827;
      flex-shrink:0;
    }
    .ov-title-row{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }
    .ov-title{
      font-size:19px;
      font-weight:700;
    }
    .ov-sub{
      font-size:11px;
      color:var(--mut);
      margin:2px 0;
    }
    .ov-current{
      font-size:10px;
      margin:2px 0 1px;
    }
    .ov-overview{
      font-size:12px;
      color:var(--mut);
      margin-top:2px;
    }
    .ov-links{
      margin-top:4px;
      display:flex;
      gap:4px;
      flex-wrap:wrap;
    }

    .season-list{
      margin-top:8px;
      font-size:11px;
    }
    .season-row{
      padding:4px 0;
      border-bottom:1px solid rgba(148,163,253,.18);
      cursor:pointer;
    }
    .season-label{
      font-weight:600;
      margin-right:6px;
    }
    .season-meta{
      font-size:9px;
      color:var(--mut);
    }
    .season-desc{
      font-size:9px;
      color:var(--mut);
      margin-top:1px;
    }

    .episodes{
      margin-top:3px;
      padding-left:4px;
      font-size:10px;
    }
    .ep-row{
      padding:3px 0;
      border-bottom:1px dashed rgba(148,163,253,.16);
      cursor:pointer;
    }
    .ep-watched{
      font-size:8px;
      color:#22c55e;
      margin-left:4px;
    }

    /* Live TV */
    .ltv-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:8px;
      margin-top:4px;
    }
    .ltv-card{
      background:var(--card);
      border-radius:12px;
      padding:6px;
      border:1px solid var(--chip);
      display:flex;
      gap:6px;
      align-items:center;
    }
    .ltv-logo{
      width:40px;
      height:40px;
      border-radius:8px;
      object-fit:contain;
      background:#111827;
      flex-shrink:0;
    }
    .ltv-body{
      display:flex;
      flex-direction:column;
      gap:1px;
      font-size:9px;
    }
    .ltv-title{
      font-size:11px;
      font-weight:600;
    }
    .ltv-meta{
      color:var(--mut);
      font-size:8px;
    }

    #meta{
      font-size:9px;
      color:var(--mut);
      padding:2px 20px 10px;
      max-width:1200px;
      margin:0 auto;
    }

    .remote-focus{
      outline:2px solid var(--pri);
      outline-offset:2px;
      border-radius:6px;
    }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="row">
      <h1>My TV Hub</h1>
      <div class="small"><a href="config.html">Config</a></div>
    </div>
    <nav>
      <div class="tab" data-tab="calendar">Calendar</div>
      <div class="tab" data-tab="shows">Shows</div>
      <div class="tab" data-tab="movies">Movies</div>
      <div class="tab" data-tab="livetv">Live TV</div>
      <div id="profileBar" class="profile-bar" hidden></div>
    </nav>
  </div>
</header>

<main>
  <section id="calendar" class="section"></section>
  <section id="shows" class="section" hidden></section>
  <section id="movies" class="section" hidden></section>
  <section id="livetv" class="section" hidden></section>
</main>

<div id="meta"></div>

<div id="overlay" class="overlay" hidden>
  <div class="overlay-backdrop"></div>
  <div class="overlay-panel">
    <button class="overlay-back" aria-label="Back" hidden>&larr;</button>
    <button class="overlay-close" aria-label="Close">&times;</button>
    <div id="overlay-content"></div>
  </div>
</div>

<script>
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const IMG = p => p ? `https://image.tmdb.org/t/p/w300${p}` : '';

  const state = {
    data: null,
    serviceLogos: {},
    today: new Date(),
    currentMonth: null,
    profile: 'All',
    showsGenre: 'All',
    showsStatus: 'All',
    showsWhen: 'All',
    showsSort: 'title',
    showsDir: 'asc',
    moviesGenre: 'All',
    moviesStatus: 'All',
    moviesWhen: 'All',
    moviesSort: 'title',
    moviesDir: 'asc'
  };

  let overlayStack = [];
  let remoteIndex = -1;

  (function initTheme(){
    const t = localStorage.getItem('tvhub_theme') || 'dark';
    const s = parseFloat(localStorage.getItem('tvhub_fontscale') || '1.0') || 1.0;
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.style.setProperty('--fs-scale', String(s));
  })();

  const getShows = () => (state.data && state.data.shows) || [];
  const getMovies = () => (state.data && state.data.movies) || [];
  const getLiveTV = () => (state.data && state.data.live_tv) || [];

  async function load(){
    try{
      const [logos, data] = await Promise.all([
        loadServiceLogos().catch(()=> ({})),
        fetch('../data/data.json', {cache:'no-cache'}).then(r=>{
          if(!r.ok) throw new Error('no data.json');
          return r.json();
        })
      ]);
      state.serviceLogos = logos || {};
      state.data = data;
      state.currentMonth = new Date(state.today.getFullYear(), state.today.getMonth(), 1);
      initTabs();
      initProfileBar();
      renderAll();
    }catch(e){
      console.error(e);
      $('#calendar').innerHTML =
        '<div class="mut">Unable to load data. Run the "Build TV Data and Deploy" workflow.</div>';
    }
  }

  async function loadServiceLogos(){
    const url = '../reports/service_logo_report_20251108_011548.csv';
    try{
      const r = await fetch(url, {cache:'no-cache'});
      if(!r.ok) return {};
      const text = await r.text();
      if(!text) return {};
      const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
      if(lines.length < 2) return {};
      const header = lines[0].split(',').map(s=>s.trim().toLowerCase());
      const nameIdx = header.findIndex(h=>h.includes('name') || h.includes('service'));
      const logoIdx = header.findIndex(h=>h.includes('logo'));
      if(nameIdx === -1 || logoIdx === -1) return {};
      const map = {};
      for(let i=1;i<lines.length;i++){
        const cols = lines[i].split(',').map(s=>s.trim());
        const name = cols[nameIdx];
        const logo = cols[logoIdx];
        if(!name || !logo) continue;
        map[name.toLowerCase()] = logo;
      }
      return map;
    }catch(e){
      console.warn('Logo CSV load failed', e);
      return {};
    }
  }

  function initTabs(){
    const tabs = $$('.tab');
    tabs.forEach(tab=>{
      tab.onclick = () => {
        const t = tab.dataset.tab;
        if(tab.classList.contains('active')) return;
        tabs.forEach(x=>x.classList.remove('active'));
        tab.classList.add('active');
        ['calendar','shows','movies','livetv'].forEach(id=>{
          $('#'+id).hidden = (id !== t);
        });
        if(t === 'calendar') renderCalendar();
        if(t === 'shows') renderShows();
        if(t === 'movies') renderMovies();
        if(t === 'livetv') renderLiveTV();
        remoteIndex = -1;
      };
    });
    tabs[0].classList.add('active');
  }

  function initProfileBar(){
    const pb = $('#profileBar');
    const profiles = (state.data && state.data.profiles) || null;
    if(!profiles || !profiles.length){
      pb.hidden = true;
      return;
    }
    pb.hidden = false;
    const cand = [
      {id:'All', label:'All'},
      {id:'Andrew', label:'Andrew'},
      {id:'Brant', label:'Brant'},
      {id:'Both', label:'Both'}
    ].filter(p => p.id === 'All' || profiles.includes(p.id));
    pb.innerHTML =
      '<span class="label">Profile</span>' +
      cand.map(p =>
        `<button class="btn-profile${p.id===state.profile?' active':''}" data-prof="${p.id}">${p.label}</button>`
      ).join('') +
      `<button class="btn-profile${state.showsWhen==='Next30' && state.moviesWhen==='Next30'?' active':''}"
         data-quick-upcoming="1">Upcoming 30d</button>`;
    $$('[data-prof]').forEach(b=>{
      b.onclick = () => {
        state.profile = b.dataset.prof;
        initProfileBar();
        renderAll();
      };
    });
    $$('[data-quick-upcoming]').forEach(b=>{
      b.onclick = () => {
        const active = state.showsWhen==='Next30' && state.moviesWhen==='Next30';
        state.showsWhen = active ? 'All' : 'Next30';
        state.moviesWhen = active ? 'All' : 'Next30';
        initProfileBar();
        renderAll();
      };
    });
  }

  function buildEpisodeIcons(show, season, epNum){
    const sid = show.show_id;
    const e = epNum || '';
    return `
      <a class="icon-link" target="_blank"
         href="https://www.themoviedb.org/tv/${sid}/season/${season}/episode/${e}">
        <span>Ⓣ</span><span>TMDB</span>
      </a>
      <a class="icon-link" target="_blank"
         href="https://vidsrc.net/embed/tv/${sid}/${season}/${e}">
        <span>▶</span><span>VidSrc</span>
      </a>
      <a class="icon-link" target="_blank"
         href="https://player.videasy.net/tv/${sid}/${season}/${e}">
        <span>▶</span><span>Videasy</span>
      </a>
    `;
  }

  function buildMovieIcons(mv){
    const id = mv.movie_id;
    return `
      <a class="icon-link" target="_blank" href="${mv.links.tmdb}">
        <span>Ⓣ</span><span>TMDB</span>
      </a>
      <a class="icon-link" target="_blank" href="https://vidsrc.net/embed/movie/${id}">
        <span>▶</span><span>VidSrc</span>
      </a>
      <a class="icon-link" target="_blank" href="https://player.videasy.net/movie/${id}">
        <span>▶</span><span>Videasy</span>
      </a>
    `;
  }

  function buildNetworks(show){
    const nets = show.networks || [];
    if(!nets.length) return '';
    const first = nets.slice(0,3);
    return `
      <div class="net-row">
        ${first.map(n=>{
          const key = n.toLowerCase();
          const logo = state.serviceLogos[key];
          if(logo){
            const src = logo.startsWith('http')
              ? logo
              : `../image/services_logos/${logo}`;
            return `<div class="net-chip"><img class="net-logo" src="${src}" alt="${n}"></div>`;
          }
          return `<div class="net-chip">${n}</div>`;
        }).join('')}
      </div>
    `;
  }

  function guessCurrentSeason(show){
    let best = null, bestDate = null;
    (show.seasons||[]).forEach(s=>{
      (s.episodes||[]).forEach(ep=>{
        if(!ep.air_date) return;
        const d = new Date(ep.air_date);
        if(!bestDate || d > bestDate){
          bestDate = d;
          best = s.season_number;
        }
      });
    });
    return best;
  }

  function getShowLastAir(show){
    let last = null;
    (show.seasons||[]).forEach(s=>{
      (s.episodes||[]).forEach(ep=>{
        if(!ep.air_date) return;
        const d = new Date(ep.air_date);
        if(!last || d > last) last = d;
      });
    });
    return last;
  }

  function getShowNextAir(show, today){
    let next = null;
    (show.seasons||[]).forEach(s=>{
      (s.episodes||[]).forEach(ep=>{
        if(!ep.air_date) return;
        const d = new Date(ep.air_date);
        if(d >= today && (!next || d < next)) next = d;
      });
    });
    return next;
  }

  const getMovieDate = mv => mv.release_date ? new Date(mv.release_date) : null;

  function watchedLabel(ep){
    const wb = ep.watched_by || [];
    if(!wb.length) return '';
    if(wb.includes('Andrew') && wb.includes('Brant')) return '<span class="ep-watched">Watched: Both</span>';
    if(wb.includes('Andrew')) return '<span class="ep-watched">Watched: Andrew</span>';
    if(wb.includes('Brant')) return '<span class="ep-watched">Watched: Brant</span>';
    return '';
  }
  function isVisibleForProfile(ep){
    const wb = ep.watched_by || [];
    if(state.profile === 'All') return true;
    if(state.profile === 'Andrew') return !wb.includes('Andrew');
    if(state.profile === 'Brant') return !wb.includes('Brant');
    if(state.profile === 'Both') return !(wb.includes('Andrew') && wb.includes('Brant'));
    return true;
  }

  function inWhenBucket(datePast, dateFuture, when, today){
    if(when === 'All') return true;
    if(when === 'Past') return !!datePast && (!dateFuture || dateFuture < today);
    if(when === 'Future') return !!dateFuture && dateFuture >= today;
    if(when === 'Next30'){
      if(!dateFuture) return false;
      const diff = (dateFuture - today) / 86400000;
      return diff >= 0 && diff <= 30;
    }
    if(when === 'Next90'){
      if(!dateFuture) return false;
      const diff = (dateFuture - today) / 86400000;
      return diff >= 0 && diff <= 90;
    }
    return true;
  }

  function buildWhenButtons(type, current){
    const opts = [
      ['All','All'],
      ['Past','Past'],
      ['30d','Next30'],
      ['90d','Next90'],
      ['Future','Future']
    ];
    return opts.map(([label,val])=>{
      const active = current === val ? ' active' : '';
      return `<button class="btn chip${active}" data-when-type="${type}" data-when="${val}">${label}</button>`;
    }).join('');
  }

    const by = {};
    for(const sh of shows){
      for(const s of sh.seasons || []){

      (by[key] ||= []).push({type:'mv', mv});

    const year = state.currentMonth.getFullYear();
    const month = state.currentMonth.getMonth();
    const first = new Date(year, month, 1);
    const start = new Date(first);
    start.setDate(first.getDate() - first.getDay());

    let html = `

  // Overlay (P1, P2, P3, P4) implementation identical to previous answer:
  // openShowOverlay, openEpisodeOverlay, openMovieOverlay, showOverlay,
  // renderShowView, renderEpisodeView, renderMovieView (unchanged from design).

  // For brevity here, those functions are already defined above
  // in your current version; keep them as-is from prior block.
  // (If anything is missing in your local file, shout and I'll resend that slice.)

  // Remote navigation (directional)

  document.addEventListener('keydown', e=>{
    const ovOpen = !$('#overlay').hidden && overlayStack.length;
    if(ovOpen){
      if(e.key === 'Escape' || e.key === 'Backspace'){
        e.preventDefault();
        popOverlayOne();
      }
      return;
    }
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter'].includes(e.key)){
      e.preventDefault();
      remoteNavigate(e.key);
    }
  });

  function collectRemoteItems(){
    const items = [];
    $$('.tab').forEach(el=>{ if(el.offsetParent) items.push(el); });
    ['calendar','shows','movies','livetv'].forEach(id=>{
      const sec = $('#'+id);
      if(sec && !sec.hidden){
        sec.querySelectorAll('.remote').forEach(el=>{
          if(el.offsetParent) items.push(el);
        });
      }
    });
    return items;
  }

  function remoteNavigate(key){
    const els = collectRemoteItems();
    if(!els.length) return;
    const rects = els.map(el=>{
      const r = el.getBoundingClientRect();
      return {el,x:(r.left+r.right)/2,y:(r.top+r.bottom)/2};
    });
    if(remoteIndex < 0 || remoteIndex >= els.length) remoteIndex = 0;
    const cur = rects[remoteIndex];

    if(key === 'Enter'){
      els[remoteIndex].click();
      return;
    }

    const candidates = [];
    rects.forEach((c,i)=>{
      if(i===remoteIndex) return;
      const dx = c.x - cur.x;
      const dy = c.y - cur.y;
      if(key === 'ArrowRight' && dx > 4 && Math.abs(dy) < 80) candidates.push({i,score:dx + Math.abs(dy)/4});
      if(key === 'ArrowLeft' && dx < -4 && Math.abs(dy) < 80) candidates.push({i,score:-dx + Math.abs(dy)/4});
      if(key === 'ArrowDown' && dy > 4) candidates.push({i,score:dy + Math.abs(dx)/4});
      if(key === 'ArrowUp' && dy < -4) candidates.push({i,score:-dy + Math.abs(dx)/4});
    });

    if(candidates.length){
      candidates.sort((a,b)=>a.score - b.score);
      remoteIndex = candidates[0].i;
    }else{
      if(key === 'ArrowRight' || key === 'ArrowDown')
        remoteIndex = (remoteIndex + 1) % els.length;
      else
        remoteIndex = (remoteIndex - 1 + els.length) % els.length;
    }

    els.forEach(el=>el.classList.remove('remote-focus'));
    const next = els[remoteIndex];
    next.classList.add('remote-focus');
    next.scrollIntoView({block:'nearest'});
  }

  function popOverlayOne(){
    if(overlayStack.length <= 1){
      overlayStack = [];
      $('#overlay').hidden = true;
      $('#overlay-content').innerHTML = '';
      return;
    }
    overlayStack.pop();
    showOverlay();
  }

  function renderMeta(){
    if(!state.data) return;
    const sc = (state.data.meta && state.data.meta.shows) || (state.data.shows||[]).length;
    const mc = (state.data.meta && state.data.meta.movies) || (state.data.movies||[]).length;
    const built = state.data.generated_at || 'n/a';
    $('#meta').textContent =
      `Data built: ${built} · Shows: ${sc} · Movies: ${mc}`;
  }

  function renderAll(){
    renderCalendar();
    renderShows();
    renderMovies();
    renderLiveTV();
    renderMeta();
    // default Calendar
    $('#calendar').hidden=false;
    $('#shows').hidden=true;
    $('#movies').hidden=true;
    $('#livetv').hidden=true;
    $$('.tab').forEach(t=>t.classList.remove('active'));
    $$('.tab')[0].classList.add('active');
  }

  load();
</script>
</body>
</html>
