<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>My TV Hub - Dashboard</title>
  <link rel="stylesheet" href="./css/my_tv_hub.css" />
  <link rel="stylesheet" href="./css/main_app.css" />
</head>
<body data-app-family="main" data-page="dashboard">
  <div class="app">
    <div class="top">
      <div class="brand">
        <div class="logo" aria-label="MY TV HUB"><div class="logo_txt"><div>MY TV</div><div>HUB</div></div></div>
      </div>
      <div class="nav" role="tablist" aria-label="Primary">
        <a class="tab active" data-tab="dashboard" href="./index.html" role="tab" aria-selected="true">Dashboard</a>
        <a class="tab" data-tab="shows" href="./shows.html" role="tab" aria-selected="false">Shows</a>
        <a class="tab" data-tab="movies" href="./movies.html" role="tab" aria-selected="false">Movies</a>
        <a class="tab" data-tab="watch-me" href="./watch_me/watch_me.html" role="tab" aria-selected="false">Watch Me</a>
        <a class="tab" data-tab="calendar" href="./calendar.html" role="tab" aria-selected="false">Calendar</a>
        <a class="tab" data-tab="discover" href="./discover.html" role="tab" aria-selected="false">Discover</a>
        <a class="tab" data-tab="config" href="./config.html" role="tab" aria-selected="false">Config</a>
        <a class="tab" data-tab="inputs-editor" href="http://127.0.0.1:8787/web/inputs_editor.html" role="tab" aria-selected="false">Inputs Editor</a>
      </div>
      <div class="status" aria-live="polite">
        <div id="statusDot" class="dot"></div>
        <span id="statusText">Loading</span>
        <button id="verBadge" class="calbtn" type="button" aria-label="Version">ver</button>
      </div>
    </div>
    <div class="shell">
      <main class="main">
        <div id="panel-dashboard" class="panel">
          <div class="dash">
            <section class="dashblock accent-pink">
              <div class="dashhead"><h2>Last Week</h2><span class="muted" id="dashLastWeekMeta"></span></div>
              <div id="dashLastWeekCols" class="dashgrid"></div>
            </section>
            <section class="dashblock accent-orange">
              <div class="dashhead"><h2>Up Next</h2><span class="muted" id="dashNextMeta"></span></div>
              <div id="dashUpNext" class="dashrow"></div>
            </section>
            <section class="dashblock accent-pink">
              <div class="dashhead"><h2>Upcoming Schedule</h2><span class="muted">Next 7 days</span></div>
              <div id="dashScheduleCols" class="dashgrid"></div>
            </section>
            <section class="dashblock accent-green">
              <div class="dashhead"><h2>Watchlist</h2><span class="muted" id="dashWatchMeta"></span></div>
              <div id="dashWatchlist" class="dashwatchlist"></div>
            </section>
            <section class="dashblock accent-yellow">
              <div class="dashhead"><h2>Recommendations</h2><span class="muted">Shows &amp; Movies</span></div>
              <div class="dashrecs">
                <div class="dashreccol">
                  <div class="dashhead" style="margin-bottom:4px;"><h2 style="font-size:15px;">Shows</h2></div>
                  <div id="dashShowRecs" class="dashrecgrid"></div>
                </div>
                <div class="dashreccol">
                  <div class="dashhead" style="margin-bottom:4px;"><h2 style="font-size:15px;">Movies</h2></div>
                  <div id="dashMovieRecs" class="dashrecgrid"></div>
                </div>
              </div>
            </section>
          </div>
        </div>
        <div id="panel-show" class="panel hidden">
          <div id="showRoot"></div>
        </div>
      </main>
    </div>
    <div class="footer" id="footer"></div>
  </div>
  <div id="modalBack" class="app-modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true">
    <div id="modalCard" class="app-modal-card" tabindex="0">
      <div class="app-modal-header">
        <div id="modalTitle" class="app-modal-title">Details</div>
        <button id="modalClose" class="calbtn" type="button">Close</button>
      </div>
      <div id="modalBody" class="app-modal-body"></div>
    </div>
  </div>
  <div id="providerBack" class="app-modal-backdrop app-modal-backdrop--provider" aria-hidden="true" role="dialog" aria-modal="true">
    <div id="providerCard" class="app-modal-card app-modal-card--provider" tabindex="0">
      <div class="app-modal-header">
        <div id="providerTitle" class="app-modal-title">Where to watch</div>
        <button id="providerClose" class="calbtn" type="button">Close</button>
      </div>
      <div id="providerBody" class="app-modal-body"></div>
    </div>
  </div>
  <script type="module" src="./js/app_runtime.js"></script>
</body>
</html>
