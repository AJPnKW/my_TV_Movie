<!doctype html>
<html lang="en">
<head>
  <!--
    File: /web/index.html
    Project: my_TV_Movie
    Version: v2.0.0 (2025-11-07)

    Key features:
    - Calendar tab:
        * 6x7 month grid (Sun-Sat) with Prev/Next.
        * Shows TV episodes + Movie releases for visible days.
        * No grey-out: previous/next month days in grid look consistent.
        * Episode links:
            - TV: vidsrc/videasy include /show_id/season/episode
            - Movie: vidsrc/videasy /movie_id
    - Shows tab:
        * Cards with poster-first layout.
        * Controls:
            - Sort: Title A–Z/Z–A (toggle button) or Next Episode.
            - Genre filter.
            - Status filter (from TMDB status).
    - Movies tab:
        * Similar controls:
            - Sort: Title A–Z/Z–A or Release Date.
            - Genre & Status filters.
    - Overlay:
        * Click any show title to open:
            - Poster, title, genres.
            - Overview.
            - Seasons listing (mark heuristic "Current season").
            - Click season row to expand episode list.
            - Hides pure TBA episodes (shows them automatically when data appears).
    - Config integration:
        * Reads localStorage:
            - tvhub_theme: "dark" (default) or "light"
            - tvhub_fontscale: e.g. "1.0", "1.2"
    - Footer stats:
        * "Data built: <timestamp> · Shows: N · Movies: M"
  -->
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>My TV Hub</title>
  <style>
    :root{
      --bg:#0b0b0c;
      --fg:#f3f3f3;
      --mut:#b9b9c2;
      --card:#15151a;
      --chip:#22222a;
      --pri:#6ad1ff;
      --border:#252530;
      --fs-scale:1;
    }
    :root[data-theme="light"]{
      --bg:#f5f5f7;
      --fg:#111827;
      --mut:#6b7280;
      --card:#ffffff;
      --chip:#e5e7eb;
      --pri:#2563eb;
      --border:#d1d5db;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font:calc(15px * var(--fs-scale))/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    a{ color:var(--pri); text-decoration:none; }
    a:hover{ text-decoration:underline; }

    header{
      position:sticky; top:0; z-index:5;
      background:rgba(11,11,12,.9);
      backdrop-filter:saturate(1.4) blur(6px);
    }
    :root[data-theme="light"] header{
      background:rgba(245,245,247,.97);
      backdrop-filter:none;
    }

    .wrap{ max-width:1100px; margin:0 auto; padding:14px; }
    h1{ margin:0; font-size:22px; }

    .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

    nav{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }

    .tab{
      padding:10px 14px;
      border-radius:999px;
      background:var(--chip);
      cursor:pointer;
      font-size:14px;
      user-select:none;
    }
    .tab.active{
      background:var(--pri);
      color:#041f2a;
    }

    main.wrap{ padding-top:10px; padding-bottom:8px; }

    .section{ padding:4px 0 16px; }
    .mut{ color:var(--mut); }
    .small{ font-size:12px; }
    .divider{ height:1px; background:var(--border); margin:8px 0; }

    .links a{ margin-right:10px; font-size:11px; }

    .pill{
      display:inline-block;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid var(--border);
      font-size:11px;
    }

    /* Controls row for Shows/Movies */
    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      margin-bottom:8px;
      font-size:11px;
    }
    .label{ color:var(--mut); }

    .btn{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--chip);
      color:var(--fg);
      font-size:11px;
      cursor:pointer;
      user-select:none;
    }
    .btn.active{
      background:var(--pri);
      color:#041f2a;
    }

    .chip{
      background:var(--chip);
      padding:4px 8px;
      border-radius:999px;
      font-size:11px;
      cursor:pointer;
    }
    .chip.active{
      background:var(--pri);
      color:#041f2a;
    }

    /* Calendar */
    .cal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:8px;
      gap:8px;
    }
    .cal-title{ font-size:18px; font-weight:600; }
    .cal-btn{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--chip);
      color:var(--fg);
      font-size:12px;
      cursor:pointer;
    }
    .cal-grid{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:4px;
      font-size:11px;
    }
    .cal-dow{
      text-align:center;
      padding:4px 0;
      color:var(--mut);
    }
    .cal-day{
      min-height:86px;
      padding:4px;
      border-radius:8px;
      background:var(--card);
      border:1px solid transparent;
      display:flex;
      flex-direction:column;
      gap:3px;
    }
    .cal-day.today{ border-color:var(--pri); }
    .cal-date{
      font-weight:600;
      font-size:11px;
      margin-bottom:2px;
    }
    .cal-item{
      display:flex;
      gap:4px;
      align-items:flex-start;
    }
    .cal-item img{
      width:22px; height:33px;
      border-radius:4px;
      object-fit:cover;
      flex-shrink:0;
      background:#111;
    }
    .cal-item span{
      display:block;
      font-size:9px;
      line-height:1.2;
    }
    .cal-item .show-title{
      font-weight:600;
      cursor:pointer;
    }
    .cal-item .movie-label{
      font-size:8px;
      color:var(--mut);
    }

    /* Cards for Shows/Movies tabs */
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(280px,1fr));
      gap:12px;
    }
    .card{
      background:var(--card);
      border-radius:14px;
      padding:10px;
      display:flex;
      gap:8px;
      align-items:flex-start;
    }
    .poster{
      width:70px;
      height:105px;
      border-radius:10px;
      object-fit:cover;
      flex-shrink:0;
      background:#111;
    }
    .card-body{
      display:flex;
      flex-direction:column;
      gap:4px;
      flex:1;
      min-width:0;
    }
    .title{
      font-size:16px;
      font-weight:700;
      cursor:pointer;
    }

    /* Overlay */
    .overlay[hidden]{ display:none; }
    .overlay{
      position:fixed;
      inset:0;
      z-index:40;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .overlay-backdrop{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.7);
    }
    .overlay-panel{
      position:relative;
      max-width:900px;
      max-height:85vh;
      padding:18px 16px 14px;
      background:var(--card);
      border-radius:18px;
      box-shadow:0 18px 45px rgba(0,0,0,.6);
      overflow:auto;
      z-index:41;
    }
    :root[data-theme="light"] .overlay-panel{
      background:#ffffff;
      box-shadow:0 18px 45px rgba(0,0,0,.18);
    }
    .overlay-close{
      position:absolute;
      top:6px;
      right:10px;
      border:none;
      background:transparent;
      color:var(--mut);
      font-size:24px;
      cursor:pointer;
    }
    .ov-header{
      display:flex;
      gap:12px;
      align-items:flex-start;
      margin-bottom:10px;
      padding-top:12px; /* space so the X doesn't overlap title */
    }
    .ov-poster{
      width:90px;
      height:135px;
      border-radius:12px;
      object-fit:cover;
      background:#111;
      flex-shrink:0;
    }
    .ov-title{
      font-size:20px;
      font-weight:700;
      margin-bottom:4px;
    }
    .ov-sub{
      font-size:12px;
      color:var(--mut);
    }
    .ov-overview{
      font-size:13px;
      color:var(--mut);
      margin-top:4px;
    }
    .season-list{
      margin-top:6px;
      font-size:13px;
    }
    .season-row{
      padding:6px 0;
      border-bottom:1px solid var(--border);
      cursor:pointer;
    }
    .season-label{
      font-weight:600;
    }
    .season-badge{
      display:inline-block;
      margin-left:6px;
      padding:2px 6px;
      border-radius:999px;
      background:var(--chip);
      font-size:9px;
      color:var(--pri);
    }
    .season-meta{
      font-size:11px;
      color:var(--mut);
    }
    .season-overview{
      font-size:11px;
      color:var(--mut);
      margin-top:2px;
    }
    .episodes{
      margin-top:4px;
      padding-left:4px;
      font-size:11px;
    }
    .ep-row{
      margin-bottom:3px;
    }

    /* Footer meta */
    #meta{
      font-size:10px;
      color:var(--mut);
      padding:4px 14px 10px;
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="row" style="justify-content:space-between">
        <h1>My TV Hub</h1>
        <div class="row small">
          <a href="config.html">Config</a>
        </div>
      </div>
      <nav>
        <div class="tab active" data-tab="calendar">Calendar</div>
        <div class="tab" data-tab="shows">Shows</div>
        <div class="tab" data-tab="movies">Movies</div>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="calendar" class="section"></section>
    <section id="shows" class="section" hidden></section>
    <section id="movies" class="section" hidden></section>
  </main>

  <div class="wrap">
    <div id="meta"></div>
  </div>

  <!-- Overlay -->
  <div id="overlay" class="overlay" hidden>
    <div class="overlay-backdrop"></div>
    <div class="overlay-panel">
      <button class="overlay-close" aria-label="Close">&times;</button>
      <div id="overlay-content"></div>
    </div>
  </div>

  <script>
    const $  = s => document.querySelector(s);
    const $$ = s => Array.from(document.querySelectorAll(s));
    const IMG = p => p ? `https://image.tmdb.org/t/p/w300${p}` : '';
    const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    const state = {
      data: null,
      today: new Date(),
      currentMonth: null,
      // Shows tab
      showsSort: 'title',   // 'title' or 'next'
      showsDir: 'asc',      // for title sort
      showsGenre: 'All',
      showsStatus: 'All',
      // Movies tab
      moviesSort: 'title',  // 'title' or 'date'
      moviesDir: 'asc',
      moviesGenre: 'All',
      moviesStatus: 'All',
    };

    // --- Config from localStorage (theme + font scale) -----------------------
    (function applyConfig(){
      const theme = localStorage.getItem('tvhub_theme') || 'dark';
      const scale = parseFloat(localStorage.getItem('tvhub_fontscale') || '1.0') || 1.0;
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.setProperty('--fs-scale', String(scale));
    })();

    // --- Helpers -------------------------------------------------------------
    function getShows(){ return (state.data && state.data.shows) || []; }
    function getMovies(){ return (state.data && state.data.movies) || []; }

    function isTBA(name){
      if(!name) return false;
      const n = name.trim().toUpperCase();
      return n === 'TBA' || n === 'N/A';
    }

    // --- Load data.json ------------------------------------------------------
    async function load(){
      try{
        const res = await fetch('../data/data.json', { cache:'no-cache' });
        if(!res.ok) throw new Error('Failed to load data.json');
        state.data = await res.json();
        state.currentMonth = new Date(state.today.getFullYear(), state.today.getMonth(), 1);
        renderAll();
        attachTabs();
      }catch(err){
        console.error(err);
        $('#calendar').innerHTML =
          '<div class="mut">Unable to load data. Make sure the GitHub Actions refresh has run.</div>';
      }
    }

    // --- Common link builders ------------------------------------------------
    function showLinks(show){
      const sid = show.show_id;
      return `
        <div class="links small">
          <a target="_blank" href="${show.links.tmdb}">TMDB</a>
          <a target="_blank" href="https://vidsrc.net/embed/tv/${sid}">VidSrc</a>
          <a target="_blank" href="https://player.videasy.net/tv/${sid}">Videasy</a>
        </div>
      `;
    }

    function episodeLinks(show, season, epNum){
      const sid = show.show_id;
      const s = season;
      const e = epNum || '';
      return `
        <div class="links small">
          <a target="_blank" href="${show.links.tmdb}">TMDB</a>
          <a target="_blank" href="https://vidsrc.net/embed/tv/${sid}/${s}/${e}">VidSrc</a>
          <a target="_blank" href="https://player.videasy.net/tv/${sid}/${s}/${e}">Videasy</a>
        </div>
      `;
    }

    function movieLinks(movie){
      const mid = movie.movie_id;
      return `
        <div class="links small">
          <a target="_blank" href="${movie.links.tmdb}">TMDB</a>
          <a target="_blank" href="https://vidsrc.net/embed/movie/${mid}">VidSrc</a>
          <a target="_blank" href="https://player.videasy.net/movie/${mid}">Videasy</a>
        </div>
      `;
    }

    // --- Tabs ----------------------------------------------------------------
    function attachTabs(){
      $$('.tab').forEach(tab=>{
        tab.addEventListener('click', ()=>{
          const target = tab.dataset.tab;
          if(tab.classList.contains('active')) return;

          $$('.tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');

          ['calendar','shows','movies'].forEach(id=>{
            $('#'+id).hidden = (id !== target);
          });

          if(target === 'calendar') renderCalendar();
          if(target === 'shows')    renderShows();
          if(target === 'movies')   renderMovies();
        });
      });
    }

    // --- Calendar: TV episodes + Movie releases ------------------------------
    function changeMonth(delta){
      const m = state.currentMonth;
      state.currentMonth = new Date(m.getFullYear(), m.getMonth()+delta, 1);
      renderCalendar();
    }

    function renderCalendar(){
      const host = $('#calendar');
      const shows = getShows();
      const movies = getMovies();

      if(!shows.length && !movies.length){
        host.innerHTML = '<div class="mut">No shows or movies configured.</div>';
        return;
      }

      if(!state.currentMonth){
        state.currentMonth = new Date(state.today.getFullYear(), state.today.getMonth(), 1);
      }

      const byDate = {};

      // TV episodes
      for(const show of shows){
        for(const s of show.seasons || []){
          for(const ep of s.episodes || []){
            if(!ep.air_date) continue;
            const key = ep.air_date;
            (byDate[key] ||= []).push({
              type:'episode',
              show,
              season:s.season_number,
              ep
            });
          }
        }
      }

      // Movies (by release_date)
      for(const mv of movies){
        if(!mv.release_date) continue;
        const key = mv.release_date;
        (byDate[key] ||= []).push({
          type:'movie',
          movie:mv
        });
      }

      // Sort entries within a day
      for(const key in byDate){
        byDate[key].sort((a,b)=>{
          // episodes before movies for readability
          if(a.type !== b.type){
            return a.type === 'episode' ? -1 : 1;
          }
          if(a.type === 'episode'){
            if(a.show.name < b.show.name) return -1;
            if(a.show.name > b.show.name) return 1;
            return (a.ep.episode_number||0) - (b.ep.episode_number||0);
          }
          // movies: by title
          if(a.movie.name < b.movie.name) return -1;
          if(a.movie.name > b.movie.name) return 1;
          return 0;
        });
      }

      const year  = state.currentMonth.getFullYear();
      const month = state.currentMonth.getMonth();
      const first = new Date(year, month, 1);
      const firstDow = first.getDay();
      const startDate = new Date(first);
      startDate.setDate(first.getDate() - firstDow);

      const monthName = first.toLocaleString(undefined, {month:'long', year:'numeric'});

      let html = `
        <div class="cal-header">
          <button class="cal-btn" id="cal-prev">&lt; Prev</button>
          <div class="cal-title">${monthName}</div>
          <button class="cal-btn" id="cal-next">Next &gt;</button>
        </div>
        <div class="cal-grid">
      `;

      // DOW row
      for(const d of DOW) html += `<div class="cal-dow">${d}</div>`;

      // 6 weeks
      for(let i=0;i<42;i++){
        const d = new Date(startDate);
        d.setDate(startDate.getDate() + i);

        const isToday =
          d.getFullYear() === state.today.getFullYear() &&
          d.getMonth() === state.today.getMonth() &&
          d.getDate() === state.today.getDate();

        const ymd = d.toISOString().slice(0,10);
        const items = byDate[ymd] || [];

        html += `<div class="cal-day${isToday?' today':''}">`;
        html += `<div class="cal-date">${d.getDate()}</div>`;

        for(const item of items){
          if(item.type === 'episode'){
            const {show, season, ep} = item;
            html += `
              <div class="cal-item">
                ${show.poster_path ? `<img src="${IMG(show.poster_path)}" alt="">` : ''}
                <div>
                  <span class="show-title link-show" data-show-id="${show.show_id}">${show.name}</span>
                  <span class="code">
                    S${String(season).padStart(2,'0')}E${String(ep.episode_number||0).padStart(2,'0')}
                    ${ep.name ? ' · ' + ep.name : ''}
                  </span>
                  ${episodeLinks(show, season, ep.episode_number)}
                </div>
              </div>
            `;
          } else if(item.type === 'movie'){
            const mv = item.movie;
            html += `
              <div class="cal-item">
                ${mv.poster_path ? `<img src="${IMG(mv.poster_path)}" alt="">` : ''}
                <div>
                  <span class="show-title">${mv.name}</span>
                  <span class="movie-label">Movie</span>
                  ${movieLinks(mv)}
                </div>
              </div>
            `;
          }
        }

        html += `</div>`;
      }

      html += `</div>`;
      host.innerHTML = html;

      $('#cal-prev').onclick = () => changeMonth(-1);
      $('#cal-next').onclick = () => changeMonth(1);
      wireShowClicks();
    }

    // --- Shows tab (filters + sort) ------------------------------------------
    function renderShows(){
      const host = $('#shows');
      const shows = getShows();
      if(!shows.length){
        host.innerHTML = '<div class="mut">No shows loaded.</div>';
        return;
      }

      // Collect genres & statuses
      const genres = new Set();
      const statuses = new Set();
      for(const sh of shows){
        (sh.genres || []).forEach(g => genres.add(g));
        if(sh.status) statuses.add(sh.status);
      }

      // Controls UI
      let html = `
        <div class="controls">
          <span class="label">Sort:</span>
          <button class="btn" id="sh-sort-title"></button>
          <button class="btn" id="sh-sort-next">Next episode</button>
          <span class="label">Genre:</span>
          <button class="btn${state.showsGenre==='All'?' active':''}" data-sh-genre="All">All</button>
      `;

      for(const g of Array.from(genres).sort()){
        html += `<button class="btn${state.showsGenre===g?' active':''}" data-sh-genre="${g}">${g}</button>`;
      }

      html += `
          <span class="label">Status:</span>
          <button class="btn${state.showsStatus==='All'?' active':''}" data-sh-status="All">All</button>
      `;
      for(const s of Array.from(statuses).sort()){
        html += `<button class="btn${state.showsStatus===s?' active':''}" data-sh-status="${s}">${s}</button>`;
      }

      html += `</div><div class="grid">`;

      // Filter + sort logic
      let list = shows.slice();

      if(state.showsGenre !== 'All'){
        list = list.filter(sh => (sh.genres || []).includes(state.showsGenre));
      }
      if(state.showsStatus !== 'All'){
        list = list.filter(sh => (sh.status || '') === state.showsStatus);
      }

      if(state.showsSort === 'title'){
        list.sort((a,b)=>{
          if(a.name < b.name) return state.showsDir === 'asc' ? -1 : 1;
          if(a.name > b.name) return state.showsDir === 'asc' ? 1 : -1;
          return 0;
        });
      } else if(state.showsSort === 'next'){
        // Sort by next upcoming (or last aired) episode date
        function nextDate(sh){
          let best = null;
          for(const s of sh.seasons || []){
            for(const ep of s.episodes || []){
              if(!ep.air_date) continue;
              const d = new Date(ep.air_date);
              if(!best || d > best) best = d;
            }
          }
          return best;
        }
        list.sort((a,b)=>{
          const da = nextDate(a);
          const db = nextDate(b);
          if(!da && !db) return 0;
          if(!da) return 1;
          if(!db) return -1;
          return da - db;
        });
      }

      // Cards
      for(const sh of list){
        html += `
          <div class="card">
            ${sh.poster_path
              ? `<img class="poster" src="${IMG(sh.poster_path)}" alt="${sh.name}">`
              : `<div class="poster"></div>`}
            <div class="card-body">
              <div class="title link-show" data-show-id="${sh.show_id}">${sh.name}</div>
              <div class="mut small">
                ${(sh.genres || []).join(', ')}${sh.status ? ' • ' + sh.status : ''}
              </div>
              <div class="divider"></div>
              ${showLinks(sh)}
            </div>
          </div>
        `;
      }

      html += `</div>`;
      host.innerHTML = html;

      // Wire sort buttons
      const sortTitleBtn = $('#sh-sort-title');
      sortTitleBtn.textContent = state.showsDir === 'asc' ? 'Title A–Z' : 'Title Z–A';
      sortTitleBtn.classList.add('active');
      $('#sh-sort-next').classList.toggle('active', state.showsSort === 'next');

      sortTitleBtn.onclick = ()=>{
        if(state.showsSort === 'title'){
          state.showsDir = state.showsDir === 'asc' ? 'desc' : 'asc';
        }else{
          state.showsSort = 'title';
        }
        renderShows();
      };
      $('#sh-sort-next').onclick = ()=>{
        state.showsSort = 'next';
        renderShows();
      };

      // Genre buttons
      $$('[data-sh-genre]').forEach(btn=>{
        btn.onclick = ()=>{
          state.showsGenre = btn.dataset.shGenre;
          renderShows();
        };
      });

      // Status buttons
      $$('[data-sh-status]').forEach(btn=>{
        btn.onclick = ()=>{
          state.showsStatus = btn.dataset.shStatus;
          renderShows();
        };
      });

      wireShowClicks();
    }

    // --- Movies tab ----------------------------------------------------------
    function renderMovies(){
      const host = $('#movies');
      const movies = getMovies();
      if(!movies.length){
        host.innerHTML = '<div class="mut">No movies loaded.</div>';
        return;
      }

      const genres = new Set();
      const statuses = new Set();
      for(const mv of movies){
        (mv.genres || []).forEach(g => genres.add(g));
        if(mv.status) statuses.add(mv.status);
      }

      let html = `
        <div class="controls">
          <span class="label">Sort:</span>
          <button class="btn" id="mv-sort-title"></button>
          <button class="btn" id="mv-sort-date">Release date</button>
          <span class="label">Genre:</span>
          <button class="btn${state.moviesGenre==='All'?' active':''}" data-mv-genre="All">All</button>
      `;

      for(const g of Array.from(genres).sort()){
        html += `<button class="btn${state.moviesGenre===g?' active':''}" data-mv-genre="${g}">${g}</button>`;
      }

      html += `
          <span class="label">Status:</span>
          <button class="btn${state.moviesStatus==='All'?' active':''}" data-mv-status="All">All</button>
      `;
      for(const s of Array.from(statuses).sort()){
        html += `<button class="btn${state.moviesStatus===s?' active':''}" data-mv-status="${s}">${s}</button>`;
      }

      html += `</div><div class="grid">`;

      let list = movies.slice();

      if(state.moviesGenre !== 'All'){
        list = list.filter(mv => (mv.genres || []).includes(state.moviesGenre));
      }
      if(state.moviesStatus !== 'All'){
        list = list.filter(mv => (mv.status || '') === state.moviesStatus);
      }

      if(state.moviesSort === 'title'){
        list.sort((a,b)=>{
          if(a.name < b.name) return state.moviesDir === 'asc' ? -1 : 1;
          if(a.name > b.name) return state.moviesDir === 'asc' ? 1 : -1;
          return 0;
        });
      }else if(state.moviesSort === 'date'){
        list.sort((a,b)=>{
          const da = a.release_date ? new Date(a.release_date) : null;
          const db = b.release_date ? new Date(b.release_date) : null;
          if(!da && !db) return 0;
          if(!da) return 1;
          if(!db) return -1;
          return da - db;
        });
      }

      for(const mv of list){
        html += `
          <div class="card">
            ${mv.poster_path
              ? `<img class="poster" src="${IMG(mv.poster_path)}" alt="${mv.name}">`
              : `<div class="poster"></div>`}
            <div class="card-body">
              <div class="title">${mv.name}</div>
              <div class="mut small">
                ${(mv.genres || []).join(', ')}${mv.status ? ' • ' + mv.status : ''}
                ${mv.release_date ? ' • ' + mv.release_date : ''}
              </div>
              <div class="divider"></div>
              ${movieLinks(mv)}
            </div>
          </div>
        `;
      }

      html += `</div>`;
      host.innerHTML = html;

      // Sort controls
      const sortTitleBtn = $('#mv-sort-title');
      sortTitleBtn.textContent = state.moviesDir === 'asc' ? 'Title A–Z' : 'Title Z–A';
      sortTitleBtn.classList.add('active');
      $('#mv-sort-date').classList.toggle('active', state.moviesSort === 'date');

      sortTitleBtn.onclick = ()=>{
        if(state.moviesSort === 'title'){
          state.moviesDir = state.moviesDir === 'asc' ? 'desc' : 'asc';
        }else{
          state.moviesSort = 'title';
        }
        renderMovies();
      };
      $('#mv-sort-date').onclick = ()=>{
        state.moviesSort = 'date';
        renderMovies();
      };

      // Genre buttons
      $$('[data-mv-genre]').forEach(btn=>{
        btn.onclick = ()=>{
          state.moviesGenre = btn.dataset.mvGenre;
          renderMovies();
        };
      });

      // Status buttons
      $$('[data-mv-status]').forEach(btn=>{
        btn.onclick = ()=>{
          state.moviesStatus = btn.dataset.mvStatus;
          renderMovies();
        };
      });
    }

    // --- Overlay: show details (click titles) --------------------------------
    function wireShowClicks(){
      $$('.link-show').forEach(el=>{
        el.onclick = e=>{
          e.preventDefault();
          const id = parseInt(el.dataset.showId, 10);
          const show = getShows().find(s => s.show_id === id);
          if(show) openOverlay(show);
        };
      });
    }

    function guessCurrentSeason(show){
      if(!show.seasons || !show.seasons.length) return null;
      // Heuristic: the season with the latest episode air_date
      let best = null;
      let bestDate = null;
      for(const s of show.seasons){
        for(const ep of s.episodes || []){
          if(!ep.air_date) continue;
          const d = new Date(ep.air_date);
          if(!bestDate || d > bestDate){
            bestDate = d;
            best = s.season_number;
          }
        }
      }
      return best;
    }

    function openOverlay(show){
      const ov = $('#overlay');
      const content = $('#overlay-content');

      const seasons = show.seasons || [];
      const currentSeason = guessCurrentSeason(show);

      let seasonsHtml = '';
      for(const s of seasons){
        const eps = s.episodes || [];
        const firstEp = eps.find(ep => ep.air_date) || eps[0];
        const year = firstEp && firstEp.air_date
          ? firstEp.air_date.slice(0,4)
          : '';
        seasonsHtml += `
          <div class="season-row" data-season="${s.season_number}">
            <div class="season-label">
              Season ${s.season_number}
              ${currentSeason === s.season_number ? '<span class="season-badge">Current season</span>' : ''}
            </div>
            <div class="season-meta">
              ${year ? year + ' • ' : ''}${eps.length} Episodes
            </div>
            ${s.overview ? `<div class="season-overview">${s.overview}</div>` : ''}
          </div>
        `;
      }

      content.innerHTML = `
        <div class="ov-header">
          ${show.poster_path
            ? `<img class="ov-poster" src="${IMG(show.poster_path)}" alt="${show.name} poster">`
            : `<div class="ov-poster"></div>`}
          <div>
            <div class="ov-title">${show.name}</div>
            <div class="ov-sub">
              ${(show.genres || []).join(', ')}
              ${show.status ? ' • ' + show.status : ''}
            </div>
            ${show.overview ? `<div class="ov-overview">${show.overview}</div>` : ''}
          </div>
        </div>
        <div class="season-list">
          ${seasonsHtml || '<div class="mut">No seasons found.</div>'}
        </div>
      `;

      // Season click -> toggle episodes list
      content.querySelectorAll('.season-row').forEach(row=>{
        row.addEventListener('click', ()=>{
          const sn = parseInt(row.dataset.season, 10);
          const s = seasons.find(x => x.season_number === sn);
          if(!s) return;

          const existing = row.nextElementSibling;
          if(existing && existing.classList.contains('episodes')){
            existing.remove();
            return;
          }

          // close others
          content.querySelectorAll('.episodes').forEach(e => e.remove());

          const wrap = document.createElement('div');
          wrap.className = 'episodes';

          const eps = (s.episodes || []).filter(ep => {
            // hide bare TBA with no details
            if(isTBA(ep.name) && !ep.overview) return false;
            return true;
          });

          if(!eps.length){
            wrap.innerHTML = '<div class="mut">No detailed episodes yet.</div>';
          }else{
            wrap.innerHTML = eps.map(ep=>{
              const code = `S${String(sn).padStart(2,'0')}E${String(ep.episode_number||0).padStart(2,'0')}`;
              const date = ep.air_date ? ` • ${ep.air_date}` : '';
              const ov = ep.overview ? ` — ${ep.overview}` : '';
              return `<div class="ep-row"><strong>${code}</strong> ${ep.name || ''}${date}${ov}</div>`;
            }).join('');
          }

          row.insertAdjacentElement('afterend', wrap);
        });
      });

      ov.hidden = false;
      $('.overlay-close').onclick = closeOverlay;
      $('.overlay-backdrop').onclick = closeOverlay;
    }

    function closeOverlay(){
      $('#overlay').hidden = true;
      $('#overlay-content').innerHTML = '';
    }

    // --- Footer meta ---------------------------------------------------------
    function renderMeta(){
      const metaEl = $('#meta');
      if(!state.data || !metaEl) return;
      const ts = state.data.generated_at || '';
      const sc = (state.data.meta && state.data.meta.shows) || (state.data.shows || []).length;
      const mc = (state.data.meta && state.data.meta.movies) || (state.data.movies || []).length;
      metaEl.textContent = `Data built: ${ts} · Shows: ${sc} · Movies: ${mc}`;
    }

    // --- Orchestrator --------------------------------------------------------
    function renderAll(){
      renderCalendar();
      renderShows();
      renderMovies();
      renderMeta();
      // Default visible is calendar; others hidden by CSS
      $('#shows').hidden = true;
      $('#movies').hidden = true;
    }

    load();
  </script>
</body>
</html>
