<!doctype html>
<html lang="en">
<head>
  <!--
    File: web/index.html
    Project: my_TV_Movie
    Version: v2.1.0 (2025-11-07)

    Highlights:
    - Tabs: Calendar | Shows | Movies
    - Calendar:
        * 6x7 month grid (Sun–Sat), Prev/Next.
        * TV episodes + movie releases.
        * Stronger day borders & today highlight.
        * Show/episode text more prominent than link row.
        * Click TV show titles or SxxEyy to open show overlay.
    - Shows tab:
        * Sort: Title A–Z/Z–A (button label toggles) or Next episode.
        * Filter: Genre, Status.
        * Show cards: TMDB link only; VidSrc/Videasy are episode-level.
        * Show titles open overlay (seasons + episodes).
    - Movies tab:
        * Sort: Title A–Z/Z–A or Release date.
        * Filter: Genre, Status.
    - Overlay:
        * Poster, status, overview.
        * Seasons list with heuristic “Current season”.
        * Click season to see episodes (TBA-only hidden).
    - Config integration:
        * Reads tvhub_theme & tvhub_fontscale from localStorage.
    - Footer:
        * Data built: <iso> · Shows: N · Movies: M
  -->
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>My TV Hub</title>
  <style>
    :root{
      --bg:#0b0b0c;
      --fg:#f3f3f3;
      --mut:#b9b9c2;
      --card:#15151a;
      --chip:#22222a;
      --pri:#6ad1ff;
      --border:#252530;
      --fs-scale:1;
    }
    :root[data-theme="light"]{
      --bg:#f5f5f7;
      --fg:#111827;
      --mut:#6b7280;
      --card:#ffffff;
      --chip:#e5e7eb;
      --pri:#2563eb;
      --border:#d1d5db;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font:calc(15px * var(--fs-scale))/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }

    a{ color:var(--pri); text-decoration:none; }
    a:hover{ text-decoration:underline; }

    header{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(11,11,12,.96);
      backdrop-filter:saturate(1.4) blur(6px);
    }
    :root[data-theme="light"] header{
      background:rgba(245,245,247,.97);
      backdrop-filter:none;
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:14px;
    }

    h1{ margin:0; font-size:22px; }

    .row{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }

    nav{
      display:flex;
      gap:8px;
      margin-top:10px;
      flex-wrap:wrap;
    }

    .tab{
      padding:8px 14px;
      border-radius:999px;
      background:var(--chip);
      cursor:pointer;
      font-size:13px;
      user-select:none;
    }
    .tab.active{
      background:var(--pri);
      color:#041f2a;
    }

    main.wrap{
      padding-top:10px;
      padding-bottom:6px;
    }

    .section{
      padding:4px 0 16px;
    }

    .mut{ color:var(--mut); }
    .small{ font-size:11px; }
    .divider{ height:1px; background:var(--border); margin:6px 0; }

    .links a{
      margin-right:8px;
      font-size:9px;
    }

    .pill{
      display:inline-block;
      padding:3px 7px;
      border-radius:999px;
      border:1px solid var(--border);
      font-size:9px;
    }

    /* Sticky controls for subviews */
    .controls-sticky{
      position:sticky;
      top:64px;
      z-index:15;
      padding:6px 0 6px;
      margin-bottom:6px;
      background:var(--bg);
    }

    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      align-items:center;
      font-size:10px;
    }

    .label{ color:var(--mut); }

    .btn{
      padding:5px 9px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--chip);
      color:var(--fg);
      font-size:10px;
      cursor:pointer;
      user-select:none;
    }
    .btn.active{
      background:var(--pri);
      color:#041f2a;
    }

    /* Calendar */

    .cal-head-sticky{
      position:sticky;
      top:64px;
      z-index:15;
      padding-bottom:4px;
      background:var(--bg);
    }

    .cal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      margin-bottom:4px;
    }

    .cal-title{
      font-size:17px;
      font-weight:600;
    }

    .cal-btn{
      padding:5px 9px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--chip);
      color:var(--fg);
      font-size:10px;
      cursor:pointer;
    }

    .cal-dow-row{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:3px;
      font-size:9px;
      color:var(--mut);
    }
    .cal-dow{
      text-align:center;
      padding:2px 0;
    }

    .cal-grid{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:4px;
      font-size:9px;
    }

    .cal-day{
      min-height:78px;
      padding:4px;
      border-radius:7px;
      background:#101019;
      border:1px solid #22232c;
      display:flex;
      flex-direction:column;
      gap:3px;
    }
    :root[data-theme="light"] .cal-day{
      background:#ffffff;
      border-color:#e5e7eb;
    }

    .cal-day.today{
      background:rgba(106,209,255,0.09);
      border-color:var(--pri);
      box-shadow:0 0 0 1px rgba(106,209,255,0.35);
    }

    .cal-date{
      font-weight:600;
      font-size:9px;
      margin-bottom:1px;
    }

    .cal-item{
      display:flex;
      gap:4px;
      align-items:flex-start;
      cursor:default;
    }

    .cal-item img{
      width:22px;
      height:33px;
      border-radius:4px;
      object-fit:cover;
      flex-shrink:0;
      background:#111;
    }

    .cal-lines{
      display:flex;
      flex-direction:column;
      gap:1px;
    }

    .cal-show{
      font-size:9px;
      font-weight:600;
      cursor:pointer;
    }

    .cal-ep{
      font-size:9px;
      cursor:pointer;
    }

    .cal-movie-label{
      font-size:8px;
      color:var(--mut);
    }

    .links-ep a{
      font-size:8px;
      color:var(--pri);
    }

    /* Cards */

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:10px;
    }

    .card{
      background:var(--card);
      border-radius:12px;
      padding:8px;
      display:flex;
      gap:7px;
      align-items:flex-start;
      border:1px solid #1c1d26;
    }
    :root[data-theme="light"] .card{
      border-color:#e5e7eb;
    }

    .poster{
      width:64px;
      height:96px;
      border-radius:9px;
      object-fit:cover;
      flex-shrink:0;
      background:#111;
    }

    .card-body{
      display:flex;
      flex-direction:column;
      gap:3px;
      flex:1;
      min-width:0;
    }

    .title{
      font-size:14px;
      font-weight:700;
      cursor:pointer;
    }

    /* Overlay */

    .overlay[hidden]{ display:none; }

    .overlay{
      position:fixed;
      inset:0;
      z-index:40;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .overlay-backdrop{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.72);
    }

    .overlay-panel{
      position:relative;
      max-width:900px;
      max-height:86vh;
      padding:18px 14px 12px;
      background:var(--card);
      border-radius:18px;
      box-shadow:0 22px 50px rgba(0,0,0,.7);
      overflow:auto;
      z-index:41;
    }
    :root[data-theme="light"] .overlay-panel{
      background:#ffffff;
      box-shadow:0 22px 50px rgba(0,0,0,.22);
    }

    .overlay-close{
      position:absolute;
      top:6px;
      right:10px;
      border:none;
      background:transparent;
      color:var(--mut);
      font-size:24px;
      cursor:pointer;
    }

    .ov-header{
      display:flex;
      gap:10px;
      align-items:flex-start;
      margin-bottom:8px;
      padding-top:14px; /* space so close button doesn't overlap */
    }

    .ov-poster{
      width:90px;
      height:135px;
      border-radius:10px;
      object-fit:cover;
      background:#111;
      flex-shrink:0;
    }

    .ov-title{
      font-size:19px;
      font-weight:700;
      margin-bottom:2px;
    }

    .ov-sub{
      font-size:11px;
      color:var(--mut);
    }

    .ov-overview{
      margin-top:4px;
      font-size:12px;
      color:var(--mut);
    }

    .season-list{
      margin-top:6px;
      font-size:12px;
    }

    .season-row{
      padding:5px 0;
      border-bottom:1px solid var(--border);
      cursor:pointer;
    }

    .season-label{
      font-weight:600;
      font-size:12px;
    }

    .season-badge{
      display:inline-block;
      margin-left:6px;
      padding:1px 6px;
      border-radius:999px;
      background:var(--chip);
      color:var(--pri);
      font-size:9px;
    }

    .season-meta{
      font-size:10px;
      color:var(--mut);
    }

    .season-overview{
      font-size:10px;
      color:var(--mut);
      margin-top:2px;
    }

    .episodes{
      margin-top:3px;
      padding-left:4px;
      font-size:10px;
    }

    .ep-row{
      margin-bottom:2px;
    }

    /* Footer meta */
    #meta{
      font-size:9px;
      color:var(--mut);
      padding:2px 14px 10px;
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="row" style="justify-content:space-between">
        <h1>My TV Hub</h1>
        <div class="row small">
          <a href="config.html">Config</a>
        </div>
      </div>
      <nav>
        <div class="tab active" data-tab="calendar">Calendar</div>
        <div class="tab" data-tab="shows">Shows</div>
        <div class="tab" data-tab="movies">Movies</div>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="calendar" class="section"></section>
    <section id="shows" class="section" hidden></section>
    <section id="movies" class="section" hidden></section>
  </main>

  <div class="wrap">
    <div id="meta"></div>
  </div>

  <!-- Overlay for show details -->
  <div id="overlay" class="overlay" hidden>
    <div class="overlay-backdrop"></div>
    <div class="overlay-panel">
      <button class="overlay-close" aria-label="Close">&times;</button>
      <div id="overlay-content"></div>
    </div>
  </div>

  <script>
    const $  = s => document.querySelector(s);
    const $$ = s => Array.from(document.querySelectorAll(s));
    const IMG = p => p ? `https://image.tmdb.org/t/p/w300${p}` : '';
    const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    const state = {
      data: null,
      today: new Date(),
      currentMonth: null,
      // Shows
      showsSort: 'title', // 'title' | 'next'
      showsDir: 'asc',
      showsGenre: 'All',
      showsStatus: 'All',
      // Movies
      moviesSort: 'title', // 'title' | 'date'
      moviesDir: 'asc',
      moviesGenre: 'All',
      moviesStatus: 'All',
    };

    // Apply theme / font from localStorage
    (function initTheme(){
      const theme = localStorage.getItem('tvhub_theme') || 'dark';
      const scale = parseFloat(localStorage.getItem('tvhub_fontscale') || '1.0') || 1.0;
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.setProperty('--fs-scale', String(scale));
    })();

    function getShows(){ return (state.data && state.data.shows) || []; }
    function getMovies(){ return (state.data && state.data.movies) || []; }

    function isPureTBA(name, overview){
      if(!name) return false;
      const n = name.trim().toUpperCase();
      return (n === 'TBA' || n === 'N/A') && !overview;
    }

    async function load(){
      try{
        const res = await fetch('../data/data.json', {cache:'no-cache'});
        if(!res.ok) throw new Error('Failed to load data.json');
        state.data = await res.json();
        state.currentMonth = new Date(
          state.today.getFullYear(),
          state.today.getMonth(),
          1
        );
        renderAll();
        attachTabs();
      }catch(e){
        console.error(e);
        $('#calendar').innerHTML =
          '<div class="mut">Unable to load data. Run the "Build TV Data" workflow.</div>';
      }
    }

    function attachTabs(){
      $$('.tab').forEach(tab=>{
        tab.addEventListener('click', ()=>{
          const target = tab.dataset.tab;
          if(tab.classList.contains('active')) return;

          $$('.tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');

          ['calendar','shows','movies'].forEach(id=>{
            $('#'+id).hidden = (id !== target);
          });

          if(target === 'calendar') renderCalendar();
          if(target === 'shows')    renderShows();
          if(target === 'movies')   renderMovies();
        });
      });
    }

    // ---------------- Calendar ----------------

    function changeMonth(delta){
      const m = state.currentMonth;
      state.currentMonth = new Date(m.getFullYear(), m.getMonth() + delta, 1);
      renderCalendar();
    }

    function renderCalendar(){
      const host = $('#calendar');
      const shows = getShows();
      const movies = getMovies();

      if(!shows.length && !movies.length){
        host.innerHTML = '<div class="mut">No shows or movies configured.</div>';
        return;
      }

      if(!state.currentMonth){
        state.currentMonth = new Date(state.today.getFullYear(), state.today.getMonth(), 1);
      }

      const byDate = {};

      // TV episodes
      for(const show of shows){
        for(const s of show.seasons || []){
          for(const ep of s.episodes || []){
            if(!ep.air_date) continue;
            const key = ep.air_date;
            (byDate[key] ||= []).push({
              type:'episode',
              show,
              season:s.season_number,
              ep
            });
          }
        }
      }

      // Movies by release date
      for(const mv of movies){
        if(!mv.release_date) continue;
        const key = mv.release_date;
        (byDate[key] ||= []).push({ type:'movie', movie:mv });
      }

      // Sort within a day
      for(const key in byDate){
        byDate[key].sort((a,b)=>{
          if(a.type !== b.type){
            return a.type === 'episode' ? -1 : 1;
          }
          if(a.type === 'episode'){
            if(a.show.name < b.show.name) return -1;
            if(a.show.name > b.show.name) return 1;
            return (a.ep.episode_number || 0) - (b.ep.episode_number || 0);
          }
          if(a.movie.name < b.movie.name) return -1;
          if(a.movie.name > b.movie.name) return 1;
          return 0;
        });
      }

      const year  = state.currentMonth.getFullYear();
      const month = state.currentMonth.getMonth();
      const first = new Date(year, month, 1);
      const firstDow = first.getDay();

      const startDate = new Date(first);
      startDate.setDate(first.getDate() - firstDow);

      const monthName = first.toLocaleString(undefined, {month:'long', year:'numeric'});

      let html = `
        <div class="cal-head-sticky">
          <div class="cal-header">
            <button class="cal-btn" id="cal-prev">&lt; Prev</button>
            <div class="cal-title">${monthName}</div>
            <button class="cal-btn" id="cal-next">Next &gt;</button>
          </div>
          <div class="cal-dow-row">
            ${DOW.map(d => `<div class="cal-dow">${d}</div>`).join('')}
          </div>
        </div>
        <div class="cal-grid">
      `;

      for(let i=0;i<42;i++){
        const d = new Date(startDate);
        d.setDate(startDate.getDate() + i);

        const isToday =
          d.getFullYear() === state.today.getFullYear() &&
          d.getMonth() === state.today.getMonth() &&
          d.getDate() === state.today.getDate();

        const ymd = d.toISOString().slice(0,10);
        const items = byDate[ymd] || [];

        html += `<div class="cal-day${isToday ? ' today' : ''}">`;
        html += `<div class="cal-date">${d.getDate()}</div>`;

        for(const item of items){
          if(item.type === 'episode'){
            const {show, season, ep} = item;
            html += `
              <div class="cal-item" data-show-id="${show.show_id}">
                ${show.poster_path ? `<img src="${IMG(show.poster_path)}" alt="">` : ''}
                <div class="cal-lines">
                  <div class="cal-show">${show.name}</div>
                  <div class="cal-ep">
                    S${String(season).padStart(2,'0')}E${String(ep.episode_number||0).padStart(2,'0')}
                    ${ep.name ? ' · ' + ep.name : ''}
                  </div>
                  <div class="links-ep">
                    <a target="_blank" href="${show.links.tmdb}">TMDB</a>
                    <a target="_blank" href="https://vidsrc.net/embed/tv/${show.show_id}/${season}/${ep.episode_number||''}">VidSrc</a>
                    <a target="_blank" href="https://player.videasy.net/tv/${show.show_id}/${season}/${ep.episode_number||''}">Videasy</a>
                  </div>
                </div>
              </div>
            `;
          } else if(item.type === 'movie'){
            const mv = item.movie;
            html += `
              <div class="cal-item">
                ${mv.poster_path ? `<img src="${IMG(mv.poster_path)}" alt="">` : ''}
                <div class="cal-lines">
                  <div class="cal-show">${mv.name}</div>
                  <div class="cal-movie-label">Movie</div>
                  <div class="links-ep">
                    <a target="_blank" href="${mv.links.tmdb}">TMDB</a>
                    <a target="_blank" href="https://vidsrc.net/embed/movie/${mv.movie_id}">VidSrc</a>
                    <a target="_blank" href="https://player.videasy.net/movie/${mv.movie_id}">Videasy</a>
                  </div>
                </div>
              </div>
            `;
          }
        }

        html += `</div>`;
      }

      html += `</div>`;
      host.innerHTML = html;

      $('#cal-prev').onclick = () => changeMonth(-1);
      $('#cal-next').onclick = () => changeMonth(1);

      // Click show / ep region opens overlay (for TV)
      $$('#calendar .cal-item').forEach(item=>{
        const id = item.dataset.showId;
        if(!id) return;
        item.addEventListener('click', e=>{
          // ignore clicks on links
          if(e.target.tagName === 'A') return;
          const show = getShows().find(s => s.show_id === parseInt(id,10));
          if(show) openOverlay(show);
        });
      });
    }

    // ---------------- Shows ----------------

    function renderShows(){
      const host = $('#shows');
      const shows = getShows();
      if(!shows.length){
        host.innerHTML = '<div class="mut">No shows loaded.</div>';
        return;
      }

      const genres = new Set();
      const statuses = new Set();
      for(const sh of shows){
        (sh.genres || []).forEach(g => genres.add(g));
        if(sh.status) statuses.add(sh.status);
      }

      let html = `
        <div class="controls-sticky">
          <div class="controls">
            <span class="label">Sort:</span>
            <button class="btn" id="sh-sort-title"></button>
            <button class="btn" id="sh-sort-next">Next episode</button>
            <span class="label">Genre:</span>
            <button class="btn${state.showsGenre==='All'?' active':''}" data-sh-genre="All">All</button>
      `;

      for(const g of Array.from(genres).sort()){
        html += `<button class="btn${state.showsGenre===g?' active':''}" data-sh-genre="${g}">${g}</button>`;
      }

      html += `
            <span class="label">Status:</span>
            <button class="btn${state.showsStatus==='All'?' active':''}" data-sh-status="All">All</button>
      `;

      for(const s of Array.from(statuses).sort()){
        html += `<button class="btn${state.showsStatus===s?' active':''}" data-sh-status="${s}">${s}</button>`;
      }

      html += `
          </div>
        </div>
        <div class="grid">
      `;

      let list = shows.slice();

      if(state.showsGenre !== 'All'){
        list = list.filter(sh => (sh.genres || []).includes(state.showsGenre));
      }
      if(state.showsStatus !== 'All'){
        list = list.filter(sh => (sh.status || '') === state.showsStatus);
      }

      if(state.showsSort === 'title'){
        list.sort((a,b)=>{
          if(a.name < b.name) return state.showsDir === 'asc' ? -1 : 1;
          if(a.name > b.name) return state.showsDir === 'asc' ? 1 : -1;
          return 0;
        });
      }else{ // next episode / latest
        function lastDate(sh){
          let best = null;
          for(const s of sh.seasons || []){
            for(const ep of s.episodes || []){
              if(!ep.air_date) continue;
              const d = new Date(ep.air_date);
              if(!best || d > best) best = d;
            }
          }
          return best;
        }
        list.sort((a,b)=>{
          const da = lastDate(a);
          const db = lastDate(b);
          if(!da && !db) return 0;
          if(!da) return 1;
          if(!db) return -1;
          return da - db;
        });
      }

      for(const sh of list){
        html += `
          <div class="card">
            ${sh.poster_path ? `<img class="poster" src="${IMG(sh.poster_path)}" alt="${sh.name}">` : `<div class="poster"></div>`}
            <div class="card-body">
              <div class="title link-show" data-show-id="${sh.show_id}">${sh.name}</div>
              <div class="mut small">
                ${(sh.genres || []).join(', ')}
                ${sh.status ? ' • ' + sh.status : ''}
              </div>
              <div class="divider"></div>
              <div class="links small">
                <a target="_blank" href="${sh.links.tmdb}">TMDB</a>
              </div>
            </div>
          </div>
        `;
      }

      html += `</div>`;
      host.innerHTML = html;

      const sortTitleBtn = $('#sh-sort-title');
      sortTitleBtn.textContent = state.showsDir === 'asc' ? 'Title A–Z' : 'Title Z–A';
      sortTitleBtn.classList.add(state.showsSort === 'title' ? 'active' : '');
      $('#sh-sort-next').classList.toggle('active', state.showsSort === 'next');

      sortTitleBtn.onclick = ()=>{
        if(state.showsSort === 'title'){
          state.showsDir = state.showsDir === 'asc' ? 'desc' : 'asc';
        }else{
          state.showsSort = 'title';
        }
        renderShows();
      };
      $('#sh-sort-next').onclick = ()=>{
        state.showsSort = 'next';
        renderShows();
      };

      $$('[data-sh-genre]').forEach(btn=>{
        btn.onclick = ()=>{
          state.showsGenre = btn.dataset.shGenre;
          renderShows();
        };
      });
      $$('[data-sh-status]').forEach(btn=>{
        btn.onclick = ()=>{
          state.showsStatus = btn.dataset.shStatus;
          renderShows();
        };
      });

      wireShowClicks();
    }

    // ---------------- Movies ----------------

    function renderMovies(){
      const host = $('#movies');
      const movies = getMovies();
      if(!movies.length){
        host.innerHTML = '<div class="mut">No movies loaded.</div>';
        return;
      }

      const genres = new Set();
      const statuses = new Set();
      for(const mv of movies){
        (mv.genres || []).forEach(g => genres.add(g));
        if(mv.status) statuses.add(mv.status);
      }

      let html = `
        <div class="controls-sticky">
          <div class="controls">
            <span class="label">Sort:</span>
            <button class="btn" id="mv-sort-title"></button>
            <button class="btn" id="mv-sort-date">Release date</button>
            <span class="label">Genre:</span>
            <button class="btn${state.moviesGenre==='All'?' active':''}" data-mv-genre="All">All</button>
      `;

      for(const g of Array.from(genres).sort()){
        html += `<button class="btn${state.moviesGenre===g?' active':''}" data-mv-genre="${g}">${g}</button>`;
      }

      html += `
            <span class="label">Status:</span>
            <button class="btn${state.moviesStatus==='All'?' active':''}" data-mv-status="All">All</button>
      `;

      for(const s of Array.from(statuses).sort()){
        html += `<button class="btn${state.moviesStatus===s?' active':''}" data-mv-status="${s}">${s}</button>`;
      }

      html += `
          </div>
        </div>
        <div class="grid">
      `;

      let list = movies.slice();

      if(state.moviesGenre !== 'All'){
        list = list.filter(mv => (mv.genres || []).includes(state.moviesGenre));
      }
      if(state.moviesStatus !== 'All'){
        list = list.filter(mv => (mv.status || '') === state.moviesStatus);
      }

      if(state.moviesSort === 'title'){
        list.sort((a,b)=>{
          if(a.name < b.name) return state.moviesDir === 'asc' ? -1 : 1;
          if(a.name > b.name) return state.moviesDir === 'asc' ? 1 : -1;
          return 0;
        });
      }else{
        list.sort((a,b)=>{
          const da = a.release_date ? new Date(a.release_date) : null;
          const db = b.release_date ? new Date(b.release_date) : null;
          if(!da && !db) return 0;
          if(!da) return 1;
          if(!db) return -1;
          return da - db;
        });
      }

      for(const mv of list){
        html += `
          <div class="card">
            ${mv.poster_path ? `<img class="poster" src="${IMG(mv.poster_path)}" alt="${mv.name}">` : `<div class="poster"></div>`}
            <div class="card-body">
              <div class="title">${mv.name}</div>
              <div class="mut small">
                ${(mv.genres || []).join(', ')}
                ${mv.status ? ' • ' + mv.status : ''}
                ${mv.release_date ? ' • ' + mv.release_date : ''}
              </div>
              <div class="divider"></div>
              ${movieLinks(mv)}
            </div>
          </div>
        `;
      }

      html += `</div>`;
      host.innerHTML = html;

      const sortTitleBtn = $('#mv-sort-title');
      sortTitleBtn.textContent = state.moviesDir === 'asc' ? 'Title A–Z' : 'Title Z–A';
      sortTitleBtn.classList.add(state.moviesSort === 'title' ? 'active' : '');
      $('#mv-sort-date').classList.toggle('active', state.moviesSort === 'date');

      sortTitleBtn.onclick = ()=>{
        if(state.moviesSort === 'title'){
          state.moviesDir = state.moviesDir === 'asc' ? 'desc' : 'asc';
        }else{
          state.moviesSort = 'title';
        }
        renderMovies();
      };
      $('#mv-sort-date').onclick = ()=>{
        state.moviesSort = 'date';
        renderMovies();
      };

      $$('[data-mv-genre]').forEach(btn=>{
        btn.onclick = ()=>{
          state.moviesGenre = btn.dataset.mvGenre;
          renderMovies();
        };
      });
      $$('[data-mv-status]').forEach(btn=>{
        btn.onclick = ()=>{
          state.moviesStatus = btn.dataset.mvStatus;
          renderMovies();
        };
      });
    }

    function movieLinks(mv){
      const mid = mv.movie_id;
      return `
        <div class="links small">
          <a target="_blank" href="${mv.links.tmdb}">TMDB</a>
          <a target="_blank" href="https://vidsrc.net/embed/movie/${mid}">VidSrc</a>
          <a target="_blank" href="https://player.videasy.net/movie/${mid}">Videasy</a>
        </div>
      `;
    }

    // ---------------- Overlay (Show details) ----------------

    function wireShowClicks(){
      $$('.link-show').forEach(el=>{
        el.onclick = e=>{
          e.preventDefault();
          const id = parseInt(el.dataset.showId, 10);
          const show = getShows().find(s => s.show_id === id);
          if(show) openOverlay(show);
        };
      });
    }

    function guessCurrentSeason(show){
      if(!show.seasons || !show.seasons.length) return null;
      let best = null;
      let bestDate = null;
      for(const s of show.seasons){
        for(const ep of s.episodes || []){
          if(!ep.air_date) continue;
          const d = new Date(ep.air_date);
          if(!bestDate || d > bestDate){
            bestDate = d;
            best = s.season_number;
          }
        }
      }
      return best;
    }

    function openOverlay(show){
      const ov = $('#overlay');
      const content = $('#overlay-content');
      const seasons = show.seasons || [];
      const current = guessCurrentSeason(show);

      let seasonsHtml = '';
      for(const s of seasons){
        const eps = s.episodes || [];
        const first = eps.find(ep => ep.air_date) || eps[0];
        const year = first && first.air_date ? first.air_date.slice(0,4) : '';
        seasonsHtml += `
          <div class="season-row" data-season="${s.season_number}">
            <div class="season-label">
              Season ${s.season_number}
              ${current === s.season_number ? '<span class="season-badge">Current season</span>' : ''}
            </div>
            <div class="season-meta">
              ${year ? year + ' • ' : ''}${eps.length} Episodes
            </div>
            ${s.overview ? `<div class="season-overview">${s.overview}</div>` : ''}
          </div>
        `;
      }

      content.innerHTML = `
        <div class="ov-header">
          ${show.poster_path ? `<img class="ov-poster" src="${IMG(show.poster_path)}" alt="${show.name}">` : `<div class="ov-poster"></div>`}
          <div>
            <div class="ov-title">${show.name}</div>
            <div class="ov-sub">
              ${(show.genres || []).join(', ')}
              ${show.status ? ' • ' + show.status : ''}
            </div>
            ${show.overview ? `<div class="ov-overview">${show.overview}</div>` : ''}
          </div>
        </div>
        <div class="season-list">
          ${seasonsHtml || '<div class="mut">No seasons found.</div>'}
        </div>
      `;

      content.querySelectorAll('.season-row').forEach(row=>{
        row.addEventListener('click', ()=>{
          const sn = parseInt(row.dataset.season, 10);
          const s = seasons.find(x => x.season_number === sn);
          if(!s) return;

          const existing = row.nextElementSibling;
          if(existing && existing.classList.contains('episodes')){
            existing.remove();
            return;
          }
          content.querySelectorAll('.episodes').forEach(e => e.remove());

          const wrap = document.createElement('div');
          wrap.className = 'episodes';

          const eps = (s.episodes || []).filter(ep => !isPureTBA(ep.name, ep.overview));

          if(!eps.length){
            wrap.innerHTML = '<div class="mut">No detailed episodes yet.</div>';
          }else{
            wrap.innerHTML = eps.map(ep=>{
              const code = `S${String(sn).padStart(2,'0')}E${String(ep.episode_number||0).padStart(2,'0')}`;
              const date = ep.air_date ? ` • ${ep.air_date}` : '';
              const ov = ep.overview ? ` — ${ep.overview}` : '';
              return `<div class="ep-row"><strong>${code}</strong> ${ep.name || ''}${date}${ov}</div>`;
            }).join('');
          }

          row.insertAdjacentElement('afterend', wrap);
        });
      });

      ov.hidden = false;
      $('.overlay-close').onclick = closeOverlay;
      $('.overlay-backdrop').onclick = closeOverlay;
    }

    function closeOverlay(){
      $('#overlay').hidden = true;
      $('#overlay-content').innerHTML = '';
    }

    // ---------------- Footer meta ----------------

    function renderMeta(){
      if(!state.data) return;
      const metaEl = $('#meta');
      const ts = state.data.generated_at || '';
      const sc = (state.data.meta && state.data.meta.shows) || (state.data.shows || []).length;
      const mc = (state.data.meta && state.data.meta.movies) || (state.data.movies || []).length;
      metaEl.textContent = `Data built: ${ts} · Shows: ${sc} · Movies: ${mc}`;
    }

    // ---------------- Orchestrator ----------------

    function renderAll(){
      renderCalendar();
      renderShows();
      renderMovies();
      renderMeta();
      // initial visible tab is calendar
      $('#shows').hidden = true;
      $('#movies').hidden = true;
    }

    load();
  </script>
</body>
</html>
