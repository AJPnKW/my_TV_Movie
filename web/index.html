<!DOCTYPE html>
<html lang="en">
<head>
  <!-- File: web/index.html -->
  <!-- Project: my_TV_Movie -->
  <!-- Version: v3.1.0 (2025-11-14 23:10 EST) -->
  <meta charset="utf-8" />
  <title>My TV Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #050505;
      --fg: #f5f5f5;
      --mut: #999;
      --accent: #1e88e5;
      --card-bg: #111;
      --card-border: #333;
      --today-bg: #111b2f;
      --poster-width: 120px;
      --poster-radius: 8px;
      --icon-size: 24px;
      --font-scale: 1.0;
    }
    [data-theme="light"] {
      --bg: #f8f9fa;
      --fg: #111;
      --mut: #555;
      --card-bg: #ffffff;
      --card-border: #ccc;
      --today-bg: #dbe9ff;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: calc(16px * var(--font-scale));
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 8px 16px 32px 16px;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      padding: 8px 0 6px 0;
      border-bottom: 1px solid var(--card-border);
    }
    [data-theme="light"] .app-header {
      background: rgba(248,249,250,0.9);
    }
    .app-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .app-title {
      font-size: 1.4rem;
      font-weight: 600;
    }
    .meta-line {
      font-size: 0.8rem;
      color: var(--mut);
    }

    .nav-tabs {
      margin-top: 6px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: transparent;
      color: var(--fg);
      font-size: 0.85rem;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .tab-btn:focus-visible {
      outline: 2px solid #ffcc00;
      outline-offset: 2px;
    }

    .view {
      margin-top: 12px;
    }

    .mut {
      color: var(--mut);
    }

    .watch-icons {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .watch-icons img {
      width: var(--icon-size);
      height: var(--icon-size);
      border-radius: 4px;
      object-fit: contain;
      background: #000;
    }

    /* Calendar ----------------------------------------------------------- */
    .calendar-header {
      position: sticky;
      top: 48px;
      z-index: 10;
      background: var(--bg);
      padding: 4px 0 6px 0;
    }
    [data-theme="light"] .calendar-header {
      background: var(--bg);
    }
    .calendar-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }
    .calendar-title {
      font-weight: 600;
    }
    .calendar-nav {
      display: flex;
      gap: 4px;
    }
    .btn-sm {
      padding: 2px 8px;
      font-size: 0.8rem;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: transparent;
      color: var(--fg);
      cursor: pointer;
    }

    .calendar-grid {
      margin-top: 6px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .calendar-dow-row {
      display: contents;
    }
    .calendar-dow {
      text-align: center;
      font-size: 0.75rem;
      color: var(--mut);
      padding: 2px 0;
    }
    .day-cell {
      min-height: 110px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      padding: 2px;
      box-sizing: border-box;
    }
    .day-cell.today {
      background: var(--today-bg);
    }
    .day-cell-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px;
      background: rgba(30,136,229,0.18); /* subtle shading */
    }
    .day-num {
      font-size: 0.85rem;
      font-weight: 700;
    }
    .day-items {
      margin-top: 2px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }
    .cal-item {
      display: flex;
      gap: 4px;
      align-items: flex-start;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 2px;
    }
    .cal-poster {
      width: calc(var(--poster-width) * 0.6);
      border-radius: var(--poster-radius);
      flex-shrink: 0;
      background: #000;
      object-fit: cover;
    }
    .cal-text {
      flex: 1;
      min-width: 0;
    }
    .cal-show {
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .cal-episode {
      font-size: 0.75rem;
      cursor: pointer;
    }
    .cal-meta {
      font-size: 0.7rem;
      color: var(--mut);
    }

    /* Cards -------------------------------------------------------------- */
    .filters-row {
      position: sticky;
      top: 48px;
      z-index: 9;
      background: var(--bg);
      padding: 4px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      align-items: center;
    }
    .filters-row label {
      font-size: 0.8rem;
      color: var(--mut);
    }
    .filters-row select {
      font-size: 0.8rem;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--fg);
    }

    .grid {
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--card-border);
      padding: 8px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      box-sizing: border-box;
    }
    .card-poster {
      width: var(--poster-width);
      border-radius: var(--poster-radius);
      background: #000;
      object-fit: cover;
      flex-shrink: 0;
    }
    .card-body {
      flex: 1;
      min-width: 0;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .card-sub {
      font-size: 0.8rem;
      color: var(--mut);
    }

    /* Popups ------------------------------------------------------------- */
    .overlay-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }
    .overlay-backdrop.open {
      display: flex;
    }
    .overlay {
      max-width: 900px;
      max-height: 90vh;
      width: 100%;
      margin: 0 8px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .overlay-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 8px 10px;
      border-bottom: 1px solid var(--card-border);
    }
    .overlay-title {
      font-weight: 600;
      font-size: 1rem;
    }
    .overlay-close {
      border: none;
      background: transparent;
      color: var(--mut);
      font-size: 1.2rem;
      cursor: pointer;
    }
    .overlay-body {
      padding: 8px 10px 10px 10px;
      overflow-y: auto;
    }

    .overlay-layout {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .overlay-poster {
      width: var(--poster-width);
      border-radius: var(--poster-radius);
      background: #000;
      object-fit: cover;
      flex-shrink: 0;
    }
    .overlay-main {
      flex: 1;
      min-width: 0;
    }
    .overlay-section-title {
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 8px;
      margin-bottom: 4px;
    }
    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      font-size: 0.75rem;
    }
    .badge {
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: rgba(255,255,255,0.03);
    }

    .episodes-list {
      margin-top: 4px;
      border-top: 1px solid var(--card-border);
    }
    .episode-row {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.8rem;
    }
    .episode-row-title {
      cursor: pointer;
      font-weight: 500;
    }
    .episode-row-meta {
      font-size: 0.75rem;
      color: var(--mut);
    }

    @media (max-width: 640px) {
      .overlay-layout {
        flex-direction: column;
      }
      .calendar-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body data-theme="dark">
  <div class="app" id="app-root">
    <header class="app-header">
      <div class="app-title-row">
        <div class="app-title">My TV Hub</div>
        <div class="meta-line" id="meta-line">
          index.html: v3.1.0 (2025-11-14 23:10 EST) • Data built: n/a • Shows: n/a • Movies: n/a • LiveTV: 0
        </div>
      </div>
      <div class="nav-tabs" id="nav-tabs">
        <button class="tab-btn active" data-tab="calendar">Calendar</button>
        <button class="tab-btn" data-tab="shows">Shows</button>
        <button class="tab-btn" data-tab="movies">Movies</button>
        <button class="tab-btn" data-tab="config">Config</button>
      </div>
    </header>

    <main id="main">
      <div class="view" id="view-calendar"></div>
      <div class="view" id="view-shows" style="display:none;"></div>
      <div class="view" id="view-movies" style="display:none;"></div>
      <div class="view" id="view-config" style="display:none;"></div>
    </main>
  </div>

  <!-- Overlay (reused for show/movie/episode) -->
  <div class="overlay-backdrop" id="overlay-backdrop" aria-hidden="true">
    <div class="overlay" role="dialog" aria-modal="true">
      <div class="overlay-header">
        <div class="overlay-title" id="overlay-title"></div>
        <button class="overlay-close" id="overlay-close" aria-label="Close">×</button>
      </div>
      <div class="overlay-body" id="overlay-body"></div>
    </div>
  </div>

  <script>
    // Basic config (logos)
    const ICON_TMDB    = "../image/services_logos/TMDB_icon.png";
    const ICON_VIDSRC  = "../image/services_logos/VidSrc_icon.png";
    const ICON_VIDEASY = "../image/services_logos/videasy_icon.png";

    const APP_STATE = {
      data: null,
      monthOffset: 0,
      currentTab: "calendar"
    };

    function setTheme(theme) {
      document.body.setAttribute("data-theme", theme);
      localStorage.setItem("mytv_theme", theme);
    }

    function applyFontScale(scale) {
      document.documentElement.style.setProperty("--font-scale", scale.toString());
      localStorage.setItem("mytv_font_scale", scale.toString());
    }

    function initThemeAndScale() {
      const t = localStorage.getItem("mytv_theme") || "dark";
      const s = parseFloat(localStorage.getItem("mytv_font_scale") || "1.0");
      setTheme(t);
      applyFontScale(s);
    }

    function fmtVersionMeta(data) {
      const meta = data && data.meta ? data.meta : {};
      const built = meta.built_at || "n/a";
      const shows = meta.shows != null ? meta.shows : "n/a";
      const movies = meta.movies != null ? meta.movies : "n/a";
      const livetv = meta.livetv != null ? meta.livetv : 0;
      return `index.html: v3.1.0 (2025-11-14 23:10 EST) • Data built: ${built} • Shows: ${shows} • Movies: ${movies} • LiveTV: ${livetv}`;
    }

    function imgPoster(url, cssClass) {
      if (!url) return "";
      const full = "https://image.tmdb.org/t/p/w342" + url;
      return `<img src="${full}" class="${cssClass}" loading="lazy" />`;
    }

    function renderWatchIcons(links) {
      if (!links) return "";
      const parts = [];
      if (links.tmdb) {
        parts.push(
          `<a href="${links.tmdb}" target="_blank" rel="noopener">
             <img src="${ICON_TMDB}" alt="TMDB" />
           </a>`
        );
      }
      if (links.vidsrc) {
        parts.push(
          `<a href="${links.vidsrc}" target="_blank" rel="noopener">
             <img src="${ICON_VIDSRC}" alt="VidSrc" />
           </a>`
        );
      }
      if (links.videasy) {
        parts.push(
          `<a href="${links.videasy}" target="_blank" rel="noopener">
             <img src="${ICON_VIDEASY}" alt="Videasy" />
           </a>`
        );
      }
      if (!parts.length) return "";
      return `<div class="watch-icons">${parts.join("")}</div>`;
    }

    function titleWithId(name, tmdb_id) {
      if (!tmdb_id) return name;
      return `${name} [${tmdb_id}]`;
    }

    // ---------------------------------------------------------------------
    // Calendar view
    // ---------------------------------------------------------------------

    function renderCalendar() {
      const container = document.getElementById("view-calendar");
      const data = APP_STATE.data;
      if (!data) {
        container.innerHTML = `<div class="mut">Unable to load data. Run the “Build TV Data and Deploy” workflow.</div>`;
        return;
      }

      // Build map: date -> items
      const byDate = {};
      const shows = data.shows || [];
      for (const show of shows) {
        const tmdbId = show.tmdb_id;
        for (const season of (show.seasons || [])) {
          const sNum = season.season_number;
          for (const ep of (season.episodes || [])) {
            if (!ep.air_date) continue;
            const key = ep.air_date;
            if (!byDate[key]) byDate[key] = [];
            byDate[key].push({
              type: "episode",
              show,
              season,
              episode: ep,
              tmdbId,
              sNum,
              eNum: ep.episode_number
            });
          }
        }
      }

      const movies = data.movies || [];
      for (const m of movies) {
        if (!m.release_date) continue;
        const key = m.release_date;
        if (!byDate[key]) byDate[key] = [];
        byDate[key].push({
          type: "movie",
          movie: m,
        });
      }

      const today = new Date();
      const year = today.getUTCFullYear();
      const month = today.getUTCMonth() + APP_STATE.monthOffset;
      const base = new Date(Date.UTC(year, month, 1));
      const displayYear = base.getUTCFullYear();
      const displayMonth = base.getUTCMonth(); // 0-based

      const firstDay = new Date(Date.UTC(displayYear, displayMonth, 1));
      const startDow = firstDay.getUTCDay(); // 0=Sun
      const startDate = new Date(firstDay);
      startDate.setUTCDate(firstDay.getUTCDate() - startDow);

      const rows = [];
      // DOW header row
      const dows = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
      rows.push(
        `<div class="calendar-dow-row">` +
          dows.map(d => `<div class="calendar-dow">${d}</div>`).join("") +
        `</div>`
      );

      for (let week = 0; week < 6; week++) {
        for (let d = 0; d < 7; d++) {
          const cellDate = new Date(startDate);
          cellDate.setUTCDate(startDate.getUTCDate() + week*7 + d);
          const yyyy = cellDate.getUTCFullYear();
          const mm = String(cellDate.getUTCMonth()+1).padStart(2,"0");
          const dd = String(cellDate.getUTCDate()).padStart(2,"0");
          const key = `${yyyy}-${mm}-${dd}`;

          const isThisMonth = cellDate.getUTCMonth() === displayMonth;
          const isToday = (cellDate.toISOString().slice(0,10) === today.toISOString().slice(0,10));

          const items = (byDate[key] || []).sort((a,b) => {
            if (a.type === b.type && a.type === "episode") {
              return (a.sNum - b.sNum) || (a.eNum - b.eNum);
            }
            return (a.type === "episode" ? -1 : 1);
          });

          let inner = "";
          inner += `<div class="day-cell-top">`;
          inner += `<span class="day-num">${isThisMonth ? cellDate.getUTCDate() : ""}</span>`;
          inner += `</div>`;

          inner += `<div class="day-items">`;
          for (const item of items) {
            if (item.type === "episode") {
              const show = item.show;
              const ep = item.episode;
              inner += `
              <div class="cal-item">
                ${imgPoster(show.poster_path, "cal-poster")}
                <div class="cal-text">
                  <div class="cal-show" data-show-tmdb="${show.tmdb_id}">
                    ${titleWithId(show.name, show.tmdb_id)}
                  </div>
                  <div class="cal-episode" data-show-tmdb="${show.tmdb_id}" data-season="${item.sNum}" data-episode="${item.eNum}">
                    S${String(item.sNum).padStart(2,"0")}E${String(item.eNum).padStart(2,"0")} · ${ep.name || ""}
                  </div>
                  <div class="cal-meta">
                    ${ep.runtime ? `${ep.runtime} min` : ""} ${show.networks && show.networks.length ? "• " + show.networks.join(", ") : ""}
                  </div>
                  ${renderWatchIcons(ep.links)}
                </div>
              </div>`;
            } else if (item.type === "movie") {
              const m = item.movie;
              inner += `
              <div class="cal-item">
                ${imgPoster(m.poster_path, "cal-poster")}
                <div class="cal-text">
                  <div class="cal-show" data-movie-tmdb="${m.tmdb_id}">
                    ${titleWithId(m.title, m.tmdb_id)}
                  </div>
                  <div class="cal-meta">
                    ${m.release_date || ""} ${m.runtime ? "• " + m.runtime + " min" : ""} ${m.status ? "• " + m.status : ""}
                  </div>
                  ${renderWatchIcons(m.links)}
                </div>
              </div>`;
            }
          }
          inner += `</div>`;

          rows.push(
            `<div class="day-cell${isToday ? " today" : ""}">${inner}</div>`
          );
        }
      }

      container.innerHTML = `
        <div class="calendar-header">
          <div class="calendar-header-row">
            <div class="calendar-title">${base.toLocaleString("en-CA", { month: "long", year: "numeric", timeZone: "UTC" })}</div>
            <div class="calendar-nav">
              <button class="btn-sm" data-cal-nav="prev">Prev</button>
              <button class="btn-sm" data-cal-nav="today">Today</button>
              <button class="btn-sm" data-cal-nav="next">Next</button>
            </div>
          </div>
        </div>
        <div class="calendar-grid">
          ${rows.join("")}
        </div>
      `;

      container.querySelectorAll("[data-cal-nav]").forEach(btn => {
        btn.addEventListener("click", (ev) => {
          const dir = ev.currentTarget.getAttribute("data-cal-nav");
          if (dir === "prev") APP_STATE.monthOffset -= 1;
          if (dir === "next") APP_STATE.monthOffset += 1;
          if (dir === "today") APP_STATE.monthOffset = 0;
          renderCalendar();
        });
      });

      container.querySelectorAll(".cal-show[data-show-tmdb]").forEach(el => {
        el.addEventListener("click", (ev) => {
          const tmdbId = parseInt(ev.currentTarget.getAttribute("data-show-tmdb"), 10);
          openShowPopup(tmdbId);
        });
      });
      container.querySelectorAll(".cal-episode").forEach(el => {
        el.addEventListener("click", (ev) => {
          const tmdbId = parseInt(ev.currentTarget.getAttribute("data-show-tmdb"), 10);
          const s = parseInt(ev.currentTarget.getAttribute("data-season"), 10);
          const e = parseInt(ev.currentTarget.getAttribute("data-episode"), 10);
          openEpisodePopup(tmdbId, s, e);
        });
      });
      container.querySelectorAll(".cal-show[data-movie-tmdb]").forEach(el => {
        el.addEventListener("click", (ev) => {
          const tmdbId = parseInt(ev.currentTarget.getAttribute("data-movie-tmdb"), 10);
          openMoviePopup(tmdbId);
        });
      });
    }

    // ---------------------------------------------------------------------
    // Shows view
    // ---------------------------------------------------------------------

    function renderShows() {
      const container = document.getElementById("view-shows");
      const data = APP_STATE.data;
      if (!data) {
        container.innerHTML = `<div class="mut">No data.</div>`;
        return;
      }

      const shows = (data.shows || []).slice().sort((a,b) =>
        (a.name || "").localeCompare(b.name || "")
      );

      const genresSet = new Set();
      const statusSet = new Set();
      for (const s of shows) {
        (s.genres || []).forEach(g => genresSet.add(g));
        if (s.status) statusSet.add(s.status);
      }

      const genres = ["All", ...Array.from(genresSet).sort()];
      const statuses = ["All", ...Array.from(statusSet).sort()];

      container.innerHTML = `
        <div class="filters-row">
          <label>Genre:
            <select id="show-filter-genre">
              ${genres.map(g => `<option value="${g}">${g}</option>`).join("")}
            </select>
          </label>
          <label>Sort:
            <select id="show-sort">
              <option value="name-asc">A → Z</option>
              <option value="name-desc">Z → A</option>
            </select>
          </label>
          <label>Status:
            <select id="show-filter-status">
              ${statuses.map(s => `<option value="${s}">${s}</option>`).join("")}
            </select>
          </label>
        </div>
        <div class="grid" id="shows-grid"></div>
      `;

      function redraw() {
        const gSel = document.getElementById("show-filter-genre").value;
        const sSel = document.getElementById("show-filter-status").value;
        const sortSel = document.getElementById("show-sort").value;

        let list = shows.slice();
        if (gSel !== "All") {
          list = list.filter(s => (s.genres || []).includes(gSel));
        }
        if (sSel !== "All") {
          list = list.filter(s => s.status === sSel);
        }
        if (sortSel === "name-asc") {
          list.sort((a,b) => (a.name || "").localeCompare(b.name || ""));
        } else if (sortSel === "name-desc") {
          list.sort((a,b) => (b.name || "").localeCompare(a.name || ""));
        }

        const grid = document.getElementById("shows-grid");
        if (!list.length) {
          grid.innerHTML = `<div class="mut">No shows match filters.</div>`;
          return;
        }
        grid.innerHTML = list.map(show => {
          const currentSeason = (show.seasons || []).slice().sort((a,b) => b.season_number - a.season_number)[0];
          const currentLabel = currentSeason
            ? `Current: S${String(currentSeason.season_number).padStart(2,"0")} (${currentSeason.episode_count} eps)`
            : "";
          return `
            <div class="card">
              ${imgPoster(show.poster_path, "card-poster")}
              <div class="card-body">
                <div class="card-title" data-show-tmdb="${show.tmdb_id}">
                  ${titleWithId(show.name, show.tmdb_id)}
                </div>
                <div class="card-sub">
                  ${(show.genres || []).join(", ")}${show.status ? " • " + show.status : ""}
                  ${currentLabel ? "<br>" + currentLabel : ""}
                </div>
                ${renderWatchIcons(show.links)}
              </div>
            </div>
          `;
        }).join("");

        grid.querySelectorAll(".card-title").forEach(el => {
          el.addEventListener("click", ev => {
            const tmdbId = parseInt(ev.currentTarget.getAttribute("data-show-tmdb"), 10);
            openShowPopup(tmdbId);
          });
        });
      }

      ["show-filter-genre", "show-filter-status", "show-sort"].forEach(id => {
        document.getElementById(id).addEventListener("change", redraw);
      });
      redraw();
    }

    // ---------------------------------------------------------------------
    // Movies view
    // ---------------------------------------------------------------------

    function renderMovies() {
      const container = document.getElementById("view-movies");
      const data = APP_STATE.data;
      if (!data) {
        container.innerHTML = `<div class="mut">No data.</div>`;
        return;
      }

      const movies = (data.movies || []).slice();

      const genresSet = new Set();
      const statusSet = new Set();
      for (const m of movies) {
        (m.genres || []).forEach(g => genresSet.add(g));
        if (m.status) statusSet.add(m.status);
      }

      const genres = ["All", ...Array.from(genresSet).sort()];
      const statuses = ["All", ...Array.from(statusSet).sort()];

      container.innerHTML = `
        <div class="filters-row">
          <label>Genre:
            <select id="movie-filter-genre">
              ${genres.map(g => `<option value="${g}">${g}</option>`).join("")}
            </select>
          </label>
          <label>Status:
            <select id="movie-filter-status">
              ${statuses.map(s => `<option value="${s}">${s}</option>`).join("")}
            </select>
          </label>
          <label>Sort:
            <select id="movie-sort">
              <option value="title-asc">Title A → Z</option>
              <option value="title-desc">Title Z → A</option>
              <option value="date-desc">Newest first</option>
              <option value="date-asc">Oldest first</option>
            </select>
          </label>
        </div>
        <div class="grid" id="movies-grid"></div>
      `;

      function parseDate(d) {
        if (!d) return null;
        const t = Date.parse(d);
        return isNaN(t) ? null : t;
      }

      function redraw() {
        const gSel = document.getElementById("movie-filter-genre").value;
        const sSel = document.getElementById("movie-filter-status").value;
        const sortSel = document.getElementById("movie-sort").value;

        let list = movies.slice();
        if (gSel !== "All") {
          list = list.filter(m => (m.genres || []).includes(gSel));
        }
        if (sSel !== "All") {
          list = list.filter(m => m.status === sSel);
        }

        list.sort((a,b) => {
          if (sortSel === "title-asc") {
            return (a.title || "").localeCompare(b.title || "");
          }
          if (sortSel === "title-desc") {
            return (b.title || "").localeCompare(a.title || "");
          }
          const da = parseDate(a.release_date);
          const db = parseDate(b.release_date);
          if (sortSel === "date-desc") {
            return (db || 0) - (da || 0);
          }
          if (sortSel === "date-asc") {
            return (da || 0) - (db || 0);
          }
          return 0;
        });

        const grid = document.getElementById("movies-grid");
        if (!list.length) {
          grid.innerHTML = `<div class="mut">No movies match filters.</div>`;
          return;
        }
        grid.innerHTML = list.map(m => `
          <div class="card">
            ${imgPoster(m.poster_path, "card-poster")}
            <div class="card-body">
              <div class="card-title" data-movie-tmdb="${m.tmdb_id}">
                ${titleWithId(m.title, m.tmdb_id)}
              </div>
              <div class="card-sub">
                ${(m.genres || []).join(", ")}<br>
                ${m.release_date || ""}${m.runtime ? " • " + m.runtime + " min" : ""}${m.status ? " • " + m.status : ""}
              </div>
              ${renderWatchIcons(m.links)}
            </div>
          </div>
        `).join("");

        grid.querySelectorAll(".card-title").forEach(el => {
          el.addEventListener("click", ev => {
            const tmdbId = parseInt(ev.currentTarget.getAttribute("data-movie-tmdb"), 10);
            openMoviePopup(tmdbId);
          });
        });
      }

      ["movie-filter-genre", "movie-filter-status", "movie-sort"].forEach(id => {
        document.getElementById(id).addEventListener("change", redraw);
      });
      redraw();
    }

    // ---------------------------------------------------------------------
    // Config view (minimal – display + links)
    // ---------------------------------------------------------------------

    function renderConfig() {
      const container = document.getElementById("view-config");
      const theme = document.body.getAttribute("data-theme") || "dark";
      const scale = parseFloat(localStorage.getItem("mytv_font_scale") || "1.0").toFixed(2);

      container.innerHTML = `
        <div class="card">
          <div class="card-body">
            <div style="font-weight:600; margin-bottom:4px;">Display</div>
            <div style="margin-bottom:6px;">
              <span class="mut">Theme:</span>
              <button class="btn-sm" data-theme-choice="dark"${theme === "dark" ? " style=\"background:var(--accent);color:#fff;border-color:var(--accent);\"" : ""}>Dark</button>
              <button class="btn-sm" data-theme-choice="light"${theme === "light" ? " style=\"background:var(--accent);color:#fff;border-color:var(--accent);\"" : ""}>Light</button>
            </div>
            <div style="margin-bottom:4px;">
              <span class="mut">Font size:</span>
              <input type="range" id="font-scale" min="0.8" max="2.0" step="0.05" value="${scale}">
              <span id="font-scale-label" class="mut">${scale}x</span>
            </div>
            <div class="mut" style="font-size:0.75rem;margin-top:4px;">
              Settings are stored in this browser only and used by index.html.
            </div>
          </div>
        </div>
      `;

      container.querySelectorAll("[data-theme-choice]").forEach(btn => {
        btn.addEventListener("click", ev => {
          const t = ev.currentTarget.getAttribute("data-theme-choice");
          setTheme(t);
          renderConfig();
        });
      });

      const slider = document.getElementById("font-scale");
      const label = document.getElementById("font-scale-label");
      slider.addEventListener("input", () => {
        label.textContent = `${parseFloat(slider.value).toFixed(2)}x`;
        applyFontScale(parseFloat(slider.value));
      });
    }

    // ---------------------------------------------------------------------
    // Popups
    // ---------------------------------------------------------------------

    const overlayBackdrop = document.getElementById("overlay-backdrop");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayBody = document.getElementById("overlay-body");
    const overlayClose = document.getElementById("overlay-close");

    function openOverlay(titleHtml, bodyHtml) {
      overlayTitle.innerHTML = titleHtml;
      overlayBody.innerHTML = bodyHtml;
      overlayBackdrop.classList.add("open");
      overlayBackdrop.setAttribute("aria-hidden", "false");
    }

    function closeOverlay() {
      overlayBackdrop.classList.remove("open");
      overlayBackdrop.setAttribute("aria-hidden", "true");
    }

    overlayClose.addEventListener("click", closeOverlay);
    overlayBackdrop.addEventListener("click", (ev) => {
      if (ev.target === overlayBackdrop) {
        closeOverlay();
      }
    });
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape") closeOverlay();
    });

    function findShowByTmdb(tmdbId) {
      const data = APP_STATE.data;
      if (!data || !data.shows) return null;
      return data.shows.find(s => s.tmdb_id === tmdbId) || null;
    }

    function findMovieByTmdb(tmdbId) {
      const data = APP_STATE.data;
      if (!data || !data.movies) return null;
      return data.movies.find(m => m.tmdb_id === tmdbId) || null;
    }

    function openShowPopup(tmdbId) {
      const show = findShowByTmdb(tmdbId);
      if (!show) return;
      const poster = imgPoster(show.poster_path, "overlay-poster");
      const genres = (show.genres || []).join(", ");
      const networks = (show.networks || []).join(", ");

      const seasons = (show.seasons || []).slice().sort((a,b) => a.season_number - b.season_number);

      const seasonsHtml = seasons.map(season => {
        const eps = (season.episodes || []).slice().sort((a,b) => a.episode_number - b.episode_number);
        const epsHtml = eps.map(ep => `
          <div class="episode-row">
            <div class="episode-row-title" data-show-tmdb="${show.tmdb_id}" data-season="${season.season_number}" data-episode="${ep.episode_number}">
              S${String(season.season_number).padStart(2,"0")}E${String(ep.episode_number).padStart(2,"0")} · ${ep.name || ""}
            </div>
            <div class="episode-row-meta">
              ${ep.air_date || ""}${ep.runtime ? " • " + ep.runtime + " min" : ""}<br>
              ${ep.overview || ""}
            </div>
            ${renderWatchIcons(ep.links)}
          </div>
        `).join("");

        return `
          <div class="overlay-section-title">
            Season ${season.season_number} (${season.episode_count} eps)
          </div>
          <div class="mut">${season.air_date || ""} • ${season.overview || ""}</div>
          <div class="episodes-list">
            ${epsHtml}
          </div>
        `;
      }).join("");

      const bodyHtml = `
        <div class="overlay-layout">
          ${poster}
          <div class="overlay-main">
            <div class="badge-row">
              ${genres ? `<span class="badge">${genres}</span>` : ""}
              ${show.status ? `<span class="badge">${show.status}</span>` : ""}
              ${networks ? `<span class="badge">${networks}</span>` : ""}
            </div>
            <div style="margin-top:4px;font-size:0.85rem;">${show.overview || ""}</div>
            <div class="overlay-section-title">Seasons</div>
            ${seasonsHtml || "<div class='mut'>No seasons.</div>"}
            ${renderWatchIcons(show.links)}
          </div>
        </div>
      `;
      openOverlay(titleWithId(show.name, show.tmdb_id), bodyHtml);

      overlayBody.querySelectorAll(".episode-row-title").forEach(el => {
        el.addEventListener("click", ev => {
          const t = ev.currentTarget;
          const s = parseInt(t.getAttribute("data-season"), 10);
          const e = parseInt(t.getAttribute("data-episode"), 10);
          openEpisodePopup(show.tmdb_id, s, e);
        });
      });
    }

    function openEpisodePopup(tmdbId, seasonNumber, episodeNumber) {
      const show = findShowByTmdb(tmdbId);
      if (!show) return;
      const season = (show.seasons || []).find(s => s.season_number === seasonNumber);
      if (!season) return;
      const ep = (season.episodes || []).find(e => e.episode_number === episodeNumber);
      if (!ep) return;

      const poster = imgPoster(show.poster_path, "overlay-poster");
      const title = `${titleWithId(show.name, show.tmdb_id)} – S${String(seasonNumber).padStart(2,"0")}E${String(episodeNumber).padStart(2,"0")}`;

      const bodyHtml = `
        <div class="overlay-layout">
          ${poster}
          <div class="overlay-main">
            <div class="mut">
              Season ${seasonNumber} • Episode ${episodeNumber}<br>
              ${ep.air_date || ""}${ep.runtime ? " • " + ep.runtime + " min" : ""}
            </div>
            <div style="margin-top:6px;font-size:0.9rem;">${ep.name || ""}</div>
            <div style="margin-top:4px;font-size:0.85rem;">${ep.overview || ""}</div>
            ${renderWatchIcons(ep.links)}
          </div>
        </div>
      `;
      openOverlay(title, bodyHtml);
    }

    function openMoviePopup(tmdbId) {
      const movie = findMovieByTmdb(tmdbId);
      if (!movie) return;

      const poster = imgPoster(movie.poster_path, "overlay-poster");
      const genres = (movie.genres || []).join(", ");
      const coll = movie.belongs_to_collection;
      const collHtml = coll && coll.name
        ? `<div class="overlay-section-title">Collection</div>
           <div class="mut">${coll.name}</div>`
        : "";

      const bodyHtml = `
        <div class="overlay-layout">
          ${poster}
          <div class="overlay-main">
            <div class="badge-row">
              ${genres ? `<span class="badge">${genres}</span>` : ""}
              ${movie.status ? `<span class="badge">${movie.status}</span>` : ""}
            </div>
            <div class="mut" style="margin-top:4px;">
              ${movie.release_date || ""}${movie.runtime ? " • " + movie.runtime + " min" : ""}
            </div>
            <div style="margin-top:6px;font-size:0.9rem;">${movie.overview || ""}</div>
            ${renderWatchIcons(movie.links)}
            ${collHtml}
          </div>
        </div>
      `;
      openOverlay(titleWithId(movie.title, movie.tmdb_id), bodyHtml);
    }

    // ---------------------------------------------------------------------
    // Tab handling
    // ---------------------------------------------------------------------

    function setTab(tab) {
      APP_STATE.currentTab = tab;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        const t = btn.getAttribute("data-tab");
        btn.classList.toggle("active", t === tab);
      });
      document.getElementById("view-calendar").style.display = tab === "calendar" ? "" : "none";
      document.getElementById("view-shows").style.display    = tab === "shows"    ? "" : "none";
      document.getElementById("view-movies").style.display   = tab === "movies"   ? "" : "none";
      document.getElementById("view-config").style.display   = tab === "config"   ? "" : "none";

      if (tab === "calendar") renderCalendar();
      if (tab === "shows")    renderShows();
      if (tab === "movies")   renderMovies();
      if (tab === "config")   renderConfig();
    }

    function initTabs() {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", ev => {
          const tab = ev.currentTarget.getAttribute("data-tab");
          setTab(tab);
        });
      });
    }

    // ---------------------------------------------------------------------
    // Boot
    // ---------------------------------------------------------------------

    initThemeAndScale();
    initTabs();

    fetch("../data/data.json?_=" + Date.now())
      .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(data => {
        APP_STATE.data = data;
        document.getElementById("meta-line").textContent = fmtVersionMeta(data);
        setTab("calendar");
      })
      .catch(err => {
        console.error("Failed to load data.json", err);
        APP_STATE.data = null;
        document.getElementById("meta-line").textContent =
          "index.html: v3.1.0 (2025-11-14 23:10 EST) • Data built: n/a • Shows: n/a • Movies: n/a • LiveTV: 0";
        document.getElementById("view-calendar").innerHTML =
          `<div class="mut">Unable to load data. Run the “Build TV Data and Deploy” workflow.</div>`;
      });
  </script>
</body>
</html>
