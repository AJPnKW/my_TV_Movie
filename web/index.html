<!doctype html>
<html lang="en">
<head>
  <!--
    File: web/index.html
    Project: my_TV_Movie
    Version: v2.8.08 (2025-11-10 02:05 EST)

    This build:
      - Fixes JS syntax bug that broke initialization.
      - Sticky global header.
      - Calendar:
          * Day-cell episode posters +50% (only in calendar cells).
          * Larger bold date, softened today highlight.
      - Shows:
          * Card posters compact (pre-50% size).
          * Poster + title → Show popup (P1).
          * Current Season line → Season popup (P2).
      - Popups:
          * P1 Show: poster, seasons list with season descriptions.
          * P2 Season: poster, all episodes incl. TBA, runtime, icons.
          * P3 Episode: poster, runtime, icons.
          * P4 Movie: poster, status, runtime, icons.
      - Movies:
          * Title/date sorting + status labels.
      - Live TV:
          * Skeleton grid using logos; no EPG yet.
  -->
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>My TV Hub</title>
  <style>
    :root {
      --bg: #020308;
      --fg: #f9fafb;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --accent-soft: #111827;
      --card: #050816;
      --border: #202938;
      --today-bg: #101827;
      --today-ring: #3b82f6;
      --danger: #f97316;
      --font-scale: 1.0;
      --side-pad: 40px;
    }
    :root[data-theme="light"] {
      --bg: #f3f4f6;
      --fg: #111827;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-soft: #e5e7eb;
      --card: #ffffff;
      --border: #d1d5db;
      --today-bg: #dbeafe;
      --today-ring: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: calc(14px * var(--font-scale));
      line-height: 1.5;
      padding: 8px var(--side-pad) 20px var(--side-pad);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Sticky global header */
    .app-header-wrap {
      position: sticky;
      top: 0;
      z-index: 80;
      padding-bottom: 6px;
      margin-bottom: 4px;
      background: linear-gradient(to bottom, var(--bg), rgba(0,0,0,0.0));
    }

    h1 {
      font-size: calc(22px * var(--font-scale));
      font-weight: 600;
      margin-bottom: 1px;
    }

    .meta-line {
      font-size: calc(11px * var(--font-scale));
      color: var(--muted);
      margin-bottom: 6px;
    }

    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 2px;
    }

    .nav-btn {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      font-size: calc(12px * var(--font-scale));
      cursor: pointer;
      outline: none;
    }
    .nav-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .view { display: none; }
    .view.active { display: block; }

    /* Calendar */
    .sticky-header {
      position: sticky;
      top: 64px;
      z-index: 60;
      padding: 4px 0 4px;
      background: linear-gradient(to bottom, var(--bg), rgba(0,0,0,0.0));
    }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 2px;
    }

    .cal-title {
      font-size: calc(18px * var(--font-scale));
      font-weight: 600;
    }

    .cal-nav-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      font-size: calc(11px * var(--font-scale));
      cursor: pointer;
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      font-size: calc(10px * var(--font-scale));
      color: var(--muted);
      margin-bottom: 3px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .day {
      min-height: 96px;
      border-radius: 6px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--card);
    }

    .day-header-strip {
      background: rgba(59,130,246,0.11);
      padding: 2px 4px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 4px;
    }

    .day-date {
      font-size: calc(16px * var(--font-scale));
      font-weight: 700;
    }

    .day-body {
      padding: 2px 3px 3px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .day.today {
      background: var(--today-bg);
      box-shadow: 0 0 0 2px var(--today-ring);
    }

    .ep-item,
    .movie-item {
      display: grid;
      grid-template-columns: 36px 1fr; /* poster +50% vs old 24px */
      gap: 3px;
      align-items: flex-start;
      padding: 2px;
      border-radius: 4px;
      background: rgba(7,11,23,0.96);
      font-size: calc(9px * var(--font-scale));
    }
    :root[data-theme="light"] .ep-item,
    :root[data-theme="light"] .movie-item {
      background: rgba(229,231,235,0.98);
    }

    .poster-sm {
      width: 36px;
      height: 54px;
      border-radius: 3px;
      object-fit: cover;
      background:#111827;
      cursor: pointer;
    }

    .ep-title {
      font-weight: 600;
      cursor: pointer;
    }

    .ep-meta,
    .movie-meta {
      font-size: calc(8px * var(--font-scale));
      color: var(--muted);
    }

    .net-logos {
      display: inline-flex;
      gap: 3px;
      align-items: center;
      margin-top: 1px;
    }

    .net-logo {
      height: 14px;
      max-width: 40px;
      object-fit: contain;
    }

    .icon-row {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      margin-top: 1px;
    }

    .ico-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .ico {
      width: 16px;
      height: 16px;
      object-fit: contain;
      display:block;
    }

    /* Shows / Movies */
    .filters {
      position: sticky;
      top: 64px;
      z-index: 60;
      padding: 4px 0 4px;
      background: linear-gradient(to bottom, var(--bg), rgba(0,0,0,0.0));
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 3px;
      align-items: center;
    }

    .filter-label {
      font-size: calc(9px * var(--font-scale));
      color: var(--muted);
    }

    .pill {
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: calc(9px * var(--font-scale));
      color: var(--fg);
      cursor: pointer;
    }
    .pill.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill,minmax(130px,1fr));
      gap: 8px;
      margin-top: 4px;
    }

    .card {
      background: var(--card);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* Compact posters for Show/Movie cards */
    .poster-md {
      width: 100%;
      height: 120px;
      border-radius: 6px;
      object-fit: cover;
      background:#111827;
      margin-bottom: 2px;
      cursor: pointer;
    }

    .title-link {
      font-size: calc(11px * var(--font-scale));
      font-weight: 600;
      cursor: pointer;
    }

    .sub {
      font-size: calc(8px * var(--font-scale));
      color: var(--muted);
    }

    /* Live TV */
    .livetv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill,minmax(150px,1fr));
      gap: 6px;
      margin-top: 4px;
    }

    .livetv-card {
      background: var(--card);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .livetv-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .livetv-name {
      font-size: calc(10px * var(--font-scale));
      font-weight: 600;
    }

    .livetv-meta {
      font-size: calc(8px * var(--font-scale));
      color: var(--muted);
    }

    /* Popups */
    .overlay-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .overlay-backdrop.active {
      display: flex;
    }
    .overlay {
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--accent);
      max-width: 760px;
      max-height: 88vh;
      padding: 10px;
      overflow-y: auto;
      box-shadow: 0 18px 40px rgba(0,0,0,0.9);
    }
    .overlay-header {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 4px;
    }
    .overlay-title {
      font-size: calc(14px * var(--font-scale));
      font-weight: 600;
    }
    .overlay-sub {
      font-size: calc(9px * var(--font-scale));
      color: var(--muted);
    }
    .overlay-close {
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--danger);
      color: #ffffff;
      border: none;
    }
    .overlay-section-title {
      margin-top: 4px;
      font-size: calc(9px * var(--font-scale));
      font-weight: 600;
    }
    .ep-list {
      margin-top: 2px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: calc(8px * var(--font-scale));
    }
    .ep-row {
      padding: 2px 3px;
      border-radius: 4px;
      background: rgba(7,11,23,0.96);
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    :root[data-theme="light"] .ep-row {
      background: rgba(229,231,235,0.98);
    }
    .ep-row-header {
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }
    .ep-row-title {
      font-weight: 600;
      cursor: pointer;
    }
    .ep-row-meta {
      font-size: inherit;
      color: var(--muted);
    }

    .popup-poster {
      width: 140px;
      border-radius: 8px;
      object-fit: cover;
      background:#111827;
      margin: 2px 0 4px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app-header-wrap">
    <h1>My TV Hub</h1>
    <div id="meta" class="meta-line">Loading…</div>
    <div class="nav">
      <button class="nav-btn active" data-view="calendar">Calendar</button>
      <button class="nav-btn" data-view="shows">Shows</button>
      <button class="nav-btn" data-view="movies">Movies</button>
      <button class="nav-btn" data-view="livetv">Live TV</button>
      <button class="nav-btn" data-view="config">Config</button>
    </div>
  </div>

  <!-- CALENDAR VIEW -->
  <div id="view-calendar" class="view active">
    <div class="sticky-header">
      <div class="cal-header">
        <div class="cal-title" id="cal-month-label">Loading…</div>
        <div>
          <button class="cal-nav-btn" id="cal-prev">Prev</button>
          <button class="cal-nav-btn" id="cal-today">Today</button>
          <button class="cal-nav-btn" id="cal-next">Next</button>
        </div>
      </div>
      <div class="cal-weekdays">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div>
        <div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
    </div>
    <div id="cal-grid" class="cal-grid"></div>
  </div>

  <!-- SHOWS VIEW -->
  <div id="view-shows" class="view">
    <div class="filters">
      <!-- Row 1: Genre -->
      <div class="filter-row" id="shows-genre-row">
        <span class="filter-label">Genre:</span>
      </div>
      <!-- Row 2: Sort / Status / Watched / When -->
      <div class="filter-row" id="shows-other-row">
        <span class="filter-label">Filters:</span>
        <button class="pill active" data-shows-sort="az">A–Z</button>
        <button class="pill" data-shows-sort="za">Z–A</button>
        <button class="pill" data-shows-status="all">All status</button>
        <button class="pill" data-shows-watched="all">All</button>
        <button class="pill" data-shows-when="all">Any time</button>
      </div>
    </div>
    <div id="shows-grid" class="grid"></div>
  </div>

  <!-- MOVIES VIEW -->
  <div id="view-movies" class="view">
    <div class="filters">
      <div class="filter-row" id="movies-genre-row">
        <span class="filter-label">Genre:</span>
      </div>
      <div class="filter-row" id="movies-other-row">
        <span class="filter-label">Filters:</span>
        <button class="pill active" data-movies-sort="title">Title</button>
        <button class="pill" data-movies-sort="date">Release date</button>
        <button class="pill active" data-movies-status="all">All status</button>
        <button class="pill" data-movies-watched="all">All</button>
        <button class="pill" data-movies-when="all">Any time</button>
      </div>
    </div>
    <div id="movies-grid" class="grid"></div>
  </div>

  <!-- LIVE TV VIEW -->
  <div id="view-livetv" class="view">
    <div class="filters">
      <div class="filter-row">
        <span class="filter-label">Country:</span>
        <button class="pill active" data-lt-country="all">All</button>
      </div>
      <div class="filter-row">
        <span class="filter-label">Group:</span>
        <button class="pill active" data-lt-group="all">All</button>
      </div>
    </div>
    <div id="livetv-grid" class="livetv-grid"></div>
  </div>

  <!-- CONFIG VIEW (inline helper) -->
  <div id="view-config" class="view">
    <p class="sub">
      Full settings live in
      <a href="config.html" target="_blank">config.html</a>.
      Theme &amp; font size here apply locally on this device.
    </p>
    <div style="margin-top:6px;">
      <span class="filter-label">Theme:</span>
      <button class="pill" id="cfg-dark">Dark</button>
      <button class="pill" id="cfg-light">Light</button>
      <span class="filter-label" style="margin-left:8px;">Font size:</span>
      <input type="range" id="cfg-font" min="0.8" max="1.4" step="0.05" value="1.0">
      <span id="cfg-font-label" class="filter-label">1.00x</span>
    </div>
  </div>

  <!-- POPUP OVERLAY -->
  <div id="overlay-backdrop" class="overlay-backdrop">
    <div id="overlay" class="overlay"></div>
  </div>

  <script>
    // ---------- constants ----------
    const ICONS = {
      tmdb: '../image/services_logos/TMDB_icon.png',
      vidsrc: '../image/services_logos/VidSrc_icon.png',
      videasy: '../image/services_logos/videasy_icon.png'
    };

    function slugLogo(name) {
      if (!name) return null;
      let s = name.toLowerCase()
        .replace(/\+/g, 'plus')
        .replace(/&/g, 'and')
        .replace(/[^a-z0-9]+/g, '_')
        .replace(/^_+|_+$/g, '');
      return s ? '../image/services_logos/' + s + '.png' : null;
    }

    function getServiceLogo(name) {
      if (!name) return null;
      const key = name.toLowerCase();
      const special = {
        'paramount network': 'paramount_network.png',
        'paramount+': 'paramount_plus.png',
        'nat geo': 'natgeo.png',
        'national geographic': 'natgeo.png'
      };
      if (special[key]) return '../image/services_logos/' + special[key];
      return slugLogo(name);
    }

    function formatRuntime(mins) {
      if (!mins || isNaN(mins)) return '';
      if (mins < 60) return `${mins}m`;
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return m ? `${h}h ${m}m` : `${h}h`;
    }

    function el(html) {
      const t = document.createElement('template');
      t.innerHTML = html.trim();
      return t.content.firstChild;
    }

    let DATA = null;
    let currentMonth = new Date();

    // ---------- meta ----------
    function renderMeta() {
      const metaEl = document.getElementById('meta');
      if (!DATA) {
        metaEl.textContent = 'Unable to load data. Run the "Build TV Data and Deploy" workflow.';
        return;
      }
      const built = DATA.generated_at || 'n/a';
      const shows = (DATA.meta && DATA.meta.shows) || (DATA.shows || []).length || 0;
      const movies = (DATA.meta && DATA.meta.movies) || (DATA.movies || []).length || 0;
      const live = (DATA.meta && DATA.meta.live_tv) || (DATA.live_tv || []).length || 0;
      metaEl.textContent =
        `index.html: v2.8.08 • config.html: v1.4.4 • ` +
        `Data built: ${built} • Shows: ${shows} • Movies: ${movies} • LiveTV: ${live}`;
    }

    // ---------- nav ----------
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const view = btn.dataset.view;
        document.querySelectorAll('.nav-btn')
          .forEach(b => b.classList.toggle('active', b === btn));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + view).classList.add('active');
      });
    });

    // ---------- theme & font ----------
    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('tvhub_theme', t);
      if (document.getElementById('cfg-dark')) {
        document.getElementById('cfg-dark').classList.toggle('active', t === 'dark');
        document.getElementById('cfg-light').classList.toggle('active', t === 'light');
      }
    }
    function applyFontScale(v) {
      document.documentElement.style.setProperty('--font-scale', v);
      localStorage.setItem('tvhub_fontscale', v);
      const lbl = document.getElementById('cfg-font-label');
      if (lbl) lbl.textContent = v.toFixed(2) + 'x';
    }

    (function initThemeFont() {
      applyTheme(localStorage.getItem('tvhub_theme') || 'dark');
      const fs = parseFloat(localStorage.getItem('tvhub_fontscale') || '1.0') || 1.0;
      applyFontScale(fs);
      const slider = document.getElementById('cfg-font');
      if (slider) slider.value = fs.toFixed(2);
    })();

    if (document.getElementById('cfg-dark')) {
      document.getElementById('cfg-dark').onclick = () => applyTheme('dark');
      document.getElementById('cfg-light').onclick = () => applyTheme('light');
      document.getElementById('cfg-font').oninput = e =>
        applyFontScale(parseFloat(e.target.value));
    }

    // ---------- overlay ----------
    const overlayBackdrop = document.getElementById('overlay-backdrop');
    const overlayEl = document.getElementById('overlay');

    function closeOverlay() {
      overlayBackdrop.classList.remove('active');
      overlayEl.innerHTML = '';
    }

    overlayBackdrop.addEventListener('click', e => {
      if (e.target === overlayBackdrop) closeOverlay();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeOverlay();
    });

    function openOverlay(html) {
      overlayEl.innerHTML = '';
      overlayEl.appendChild(el(html));
      overlayBackdrop.classList.add('active');
      const closeBtn = overlayEl.querySelector('.overlay-close');
      if (closeBtn) closeBtn.onclick = closeOverlay;
    }

    // ---------- icon row builders ----------
    function buildEpisodeIconRow(showId, season, ep) {
      const tmdb = `https://www.themoviedb.org/tv/${showId}/season/${season}/episode/${ep}`;
      const vids = `https://vidsrc.net/embed/tv/${showId}/${season}/${ep}`;
      const vea  = `https://player.videasy.net/tv/${showId}/${season}/${ep}`;
      return `
        <a class="ico-link" href="${tmdb}" target="_blank" title="TMDB">
          <img src="${ICONS.tmdb}" class="ico" alt="TMDB">
        </a>
        <a class="ico-link" href="${vids}" target="_blank" title="VidSrc">
          <img src="${ICONS.vidsrc}" class="ico" alt="VidSrc">
        </a>
        <a class="ico-link" href="${vea}" target="_blank" title="Videasy">
          <img src="${ICONS.videasy}" class="ico" alt="Videasy">
        </a>
      `;
    }

    function buildMovieIconRow(mv) {
      const id = mv.movie_id;
      const tmdb = `https://www.themoviedb.org/movie/${id}`;
      const vids = `https://vidsrc.net/embed/movie/${id}`;
      const vea  = `https://player.videasy.net/movie/${id}`;
      return `
        <a class="ico-link" href="${tmdb}" target="_blank" title="TMDB">
          <img src="${ICONS.tmdb}" class="ico" alt="TMDB">
        </a>
        <a class="ico-link" href="${vids}" target="_blank" title="VidSrc">
          <img src="${ICONS.vidsrc}" class="ico" alt="VidSrc">
        </a>
        <a class="ico-link" href="${vea}" target="_blank" title="Videasy">
          <img src="${ICONS.videasy}" class="ico" alt="Videasy">
        </a>
      `;
    }

    // ---------- popup builders ----------
    function showShowPopup(show) {
      if (!show) return;
      const poster = show.poster_path
        ? `https://image.tmdb.org/t/p/w342${show.poster_path}` : '';
      const seasons = show.seasons || [];
      const currentSeason = seasons.slice().sort((a,b)=>b.season_number-a.season_number)[0];
      const epCount = currentSeason ? (currentSeason.episodes || []).length : 0;
      const currentLine = currentSeason
        ? `Current Season: ${currentSeason.season_number} • ${epCount} episodes`
        : '';
      const netHtml = (show.networks || []).map(n => {
        const src = getServiceLogo(n);
        return src
          ? `<img src="${src}" class="net-logo" alt="${n}">`
          : `<span>${n}</span>`;
      }).join(' ');

      const seasonsHtml = seasons.map(s => {
        const c = (s.episodes || []).length;
        const desc = s.overview ? s.overview : '';
        return `
          <div class="ep-row"
               onclick="window.__openSeason(${show.show_id}, ${s.season_number})">
            <div class="ep-row-header">
              <div class="ep-row-title">
                Season ${s.season_number} • ${c} episodes
              </div>
            </div>
            <div class="ep-row-meta">${desc}</div>
          </div>
        `;
      }).join('');

      openOverlay(`
        <div>
          <div class="overlay-header">
            <div>
              <div class="overlay-title">
                ${show.name}
                ${show.links && show.links.tmdb
                  ? `<a href="${show.links.tmdb}" target="_blank">
                       <img src="${ICONS.tmdb}" class="ico" alt="TMDB">
                     </a>`
                  : ''}
              </div>
              <div class="overlay-sub">
                ${currentLine}<br>
                <span class="net-logos">${netHtml}</span><br>
                ${(show.genres || []).join(', ')} ${show.status ? '• ' + show.status : ''}
              </div>
            </div>
            <button class="overlay-close">✕</button>
          </div>
          ${poster ? `<img src="${poster}" alt="" class="popup-poster">` : ''}
          <div class="overlay-sub">${show.overview || ''}</div>
          <div class="overlay-section-title">Seasons</div>
          <div class="ep-list">
            ${seasonsHtml || '<div class="ep-row-meta">No seasons data.</div>'}
          </div>
        </div>
      `);
    }

    function showSeasonPopup(showId, seasonNum) {
      const show = (DATA.shows || []).find(s => s.show_id === showId);
      if (!show) return;
      const season = (show.seasons || []).find(s => s.season_number === seasonNum);
      if (!season) return;
      const poster = show.poster_path
        ? `https://image.tmdb.org/t/p/w342${show.poster_path}` : '';

      const epsHtml = (season.episodes || []).map(ep => {
        const code = `S${String(seasonNum).padStart(2,'0')}E${String(ep.episode_number).padStart(2,'0')}`;
        const air = ep.air_date || 'TBA';
        const rt = formatRuntime(ep.runtime);
        const desc = ep.overview || '';
        const icons = buildEpisodeIconRow(show.show_id, seasonNum, ep.episode_number);
        return `
          <div class="ep-row">
            <div class="ep-row-header">
              <div class="ep-row-title"
                   onclick="window.__openEpisode(${show.show_id}, ${seasonNum}, ${ep.episode_number})">
                ${code} · ${ep.name || 'TBA'}
              </div>
              <div class="ep-row-meta">${air}${rt ? ' • ' + rt : ''}</div>
            </div>
            <div class="ep-row-meta">${desc}</div>
            <div class="icon-row">${icons}</div>
          </div>
        `;
      }).join('');

      openOverlay(`
        <div>
          <div class="overlay-header">
            <div>
              <div class="overlay-title">${show.name} — Season ${seasonNum}</div>
              <div class="overlay-sub">${season.overview || ''}</div>
            </div>
            <button class="overlay-close">✕</button>
          </div>
          ${poster ? `<img src="${poster}" alt="" class="popup-poster">` : ''}
          <div class="overlay-section-title">Episodes</div>
          <div class="ep-list">
            ${epsHtml || '<div class="ep-row-meta">No episodes.</div>'}
          </div>
        </div>
      `);
    }

    function showEpisodePopup(showId, seasonNum, epNum) {
      const show = (DATA.shows || []).find(s => s.show_id === showId);
      const season = show && (show.seasons || []).find(s => s.season_number === seasonNum);
      const ep = season && (season.episodes || []).find(e => e.episode_number === epNum);
      if (!show || !season || !ep) return;

      const poster = show.poster_path
        ? `https://image.tmdb.org/t/p/w342${show.poster_path}` : '';

      const code = `S${String(seasonNum).padStart(2,'0')}E${String(epNum).padStart(2,'0')}`;
      const air = ep.air_date || 'TBA';
      const rt = formatRuntime(ep.runtime);
      const icons = buildEpisodeIconRow(show.show_id, seasonNum, epNum);

      openOverlay(`
        <div>
          <div class="overlay-header">
            <div>
              <div class="overlay-title">${show.name} — ${code}</div>
              <div class="overlay-sub">${air}${rt ? ' • ' + rt : ''}</div>
            </div>
            <button class="overlay-close">✕</button>
          </div>
          ${poster ? `<img src="${poster}" alt="" class="popup-poster">` : ''}
          <div class="overlay-sub">${ep.overview || 'No description.'}</div>
          <div class="overlay-section-title">Watch</div>
          <div class="icon-row">${icons}</div>
        </div>
      `);
    }

    function showMoviePopup(movieId) {
      const mv = (DATA.movies || []).find(m => m.movie_id === movieId);
      if (!mv) return;
      const poster = mv.poster_path
        ? `https://image.tmdb.org/t/p/w342${mv.poster_path}` : '';
      const rd = mv.release_date || 'TBA';
      const rt = formatRuntime(mv.runtime);
      const status = labelMovieStatus(mv);
      const icons = buildMovieIconRow(mv);
      const coll = mv.belongs_to_collection && mv.belongs_to_collection.name
        ? `
          <div class="overlay-section-title">Collection</div>
          <div class="overlay-sub">${mv.belongs_to_collection.name}</div>
        `
        : '';

      openOverlay(`
        <div>
          <div class="overlay-header">
            <div>
              <div class="overlay-title">${mv.name}</div>
              <div class="overlay-sub">
                ${rd}${status ? ' • ' + status : ''}${rt ? ' • ' + rt : ''}
              </div>
            </div>
            <button class="overlay-close">✕</button>
          </div>
          ${poster ? `<img src="${poster}" alt="" class="popup-poster">` : ''}
          <div class="overlay-sub">${mv.overview || ''}</div>
          <div class="overlay-section-title">Watch</div>
          <div class="icon-row">${icons}</div>
          ${coll}
        </div>
      `);
    }

    window.__openSeason = showSeasonPopup;
    window.__openEpisode = showEpisodePopup;

    // ---------- movie status ----------
    function labelMovieStatus(mv) {
      const raw = (mv.status || '').toLowerCase();
      const today = new Date().toISOString().slice(0,10);
      const rd = mv.release_date || '';

      if (raw.includes('released')) return 'Released';
      if (raw.includes('post production')) return 'In Production';
      if (raw.includes('in production')) return 'In Production';
      if (raw.includes('planned') || raw.includes('announced')) return 'Announced';

      if (rd) {
        if (rd > today) return 'Announced';
        if (rd <= today) return 'Released';
      }
      return '';
    }

    // ---------- calendar ----------
    function buildCalendar() {
      if (!DATA) return;
      const grid = document.getElementById('cal-grid');
      const label = document.getElementById('cal-month-label');
      grid.innerHTML = '';

      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const first = new Date(year, month, 1);
      const startDay = first.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      label.textContent = first.toLocaleString(undefined, { month: 'long', year: 'numeric' });

      const today = new Date();
      const isTodayMonth = today.getFullYear() === year && today.getMonth() === month;
      const totalCells = 42;
      let d = 1 - startDay;

      for (let i = 0; i < totalCells; i++, d++) {
        const cellDate = new Date(year, month, d);
        const inMonth = cellDate.getMonth() === month;
        const isToday = isTodayMonth && inMonth && cellDate.getDate() === today.getDate();

        const dayEl = el(`<div class="day ${isToday ? 'today' : ''}"></div>`);
        const head = el(`
          <div class="day-header-strip">
            <div class="day-date">${cellDate.getDate()}</div>
          </div>
        `);
        const body = el(`<div class="day-body"></div>`);

        if (!inMonth) dayEl.style.opacity = 0.25;

        const airStr = cellDate.toISOString().slice(0,10);

        // TV episodes
        (DATA.shows || []).forEach(show => {
          (show.seasons || []).forEach(season => {
            (season.episodes || []).forEach(ep => {
              if (!ep.air_date || ep.air_date !== airStr) return;
              const poster = show.poster_path
                ? `https://image.tmdb.org/t/p/w154${show.poster_path}` : '';
              const code = `S${String(season.season_number).padStart(2,'0')}E${String(ep.episode_number).padStart(2,'0')}`;
              const rt = formatRuntime(ep.runtime);
              const nets = (show.networks || []).map(n => {
                const src = getServiceLogo(n);
                return src ? `<img src="${src}" class="net-logo" alt="${n}">` : '';
              }).join('');
              const icons = buildEpisodeIconRow(show.show_id, season.season_number, ep.episode_number);

              const item = el(`
                <div class="ep-item">
                  <img class="poster-sm"
                       src="${poster}"
                       alt=""
                       data-show="${show.show_id}">
                  <div>
                    <div class="ep-title"
                         data-action="show"
                         data-id="${show.show_id}">
                      ${show.name}
                    </div>
                    <div class="ep-meta">
                      <span class="ep-title"
                            data-action="ep"
                            data-show="${show.show_id}"
                            data-season="${season.season_number}"
                            data-ep="${ep.episode_number}">
                        ${code} · ${ep.name || 'TBA'}
                      </span>
                      ${rt ? ' • ' + rt : ''}
                    </div>
                    <div class="ep-meta">
                      <span class="net-logos">${nets}</span>
                    </div>
                    <div class="icon-row">${icons}</div>
                  </div>
                </div>
              `);
              body.appendChild(item);
            });
          });
        });

        // Movies
        (DATA.movies || []).forEach(mv => {
          if (!mv.release_date || mv.release_date !== airStr) return;
          const poster = mv.poster_path
            ? `https://image.tmdb.org/t/p/w154${mv.poster_path}` : '';
          const rt = formatRuntime(mv.runtime);
          const icons = buildMovieIconRow(mv);
          const item = el(`
            <div class="movie-item">
              <img class="poster-sm"
                   src="${poster}"
                   alt=""
                   data-movie="${mv.movie_id}">
              <div>
                <div class="ep-title"
                     data-action="movie"
                     data-id="${mv.movie_id}">
                  ${mv.name}
                </div>
                <div class="movie-meta">
                  ${(mv.genres || []).slice(0,2).join(', ')}${rt ? ' • ' + rt : ''}
                </div>
                <div class="icon-row">${icons}</div>
              </div>
            </div>
          `);
          body.appendChild(item);
        });

        dayEl.appendChild(head);
        dayEl.appendChild(body);
        grid.appendChild(dayEl);
      }

      // calendar click wiring
      grid.querySelectorAll('img.poster-sm[data-show]').forEach(img => {
        img.onclick = () => {
          const id = parseInt(img.dataset.show,10);
          const s = (DATA.shows || []).find(x => x.show_id === id);
          showShowPopup(s);
        };
      });
      grid.querySelectorAll('img.poster-sm[data-movie]').forEach(img => {
        img.onclick = () => {
          const id = parseInt(img.dataset.movie,10);
          showMoviePopup(id);
        };
      });
      grid.querySelectorAll('[data-action="show"]').forEach(n => {
        n.onclick = () => {
          const id = parseInt(n.dataset.id,10);
          const s = (DATA.shows || []).find(x => x.show_id === id);
          showShowPopup(s);
        };
      });
      grid.querySelectorAll('[data-action="ep"]').forEach(n => {
        n.onclick = () => {
          showEpisodePopup(
            parseInt(n.dataset.show,10),
            parseInt(n.dataset.season,10),
            parseInt(n.dataset.ep,10)
          );
        };
      });
      grid.querySelectorAll('[data-action="movie"]').forEach(n => {
        n.onclick = () => {
          const id = parseInt(n.dataset.id,10);
          showMoviePopup(id);
        };
      });
    }

    document.getElementById('cal-prev').onclick = () => {
      currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1);
      buildCalendar();
    };
    document.getElementById('cal-next').onclick = () => {
      currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1);
      buildCalendar();
    };
    document.getElementById('cal-today').onclick = () => {
      currentMonth = new Date();
      buildCalendar();
    };

    // ---------- shows ----------
    function buildShows() {
      const grid = document.getElementById('shows-grid');
      const genreRow = document.getElementById('shows-genre-row');
      const shows = (DATA.shows || []).slice();
      grid.innerHTML = '';

      const genres = new Set();
      shows.forEach(s => (s.genres || []).forEach(g => genres.add(g)));

      genreRow.innerHTML = '<span class="filter-label">Genre:</span>';
      const allBtn = el('<button class="pill active" data-shows-genre="all">All</button>');
      genreRow.appendChild(allBtn);
      Array.from(genres).sort().forEach(g => {
        genreRow.appendChild(el(`<button class="pill" data-shows-genre="${g}">${g}</button>`));
      });

      function apply() {
        grid.innerHTML = '';
        const activeGenreBtn = genreRow.querySelector('.pill.active[data-shows-genre]');
        const gsel = activeGenreBtn ? activeGenreBtn.dataset.showsGenre : 'all';

        let list = shows.slice();
        if (gsel !== 'all') list = list.filter(s => (s.genres || []).includes(gsel));

        const sortBtn = document.querySelector('.pill.active[data-shows-sort]');
        const sort = sortBtn ? sortBtn.dataset.showsSort : 'az';
        list.sort((a,b) => (a.name || '').localeCompare(b.name || '') * (sort === 'za' ? -1 : 1));

        list.forEach(show => {
          const poster = show.poster_path
            ? `https://image.tmdb.org/t/p/w342${show.poster_path}` : '';
          const seasons = show.seasons || [];
          const currentSeason = seasons.slice().sort((a,b)=>b.season_number-a.season_number)[0];
          const currentLine = currentSeason
            ? `Current Season: ${currentSeason.season_number} • ${(currentSeason.episodes || []).length} episodes`
            : '';
          const icons = `
            ${show.links && show.links.tmdb
              ? `<a class="ico-link" href="${show.links.tmdb}" target="_blank">
                   <img src="${ICONS.tmdb}" class="ico" alt="TMDB">
                 </a>`
              : ''}
            <a class="ico-link" href="https://vidsrc.net/embed/tv/${show.show_id}" target="_blank">
              <img src="${ICONS.vidsrc}" class="ico" alt="VidSrc">
            </a>
            <a class="ico-link" href="https://player.videasy.net/tv/${show.show_id}" target="_blank">
              <img src="${ICONS.videasy}" class="ico" alt="Videasy">
            </a>
          `;
          const card = el(`
            <div class="card">
              <img class="poster-md" src="${poster}" alt="" data-show="${show.show_id}">
              <div class="title-link" data-show="${show.show_id}">${show.name}</div>
              <div class="sub current-season"
                   data-show="${show.show_id}"
                   data-season="${currentSeason ? currentSeason.season_number : ''}">
                ${currentLine}
              </div>
              <div class="sub">
                ${(show.genres || []).join(', ')}
                ${show.status ? '• ' + show.status : ''}
              </div>
              <div class="icon-row">${icons}</div>
            </div>
          `);
          grid.appendChild(card);
        });

        grid.querySelectorAll('.poster-md[data-show], .title-link[data-show]').forEach(n => {
          n.onclick = () => {
            const id = parseInt(n.dataset.show,10);
            const s = shows.find(x => x.show_id === id);
            showShowPopup(s);
          };
        });

        grid.querySelectorAll('.current-season[data-season]').forEach(n => {
          const sid = parseInt(n.dataset.show,10);
          const sn = parseInt(n.dataset.season,10);
          if (!sn) return;
          n.style.cursor = 'pointer';
          n.onclick = () => showSeasonPopup(sid, sn);
        });
      }

      genreRow.addEventListener('click', e => {
        const btn = e.target.closest('.pill[data-shows-genre]');
        if (!btn) return;
        genreRow.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        apply();
      });

      document.getElementById('shows-other-row').addEventListener('click', e => {
        const sortBtn = e.target.closest('.pill[data-shows-sort]');
        if (sortBtn) {
          document
            .querySelectorAll('.pill[data-shows-sort]')
            .forEach(b => b.classList.remove('active'));
          sortBtn.classList.add('active');
          apply();
        }
      });

      apply();
    }

    // ---------- movies ----------
    function buildMovies() {
      const grid = document.getElementById('movies-grid');
      const genreRow = document.getElementById('movies-genre-row');
      const moviesOther = document.getElementById('movies-other-row');
      const movies = (DATA.movies || []).slice();
      grid.innerHTML = '';

      const genres = new Set();
      movies.forEach(m => (m.genres || []).forEach(g => genres.add(g)));

      genreRow.innerHTML = '<span class="filter-label">Genre:</span>';
      genreRow.appendChild(el('<button class="pill active" data-movies-genre="all">All</button>'));
      Array.from(genres).sort().forEach(g => {
        genreRow.appendChild(el(`<button class="pill" data-movies-genre="${g}">${g}</button>`));
      });

      moviesOther.querySelector('[data-movies-status="all"]').classList.add('active');

      function apply() {
        grid.innerHTML = '';
        const gbtn = genreRow.querySelector('.pill.active[data-movies-genre]');
        const gsel = gbtn ? gbtn.dataset.moviesGenre : 'all';

        const sbtn = moviesOther.querySelector('.pill.active[data-movies-sort]');
        const sort = sbtn ? sbtn.dataset.moviesSort : 'title';

        const stbtn = moviesOther.querySelector('.pill.active[data-movies-status]');
        const ssel = stbtn ? stbtn.dataset.moviesStatus : 'all';

        let list = movies.slice();
        if (gsel !== 'all') {
          list = list.filter(m => (m.genres || []).includes(gsel));
        }

        list.forEach(m => m._statusLabel = labelMovieStatus(m));
        if (ssel !== 'all') {
          list = list.filter(m => m._statusLabel === ssel);
        }

        list.sort((a,b) => {
          if (sort === 'date') {
            const ad = a.release_date || '';
            const bd = b.release_date || '';
            return ad.localeCompare(bd);
          }
          return (a.name || '').localeCompare(b.name || '');
        });

        list.forEach(mv => {
          const poster = mv.poster_path
            ? `https://image.tmdb.org/t/p/w342${mv.poster_path}` : '';
          const rd = mv.release_date || 'TBA';
          const rt = formatRuntime(mv.runtime);
          const status = mv._statusLabel || '';
          const icons = buildMovieIconRow(mv);

          const card = el(`
            <div class="card">
              <img class="poster-md" src="${poster}" alt="" data-movie="${mv.movie_id}">
              <div class="title-link" data-movie="${mv.movie_id}">${mv.name}</div>
              <div class="sub">${(mv.genres || []).join(', ')}</div>
              <div class="sub">
                ${rd}${status ? ' • ' + status : ''}${rt ? ' • ' + rt : ''}
              </div>
              <div class="icon-row">${icons}</div>
            </div>
          `);
          grid.appendChild(card);
        });

        grid.querySelectorAll('.poster-md[data-movie], .title-link[data-movie]').forEach(n => {
          n.onclick = () => {
            const id = parseInt(n.dataset.movie,10);
            showMoviePopup(id);
          };
        });
      }

      genreRow.addEventListener('click', e => {
        const btn = e.target.closest('.pill[data-movies-genre]');
        if (!btn) return;
        genreRow.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        apply();
      });

      moviesOther.addEventListener('click', e => {
        const sBtn = e.target.closest('.pill[data-movies-sort]');
        if (sBtn) {
          moviesOther.querySelectorAll('.pill[data-movies-sort]')
            .forEach(b => b.classList.remove('active'));
          sBtn.classList.add('active');
          apply();
          return;
        }
        const stBtn = e.target.closest('.pill[data-movies-status]');
        if (stBtn) {
          moviesOther.querySelectorAll('.pill[data-movies-status]')
            .forEach(b => b.classList.remove('active'));
          stBtn.classList.add('active');
          apply();
        }
      });

      apply();
    }

    // ---------- live tv ----------
    function buildLiveTV() {
      const grid = document.getElementById('livetv-grid');
      grid.innerHTML = '';
      const chans = DATA.live_tv || [];
      chans.forEach(ch => {
        const logo = ch.logo
          ? '../image/services_logos/' + ch.logo
          : getServiceLogo(ch.name);
        const c = el(`
          <div class="livetv-card">
            ${logo ? `<img src="${logo}" class="livetv-logo" alt="${ch.name}">` : ''}
            <div>
              <div class="livetv-name">${ch.name}</div>
              <div class="livetv-meta">
                ${(ch.country || '')}
                ${ch.group ? '• ' + ch.group : ''}
                ${ch.location ? '• ' + ch.location : ''}
                ${ch.timezone ? '• ' + ch.timezone : ''}
              </div>
            </div>
          </div>
        `);
        grid.appendChild(c);
      });
    }

    // ---------- load data ----------
    async function loadData() {
      try {
        const res = await fetch('../data/data.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        DATA = await res.json();
      } catch (e) {
        console.error('Failed to load data.json', e);
        DATA = null;
      }
      renderMeta();
      if (DATA) {
        buildCalendar();
        buildShows();
        buildMovies();
        buildLiveTV();
      }
    }

    loadData();
  </script>
</body>
</html>
