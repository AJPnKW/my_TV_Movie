<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <link rel="stylesheet" href="./css/my_tv_hub.css" />
  <style>
    /* Safety net styling (keeps UI usable even if CSS drifts) */
    :root{color-scheme:dark;}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#070b12;color:#e8eefc;}
    html,body{height:100%;}
    /* Force page + main panel to be vertically scrollable across TV browsers */
    body{overflow:auto !important; overscroll-behavior:contain; touch-action:pan-y;}
    .app{min-height:100vh; display:flex; flex-direction:column;}
    .panel{flex:1; min-height:0; overflow:auto; -webkit-overflow-scrolling:touch;}

    .app{max-width:1400px;margin:0 auto;padding:14px;}
    .topbar{display:flex;align-items:center;gap:12px}
    .brand{display:flex;align-items:center;gap:10px}
    .logo{width:34px;height:34px;border-radius:10px;background:#0f172a;display:grid;place-items:center;border:1px solid rgba(255,255,255,.08)}
    .title{font-weight:800;font-size:22px;letter-spacing:.2px}
    .subtitle{opacity:.8;font-size:12px;margin-top:2px}
    .status{margin-left:auto;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
    .dot{width:10px;height:10px;border-radius:50%;background:#16a34a}
    .dot.bad{background:#dc2626}
    .nav{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;padding:10px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
    .tab{cursor:pointer;user-select:none;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font-weight:700}
    .tab.active{background:rgba(59,130,246,.25);border-color:rgba(59,130,246,.5)}
    .panel{margin-top:14px;border-radius:22px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);padding:18px;min-height:0;max-height:calc(100vh - 190px);overflow:auto;-webkit-overflow-scrolling:touch;}
    .panel h2{margin:0 0 6px 0;font-size:34px}
    .toolbar{display:flex;gap:10px;align-items:center;margin:8px 0 14px 0}
    .search{flex:1;min-width:240px}
    input,select{width:100%;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#e8eefc}
    .grid{display:grid;gap:14px}
    .grid.cards{grid-template-columns:repeat(auto-fill,minmax(var(--card_min,240px),1fr))}
    .card{border-radius:18px;overflow:auto;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
    .poster{aspect-ratio:2/3;width:100%;object-fit:cover;background:#0b1220}
    .card-body{padding:12px}
    .card-title{font-weight:900;font-size:15px;margin:0}
    .meta{opacity:.85;font-size:12px;margin-top:6px;line-height:1.25}
    .pill{display:inline-block;margin-right:6px;margin-top:6px;padding:3px 8px;border-radius:999px;font-size:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
    .btnrow{display:flex;gap:8px;margin-top:10px}
    .btn{flex:1;text-align:center;text-decoration:none;font-weight:800;font-size:12px;padding:9px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#e8eefc}
    .btn:focus,.tab:focus{outline:2px solid rgba(59,130,246,.6);outline-offset:2px}
    .btn.tmdb{background:rgba(56,189,248,.22)}
    .btn.videasy{background:rgba(236,72,153,.22)}
    .btn.vidsrc{background:rgba(34,197,94,.18)}
    .btn.disabled{opacity:.45;pointer-events:none}
    .footer{opacity:.75;font-size:12px;margin-top:10px;padding:10px 2px;text-align:left}
    /* Calendar */
    .cal-head{display:flex;align-items:center;gap:10px;margin-top:6px}
    .cal-navbtn{width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#e8eefc;font-weight:900;cursor:pointer}
    .cal-month{font-size:26px;font-weight:900;margin-left:4px}
    .cal-today{margin-left:auto;padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);opacity:.85}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-top:14px}
    .dow{opacity:.75;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:0 4px}
    .day{min-height:110px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);padding:10px;position:relative}
    .day.dim{opacity:.45}
    .daynum{position:absolute;top:10px;left:10px;width:28px;height:28px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;font-weight:900;font-size:13px}
    .chips{margin-top:34px;display:flex;flex-direction:column;gap:8px}
    .chip{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);cursor:pointer}
    .chip .t{font-weight:900;font-size:12px;line-height:1.2}
    .chip .s{opacity:.8;font-size:11px;line-height:1.2}
    .more{opacity:.8;font-size:12px;margin-top:2px;cursor:pointer;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.12)}
    /* Modal */
    .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:999}
    .modal{max-width:980px;width:100%;max-height:86vh;overflow:auto;border-radius:22px;background:#0b1220;border:1px solid rgba(255,255,255,.10);box-shadow:0 30px 80px rgba(0,0,0,.5)}
    .modal-head{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
    .modal-title{font-weight:1000;font-size:18px}
    .modal-close{margin-left:auto;cursor:pointer;border-radius:12px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);color:#e8eefc;font-weight:900;padding:8px 12px}
    .modal-body{padding:16px}
    .list{display:flex;flex-direction:column;gap:10px}
    .row{padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
    .row .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
    .row .name{font-weight:900}
    .row .sub{opacity:.8;font-size:12px}
  
    /* =====================================================================
       v1.2.6 GAP FIXES (TARGETED, NO ARCH CHANGES)
       - config.json image_sizes applied (show/movie/episode still)
       - button label styling (TMDB / VidSrc / VidEasy)
       - logo "MY TV / HUB"
       - today date number contrast
       ===================================================================== */
    :root{
      --card_min:240px;
      --show_width:240px;
      --movie_width:240px;
      --season_width:240px;
      --episode_still_w:200px;
      --backdrop_w:780px;
    }
    .logo_txt{font-weight:1000;line-height:1.0;font-size:12px;letter-spacing:.12em;text-align:center}
    .logo_txt div:first-child{opacity:.95}
    .logo_txt div:last-child{opacity:1}
    .btn.tmdb, .btn.vidsrc, .btn.videasy{
      background:rgba(59,130,246,0.18);
      border:1px solid rgba(59,130,246,0.55);
      color:rgba(255,255,255,0.96);
    }
    .btn.tmdb:hover, .btn.vidsrc:hover, .btn.videasy:hover{background:rgba(59,130,246,0.26)}
    .day.today .date{
      color:rgba(255,255,255,0.98);
      background:rgba(59,130,246,0.22);
      border:1px solid rgba(59,130,246,0.55);
      padding:4px 8px;
      border-radius:12px;
      width:max-content;
      box-shadow:0 0 0 2px rgba(59,130,246,0.10) inset;
    }
    .chipimg{
      width:var(--episode_still_w,200px);
      height:42px;
      border-radius:12px;
      object-fit:cover;
      background:#0b1220;
      border:1px solid rgba(255,255,255,.08);
      flex:0 0 auto;
    }

  
    /* v1.2.6: remove redundant in-view headings */
    .view h1, .view h2{display:none!important}
  
    .chip{display:flex;gap:10px;align-items:flex-start}
    .chiptext{min-width:0}
  
    /* v1.2.6: remove redundant panel headings */
    .panel h2{display:none!important}
  
    .chiptext{min-width:0}
    .chipbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

    .panel[data-panel="showpage"]{padding:0}
    .showpage{border-radius:16px;overflow:hidden;background-size:cover;background-position:center}
    .showwrap{padding:18px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px)}
    .hero{display:grid;grid-template-columns:260px 1fr;gap:16px}
    .poster{width:260px;border-radius:16px;border:1px solid rgba(255,255,255,.12)}
    .kicker{font-size:12px;letter-spacing:.18em;opacity:.75}
    .titlebig{font-size:34px;font-weight:950;letter-spacing:.04em;margin-top:6px}
    .pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
    .pill{padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);font-size:12px}
    .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
    .overview{opacity:.92;line-height:1.35;max-width:980px}
    .seasonblock{display:grid;grid-template-columns:360px 1fr;gap:16px;margin-top:16px}
    .seasonlabel{font-weight:900;margin-bottom:8px;text-align:right}
    .radios{max-height:210px;overflow:auto;padding-right:6px}
    .radio{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);margin-bottom:8px}
    .seasoninfo{display:grid;grid-template-columns:180px 1fr;gap:12px;border:1px solid rgba(255,255,255,.10);border-radius:14px;background:rgba(255,255,255,.04);padding:12px}
    .poster_sm{width:180px;border-radius:14px;border:1px solid rgba(255,255,255,.12)}
    .epslabel{font-weight:900;margin:16px 0 10px}
    .epsrow{display:flex;gap:14px;overflow:auto;padding-bottom:8px}
    .epcard{min-width:320px;max-width:320px;border:1px solid rgba(255,255,255,.10);border-radius:14px;background:rgba(255,255,255,.04);overflow:hidden}
    .epstill{width:100%;height:160px;object-fit:cover}
    .epmeta{padding:10px 12px}
    .eptop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .badge{padding:4px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);font-size:12px;font-weight:900}
    .eptitle{font-weight:900}
    .muted{opacity:.75}
    .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .epbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo"><div class="logo_txt"><div>MY TV</div><div>HUB</div></div></div>
        <div>
          <div class="title"></div>
          <div class="subtitle" id="subtitle"></div>
        </div>
      </div>
      <div class="status" id="statusPill" title="Data status">
        <div class="dot" id="statusDot"></div>
        <div id="statusText">Ready</div>
      </div>
    </div>

    <div class="nav" role="tablist" aria-label="Views">
      <div class="tab active" data-tab="calendar" tabindex="0">Calendar</div>
      <div class="tab" data-tab="shows" tabindex="0">Shows</div>
      <div class="tab" data-tab="movies" tabindex="0">Movies</div>
      <div class="tab" aria-disabled="true" title="Not in this single-page build" style="opacity:.55;cursor:not-allowed;">Live TV</div>
      <div class="tab" aria-disabled="true" title="Not in this single-page build" style="opacity:.55;cursor:not-allowed;">Watchlist</div>
      <div class="tab" aria-disabled="true" title="Not in this single-page build" style="opacity:.55;cursor:not-allowed;">Explore</div>
      <div class="tab" aria-disabled="true" title="Not in this single-page build" style="opacity:.55;cursor:not-allowed;">Profiles</div>
      <div class="tab" aria-disabled="true" title="Use config.html" style="opacity:.55;cursor:not-allowed;">Config</div>
    </div>

    <div class="panel" id="panel"></div>

    <div class="footer" id="footer"></div>
  </div>

  <div class="modal-back" id="modalBack" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Details">
      <div class="modal-head">
        <div class="modal-title" id="modalTitle">Details</div>
        <button class="modal-close" id="modalClose">Close</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

<script>
(() => {
  const $ = (sel, el=document) => el.querySelector(sel);
  const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));

  const state = {
    cfg: null,
    data: null,
    tab: "calendar",
    calendarMonth: null, // Date set to first of month
    search: { shows: "", movies: "" },
    sort: { shows: "title", movies: "title" },
  };

  function setStatus(ok, msg) {
    $("#statusText").textContent = msg;
    $("#statusDot").classList.toggle("bad", !ok);
  }

  function fmtDate(d) {
    if (!d) return "";
    try {
      const dt = new Date(d + "T00:00:00");
      return dt.toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" });
    } catch { return String(d); }
  }

  function pad2(n){ return String(n).padStart(2,"0"); }
  function seTag(s,e){ return `S${pad2(s)}E${pad2(e)}`; }

  function tmdbShowUrl(id){ return `https://www.themoviedb.org/tv/${id}`; }
  function tmdbMovieUrl(id){ return `https://www.themoviedb.org/movie/${id}`; }

  function videasyTvUrl(id,s,e){
    const base = state.cfg?.streaming?.videasy_tv || "https://player.videasy.net/tv/";
    return `${base}${id}/${s}/${e}`;
  }
  function vidsrcTvUrl(id,s,e){
    const base = state.cfg?.streaming?.vidsrc_tv || "https://vidsrc.net/embed/tv/";
    return `${base}${id}/${s}/${e}`;
  }
  function videasyMovieUrl(id){
    const base = state.cfg?.streaming?.videasy_movie || "https://player.videasy.net/movie/";
    return `${base}${id}`;
  }
  function vidsrcMovieUrl(id){
    const base = state.cfg?.streaming?.vidsrc_movie || "https://vidsrc.net/embed/movie/";
    return `${base}${id}`;
  }

  function safeText(s){ return (s ?? "").toString(); }
  function genreLine(genres){
    if (!genres || !genres.length) return "";
    const names = genres.map(g => g?.name ? g.name : String(g)).filter(Boolean);
    return names.join(" / ");
  }

  function openModal(title, html) {
    $("#modalTitle").textContent = title;
    $("#modalBody").innerHTML = html;
    $("#modalBack").style.display = "flex";
    $("#modalBack").setAttribute("aria-hidden", "false");
    $("#modalClose").focus();
  }
  function closeModal(){
    $("#modalBack").style.display = "none";
    $("#modalBack").setAttribute("aria-hidden", "true");
    $("#modalBody").innerHTML = "";
  }

  function footerText() {
    const meta = state.data?.meta || {};
    const counts = meta.counts || {};
    const dataOk = state.data ? "ok" : "fail";
    const cfgOk  = (state.cfgFetchOk === true) ? "ok" : "fail";
    const showsN = counts.shows ?? (state.data?.shows?.length ?? 0);
    const moviesN = counts.movies ?? (state.data?.movies?.length ?? 0);
    return ` • data: ${dataOk} • cfg: ${cfgOk} • shows: ${showsN} • movies: ${moviesN}`;
  }

  async function loadAll() {
    setStatus(true, "Loading");
    state.cfg_ok = false;
    try {
      const [cfgRes, dataRes] = await Promise.all([
        fetch("./config.json", {cache:"no-store"}),
        fetch("../data/data.json", {cache:"no-store"})
      ]);
      if (!cfgRes.ok) throw new Error(`config.json HTTP ${cfgRes.status}`);
      if (!dataRes.ok) throw new Error(`data.json HTTP ${dataRes.status}`);
      // v1.2.6: config.json is OPTIONAL; if invalid JSON, continue with defaults
      try {
        state.cfg = await cfgRes.json();
      } catch (cfgErr) {
        console.error(cfgErr);
        state.cfg = {}; // defaults
        window.__cfg_invalid = true;
      }
      state.data = await dataRes.json();

      $("#footer").textContent = footerText();
      setStatus(true, "Ready");
      initCalendarMonth();
      render();
    handleHashRoute();
    } catch (e) {
      console.error(e);
      $("#footer").textContent = footerText();
      setStatus(false, "Failed");
      const msg = safeText(e?.message || e);
      $("#panel").innerHTML = `
        <h2>Calendar</h2>
        <div style="margin-top:10px;padding:12px 14px;border-radius:16px;border:1px solid rgba(220,38,38,.35);background:rgba(220,38,38,.10);">
          Failed to fetch data/config. Fix: run a local server from repo root: <code> .\.venv\Scripts\python.exe -m http.server 8000 </code>
          Then open: <code> http://127.0.0.1:8000/web/index.html </code><br/>
          Details: <code>${msg.replaceAll("<","&lt;")}</code>
        </div>
      `;
    }
  }

  function initCalendarMonth() {
    const today = new Date();
    state.calendarMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  }

  function buildCalendarEvents() {
    // v1.2.6: Calendar must include ALL episodes (all seasons) + ALL movies (no future-only scoping)
    // Index key: YYYY-MM-DD (normalize any timestamp to first 10 chars)
    const eventsByDate = new Map(); // yyyy-mm-dd -> [{type, ...}]
    const shows = state.data?.shows || [];
    const movies = state.data?.movies || [];

    for (const s of shows) {
      const seasons = Array.isArray(s?.seasons) ? s.seasons : [];
      for (const se of seasons) {
        const eps = Array.isArray(se?.episodes) ? se.episodes : [];
        for (const ep of eps) {
          const adRaw = safeText(ep?.air_date, "").trim();
          const ad = adRaw ? adRaw.slice(0,10) : "";
          if (!ad || !/^\d{4}-\d{2}-\d{2}$/.test(ad)) continue;

          const arr = eventsByDate.get(ad) || [];
          arr.push({
            type: "episode",
            title: s.title,
            tmdb_id: s.tmdb_id,
            season: ep.season_number ?? se.season_number,
            episode: ep.episode_number,
            ep_name: ep.name,
            runtime: ep.runtime,
            still: ep.still_local || ep.still_path || "",
            links: ep.links || {}
          });
          eventsByDate.set(ad, arr);
        }
      }
    }

    for (const movie of movies) {
      const rdRaw = safeText(movie?.release_date, "").trim();
      const rd = rdRaw ? rdRaw.slice(0,10) : "";
      if (!rd || !/^\d{4}-\d{2}-\d{2}$/.test(rd)) continue;

      const arr = eventsByDate.get(rd) || [];
      arr.push({
        type: "movie",
        title: movie.title,
        tmdb_id: movie.tmdb_id,
        poster: movie.poster_local || movie.poster_path || "",
        links: movie.links || {}
      });
      eventsByDate.set(rd, arr);
    }

    // Stable sort per date: episodes first, then movies, then title
    for (const [k, arr] of eventsByDate.entries()) {
      arr.sort((a,b) => {
        const pa = a.type === "episode" ? 0 : 1;
        const pb = b.type === "episode" ? 0 : 1;
        if (pa !== pb) return pa - pb;
        return safeText(a.title).localeCompare(safeText(b.title));
      });
    }

    return eventsByDate;
  }

  function renderCalendar() {
    const m = state.calendarMonth;
    const monthName = m.toLocaleDateString(undefined, { month:"long", year:"numeric" });
    const today = new Date();
    const todayKey = `${today.getFullYear()}-${pad2(today.getMonth()+1)}-${pad2(today.getDate())}`;
    const eventsByDate = buildCalendarEvents();

    // Calendar grid: include leading/trailing days to fill 6 weeks
    const firstDow = new Date(m.getFullYear(), m.getMonth(), 1).getDay(); // 0=Sun
    const startOffset = (firstDow + 6) % 7; // convert Monday=0
    const gridStart = new Date(m.getFullYear(), m.getMonth(), 1 - startOffset);

    const days = [];
    for (let i=0;i<42;i++){
      const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i);
      const key = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
      const inMonth = d.getMonth() === m.getMonth();
      days.push({ d, key, inMonth });
    }

    const dows = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(s => `<div class="dow">${s}</div>`).join("");

    const dayHtml = days.map(({d,key,inMonth}) => {
      const ev = eventsByDate.get(key) || [];
      const top = ev.slice(0,3);
      const rest = Math.max(0, ev.length - top.length);

      const chips = top.map((it, idx) => {
        const sub = it.type === "episode"
          ? `${seTag(it.season, it.episode)} • ${safeText(it.ep_name)}`
          : `Movie • Release`;
        const t = safeText(it.title);
        return `
          <div class="chip" data-day="${key}" data-idx="${idx}">
            <div>
              <div class="t">${t}</div>
              <div class="s">${sub}</div>
            </div>
          </div>
        `;
      }).join("");

      const more = rest > 0 ? `<div class="more" data-more="${key}">+${rest} more</div>` : "";

      const dim = inMonth ? "" : "dim";
      return `
        <div class="day ${dim}">
          <div class="daynum">${d.getDate()}</div>
          <div class="chips">${chips}${more}</div>
        </div>
      `;
    }).join("");

    $("#panel").innerHTML = `
      <h2>Calendar</h2>
      <div class="cal-head">
        <button class="cal-navbtn" id="calPrev" aria-label="Previous month">◀</button>
        <button class="cal-navbtn" id="calNext" aria-label="Next month">▶</button>
        <div class="cal-month">${monthName}</div>
        <div class="cal-today">Today ${todayKey}</div>
      </div>
      <div class="cal-grid" style="margin-top:10px;">
        ${dows}
        ${dayHtml}
      </div>
    `;

    $("#calPrev").onclick = () => { state.calendarMonth = new Date(m.getFullYear(), m.getMonth()-1, 1); render(); };
    $("#calNext").onclick = () => { state.calendarMonth = new Date(m.getFullYear(), m.getMonth()+1, 1); render(); };

    // chip click -> open episode/movie modal
    $$(".chip").forEach(ch => {
      ch.onclick = () => {
        const day = ch.getAttribute("data-day");
        const idx = parseInt(ch.getAttribute("data-idx"), 10);
        const list = (eventsByDate.get(day) || []);
        const it = list[idx];
        if (!it) return;
        if (it.type === "episode") {
          const s = it.season, e = it.episode;
          const html = `
            <div class="row">
              <div class="top">
                <div class="name"><a href="${tmdbShowUrl(it.tmdb_id)}" target="_blank" rel="noreferrer" style="color:#e8eefc;text-decoration:none;">${safeText(it.title)}</a></div>
                <div class="sub">• ${fmtDate(it.air_date)} • ${seTag(s,e)}</div>
              </div>
              <div class="sub" style="margin-top:6px;">${safeText(it.ep_name)}</div>
              <div class="btnrow" style="margin-top:12px;">
                <a class="btn tmdb" href="${tmdbShowUrl(it.tmdb_id)}" target="_blank" rel="noreferrer">TMDB</a>
                <a class="btn videasy" href="${videasyTvUrl(it.tmdb_id,s,e)}" target="_blank" rel="noreferrer">VidEasy</a>
                <a class="btn vidsrc" href="${vidsrcTvUrl(it.tmdb_id,s,e)}" target="_blank" rel="noreferrer">VidSrc</a>
              </div>
            </div>
          `;
          openModal(`${safeText(it.title)} • ${seTag(s,e)}`, html);
        } else {
          const html = `
            <div class="row">
              <div class="top">
                <div class="name"><a href="${tmdbMovieUrl(it.tmdb_id)}" target="_blank" rel="noreferrer" style="color:#e8eefc;text-decoration:none;">${safeText(it.title)}</a></div>
                <div class="sub">• ${fmtDate(it.release_date)}</div>
              </div>
              <div class="btnrow" style="margin-top:12px;">
                <a class="btn tmdb" href="${tmdbMovieUrl(it.tmdb_id)}" target="_blank" rel="noreferrer">TMDB</a>
                <a class="btn videasy" href="${videasyMovieUrl(it.tmdb_id)}" target="_blank" rel="noreferrer">VidEasy</a>
                <a class="btn vidsrc" href="${vidsrcMovieUrl(it.tmdb_id)}" target="_blank" rel="noreferrer">VidSrc</a>
              </div>
            </div>
          `;
          openModal(`${safeText(it.title)} • Movie`, html);
        }
      };
    });

    $$(".more").forEach(more => {
      more.onclick = () => {
        const day = more.getAttribute("data-more");
        const list = (eventsByDate.get(day) || []);
        const rows = list.map((it) => {
          if (it.type === "episode") {
            const s = it.season, e = it.episode;
            return `
              <div class="row">
                <div class="top">
                  <div class="name">${safeText(it.title)}</div>
                  <div class="sub">• ${seTag(s,e)} • ${safeText(it.ep_name)}</div>
                </div>
                <div class="btnrow" style="margin-top:10px;">
                  <a class="btn tmdb" href="${tmdbShowUrl(it.tmdb_id)}" target="_blank" rel="noreferrer">TMDB</a>
                  <a class="btn videasy" href="${videasyTvUrl(it.tmdb_id,s,e)}" target="_blank" rel="noreferrer">VidEasy</a>
                  <a class="btn vidsrc" href="${vidsrcTvUrl(it.tmdb_id,s,e)}" target="_blank" rel="noreferrer">VidSrc</a>
                </div>
              </div>
            `;
          } else {
            return `
              <div class="row">
                <div class="top">
                  <div class="name">${safeText(it.title)}</div>
                  <div class="sub">• Movie</div>
                </div>
                <div class="btnrow" style="margin-top:10px;">
                  <a class="btn tmdb" href="${tmdbMovieUrl(it.tmdb_id)}" target="_blank" rel="noreferrer">TMDB</a>
                  <a class="btn videasy" href="${videasyMovieUrl(it.tmdb_id)}" target="_blank" rel="noreferrer">VidEasy</a>
                  <a class="btn vidsrc" href="${vidsrcMovieUrl(it.tmdb_id)}" target="_blank" rel="noreferrer">VidSrc</a>
                </div>
              </div>
            `;
          }
        }).join("");
        openModal(`${day} • ${list.length} items`, `<div class="list">${rows}</div>`);
      };
    });
  }

  function renderShows() {
    // v1.2.6: config-driven show card sizing
    try{ document.documentElement.style.setProperty("--card_min", getComputedStyle(document.documentElement).getPropertyValue("--show_width").trim() || "240px"); }catch(_){ }

    const shows = (state.data?.shows || []).slice();
    const q = state.search.shows.trim().toLowerCase();
    const sort = state.sort.shows;

    const filtered = shows.filter(s => {
      if (!q) return true;
      const hay = `${safeText(s.title)} ${safeText(s.original_name)} ${safeText(s.tmdb_id)}`.toLowerCase();
      return hay.includes(q);
    });

    filtered.sort((a,b) => safeText(a.title).localeCompare(safeText(b.title)));

    const cards = filtered.map(s => {
      const poster = s.poster_local ? s.poster_local : "";
      const year = s.first_air_date ? String(s.first_air_date).slice(0,4) : "";
      const status = safeText(s.status);
      const genres = genreLine(s.genres);
      const nea = s.next_episode_to_air;
      const nextLine = nea?.air_date ? `Next: ${fmtDate(nea.air_date)} • ${seTag(nea.season_number, nea.episode_number)} • ${safeText(nea.name)}` : "";
      const canWatch = !!nea?.air_date && !!s.tmdb_id;

      const tmdb = tmdbShowUrl(s.tmdb_id);
      const videasy = canWatch ? videasyTvUrl(s.tmdb_id, nea.season_number, nea.episode_number) : "#";
      const vidsrc = canWatch ? vidsrcTvUrl(s.tmdb_id, nea.season_number, nea.episode_number) : "#";

      return `
        <div class="card">
          ${poster ? `<img class="poster" src="${poster}" alt="">` : `<div class="poster"></div>`}
          <div class="card-body">
            <div class="card-title">${safeText(s.title)}</div>
            <div class="meta">${year ? `Since ${year}` : ""}${status ? ` • ${status}` : ""}</div>
            ${genres ? `<div class="meta" style="margin-top:6px;">${genres}</div>` : ``}
            ${nextLine ? `<div class="meta" style="margin-top:8px;font-weight:800;">${nextLine}</div>` : ``}
            <div class="btnrow">
              <a class="btn tmdb" href="${tmdb}" target="_blank" rel="noreferrer">TMDB</a>
              <a class="btn videasy ${canWatch ? "" : "disabled"}" href="${videasy}" target="_blank" rel="noreferrer">VidEasy</a>
              <a class="btn vidsrc ${canWatch ? "" : "disabled"}" href="${vidsrc}" target="_blank" rel="noreferrer">VidSrc</a>
            </div>
          </div>
        </div>
      `;
    }).join("");

    $("#panel").innerHTML = `
      <div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;">
        <div style="flex:1;min-width:260px;">
          <h2>Shows</h2>
        </div>
        <div style="flex:2;min-width:260px;">
          <div class="toolbar" style="margin:0;">
            <div class="search"><input id="showSearch" placeholder="Search..." value="${state.search.shows.replaceAll('"',"&quot;")}"></div>
            <div style="width:170px"><select id="showSort"><option value="title">Title A→Z</option></select></div>
          </div>
        </div>
      </div>
      <div class="grid cards" style="margin-top:16px;">${cards}</div>
    `;

    $("#showSearch").oninput = (e) => { state.search.shows = e.target.value; renderShows(); };
  }

  function renderMovies() {
    // v1.2.6: config-driven movie card sizing
    try{ document.documentElement.style.setProperty("--card_min", getComputedStyle(document.documentElement).getPropertyValue("--movie_width").trim() || "240px"); }catch(_){ }

    const movies = (state.data?.movies || []).slice();
    const q = state.search.movies.trim().toLowerCase();

    const filtered = movies.filter(m => {
      if (!q) return true;
      const hay = `${safeText(m.title)} ${safeText(m.original_title)} ${safeText(m.tmdb_id)}`.toLowerCase();
      return hay.includes(q);
    });

    filtered.sort((a,b) => safeText(a.title).localeCompare(safeText(b.title)));

    const cards = filtered.map(m => {
      const poster = m.poster_local ? m.poster_local : "";
      const year = m.release_date ? String(m.release_date).slice(0,4) : "";
      const genres = genreLine(m.genres);
      const runtime = m.runtime ? `${m.runtime} min` : "";
      const tmdb = tmdbMovieUrl(m.tmdb_id);
      const videasy = videasyMovieUrl(m.tmdb_id);
      const vidsrc = vidsrcMovieUrl(m.tmdb_id);

      return `
        <div class="card">
          ${poster ? `<img class="poster" src="${poster}" alt="">` : `<div class="poster"></div>`}
          <div class="card-body">
            <div class="card-title">${safeText(m.title)}</div>
            <div class="meta">${year ? `Since ${year}` : ""}${runtime ? ` • ${runtime}` : ""}</div>
            ${genres ? `<div class="meta" style="margin-top:6px;">${genres}</div>` : ``}
            <div class="btnrow">
              <a class="btn tmdb" href="${tmdb}" target="_blank" rel="noreferrer">TMDB</a>
              <a class="btn videasy" href="${videasy}" target="_blank" rel="noreferrer">VidEasy</a>
              <a class="btn vidsrc" href="${vidsrc}" target="_blank" rel="noreferrer">VidSrc</a>
            </div>
          </div>
        </div>
      `;
    }).join("");

    $("#panel").innerHTML = `
      <div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;">
        <div style="flex:1;min-width:260px;">
          <h2>Movies</h2>
        </div>
        <div style="flex:2;min-width:260px;">
          <div class="toolbar" style="margin:0;">
            <div class="search"><input id="movieSearch" placeholder="Search..." value="${state.search.movies.replaceAll('"',"&quot;")}"></div>
            <div style="width:170px"><select id="movieSort"><option value="title">Title A→Z</option></select></div>
          </div>
        </div>
      </div>
      <div class="grid cards" style="margin-top:16px;">${cards}</div>
    `;

    $("#movieSearch").oninput = (e) => { state.search.movies = e.target.value; renderMovies(); };
  }

  function render() {
    $("#footer").textContent = footerText();
    if (state.tab === "calendar") renderCalendar();
    else if (state.tab === "shows") renderShows();
    else if (state.tab === "movies") renderMovies();
    else { state.tab = "calendar"; renderCalendar(); }
  }

  function setTab(tab) {
    state.tab = tab;
    $$(".tab").forEach(t => t.classList.toggle("active", t.getAttribute("data-tab") === tab));
    render();
  }

  function bindNav() {
    $$(".tab").forEach(t => {
      const tab = t.getAttribute("data-tab");
      if (!tab) return;
      t.onclick = () => setTab(tab);
      t.onkeydown = (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setTab(tab); }
      };
    });
  }

  $("#modalClose").onclick = closeModal;
  $("#modalBack").addEventListener("click", (e) => { if (e.target === $("#modalBack")) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  bindNav
  // v1.2.6: show card click -> #show/<tmdb_id>
  document.addEventListener("click", (e) => {
    const card = e.target && e.target.closest ? e.target.closest(".card") : null;
    if (!card) return;
    const kind = card.getAttribute("data-kind");
    const id = card.getAttribute("data-id");
    if (kind === "show" && id){
      location.hash = "#show/" + id;
    }
  });
();
  loadAll();
})();

  function tmdbShowUrl(id){ return id ? `https://www.themoviedb.org/tv/${id}` : "#"; }

  function pickLatestSeason(show){
    const seasons = Array.isArray(show?.seasons) ? show.seasons : [];
    if (!seasons.length) return null;
    return seasons.slice().sort((a,b)=>Number(b.season_number||0)-Number(a.season_number||0))[0];
  }

  function renderShowPage(tmdbId){
    const panel = document.querySelector('.panel[data-panel="showpage"]');
    if (!panel) return;
    const show = (state.data?.shows || []).find(s => String(s.tmdb_id) === String(tmdbId));
    if (!show){
      panel.innerHTML = `<div class="empty">Show not found</div>`;
      return;
    }

    const seasons = Array.isArray(show.seasons) ? show.seasons.slice().sort((a,b)=>Number(a.season_number||0)-Number(b.season_number||0)) : [];
    const selected = state.showpage_season ?? (pickLatestSeason(show)?.season_number ?? (seasons[0]?.season_number ?? null));
    const selSeason = seasons.find(s => Number(s.season_number)===Number(selected)) || seasons[seasons.length-1] || null;
    state.showpage_season = selSeason ? selSeason.season_number : null;

    const poster = resolveImg(show.poster_local || show.poster_path || "");
    const backdrop = resolveImg(show.backdrop_local || show.backdrop_path || "");
    const genres = Array.isArray(show.genres) ? show.genres.map(g=>g.name).filter(Boolean) : [];
    const vote = (show.vote_average!=null) ? Number(show.vote_average).toFixed(1) : "";
    const networks = Array.isArray(show.networks) ? show.networks.map(n=>n.name).filter(Boolean) : [];
    const firstAir = safeText(show.first_air_date, "");

    const firstEp = (selSeason && Array.isArray(selSeason.episodes) && selSeason.episodes.length) ? selSeason.episodes[0] : null;
    const vidsrc = firstEp?.links?.vidsrc || "";
    const videasy = firstEp?.links?.videasy || "";

    const seasonPicker = seasons.map(s=>{
      const sn = s.season_number;
      const name = safeText(s.name, `Season ${sn}`);
      const checked = Number(sn)===Number(selSeason?.season_number) ? "checked" : "";
      return `<label class="radio"><input type="radio" name="seasonpick" value="${sn}" ${checked}/> ${escapeHtml(name)}</label>`;
    }).join("");

    const seasonPoster = resolveImg(selSeason?.poster_local || selSeason?.poster_path || "");
    const seasonOverview = safeText(selSeason?.overview, "");
    const seasonAir = safeText(selSeason?.air_date, "");

    const eps = Array.isArray(selSeason?.episodes) ? selSeason.episodes : [];
    const epCards = eps.map(ep=>{
      const still = resolveImg(ep.still_local || ep.still_path || "");
      const tag = seTag(ep.season_number ?? selSeason.season_number, ep.episode_number);
      const rt = ep.runtime ? `${ep.runtime}m` : "";
      const eov = safeText(ep.overview,"");
      const e_vidsrc = ep.links?.vidsrc || "";
      const e_videasy = ep.links?.videasy || "";
      return `<div class="epcard">
        ${still ? `<img class="epstill" src="${still}" alt=""/>` : ``}
        <div class="epmeta">
          <div class="eptop"><span class="badge">${escapeHtml(tag)}</span><span class="eptitle">${escapeHtml(safeText(ep.name))}</span><span class="muted">${escapeHtml(rt)}</span></div>
          <div class="epov clamp2">${escapeHtml(eov)}</div>
          <div class="epbtns">
            <a class="btn tmdb" href="${escapeAttr(tmdbShowUrl(show.tmdb_id))}" target="_blank" rel="noreferrer">TMDB</a>
            ${e_vidsrc ? `<a class="btn vidsrc" href="${escapeAttr(e_vidsrc)}" target="_blank" rel="noreferrer">VidSrc</a>` : ``}
            ${e_videasy ? `<a class="btn videasy" href="${escapeAttr(e_videasy)}" target="_blank" rel="noreferrer">VidEasy</a>` : ``}
          </div>
        </div>
      </div>`;
    }).join("");

    panel.innerHTML = `
      <div class="showpage" style="${backdrop ? `background-image:linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.85)), url('${escapeAttr(backdrop)}');` : ''}">
        <div class="showwrap">
          <div class="hero">
            <div class="posterbox">${poster ? `<img class="poster" src="${escapeAttr(poster)}" alt=""/>` : ``}</div>
            <div class="herotext">
              <div class="kicker">ORIGINAL SERIES</div>
              <div class="titlebig">${escapeHtml(safeText(show.title||show.name))}</div>
              <div class="pills">
                ${genres.slice(0,6).map(g=>`<span class="pill">${escapeHtml(g)}</span>`).join("")}
                ${vote ? `<span class="pill">★ ${escapeHtml(vote)}</span>` : ``}
                ${networks.slice(0,2).map(n=>`<span class="pill">${escapeHtml(n)}</span>`).join("")}
                ${firstAir ? `<span class="pill">Premiered ${escapeHtml(firstAir)}</span>` : ``}
              </div>
              <div class="btnrow">
                <a class="btn tmdb" href="${escapeAttr(tmdbShowUrl(show.tmdb_id))}" target="_blank" rel="noreferrer">TMDB</a>
                ${vidsrc ? `<a class="btn vidsrc" href="${escapeAttr(vidsrc)}" target="_blank" rel="noreferrer">VidSrc</a>` : ``}
                ${videasy ? `<a class="btn videasy" href="${escapeAttr(videasy)}" target="_blank" rel="noreferrer">VidEasy</a>` : ``}
              </div>
              <div class="overview">${escapeHtml(safeText(show.overview))}</div>
            </div>
          </div>

          <div class="seasonblock">
            <div class="seasonpicker">
              <div class="seasonlabel">Season</div>
              <div class="radios">${seasonPicker}</div>
            </div>
            <div class="seasoninfo">
              <div class="seasonposter">${seasonPoster ? `<img class="poster_sm" src="${escapeAttr(seasonPoster)}" alt=""/>` : ``}</div>
              <div class="seasontext">
                <div class="seasonname">${escapeHtml(safeText(selSeason?.name, `Season ${selSeason?.season_number||""}`))}</div>
                <div class="muted">${escapeHtml(seasonAir)}</div>
                <div class="seasonov">${escapeHtml(seasonOverview)}</div>
              </div>
            </div>
          </div>

          <div class="epsblock">
            <div class="epslabel">Episodes</div>
            <div class="epsrow">${epCards}</div>
          </div>
        </div>
      </div>
    `;

    panel.querySelectorAll('input[name="seasonpick"]').forEach(inp=>{
      inp.addEventListener("change", (e)=>{
        state.showpage_season = Number(e.target.value);
        renderShowPage(tmdbId);
      });
    });
  }

  function handleHashRoute(){
    const h = String(location.hash || "");
    const m = h.match(/^#show\/(\d+)/i);
    if (m){
      document.querySelectorAll(".panel").forEach(p=>p.style.display="none");
      const sp = document.querySelector('.panel[data-panel="showpage"]');
      if (sp) sp.style.display="block";
      renderShowPage(m[1]);
      return true;
    }
    document.querySelectorAll(".panel").forEach(p=>p.style.display="block");
    const sp = document.querySelector('.panel[data-panel="showpage"]');
    if (sp) sp.style.display="none";
    return false;
  }

</script>
</body>
</html>
