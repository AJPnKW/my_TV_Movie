<!-- ========================================================================================
[FILE] web/index.html
[PROJECT] my_TV_Movie (My TV Hub)
[ROLE] Single-Page Application shell (single entry point; dynamic views + popup root)
[VERSION] v4.1.1
[UPDATED] 2025-12-19_00-00-00
[BUILD] 00.00.00
[OWNER] Andrew & Brant (internal)
[DEPENDS ON] web/css/my_tv_hub.css web/config.json data/data.json
[NOTES]
- True SPA shell: internal state routing only; no URL changes; no hash routing.
- Views (fixed): Calendar, Shows, Movies, Live TV, Watchlist, Explore, Profiles, Config.
- One global popup root; stacked overlays; scroll trapped inside popup; Escape/Back closes top popup.
- data.json is loaded once and never mutated.
- Canonical asset hierarchy ONLY (assets/...); never reference deprecated image/ folder.
- Phase 4.1 scope: Calendar View renderer inside index.html (per Section 4.1).
======================================================================================== -->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>My TV Hub</title>

  <!-- External CSS (module boundary respected) -->
  <link rel="stylesheet" href="./css/my_tv_hub.css" />

  <!-- Minimal SPA-shell CSS (self-contained; does not modify other modules) -->
  <style>
    :root {
      --bg: #0b0d12;
      --fg: #e8ecf3;
      --muted: #a8b0c0;
      --panel: #121725;
      --panel2: #0f1420;
      --border: rgba(255,255,255,0.10);
      --focus: #ffffff;
      --danger: #ff5b5b;
      --ok: #35d07f;

      --header-h: 64px;
      --nav-h: 56px;

      --radius: 14px;
      --pad: 14px;

      --font: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      overflow: hidden; /* SPA: scroll is handled inside view panels */
    }

    /* Global header (sticky; always visible) */
    #global-header {
      position: sticky;
      top: 0;
      z-index: 30;
      height: var(--header-h);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      background: linear-gradient(180deg, rgba(18,23,37,0.96), rgba(18,23,37,0.88));
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    #brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
    }

    #brand .logo-chip {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255,255,255,0.10);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    #brand .title {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    #brand .title .name {
      font-size: 16px;
      font-weight: 650;
      letter-spacing: 0.2px;
    }
    #brand .title .sub {
      font-size: 12px;
      color: var(--muted);
    }

    #header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 260px;
      justify-content: flex-end;
    }

    #status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 10px;
      background: rgba(255,255,255,0.06);
      font-size: 12px;
      color: var(--muted);
      user-select: none;
    }

    #status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.06) inset;
      flex: 0 0 auto;
    }

    #error-surface {
      max-width: 520px;
      display: none;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 91, 91, 0.35);
      background: rgba(255, 91, 91, 0.10);
      color: #ffd7d7;
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 12px;
    }
    #error-surface .label { font-weight: 650; }
    #error-surface .msg {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 380px;
    }
    #error-surface button {
      margin-left: auto;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: var(--fg);
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
    }
    #error-surface button:focus {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    /* Main nav (tabs) */
    #main-nav {
      height: var(--nav-h);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(15,20,32,0.92);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: var(--header-h);
      z-index: 25;
      backdrop-filter: blur(10px);
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 40px;
      min-width: 118px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--fg);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
      cursor: pointer;
      user-select: none;
    }
    .nav-btn[aria-selected="true"] {
      background: rgba(255,255,255,0.14);
      border-color: rgba(255,255,255,0.22);
    }
    .nav-btn:focus {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    /* App body */
    #app-shell {
      height: calc(100% - var(--header-h) - var(--nav-h));
      display: flex;
      flex-direction: column;
    }

    #content-root {
      flex: 1 1 auto;
      overflow: auto;
      padding: 14px;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    .view-panel {
      background: rgba(18,23,37,0.78);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      min-height: calc(100% - 2px);
      box-sizing: border-box;
    }

    .view-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 0 0 10px 0;
    }
    .view-title h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 750;
    }
    .view-title .meta {
      color: var(--muted);
      font-size: 12px;
      font-family: var(--mono);
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    /* ==========================
       Calendar View (Section 4.1)
       ========================== */

    .cal-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      min-height: 0;
    }

    .cal-month-header {
      position: sticky; /* Section 4.1.2.2 sticky month header */
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 10px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(15,20,32,0.96);
      backdrop-filter: blur(10px);
    }

    .cal-month-header .btn {
      border: 1px solid rgba(255,255,255,0.20);
      background: rgba(255,255,255,0.08);
      color: var(--fg);
      border-radius: 12px;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 750;
      font-size: 13px;
      min-width: 44px;
      text-align: center;
    }
    .cal-month-header .btn:focus {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .cal-month-header .title {
      font-size: 16px;
      font-weight: 850;
      letter-spacing: 0.2px;
    }

    .cal-month-header .today-ind {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(255,255,255,0.06);
      user-select: none;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr); /* Section 4.1.2.1 7 columns */
      gap: 10px;
      min-height: 0;
      flex: 1 1 auto;
    }

    .cal-dow {
      font-size: 12px;
      color: var(--muted);
      font-weight: 750;
      letter-spacing: 0.2px;
      padding: 0 8px;
    }

    .cal-cell {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      padding: 10px;
      min-height: 136px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      outline: none;
    }
    .cal-cell:focus {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .cal-cell[aria-disabled="true"] {
      opacity: 0.55;
    }

    .cal-date {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-weight: 850;
      font-size: 13px;
    }
    .cal-date .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.15);
      user-select: none;
    }
    .cal-date .badge-today {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 8px;
      background: rgba(255,255,255,0.06);
      user-select: none;
    }

    .cal-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .cal-item {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.18);
      border-radius: 12px;
      padding: 6px 8px;
      outline: none;
      cursor: pointer;
    }
    .cal-item:focus {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .cal-item .thumb {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      overflow: hidden;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }
    .cal-item .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cal-item .thumb .noimg {
      font-size: 11px;
      font-weight: 850;
      color: rgba(255,255,255,0.65);
      user-select: none;
    }

    .cal-item .main {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .cal-item .main .t {
      font-weight: 800;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cal-item .main .s {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cal-item .right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cal-item .avail {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.06) inset;
      flex: 0 0 auto;
    }
    .cal-item .avail[data-on="true"] { background: var(--ok); }

    .cal-more {
      border: 1px dashed rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      outline: none;
      text-align: left;
    }
    .cal-more:focus {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    /* Popup system */
    #popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none; /* enabled when stack not empty */
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(6px);
    }

    #popup-container {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none; /* enabled when stack not empty */
      pointer-events: none; /* only active popups handle */
    }

    .popup {
      pointer-events: auto;
      position: absolute;
      inset: 6% 6%;
      background: rgba(18,23,37,0.98);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden; /* scroll trapped inside popup body */
    }

    .popup-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(15,20,32,0.96);
    }

    .popup-header .title {
      font-weight: 800;
      font-size: 15px;
    }

    .popup-header .spacer { margin-left: auto; }

    .popup-header .btn {
      border: 1px solid rgba(255,255,255,0.20);
      background: rgba(255,255,255,0.08);
      color: var(--fg);
      border-radius: 12px;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 650;
      font-size: 12px;
    }
    .popup-header .btn:focus {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .popup-body {
      flex: 1 1 auto;
      overflow: auto;
      padding: 14px;
    }

    /* Utility */
    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
  </style>
</head>

<body>
  <!-- GLOBAL HEADER (sticky; always visible) -->
  <header id="global-header" role="banner">
    <div id="brand" aria-label="My TV Hub">
      <div class="logo-chip" aria-hidden="true">
        <span style="font-weight:900;">TV</span>
      </div>
      <div class="title">
        <div class="name">My TV Hub</div>
        <div class="sub">Single-page • DPAD-first • Local assets</div>
      </div>
    </div>

    <div id="error-surface" role="status" aria-live="polite">
      <span class="label">Error</span>
      <span class="msg" id="error-msg"></span>
      <button type="button" id="error-dismiss">Dismiss</button>
    </div>

    <div id="header-right">
      <div id="status-pill" aria-label="Load status">
        <span id="status-dot" aria-hidden="true"></span>
        <span id="status-text">Initializing…</span>
      </div>
    </div>
  </header>

  <!-- MAIN NAV (tabs; calls renderView(<view>)) -->
  <nav id="main-nav" role="tablist" aria-label="Main navigation tabs">
    <button class="nav-btn" role="tab" aria-selected="true" data-view="calendar">Calendar</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="shows">Shows</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="movies">Movies</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="live_tv">Live TV</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="watchlist">Watchlist</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="explore">Explore</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="profiles">Profiles</button>
    <button class="nav-btn" role="tab" aria-selected="false" data-view="config">Config</button>
  </nav>

  <!-- SPA SHELL -->
  <main id="app-shell" role="main">
    <div id="content-root" tabindex="-1" aria-label="Active view content"></div>
  </main>

  <!-- POPUP SYSTEM (global root) -->
  <div id="popup-overlay" aria-hidden="true"></div>
  <div id="popup-container" aria-live="polite" aria-label="Popup overlays"></div>

  <script>
    "use strict";

    // =====================================================================================
    // SPA Shell Runtime (index.html module)
    // - Internal state routing only (no URL changes)
    // - data.json loaded once and never mutated
    // - Global popup root with stacked overlays; Escape/Back closes top popup
    // - Canonical assets hierarchy only (assets/...)
    // =====================================================================================

    const VIEWS = Object.freeze([
      { key: "calendar",  label: "Calendar"  },
      { key: "shows",     label: "Shows"     },
      { key: "movies",    label: "Movies"    },
      { key: "live_tv",   label: "Live TV"   },
      { key: "watchlist", label: "Watchlist" },
      { key: "explore",   label: "Explore"   },
      { key: "profiles",  label: "Profiles"  },
      { key: "config",    label: "Config"    }
    ]);

    const App = {
      state: {
        active_view: "calendar",
        data_loaded: false,
        config_loaded: false,
        fatal_error: null,
        calendar: {
          year: null,
          month_index: null // 0-11
        }
      },
      // data.json is loaded once and never mutated
      frozen_data: null,
      config: null,
      popup_stack: []
    };

    const el = {
      contentRoot: document.getElementById("content-root"),
      popupOverlay: document.getElementById("popup-overlay"),
      popupContainer: document.getElementById("popup-container"),
      statusDot: document.getElementById("status-dot"),
      statusText: document.getElementById("status-text"),
      errorSurface: document.getElementById("error-surface"),
      errorMsg: document.getElementById("error-msg"),
      errorDismiss: document.getElementById("error-dismiss"),
      nav: document.getElementById("main-nav")
    };

    function setStatus(kind, text) {
      el.statusText.textContent = text;
      if (kind === "ok") el.statusDot.style.background = "var(--ok)";
      else if (kind === "error") el.statusDot.style.background = "var(--danger)";
      else el.statusDot.style.background = "rgba(255,255,255,0.25)";
    }

    function showError(message) {
      el.errorMsg.textContent = String(message || "Unknown error");
      el.errorSurface.style.display = "inline-flex";
    }

    function clearErrorSurface() {
      el.errorMsg.textContent = "";
      el.errorSurface.style.display = "none";
    }

    function safeJsonParse(text, contextLabel) {
      try { return JSON.parse(text); }
      catch (e) {
        throw new Error(`Invalid JSON in ${contextLabel}: ${e && e.message ? e.message : e}`);
      }
    }

    async function loadConfigOnce() {
      const resp = await fetch("./config.json", { cache: "no-store" });
      if (!resp.ok) throw new Error(`Failed to load config.json (${resp.status})`);
      const text = await resp.text();
      const cfg = safeJsonParse(text, "web/config.json");
      App.config = cfg;
      App.state.config_loaded = true;
    }

    async function loadDataOnce() {
      const resp = await fetch("../data/data.json", { cache: "no-store" });
      if (!resp.ok) throw new Error(`Failed to load data.json (${resp.status})`);
      const text = await resp.text();
      const data = safeJsonParse(text, "data/data.json");
      App.frozen_data = Object.freeze(data);
      App.state.data_loaded = true;
    }

    function setActiveNav(viewKey) {
      const btns = Array.from(el.nav.querySelectorAll(".nav-btn"));
      for (const b of btns) {
        const isActive = (b.getAttribute("data-view") === viewKey);
        b.setAttribute("aria-selected", isActive ? "true" : "false");
      }
    }

    // =============================================================================
    // Calendar View (Section 4.1) — renderer inside index.html (binding rule)
    // =============================================================================

    const CAL = {
      DOW: Object.freeze(["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]),
      MONTHS: Object.freeze([
        "January","February","March","April","May","June",
        "July","August","September","October","November","December"
      ])
    };

    function pad2(n) { return String(n).padStart(2, "0"); }
    function isoDayKeyFromDate(d) {
      const y = d.getFullYear();
      const m = pad2(d.getMonth() + 1);
      const day = pad2(d.getDate());
      return `${y}-${m}-${day}`;
    }

    function parseISODateOnly(s) {
      if (!s || typeof s !== "string") return null;
      // Accept YYYY-MM-DD; reject anything else deterministically
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return null;
      const y = Number(m[1]), mo = Number(m[2]), da = Number(m[3]);
      if (!Number.isFinite(y) || !Number.isFinite(mo) || !Number.isFinite(da)) return null;
      const d = new Date(Date.UTC(y, mo - 1, da));
      // Validate round-trip (invalid dates collapse)
      if (d.getUTCFullYear() !== y || (d.getUTCMonth() + 1) !== mo || d.getUTCDate() !== da) return null;
      // Return local date with same Y-M-D for consistent calendar placement
      return new Date(y, mo - 1, da);
    }

    function firstDayOffsetMonday(year, monthIndex) {
      // Returns 0..6 offset where 0 is Monday
      const d = new Date(year, monthIndex, 1);
      const jsDow = d.getDay(); // 0=Sun..6=Sat
      // Convert to Monday-first: Mon=0..Sun=6
      return (jsDow + 6) % 7;
    }

    function daysInMonth(year, monthIndex) {
      return new Date(year, monthIndex + 1, 0).getDate();
    }

    function normalizeText(s, fallback) {
      const t = (typeof s === "string") ? s.trim() : "";
      return t ? t : (fallback || "");
    }

    function hasLinks(item) {
      const keys = (item && Array.isArray(item.links_keys)) ? item.links_keys : [];
      return keys.length > 0;
    }

    function calendarItemSecondaryText(item) {
  // A compact, resilient secondary label for calendar chips.
  // Prefer episode-based labeling when available.
  const kind = (item && item.kind) ? String(item.kind) : "";
  const parts = [];
  if (kind === "show") parts.push("Show");
  else if (kind === "movie") parts.push("Movie");

  // Episode label (if present)
  const sn = (item && Number.isFinite(item.season_number)) ? item.season_number : null;
  const en = (item && Number.isFinite(item.episode_number)) ? item.episode_number : null;
  if (sn !== null || en !== null) {
    const s = (sn !== null) ? ("S" + String(sn).padStart(2, "0")) : "";
    const e = (en !== null) ? ("E" + String(en).padStart(2, "0")) : "";
    const se = (s + e).trim();
    if (se) parts.push(se);
  }

  // Season filter (if present)
  const sf = (item && item.season_filter != null) ? String(item.season_filter).trim() : "";
  if (sf) parts.push("Season:" + sf);

  return parts.join(" • ");
}
      if (kind === "movie") {
        return `Movie • ${avail}`;
      }
      return avail;
    }

    function buildCalendarItemsIndex(data) {
      // Calendar indexing (schema-bound):
      // - shows[*] indexed by first_air_date
      // - movies[*] indexed by release_date
      // - invalid/missing dates are ignored
      // - availability derived only from links{} keys
      const byDay = new Map(); // dayKey -> { shows: [], movies: [] }

      function ensureDay(dayKey) {
        if (!byDay.has(dayKey)) byDay.set(dayKey, { shows: [], movies: [] });
        return byDay.get(dayKey);
      }

      function safeLinksKeys(linksObj) {
        if (!linksObj || typeof linksObj !== "object") return [];
        try {
          return Object.keys(linksObj).filter(k => {
            const v = linksObj[k];
            return (typeof v === "string") ? v.trim().length > 0 : !!v;
          });
        } catch (_) { return []; }
      }

      const shows = Array.isArray(data && data.shows) ? data.shows : [];
      for (const show of shows) {
        const nextEp = (show && typeof show.next_episode_to_air === "object" && show.next_episode_to_air) ? show.next_episode_to_air : null;
        const lastEp = (show && typeof show.last_episode_to_air === "object" && show.last_episode_to_air) ? show.last_episode_to_air : null;

        const dateStr =
          (nextEp && nextEp.air_date) ||
          (lastEp && lastEp.air_date) ||
          (show && show.air_date) ||
          (show && show.first_air_date) ||
          null;

        const d = parseISODateOnly(dateStr);
        if (!d) continue;

        const dayKey = isoDayKeyFromDate(d);
        const bucket = ensureDay(dayKey);

        const title = normalizeText(show && show.title, "Untitled Show");
        const tmdb_id = (show && Number.isFinite(show.tmdb_id)) ? show.tmdb_id : null;
        const trakt_id = (show && Number.isFinite(show.trakt_id)) ? show.trakt_id : null;

        const poster_local = (show && typeof show.poster_local === "string" && show.poster_local.trim()) ? show.poster_local.trim() : null;
        const backdrop_local = (show && typeof show.backdrop_local === "string" && show.backdrop_local.trim()) ? show.backdrop_local.trim() : null;

        const links = (show && show.links && typeof show.links === "object") ? show.links : {};
        const links_keys = safeLinksKeys(links);

        const seasons = Array.isArray(show && show.seasons) ? show.seasons : [];
        const seasons_count = seasons.length;

        const season_mode = (show && typeof show.season_mode === "string") ? show.season_mode : "";
        const season_filter = (show && typeof show.season_filter === "string") ? show.season_filter : "";

        bucket.shows.push({
          kind: "show",
          day_key: dayKey,
          title,
          tmdb_id,
          trakt_id,
          first_air_date: show && typeof show.first_air_date === "string" ? show.first_air_date : null,
          episode_air_date: (nextEp && typeof nextEp.air_date === "string") ? nextEp.air_date : ((lastEp && typeof lastEp.air_date === "string") ? lastEp.air_date : null),
          season_number: (nextEp && Number.isFinite(nextEp.season_number)) ? nextEp.season_number : null,
          episode_number: (nextEp && Number.isFinite(nextEp.episode_number)) ? nextEp.episode_number : null,
          episode_title: (nextEp && typeof nextEp.name === "string") ? nextEp.name : null,
          poster_local,
          backdrop_local,
          links,
          links_keys,
          season_mode,
          season_filter,
          seasons_count,
          popup: {
            type: "show",
            tmdb_id,
            trakt_id
          }
        });
      }

      const movies = Array.isArray(data && data.movies) ? data.movies : [];
      for (const movie of movies) {
        const d = parseISODateOnly(movie && movie.release_date);
        if (!d) continue;

        const dayKey = isoDayKeyFromDate(d);
        const bucket = ensureDay(dayKey);

        const title = normalizeText(movie && movie.title, "Untitled Movie");
        const tmdb_id = (movie && Number.isFinite(movie.tmdb_id)) ? movie.tmdb_id : null;
        const trakt_id = (movie && Number.isFinite(movie.trakt_id)) ? movie.trakt_id : null;

        const poster_local = (movie && typeof movie.poster_local === "string" && movie.poster_local.trim()) ? movie.poster_local.trim() : null;
        const backdrop_local = (movie && typeof movie.backdrop_local === "string" && movie.backdrop_local.trim()) ? movie.backdrop_local.trim() : null;

        const links = (movie && movie.links && typeof movie.links === "object") ? movie.links : {};
        const links_keys = safeLinksKeys(links);

        bucket.movies.push({
          kind: "movie",
          day_key: dayKey,
          title,
          tmdb_id,
          trakt_id,
          release_date: movie && typeof movie.release_date === "string" ? movie.release_date : null,
          poster_local,
          backdrop_local,
          links,
          links_keys,
          popup: {
            type: "movie",
            tmdb_id,
            trakt_id
          }
        });
      }

      for (const [, bucket] of byDay.entries()) {
        bucket.shows.sort((a, b) => String(a.title).localeCompare(String(b.title)));
        bucket.movies.sort((a, b) => String(a.title).localeCompare(String(b.title)));
      }

      return byDay;
    }

    function openPopupForItem(item) {
      const kind = item && item.kind ? String(item.kind) : "item";
      const title = (item && item.title) ? String(item.title) : "Details";

      const body = document.createElement("div");

      const meta = document.createElement("div");
      meta.className = "hint";
      const bits = [];
      bits.push(kind === "show" ? "Show" : (kind === "movie" ? "Movie" : "Item"));
      if (Number.isFinite(item && item.tmdb_id)) bits.push(`tmdb:${item.tmdb_id}`);
      if (Number.isFinite(item && item.trakt_id)) bits.push(`trakt:${item.trakt_id}`);
      if (kind === "show") {
        if (item.episode_air_date) bits.push(`air_date:${item.episode_air_date}`);
        else if (item.first_air_date) bits.push(`first_air_date:${item.first_air_date}`);

        if (Number.isFinite(item.season_number) || Number.isFinite(item.episode_number)) {
          const s = Number.isFinite(item.season_number) ? ("S" + String(item.season_number).padStart(2, "0")) : "";
          const e = Number.isFinite(item.episode_number) ? ("E" + String(item.episode_number).padStart(2, "0")) : "";
          const se = (s + e).trim();
          if (se) bits.push(se);
        }

        if (item.episode_title) bits.push(`ep:${item.episode_title}`);
      }
      if (kind === "movie" && item.release_date) bits.push(`release_date:${item.release_date}`);
      meta.textContent = bits.join(" • ");
      body.appendChild(meta);

      const linksObj = (item && item.links && typeof item.links === "object") ? item.links : {};
      const keys = (item && Array.isArray(item.links_keys)) ? item.links_keys : Object.keys(linksObj || {});
      if (keys.length === 0) {
        const none = document.createElement("div");
        none.className = "hint";
        none.style.marginTop = "10px";
        none.textContent = "No links available.";
        body.appendChild(none);
      } else {
        const grid = document.createElement("div");
        grid.style.display = "grid";
        grid.style.gridTemplateColumns = "repeat(auto-fit, minmax(160px, 1fr))";
        grid.style.gap = "10px";
        grid.style.marginTop = "12px";

        for (const k of keys) {
          const url = linksObj && linksObj[k] ? String(linksObj[k]) : "";
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn";
          btn.style.textAlign = "left";
          btn.textContent = k;
          btn.disabled = !url;
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (!url) return;
            window.open(url, "_blank", "noopener,noreferrer");
          });
          grid.appendChild(btn);
        }
        body.appendChild(grid);
      }

      openPopup({
        title: title,
        body,
        route: Object.freeze((item && item.popup) ? item.popup : { type: kind })
      });
    }

    function openMorePopup(items, dayKey) {
      const body = document.createElement("div");

      const h = document.createElement("div");
      h.className = "hint";
      h.textContent = `Items on ${String(dayKey || "")}`;
      body.appendChild(h);

      const list = document.createElement("div");
      list.style.display = "flex";
      list.style.flexDirection = "column";
      list.style.gap = "10px";
      list.style.marginTop = "12px";

      const arr = Array.isArray(items) ? items : [];
      for (const it of arr) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "btn";
        row.style.textAlign = "left";
        row.textContent = (it && it.title) ? String(it.title) : "Untitled";
        row.addEventListener("click", () => openPopupForItem(it));
        list.appendChild(row);
      }

      body.appendChild(list);

      openPopup({
        title: "More",
        body,
        route: Object.freeze({ type: "calendar_more", day: dayKey || null })
      });
    }

    function renderCalendarView(panel, data) {
      const wrap = document.createElement("div");
      wrap.className = "cal-wrap";

      const header = document.createElement("div");
      header.className = "cal-month-header";

      const btnPrev = document.createElement("button");
      btnPrev.type = "button";
      btnPrev.className = "btn";
      btnPrev.textContent = "◀";
      btnPrev.setAttribute("aria-label", "Previous month");
      btnPrev.addEventListener("click", () => shiftMonth(-1));

      const btnNext = document.createElement("button");
      btnNext.type = "button";
      btnNext.className = "btn";
      btnNext.textContent = "▶";
      btnNext.setAttribute("aria-label", "Next month");
      btnNext.addEventListener("click", () => shiftMonth(1));

      const title = document.createElement("div");
      title.className = "title";

      const todayInd = document.createElement("div");
      todayInd.className = "today-ind";
      const today = new Date();
      const todayKey = isoDayKeyFromDate(today);
      todayInd.textContent = `Today ${todayKey}`;

      header.appendChild(btnPrev);
      header.appendChild(btnNext);
      header.appendChild(title);
      header.appendChild(todayInd);

      const grid = document.createElement("div");
      grid.className = "cal-grid";

      // DOW headers
      for (const d of CAL.DOW) {
        const dow = document.createElement("div");
        dow.className = "cal-dow";
        dow.textContent = d;
        grid.appendChild(dow);
      }

      const byDay = buildCalendarItemsIndex(data);

      function resolveThumb(item) {
        const p = (item && typeof item.poster_local === "string" && item.poster_local.trim()) ? item.poster_local.trim() : "";
        const b = (item && typeof item.backdrop_local === "string" && item.backdrop_local.trim()) ? item.backdrop_local.trim() : "";
        return p || b || "";
      }

      function itemHasLinks(item) {
        const keys = (item && Array.isArray(item.links_keys)) ? item.links_keys : [];
        return keys.length > 0;
      }

      function makeItemRow(item) {
        const row = document.createElement("div");
        row.className = "cal-item";
        row.tabIndex = 0;

        row.addEventListener("click", () => openPopupForItem(item));
        row.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openPopupForItem(item);
          }
        });

        const thumb = document.createElement("div");
        thumb.className = "thumb";
        const src = resolveThumb(item);
        if (src) {
          const img = document.createElement("img");
          img.alt = "";
          img.loading = "lazy";
          img.decoding = "async";
          img.src = src;
          img.onerror = () => { thumb.innerHTML = '<div class="noimg">NO</div>'; };
          thumb.appendChild(img);
        } else {
          const no = document.createElement("div");
          no.className = "noimg";
          no.textContent = "NO";
          thumb.appendChild(no);
        }

        const main = document.createElement("div");
        main.className = "main";

        const t = document.createElement("div");
        t.className = "t";
        t.textContent = (item && item.title) ? String(item.title) : "Untitled";

        const s = document.createElement("div");
        s.className = "s";
        s.textContent = calendarItemSecondaryText(item);

        main.appendChild(t);
        main.appendChild(s);

        const right = document.createElement("div");
        right.className = "right";

        const avail = document.createElement("div");
        avail.className = "avail";
        avail.dataset.on = itemHasLinks(item) ? "true" : "false";

        right.appendChild(avail);

        row.appendChild(thumb);
        row.appendChild(main);
        row.appendChild(right);

        return row;
      }

      function shiftMonth(delta) {
        const y = App.state.calendar.year;
        const m = App.state.calendar.month_index;
        const d = new Date(y, m + delta, 1);
        App.state.calendar.year = d.getFullYear();
        App.state.calendar.month_index = d.getMonth();
        renderView("calendar");
      }

      const y = App.state.calendar.year;
      const m = App.state.calendar.month_index;
      title.textContent = `${CAL.MONTHS[m]} ${y}`;

      const offset = firstDayOffsetMonday(y, m);
      const dim = daysInMonth(y, m);

      // Use 5 rows unless overflow requires 6
      const totalCells = offset + dim;
      const rows = (totalCells > 35) ? 6 : 5;
      const cellCount = rows * 7;

      for (let i = 0; i < cellCount; i++) {
        const cell = document.createElement("div");
        cell.className = "cal-cell";
        cell.tabIndex = 0;

        const dayNum = i - offset + 1;
        const inMonth = (dayNum >= 1 && dayNum <= dim);

        if (!inMonth) {
          cell.setAttribute("aria-disabled", "true");
        }

        const dateRow = document.createElement("div");
        dateRow.className = "cal-date";

        const num = document.createElement("div");
        num.className = "num";
        num.textContent = inMonth ? String(dayNum) : "";

        dateRow.appendChild(num);

        if (inMonth) {
          const dLocal = new Date(y, m, dayNum);
          const k = isoDayKeyFromDate(dLocal);
          if (k === todayKey) {
            const b = document.createElement("div");
            b.className = "badge-today";
            b.textContent = "TODAY";
            dateRow.appendChild(b);
          }
        }

        const itemsWrap = document.createElement("div");
        itemsWrap.className = "cal-items";

        if (inMonth) {
          const dLocal = new Date(y, m, dayNum);
          const dayKey = isoDayKeyFromDate(dLocal);
          const bucket = byDay.get(dayKey) || null;

          const items = [];
          if (bucket) {
            if (Array.isArray(bucket.shows)) items.push(...bucket.shows);
            if (Array.isArray(bucket.movies)) items.push(...bucket.movies);
          }

          // Deterministic ordering
          items.sort((a, b) => {
            const ak = String(a.kind || "");
            const bk = String(b.kind || "");
            if (ak !== bk) return ak.localeCompare(bk);
            return String(a.title || "").localeCompare(String(b.title || ""));
          });

          const max = 3;
          for (let n = 0; n < Math.min(items.length, max); n++) {
            itemsWrap.appendChild(makeItemRow(items[n]));
          }

          if (items.length > max) {
            const more = document.createElement("button");
            more.type = "button";
            more.className = "cal-more";
            more.textContent = `+${items.length - max} more`;
            more.addEventListener("click", () => openMorePopup(items, dayKey));
            itemsWrap.appendChild(more);
          }
        }

        cell.appendChild(dateRow);
        cell.appendChild(itemsWrap);
        grid.appendChild(cell);
      }

      wrap.appendChild(header);
      wrap.appendChild(grid);

      panel.appendChild(wrap);
    }

    // =============================================================================
    // Popup system (stacked overlays)
    // =============================================================================

    function syncPopupDom() {
      const has = App.popup_stack.length > 0;
      el.popupOverlay.style.display = has ? "block" : "none";
      el.popupContainer.style.display = has ? "block" : "none";
      el.popupOverlay.setAttribute("aria-hidden", has ? "false" : "true");

      el.popupContainer.innerHTML = "";
      if (!has) return;

      // Only top popup is interactive (pointer-events handled via container)
      const top = App.popup_stack[App.popup_stack.length - 1];
      const popup = document.createElement("div");
      popup.className = "popup";
      popup.setAttribute("role", "dialog");
      popup.setAttribute("aria-modal", "true");

      const header = document.createElement("div");
      header.className = "popup-header";

      const title = document.createElement("div");
      title.className = "title";
      title.textContent = top && top.title ? String(top.title) : "Popup";

      const spacer = document.createElement("div");
      spacer.className = "spacer";

      const btnClose = document.createElement("button");
      btnClose.type = "button";
      btnClose.className = "btn";
      btnClose.textContent = "Close";
      btnClose.addEventListener("click", closeTopPopup);

      header.appendChild(title);
      header.appendChild(spacer);
      header.appendChild(btnClose);

      const body = document.createElement("div");
      body.className = "popup-body";

      if (top && top.body instanceof HTMLElement) body.appendChild(top.body);
      else {
        const hint = document.createElement("div");
        hint.className = "hint";
        hint.textContent = "No content.";
        body.appendChild(hint);
      }

      popup.appendChild(header);
      popup.appendChild(body);

      el.popupContainer.appendChild(popup);
    }

    function openPopup(payload) {
      const title = payload && payload.title ? String(payload.title) : "Popup";
      const body = payload && payload.body ? payload.body : null;
      const route = payload && payload.route ? payload.route : null;

      App.popup_stack.push({
        title,
        body,
        route
      });

      syncPopupDom();
    }

    function closeTopPopup() {
      if (App.popup_stack.length === 0) return;
      App.popup_stack.pop();
      syncPopupDom();
    }

    function closeAllPopups() {
      App.popup_stack.length = 0;
      syncPopupDom();
    }

    // =============================================================================
    // Views + routing (minimal deterministic shell behavior)
    // =============================================================================

    function renderView(viewKey) {
      App.state.active_view = viewKey;
      setActiveNav(viewKey);

      el.contentRoot.innerHTML = "";
      const panel = document.createElement("div");
      panel.className = "view-panel";

      const vt = document.createElement("div");
      vt.className = "view-title";
      const h1 = document.createElement("h1");
      h1.textContent = (VIEWS.find(v => v.key === viewKey) || { label: viewKey }).label;

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = (App.state.data_loaded ? "data:ok" : "data:…") + " • " + (App.state.config_loaded ? "cfg:ok" : "cfg:…");

      vt.appendChild(h1);
      vt.appendChild(meta);
      panel.appendChild(vt);

      if (!App.state.data_loaded) {
        const hint = document.createElement("div");
        hint.className = "hint";
        hint.textContent = "Loading data…";
        panel.appendChild(hint);
        el.contentRoot.appendChild(panel);
        return;
      }

      const data = App.frozen_data;

      if (viewKey === "calendar") {
        renderCalendarView(panel, data);
      } else {
        const hint = document.createElement("div");
        hint.className = "hint";
        hint.textContent = "This view is present in the shell; detailed rendering is handled by its module.";
        panel.appendChild(hint);

        // Minimal schema-safe counts (read-only)
        const counts = document.createElement("div");
        counts.className = "hint";
        const sc = Array.isArray(data && data.shows) ? data.shows.length : 0;
        const mc = Array.isArray(data && data.movies) ? data.movies.length : 0;
        counts.textContent = `shows:${sc} • movies:${mc}`;
        panel.appendChild(counts);
      }

      el.contentRoot.appendChild(panel);
      el.contentRoot.focus({ preventScroll: true });
    }

    function onNavClick(e) {
      const btn = e.target.closest(".nav-btn");
      if (!btn) return;
      const viewKey = btn.getAttribute("data-view");
      if (!viewKey) return;
      renderView(viewKey);
    }

    function onKeyDown(e) {
      // Escape closes top popup; if none, no-op
      if (e.key === "Escape") {
        if (App.popup_stack.length > 0) {
          e.preventDefault();
          closeTopPopup();
        }
      }
    }

    async function boot() {
      try {
        clearErrorSurface();
        setStatus("busy", "Loading config…");
        await loadConfigOnce();

        setStatus("busy", "Loading data…");
        await loadDataOnce();

        // Initialize calendar to current month
        const now = new Date();
        App.state.calendar.year = now.getFullYear();
        App.state.calendar.month_index = now.getMonth();

        setStatus("ok", "Ready");
        renderView(App.state.active_view);
      } catch (err) {
        const msg = (err && err.message) ? err.message : String(err);
        setStatus("error", "Failed");
        showError(msg);
        console.error(err);
      }
    }

    // Wire events
    el.nav.addEventListener("click", onNavClick);
    el.errorDismiss.addEventListener("click", clearErrorSurface);
    window.addEventListener("keydown", onKeyDown);

    // Boot
    boot();
  </script>
</body>
</html>
