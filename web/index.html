<!DOCTYPE html>
<html lang="en">
<head>
  <!-- =========================================================================
       File:        web/index.html
       Project:     my_TV_Movie
       Purpose:     Main TV / Movies / Calendar hub
       Version:     v3.3.6 (2025-12-16)
       Source:      data/data.json (static, generated)
       ========================================================================= -->

  <meta charset="UTF-8" />
  <title>My TV Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TV & Movie hub for Andrew & Brant" />

  <link rel="stylesheet" href="web/css/my_tv_hub.css?v=3.3.6" />
</head>

<body>

<header class="top-header">
  <h1>📺 My TV Hub</h1>
  <nav class="top-nav">
    <button onclick="showSection('calendar')">Calendar</button>
    <button onclick="showSection('shows')">Shows</button>
    <button onclick="showSection('movies')">Movies</button>
    <button onclick="showSection('livetv')">Live TV</button>
  </nav>
</header>

<main>

  <!-- ====================== CALENDAR ====================== -->
  <section id="calendar" class="content-section active">
    <h2>📅 Upcoming Episodes</h2>
    <div id="calendarContainer" class="calendar-grid"></div>
  </section>

  <!-- ====================== SHOWS ====================== -->
  <section id="shows" class="content-section">
    <h2>📺 TV Shows</h2>
    <div id="showsContainer" class="card-grid"></div>
  </section>

  <!-- ====================== MOVIES ====================== -->
  <section id="movies" class="content-section">
    <h2>🎬 Movies</h2>
    <div id="moviesContainer" class="card-grid"></div>
  </section>

  <!-- ====================== LIVE TV ====================== -->
  <section id="livetv" class="content-section">
    <h2>📡 Live TV</h2>
    <div id="livetvContainer" class="card-grid"></div>
  </section>

</main>

<footer class="footer">
  <p>Static data generated automatically · TMDB · Trakt</p>
</footer>

<script>
/* ============================================================================
   GLOBAL STATE
============================================================================ */

let DATA = null;

/* ============================================================================
   INIT
============================================================================ */

fetch("data/data.json")
  .then(r => r.json())
  .then(json => {
    DATA = json;
    renderCalendar();
    renderShows();
    renderMovies();
    renderLiveTV();
  })
  .catch(err => {
    console.error("Failed to load data.json", err);
  });

/* ============================================================================
   NAVIGATION
============================================================================ */

function showSection(id) {
  document.querySelectorAll(".content-section").forEach(sec => {
    sec.classList.remove("active");
  });
  document.getElementById(id).classList.add("active");
}

/* ============================================================================
   HELPERS
============================================================================ */

function img(path, fallback = "") {
  return path && path.length ? path : fallback;
}

function watchedBadge(item) {
  if (!item.trakt || !item.trakt.watched) return "";
  return `<span class="badge watched">✔ Watched</span>`;
}

/* ============================================================================
   CALENDAR
============================================================================ */

function renderCalendar() {
  const container = document.getElementById("calendarContainer");
  container.innerHTML = "";

  if (!DATA.calendar || !DATA.calendar.length) {
    container.innerHTML = "<p>No upcoming episodes.</p>";
    return;
  }

  let lastMonth = "";

  DATA.calendar.forEach(ep => {
    const month = ep.air_date.substring(0,7);
    if (month !== lastMonth) {
      container.insertAdjacentHTML(
        "beforeend",
        `<h3 class="calendar-month">${month}</h3>`
      );
      lastMonth = month;
    }

    container.insertAdjacentHTML(
      "beforeend",
      `
      <div class="calendar-card">
        <img src="${img(ep.local_episode_still, ep.episode_still)}" />
        <div>
          <strong>${ep.show_name}</strong><br/>
          S${ep.season}E${ep.episode} – ${ep.title}
          ${watchedBadge(ep)}
        </div>
      </div>
      `
    );
  });
}

/* ============================================================================
   SHOWS
============================================================================ */

function renderShows() {
  const container = document.getElementById("showsContainer");
  container.innerHTML = "";

  DATA.shows.forEach(show => {
    container.insertAdjacentHTML(
      "beforeend",
      `
      <div class="card">
        <img src="${img(show.local_poster, show.poster)}" />
        <h4>${show.name}</h4>
        ${watchedBadge(show)}
        <button onclick="openShow('${show.id}')">View</button>
      </div>
      `
    );
  });
}

function openShow(id) {
  window.location.href = `web/show.html?id=${id}`;
}

/* ============================================================================
   MOVIES
============================================================================ */

function renderMovies() {
  const container = document.getElementById("moviesContainer");
  container.innerHTML = "";

  DATA.movies.forEach(movie => {
    container.insertAdjacentHTML(
      "beforeend",
      `
      <div class="card">
        <img src="${img(movie.local_poster, movie.poster)}" />
        <h4>${movie.title}</h4>
        ${watchedBadge(movie)}
      </div>
      `
    );
  });
}

/* ============================================================================
   LIVE TV
============================================================================ */

function renderLiveTV() {
  const container = document.getElementById("livetvContainer");
  container.innerHTML = "";

  if (!DATA.live_tv || !DATA.live_tv.length) {
    container.innerHTML = "<p>No live channels configured.</p>";
    return;
  }

  DATA.live_tv.forEach(ch => {
    container.insertAdjacentHTML(
      "beforeend",
      `
      <div class="card">
        <img src="${img(ch.logo)}" />
        <h4>${ch.name}</h4>
        <a href="${ch.url}" target="_blank">Watch</a>
      </div>
      `
    );
  });
}
</script>

</body>
</html>
