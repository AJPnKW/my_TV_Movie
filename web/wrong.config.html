<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Config</title>
<link rel="stylesheet" href="css/my_tv_hub.css">
</head>
<body>

<h1>Configuration</h1>

<div id="cfg"></div>

<button onclick="location.href='index.html'">Back</button>

<script>
fetch("config.json")
  .then(r => r.json())
  .then(c => {
    const div = document.getElementById("cfg");
    div.innerHTML = `
      <h2>Streaming Services</h2>
      <pre>${JSON.stringify(c.streaming_services, null, 2)}</pre>
      <h2>UI Tuning</h2>
      <pre>${JSON.stringify(c.ui, null, 2)}</pre>
    `;
  })
  .catch(e => {
    console.error(e);
    document.getElementById("cfg").textContent = "Failed to load config";
  });
</script>
</body>
</html>
