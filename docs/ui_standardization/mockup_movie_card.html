<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mockup - Standard Movie Card</title>
  <style>
    body{margin:0;padding:28px;background:#0b1219;font-family:Segoe UI,Arial,sans-serif;color:#eef4fb}
    .wrap{max-width:320px}
    .tag{display:inline-block;margin-bottom:12px;padding:6px 10px;border-radius:999px;background:#18212d;border:1px solid rgba(255,255,255,.12);font-size:12px}
    .card{background:#121b27;border:1px solid rgba(255,255,255,.12);border-radius:20px;overflow:hidden}
    .head{padding:14px 14px 0}
    .title{font-weight:800;font-size:20px}
    .poster{display:block;padding:0;border:0;background:linear-gradient(160deg,#4e667c,#18222d);width:100%;aspect-ratio:2/3;color:rgba(238,244,251,.72)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px}
    .icon{padding:7px 10px;border-radius:12px;background:#1d2a39;border:1px solid rgba(255,255,255,.12);font-size:12px}
    .meta{padding:0 14px 16px;color:rgba(238,244,251,.72);line-height:1.45}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="tag">SECTION PURPOSE: title + poster + provider actions + meta</div>
    <article class="card">
      <div class="head"><div class="title">Standard Movie Card</div></div>
      <button class="poster" type="button" aria-label="Open movie details">Poster Click Target</button>
      <div class="actions">
        <span class="icon">Want</span>
        <span class="icon">Watched</span>
        <span class="icon">Vidsrc</span>
        <span class="icon">Videasy</span>
      </div>
      <div class="meta">Released Mar 1, 2026 • 121 min • Thriller / Mystery</div>
    </article>
  </div>
</body>
</html>
