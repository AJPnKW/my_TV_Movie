name: build-data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    paths:
      - "scripts/**"
      - "web/**"
      - "data/**"
      - ".gitea/workflows/build-data.yml"
      - "requirements.txt"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build data artifacts
        run: |
          python scripts/fetch_tmdb.py
          python scripts/fetch_trakt.py
          python scripts/migrate_watchlist_fields.py
          python scripts/trakt_sync_watch_state.py
          python scripts/download_tmdb_assets.py
          python scripts/export_service_logos_sources.py
          python scripts/download_service_logos.py --input data/service_logos_sources.json
          python scripts/sync_local_watch_state.py
          python scripts/qa_pipeline_integrity.py
        env:
          API_TMDB_KEY: ${{ secrets.API_TMDB_KEY }}
          API_TMDB_TOKEN: ${{ secrets.API_TMDB_TOKEN }}
          API_TRAKT_ID: ${{ secrets.API_TRAKT_ID }}
          API_TRAKT_KEY: ${{ secrets.API_TRAKT_KEY }}
          API_TRAKT_ACCESS_TOKEN: ${{ secrets.API_TRAKT_ACCESS_TOKEN }}
          API_TRAKT_REFRESH_TOKEN: ${{ secrets.API_TRAKT_REFRESH_TOKEN }}
          API_TRAKT_REDIRECT_URL: ${{ secrets.API_TRAKT_REDIRECT_URL }}
          API_TVMAZE_KEY: ${{ secrets.API_TVMAZE_KEY }}

      - name: Commit changes (if any)
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          git config user.name "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@users.noreply.local"
          git add -A
          git diff --cached --quiet || git commit -m "build: update data artifacts"
          git remote set-url origin "http://andrew:${PUSH_TOKEN}@theboys-hp290server:3000/andrew/my_TV_Movie.git"
          git push
