services:
  watch-party:
    build:
      context: ../..
      dockerfile: deploy/watch-party/Dockerfile
    image: my-tv-movie-watch-party:latest
    container_name: my-tv-movie-watch-party
    restart: unless-stopped
    environment:
      WATCH_PARTY_PORT: "8789"
      WATCH_PARTY_ALLOWED_ORIGINS: "https://ajpnkw.github.io,http://127.0.0.1:8789,http://localhost:8789"
    ports:
      - "8789:8789"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8789/api/watch-party/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  watch-party-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: my-tv-movie-watch-party-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://watch-party:8789
    depends_on:
      watch-party:
        condition: service_healthy
